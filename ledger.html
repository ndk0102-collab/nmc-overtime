<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 매출 · 매입 · 입고 (2026-11-20). 회사 숫자·거래처는 이 파일에 없고, 관리자 로그인 뒤 서버(구글 시트 '장부'·'재고기록')에서 받아 옵니다. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;
  --accent:#1E5AA8; --accent-soft:#E6EEF9;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA;
  --vc:#1E5AA8; --vsoft:#E6EEF9;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
body.v-sales{--vc:#1B7A43;--vsoft:#E4F3EA}
body.v-buy{--vc:#9A5B16;--vsoft:#FBEFE1}
body.v-recv{--vc:#6B4FA0;--vsoft:#F0EAF8}
body.v-sum{--vc:#1E5AA8;--vsoft:#E6EEF9}
body.v-auto{--vc:#2D5D73;--vsoft:#E3EEF3}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
b,.big,td,th{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* 위쪽 바 · 화면 고르기 */
.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 0;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.vtabs{max-width:760px;margin:8px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.vtabs button{min-height:46px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.vtabs button[aria-selected="true"]{background:var(--bg);color:var(--vc)}
.vtabs.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.vtabs.n5 button{padding:0 2px;font-size:15px;line-height:1.2}
.home:focus-visible,.vtabs button:focus-visible{outline:3px solid #F4B400;outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding:12px 12px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px;font-weight:800}
.card h2 small{margin-left:6px;font-size:13px;font-weight:600;color:var(--muted)}
.card h3{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--ink2)}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.nav:focus-visible,.row:focus-visible,.ent:focus-visible,.link:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}

/* 기간 고르기 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:800;font-size:15.5px;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{background:#fff;color:var(--vc);box-shadow:0 1px 3px rgba(15,23,42,.16)}
.pnav{display:flex;align-items:center;gap:8px;margin-top:10px}
.nav{flex-shrink:0;width:50px;height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:26px;font-weight:800;line-height:1;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.plabel{flex:1;min-width:0;text-align:center}
.plabel b{display:block;font-size:18.5px;font-weight:800;line-height:1.3}
.plabel small{display:block;font-size:13.5px;color:var(--muted)}
.pjump{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.pjump input{min-height:42px;padding:0 10px;border:2px solid var(--line);border-radius:10px;background:#fff}

/* 큰 숫자 */
.head .k{margin:0;font-size:15px;font-weight:800;color:var(--vc)}
.head .k small{margin-left:6px;font-weight:600;color:var(--muted)}
.head .big{margin:2px 0 2px;font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.head .note{margin:2px 0;font-size:14.5px;color:var(--ink2)}
.yoy{margin:10px 0 0;padding:9px 11px;border-radius:10px;background:var(--soft);font-size:14.5px;line-height:1.55}
.yoy b{white-space:nowrap}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.neutral .up,.neutral .down{color:var(--ink)}
.est{display:inline-block;padding:0 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:800;vertical-align:1px}
.warnbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.warnbox a{color:inherit;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:10px;border-radius:12px;background:var(--soft)}
.tile span{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.tile b{display:block;font-size:17px;font-weight:800;line-height:1.3;margin-top:2px}
.tile small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
@media (max-width:420px){.tiles{grid-template-columns:1fr}.tile{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}.tile b{margin:0}.tile small{flex-basis:100%;margin:0}}

/* 줄 목록 */
.rows{margin:0;padding:0;list-style:none}
.row{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit}
.rows > .row:first-child,.rows > li:first-child .row{border-top:0}
button.row{cursor:pointer}
.rl{flex:1;min-width:0}
.rl b{display:block;font-size:16px;font-weight:800}
.rl small{display:block;font-size:13px;color:var(--muted)}
.rr{flex-shrink:0;text-align:right;max-width:62%}
.rr b{display:block;font-size:16px;font-weight:800}
.rr small{display:block;font-size:12.5px;color:var(--muted)}
.subs{margin:2px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--ink2)}
.subs li{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.dayh{display:flex;justify-content:space-between;gap:8px;margin:14px 0 2px;padding:6px 10px;border-radius:10px;background:var(--vsoft);font-size:14px;font-weight:800;color:var(--ink2)}
.dayh:first-child{margin-top:4px}
.ent{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ent .et{flex:1;min-width:0}
.ent .et b{display:block;font-size:15.5px;font-weight:800}
.ent .et small{display:block;font-size:13px;color:var(--muted)}
.ent .ea{flex-shrink:0;text-align:right}
.ent .ea b{display:block;font-size:15.5px}
.ent .ea small{display:block;font-size:12px;color:var(--muted)}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--soft);font-size:11.5px;font-weight:800;color:var(--ink2);vertical-align:1px}
.tag.unpaid{background:var(--warn-soft);color:var(--warn)}
.find{width:100%;min-height:44px;margin:2px 0 6px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:16px}

/* 비교 표 (만 원) */
.tw{overflow-x:auto;margin:0 -4px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th,table.cmp td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;white-space:normal}
table.cmp thead th{font-size:12.5px;color:var(--muted);font-weight:800}
table.cmp tbody tr.cur td{background:var(--vsoft)}
table.cmp td.na{color:var(--muted)}
table.cmp tr.tot td{font-weight:800;border-top:2px solid var(--ink2)}

/* 넣기 버튼 */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;min-height:58px;padding:0 22px;border:0;border-radius:999px;background:var(--vc);color:#fff;font-size:17.5px;font-weight:800;box-shadow:0 6px 18px rgba(15,23,42,.3);cursor:pointer}
.fab:focus-visible{outline:3px solid #F4B400;outline-offset:3px}

/* 넣기 창 */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:600px;max-height:94vh;max-height:94dvh;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25)}
@media (min-width:640px){#sheet{align-items:center;padding:16px}.sheet{border-radius:20px;max-height:92vh}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;margin:0;font-size:19px;font-weight:800;color:var(--vc)}
.sbody{flex:1;overflow:auto;padding:12px 16px 4px;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot .btn{flex:1 1 140px}
.fld{margin:0 0 14px}
.fld > .lab{display:block;margin:0 0 6px;font-size:14.5px;font-weight:800;color:var(--ink2)}
.fld > .lab small{margin-left:4px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:50px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17.5px}
.inp:focus{outline:none;border-color:var(--vc)}
.inp.amt{font-size:21px;font-weight:800;text-align:right}
.inrow{display:flex;align-items:center;gap:8px}
.inrow .inp{flex:1;min-width:0}
.unit{flex-shrink:0;font-weight:800;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:42px;padding:0 14px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:15.5px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--vc);background:var(--vc);color:#fff}
.chip.sm{min-height:36px;padding:0 11px;font-size:14px;border-width:1px}
.chips.sugg{margin-top:6px}
.calc{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14.5px;line-height:1.6}
.calc .han{display:block;font-size:13px;color:var(--muted)}
.smsg{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:700}
.smsg.ok{background:var(--ok-soft);color:var(--ok)}
.smsg.err{background:var(--bad-soft);color:var(--bad)}
.smsg.info{background:var(--accent-soft);color:#174A8C}
.fwarn{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:600}
details.more{margin:0 0 12px;border-top:1px dashed var(--line);padding-top:6px}
details.more > summary{display:flex;align-items:center;min-height:44px;font-weight:800;color:var(--accent);cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700}
.chk input{width:22px;height:22px}

/* 자동 수집 */
.ag{padding:12px 0;border-top:1px solid var(--line)}
.ag.first{border-top:0;padding-top:4px}
.agh{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.agh b{font-size:16.5px;font-weight:800;margin-right:2px}
.agh .tag{margin-left:0}
.agm{margin:2px 0 6px;font-size:14px;color:var(--ink2)}
.chip.sug{border-color:var(--warn);background:var(--warn-soft)}
.chip:disabled{opacity:.5;cursor:default}
.st{display:inline-block;padding:0 7px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--ink2)}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.warn{background:var(--warn-soft);color:var(--warn)}.st.info{background:var(--accent-soft);color:#174A8C}
.steps{margin:4px 0 0;padding-left:20px;font-size:14.5px;line-height:1.65}
.rr .link{display:block;margin-left:auto;padding:4px 0 0;font-size:13.5px}
.rr b.dif{color:var(--warn)}
.small{font-size:12.5px;color:var(--muted)}

/* 로그인 */
.login{max-width:440px;margin:20px auto}
.login form{display:flex;gap:8px;margin-top:12px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px}
.err{margin:8px 0 0;color:var(--bad);font-weight:700}
.wait{padding:30px 10px;text-align:center;color:var(--muted);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3)}

@media print{
  .bar,.fab,.noprint,#sheet,.toast,.perbar .seg,.nav,.tools{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .card{border:1px solid #999;break-inside:avoid}
}
</style>
</head>
<body class="v-buy">
<header class="bar">
  <div class="bin" data-nmc-slot data-nmc-hub="manage.html" data-nmc-hub-name="관리자">

    <h1 id="title">매입</h1>
  </div>
  <nav class="vtabs n5" id="vtabs" role="tablist" aria-label="화면 선택"></nav>
</header>
<main class="wrap" id="root"></main>
<button type="button" class="fab" id="fab" data-act="add" hidden>+ 등록</button>
<div id="sheet" hidden></div>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  function money(f) {
    var a = num(f.amt);
    if (a == null || isNaN(a) || a <= 0) return null;
    a = Math.round(a);
    var o;
    if (f.vat === '별도') o = { supply: a, tax: Math.floor(a * 0.1) };
    else if (f.vat === '포함') { var s = Math.round(a / 1.1); o = { supply: s, tax: a - s }; }
    else if (f.vat === '직접') { var t = num(f.amt2); if (t == null) t = 0; if (isNaN(t) || t < 0) return null; o = { supply: a, tax: Math.round(t) }; }
    else o = { supply: a, tax: 0 };
    if (f.neg) { o.supply = -o.supply; o.tax = -o.tax; }
    o.total = o.supply + o.tax;
    if (Math.abs(o.total) > MAX_AMT) return null;
    return o;
  }

    if (A.bankIn) h += '<section class="card"><p class="hint" style="margin:0">통장 입금 중 장부 내역과 맞지 않은 ' + A.bankIn + '건은 장부에 반영하지 않습니다. 제품 매출은 출고 × 단가로 집계하며, 입금은 대금 회수 기록입니다.</p></section>';
    // 출고 대조
    if (A.ship.length) {
      h += '<section class="card" id="autoShip"><h2>출고 대조<small>매출 세금계산서와 출고 매출 · 공급가액</small></h2><ul class="rows">';
      A.ship.forEach(function (x) {
        var amt = x[5] + x[6], dif = x[3] - amt;
        h += '<li class="row"><div class="rl"><b>' + esc(x[1]) + '</b><small>' + esc(ymTxt(x[0])) + ' · 세금계산서 ' + x[2] + '건</small><ul class="subs">' +
          '<li><span>세금계산서</span><span>' + won(x[3]) + '</span></li><li><span>출고 매출</span><span>' + won(amt) + '</span></li>' +
          (x[6] ? '<li><span>└ 그중 <span class="est">추정</span></span><span>' + won(x[6]) + '</span></li>' : '') +
          (x[7] ? '<li><span>단가 없는 출고</span><span>' + fmtQ(x[7]) + 'kg</span></li>' : '') + '</ul></div>' +
          '<div class="rr"><b' + (dif ? ' class="dif"' : '') + '>' + (dif > 0 ? '+' : dif < 0 ? '−' : '') + won(Math.abs(dif)) + '</b><small>차이</small></div></li>';
      });
      h += '</ul><p class="hint">제품 매출은 출고 × 단가로 집계하므로 이 세금계산서는 장부에 다시 반영하지 않습니다. 차이가 있으면 출고 단가 또는 출고 기록을 확인하십시오. 추정 = 단가 미입력 출고를 기준 단가로 계산한 금액입니다.</p></section>';
    }
    // 최근 수집
    h += '<section class="card"><h2>최근 수집 내역<small>' + (A.recent.length ? '최근 ' + A.recent.length + '건' : '없음') + '</small></h2>';
    h += A.recent.length ? '<ul class="rows">' + A.recent.map(recentHtml).join('') + '</ul>' : '<p class="hint">아직 수집한 내역이 없습니다.</p>';
    h += '</section>';
    // 파일 처리 기록
    if (A.logs.length) {
      h += '<section class="card"><h2>파일 처리 기록<small>최근 ' + A.logs.length + '개</small></h2><ul class="rows">' + A.logs.map(function (l) {
        var doc = l[6] === '공문함', bad = !doc && l[6] !== (A.folder ? A.folder.done : '처리 완료');   // 공문 파일은 공문함이 정리 (2026-11-21)
        return '<li class="row"><div class="rl"><b>' + esc(l[1]) + '</b><small>' + esc(dtx(l[0])) + (l[2] ? ' · ' + esc(l[2]) : '') + '</small>' + (bad ? '<small class="err" style="margin:0">' + esc(l[5]) + '</small>' : '') + '</div>' +
          '<div class="rr"><b>' + (doc ? '<a class="link" href="docs.html">공문함</a>' : bad ? esc(l[6]) : '새 ' + l[4] + '건') + '</b><small>' + (bad || doc ? '' : '읽은 ' + l[3] + '건') + '</small></div></li>';
      }).join('') + '</ul><p class="hint">읽지 못한 파일은 폴더 안 ‘' + esc(A.folder ? A.folder.fail : '확인 필요') + '’로 옮겨집니다. 엑셀 형식으로 다시 저장해 수집 폴더에 넣으면 다시 읽습니다.</p></section>';
    }
    // 설정 방법
    h += '<section class="card"><details class="more" style="margin:0;border:0;padding:0"><summary>설정 방법 · 저장할 파일</summary>' +
      '<h3>처음 한 번</h3><ol class="steps"><li>회사 컴퓨터에 ‘데스크톱용 Google Drive’를 설치하고, 이 앱의 구글 시트를 소유한 회사 계정으로 로그인합니다.</li>' +
      '<li>파일 탐색기의 ‘Google Drive › 내 드라이브’ 안에 ‘' + esc(A.folder ? A.folder.name : 'NMC 자동 수집') + '’ 폴더가 표시됩니다.</li>' +
      '<li>이후 아래 파일을 이 폴더에 저장하기만 하면 됩니다.</li></ol>' +
      '<h3>저장할 파일 (엑셀 · CSV)</h3><ul class="steps"><li><b>매출 · 매입 세금계산서</b>: 홈택스 전자(세금)계산서 목록조회에서 매출 · 매입을 각각 조회한 뒤 엑셀로 내려받기</li>' +
      '<li><b>통장 거래내역</b>: 기업 인터넷뱅킹 입출금 거래내역 조회 → 엑셀 저장</li><li><b>카드 이용내역</b>: 카드사 기업 홈페이지 이용내역(승인내역) 조회 → 엑셀 저장</li></ul>' +
      '<p class="hint">공문 · 팩스 · 메일(PDF · 사진 · 한글 · 워드 · eml)을 이 폴더에 넣으면 장부가 아니라 <a class="link" href="docs.html">공문함</a>에 정리됩니다.</p>' +
      '<p class="hint">조회 기간이 겹쳐도 같은 내역은 한 번만 반영됩니다. 매출 · 매입 구분이 되지 않는 목록은 파일 이름에 ‘매출’ 또는 ‘매입’을 넣어 저장하십시오. 홈택스 · 은행 · 카드사 내려받기는 공동인증서 로그인이 필요하여 담당자가 직접 합니다.</p>' +
      '<h3>장부 반영 기준</h3><ul class="steps"><li>매입 세금계산서 · 카드: 같은 거래처 · 같은 금액의 장부 내역(직접 등록 · 입고)이 있으면 새로 넣지 않고 연결합니다.</li>' +
      '<li>매입 세금계산서의 거래처가 처음이면 거래처 · 품목 글자로 분류를 추정해 바로 장부에 넣고 ‘분류 추정’으로 표시합니다.</li>' +
      '<li>매출 세금계산서: 시공 · 공사는 장부 매출(시공)로 반영합니다. 제품 매출은 출고 × 단가로 이미 집계하므로, 그 거래처 출고가 그해에 있으면 ‘출고 대조’로만 표시하고, 출고 기록이 없으면 품목으로 분류를 추정해 장부 매출로 넣습니다(‘분류 추정’).</li>' +
      '<li>국세청 메일로 받은 전자세금계산서(2026년부터)는 서버가 열어 이 기준으로 바로 반영합니다. 홈택스 목록 엑셀과 같은 계산서는 승인번호로 한 번만 들어갑니다.</li>' +
      '<li>통장: 장부 내역의 결제(계좌이체 · 계좌입금)만 표시합니다. 매입 · 매출로 새로 넣지 않습니다.</li></ul></details></section>';
    return h;
  }
  function groupHtml(g, first) {
    var cats = g.g === '매출' ? SALE_CATS.map(function (c) { return [c, c]; }).concat([['출고', '출고 매출로 집계'], ['제외', '제외']])
      : BUY_CATS.map(function (c) { return [c, c]; }).concat([['제외', '제외']]);
    var h = '<div class="ag' + (first ? ' first' : '') + '"><div class="agh"><b>' + esc(g.name || '(거래처 미기재)') + '</b>' + g.kinds.map(function (k) { return '<span class="tag">' + esc(k) + '</span>'; }).join('') + '</div>' +
      '<p class="agm">' + g.n + '건 · 합계 ' + won(g.sum) + ' · ' + esc(spanD(g.from, g.to)) + '</p>';
    if (g.ex.length) h += '<ul class="subs">' + g.ex.map(function (e) { return '<li><span>' + esc(md(e[0]) + (e[1] ? ' · ' + e[1] : '')) + '</span><span>' + won(e[2]) + '</span></li>'; }).join('') + (g.n > g.ex.length ? '<li><span>외 ' + (g.n - g.ex.length) + '건</span><span></span></li>' : '') + '</ul>';
    if (g.memo) h += '<p class="fwarn">' + esc(g.memo) + '</p>';
    if (g.sug) h += '<p class="hint" style="margin:6px 0 0">' + (g.t === 'guess' ? '장부에 넣은 분류' : '추정 분류') + ': <b>' + esc(g.sug === '제외' ? '제외' : g.sug) + '</b> <span class="est">추정</span></p>';
    h += '<div class="chips" style="margin-top:8px">' + cats.map(function (c) {
      return '<button type="button" class="chip sm' + (c[0] === g.sug ? ' sug' : '') + '" data-act="aset" data-i="' + g.i + '" data-v="' + esc(c[0]) + '"' + (S.autoBusy ? ' disabled' : '') + '>' + esc(c[1]) + '</button>';
    }).join('') + '</div></div>';
    return h;
  }
  function recentHtml(x) {
    var amt = x[1] === '통장' ? (x[7] ? '출금 ' + won(x[7]) : '입금 ' + won(x[6])) : won(x[5]);
    var undo = x[8] === '장부 반영' || x[8] === '제외';
    return '<li class="row"><div class="rl"><b>' + esc(x[3] || '(거래처 미기재)') + '<span class="tag">' + esc(x[1]) + '</span></b><small>' + esc(md(x[2]) + (x[4] ? ' · ' + x[4] : '')) + '</small>' +
      (x[10] ? '<small>' + esc(x[10]) + '</small>' : '') + '</div><div class="rr"><b>' + amt + '</b><small><span class="st ' + (AST[x[8]] || '') + '">' + esc(x[8]) + '</span>' +
      (x[9] === 0 ? ' · 장부에서 삭제됨' : '') + '</small>' +
      (undo ? '<button type="button" class="link" data-act="aundo" data-k="' + esc(x[0]) + '"' + (S.autoBusy ? ' disabled' : '') + '>' + (S.autoArm === x[0] ? '한 번 더 누르면 되돌립니다' : '되돌리기') + '</button>' : '') + '</div></li>';
  }
  function autoAct(fn, args, done) {
    if (S.autoBusy) return;
    S.autoBusy = true; S.autoArm = '';
    var bo = $('autoBank'); S.autoBankOpen = !!(bo && bo.open);
    render();
    call(fn, args).then(function (d) {
      S.autoBusy = false; S.auto = d; S.autoErr = ''; autoInvalidate();
      if (S.view === 'auto') render();
      if (done) done(d);
    }, function (e) {
      S.autoBusy = false;
      if (String(e && e.message) !== 'auth') toast(errText(e));
      if (S.view === 'auto') render();
    });
  }

  /* ───────── 누르기 · 쓰기 ───────── */
  function savePer() { try { localStorage.setItem('nmc_led_per', JSON.stringify(S.per)); } catch (e) {} }
  function setView(v) {
    if (S.view === v) return;
    S.view = v; S.filter = '';
    if (S.view === 'sum' && S.per.sum === 'd') S.per.sum = 'm';
    if (!window.NMCNav) { try { history.replaceState(history.state, '', location.pathname + '?view=' + v); } catch (e) {} }   // 있으면 nav.js가 새 칸 주소를 ?view= 로
    S.autoArm = '';
    render(); window.scrollTo(0, 0);
    if (v === 'auto' && S.auto) needAuto(true);   // 들어올 때마다 최신으로
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (el.tagName === 'INPUT') return;
    switch (act) {
      case 'view': setView(v); return;
      case 'per': {
        var old = range(curPer(), S.at);
        S.per[S.view] = v; savePer();
        if (v === 'd') S.at = S.today >= old.a && S.today <= old.b ? S.today : old.b < S.today ? old.b : old.a;
        render(); return;
      }
      case 'prev': case 'next': {
        var n = shift(curPer(), S.at, act === 'prev' ? -1 : 1);
        if (n > S.today) n = S.today;
        S.at = n; render(); return;
      }
      case 'today': S.at = S.today; render(); return;
      case 'goday': S.per[S.view] = 'd'; S.at = v; savePer(); render(); window.scrollTo(0, 0); return;
      case 'gomon': S.per[S.view] = 'm'; S.at = v; savePer(); render(); window.scrollTo(0, 0); return;
      case 'add': openAdd(); return;
      case 'edit': openEdit(el.getAttribute('data-id')); return;
      case 'close': closeSheet(); return;
      case 'save': save(true); return;
      case 'savemore': save(false); return;
      case 'del': del(); return;
      case 'csv': exportCsv(); return;
      case 'print': window.print(); return;
      case 'reload': reload(false); return;
      case 'retry': S.err = ''; if (!S.today) start(); else render(); return;
      case 'aretry': S.autoErr = ''; S.auto = null; render(); return;
      case 'areload': needAuto(true); toast('새로고침 중…'); return;
      case 'arun': autoAct('apiAutoRun', [], function (d) { toast(runTxt(d.run) || '확인 완료'); }); return;
      case 'aon': autoAct('apiAutoOn', [true], function (d) { toast(d.trig ? '자동 확인을 켰습니다.' : '자동 확인을 켜지 못했습니다.'); }); return;
      case 'aset': {
        var g = S.auto && S.auto.groups[Number(el.getAttribute('data-i'))];
        if (!g || el.disabled) return;
        var lab = el.textContent;
        autoAct('apiAutoSet', [{ g: g.g, name: g.name, cat: v }], function (d) { toast(g.name + ' → ' + lab + ' (' + (d.applied || 0) + '건 적용)'); });
        return;
      }
      case 'aundo': {
        var k = el.getAttribute('data-k');
        if (S.autoArm !== k) { S.autoArm = k; render(); return; }
        autoAct('apiAutoUndo', [k], function () { toast('되돌렸습니다. 해당 거래처는 다음부터 분류를 다시 묻습니다.'); });
        return;
      }
      case 'fset': {
        var sh = S.sheet; if (!sh) return;
        var k = el.getAttribute('data-f'), f = sh.f;
        if (k === 'rkind') {
          var was = f.rkind;
          f.rkind = v;
          if (v === '폐타이어') { f.cat = 'SBR·폐타이어 관련'; if (!f.desc) f.desc = '폐타이어'; }
          else if (was === '폐타이어') { f.cat = '칼라칩 관련'; if (f.desc === '폐타이어') f.desc = ''; }
          if (!f.cat) f.cat = '칼라칩 관련';
        }
        else if (k === 'cat') { if (f.cat !== v) f.sub = ''; f.cat = v; }
        else if (k === 'pay' || k === 'proof' || k === 'sub') f[k] = f[k] === v ? '' : v;
        else if (k === 'unit') { f.unit = v; }
        else f[k] = v;
        if (k === 'vat' && v !== '직접') f.amt2 = '';
        sh.err = ''; sh.hint = k === 'cat' || k === 'rkind' ? '' : sh.hint;
        renderSheet();
        if (k === 'cat' && sh.src === '직접' && !f.sub) { var s1 = sheetEl.querySelector('[data-f="sub"]'); if (s1) s1.focus(); }
        return;
      }
      case 'pickitem': {
        var f2 = S.sheet && S.sheet.f; if (!f2) return;
        f2.desc = v; if (el.getAttribute('data-u')) f2.unit = el.getAttribute('data-u');
        renderSheet(); var qe = sheetEl.querySelector('[data-f="qty"]'); if (qe) qe.focus(); return;
      }
      case 'lastprice': {
        var f3 = S.sheet && S.sheet.f; if (!f3) return;
        f3.price = fmtIn(v, true); if (!f3.amt || !f3.amtManual) { f3.amtManual = false; f3.amt = ''; }
        renderSheet(); autoAmt(); updCalc(); return;
      }
    }
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.getAttribute('data-act') === 'filter') {
      S.filter = el.value;
      var d = S.data[S.at.slice(0, 4)], lst = $('list');
      if (d && lst) { var r = range(curPer(), S.at); lst.innerHTML = listHtml(d, pcmp(r.a, r.b), S.view === 'recv'); }
      return;
    }
    var k = el.getAttribute('data-f');
    if (!k || !S.sheet) return;
    var f = S.sheet.f;
    if (k === 'neg') { f.neg = el.checked; updCalc(); return; }
    if (k === 'amt' || k === 'amt2' || k === 'qty' || k === 'price') {
      var nv = fmtIn(el.value, k === 'qty' || k === 'price');
      if (nv !== el.value) { el.value = nv; try { el.setSelectionRange(nv.length, nv.length); } catch (e) {} }
      f[k] = nv;
      if (k === 'amt') f.amtManual = !!nv;
      if (S.sheet.src === '입고' && (k === 'qty' || k === 'price')) autoAmt();
      updCalc();
      if (k === 'price' || k === 'qty') { var lp = $('lastPrice'); if (lp) lp.innerHTML = lastPriceHtml(f); }
      return;
    }
    if (k === 'date') { f.date = el.value; return; }
    f[k] = el.value;
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.getAttribute('data-act') === 'jump') {
      var v = el.value;
      if (/^\d{4}-\d{2}-\d{2}$/.test(v) && v <= S.today) { S.at = v; render(); }
      return;
    }
    var k = el.getAttribute('data-f');
    if (!k || !S.sheet) return;
    if (k === 'date') { S.sheet.f.date = el.value; renderSheet(); return; }
    if (k === 'cust') { if (autoFromCust()) renderSheet(); return; }
    if (k === 'desc' && S.sheet.src === '입고') { var lp = $('lastPrice'); if (lp) lp.innerHTML = lastPriceHtml(S.sheet.f); return; }
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'loginForm') return;
    ev.preventDefault();
    var pw = $('pw'), v = pw ? pw.value : '';
    if (!v) return;
    S.loginErr = '';
    var btn = ev.target.querySelector('button'); if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
    post({ action: 'login', pw: v, dev: devId() }).then(function (r) {
      setToken(r.token); S.authed = true; S.loginErr = ''; start();
    }, function (e) {
      S.loginErr = errText(e); render();
    });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229 && S.sheet && ev.target.tagName === 'INPUT' && ev.target.type !== 'checkbox') { ev.preventDefault(); ev.target.blur(); }   // 한글 조합 중 엔터는 조합만 끝냄 (2026-11-25)
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !S.authed || S.sheet) return;
    if (S.view === 'auto') { needAuto(true); return; }
    if (!S.today) return;
    reload(true);
  });

  if (window.NMCNav) NMCNav.page({ get: navGet, set: navSet, url: function (v) { return location.pathname + '?view=' + v.view; } });
  function start() {
    S.err = '';
    if (!S.authed) { render(); return; }
    S.today = ''; S.data = {};
    render();
    S.loading[''] = true;
    call('apiLed', ['']).then(function (d) { S.loading[''] = false; put(d, true); S.at = d.today; render(); },
      function (e) { S.loading[''] = false; if (String(e && e.message) !== 'auth') S.err = errText(e); render(); });
  }
  start();

  if (DEMO) window.__led = { get S() { return S; }, salesSum: salesSum, buySum: buySum, money: money, range: range, pcmp: pcmp, yAgo: yAgo, han: han };
})();
</script>
