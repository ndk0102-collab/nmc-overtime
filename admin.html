<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin"><!-- 바깥(구글 등)에는 주소를 보내지 않고, 앱 안 화면끼리는 보냄 (뒤로 = 온 길로) -->
<meta name="theme-color" content="#1E5AA8">
<title>NMC 잔업·급여 관리</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style id="pageStyle">@page { size: A4 portrait; margin: 8mm; }</style>
<style>
:root {
  --blue: #1E5AA8; --blue-d: #17467F; --blue-l: #E8F0FB; --ink: #1B2430; --muted: #5B6676; --line: #D9E0EA;
  --bg: #EEF2F7; --card: #FFFFFF; --warn: #9A4B00; --warn-bg: #FFF4E5; --ok: #146C43; --ok-bg: #E7F6EE;
  --err: #B42318; --err-bg: #FDECEA;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.45;
}
button, input, select { font: inherit; color: inherit; }
.num, td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.hidden { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--blue); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.top-in { max-width: 1560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -.2px; margin-right: auto; }
.brand small { font-weight: 500; opacity: .8; margin-left: 6px; font-size: 13px; }
.mnav { display: flex; align-items: center; gap: 6px; }
.mnav b { font-size: 17px; min-width: 120px; text-align: center; }
.iconbtn { border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12); color: #fff; border-radius: 8px; padding: 6px 11px; cursor: pointer; }
.iconbtn:hover { background: rgba(255,255,255,.24); }
a.iconbtn { text-decoration: none; display: inline-block; }
.paydate { font-size: 13px; opacity: .92; }

.tabs { max-width: 1560px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: #fff; border-radius: 10px 10px 0 0; padding: 9px 15px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: none; }
.tab[aria-selected="true"] { color: var(--blue); background: var(--card); box-shadow: inset 0 3px 0 var(--blue); }
main { max-width: 1560px; margin: 0 auto; padding: 0 16px 40px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 0 12px 12px 12px; padding: 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.toolbar h2 { font-size: 18px; margin: 0 auto 0 0; }
.btn { border: 1px solid var(--blue); background: #fff; color: var(--blue); border-radius: 9px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--blue-l); }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-d); }
.btn.small { padding: 4px 10px; font-size: 13px; }
a.btn { display: inline-block; text-decoration: none; }
.btn.danger { border-color: var(--err); color: var(--err); }
.btn:disabled { opacity: .5; cursor: default; }

.banner { border-radius: 10px; padding: 10px 14px; margin: 12px 0 0; font-size: 14px; }
.banner.info { background: var(--blue-l); color: #183B66; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.err { background: var(--err-bg); color: var(--err); }
.banners { max-width: 1560px; margin: 0 auto; padding: 0 16px; }

/* tables */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.grid th, .grid td { padding: 6px 7px; border-bottom: 1px solid var(--line); background: #fff; }
.grid thead th { background: #F5F8FC; position: sticky; top: 0; z-index: 1; font-weight: 700; font-size: 12px; color: #36404D; white-space: nowrap; }
.grid tbody tr:nth-child(even) td { background: #FAFBFD; }
.grid tbody tr:hover td { background: #F1F6FD; }
.grid.sticky1 th:first-child, .grid.sticky1 td:first-child { position: sticky; left: 0; z-index: 2; box-shadow: 1px 0 0 var(--line); }
.grid.sticky1 thead th:first-child { z-index: 3; }
.grid .pin { position: sticky; right: 0; z-index: 2; box-shadow: -1px 0 0 var(--line); }
.grid thead th.pin { z-index: 3; }
.grid tfoot td { font-weight: 800; background: #F0F4FA; border-top: 2px solid #B9C6D8; }
.grid td.name { font-weight: 700; white-space: nowrap; }
.grid .grp-pay { border-left: 2px solid #C9D6E8; }
.grid .grp-ded { border-left: 2px solid #E8D3C9; }
.grid .net { font-weight: 800; color: var(--blue-d); }
.linkish { border: none; background: none; padding: 0; color: var(--blue); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.warnmark { color: var(--warn); font-weight: 800; margin-left: 4px; }
.warnlist { margin: 14px 0 0; padding: 12px 14px; background: var(--warn-bg); border-radius: 10px; color: var(--warn); font-size: 13.5px; }
.warnlist ul { margin: 6px 0 0; padding-left: 18px; }

/* login */
.login { max-width: 380px; margin: 12vh auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; box-shadow: 0 8px 30px rgba(20,40,80,.08); }
.login h1 { margin: 0 0 4px; font-size: 22px; color: var(--blue); }
.login p { margin: 0 0 16px; color: var(--muted); word-break: keep-all; }
.login input { width: 100%; padding: 12px 14px; border: 1px solid #B8C4D4; border-radius: 10px; font-size: 17px; }
.login input:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
.login .btn { width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; }
.login .err { color: var(--err); margin: 12px 0 0; }
.login .back { margin: 18px 0 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
.login .back a { color: var(--blue); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; padding: 8px 10px; }
.login .back .lgback { color: var(--blue); }
.home-ic { vertical-align: -3px; margin-right: 3px; }

/* forms */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; }
.field label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.field input[type=text], .field input[type=password], .field select, .field input:not([type]) {
  width: 100%; padding: 8px 10px; border: 1px solid #B8C4D4; border-radius: 8px; background: #fff;
}
.field input:focus, .field select:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; padding-top: 18px; }
.checks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 26px; }
.checks .check { padding-top: 0; }
.check input { width: 18px; height: 18px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }
legend { font-weight: 700; color: var(--blue); padding: 0 6px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(15,25,40,.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 4vh 12px; }
.modal-box { background: #fff; border-radius: 14px; width: min(900px, 100%); padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal-box h3 { margin: 0 0 12px; font-size: 19px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

/* slips */
.sliplayout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
.sliplist { display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow-y: auto; }
.sliplist button { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.sliplist button[aria-current="true"] { border-color: var(--blue); background: var(--blue-l); font-weight: 700; }
.slipview { background: #F6F8FB; border-radius: 12px; padding: 14px; overflow-x: auto; }
.slip { background: #fff; border: 1.5px solid #2B3A4D; width: 190mm; max-width: 100%; margin: 0 auto; padding: 4mm 5mm 3mm; font-size: 9.2pt; line-height: 1.3; color: #111; }
.slip-h { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #2B3A4D; padding-bottom: 1.8mm; }
.slip-h .t1 { font-size: 14pt; font-weight: 800; letter-spacing: -.3px; }
.slip-h .t2 { font-size: 9pt; color: #444; }
.slip-h .co { font-weight: 800; font-size: 11pt; }
.slip-who { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 1mm 4mm; padding: 1.5mm 0; border-bottom: 1px solid #999; font-size: 9pt; }
.slip-who b { font-size: 10.5pt; }
.slip-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5mm; margin-top: 1.8mm; align-items: start; }
.slip-t { width: 100%; border-collapse: collapse; table-layout: fixed; }
.slip-t col.c1 { width: 31%; }
.slip-t col.c3 { width: 22%; }
.slip-t caption { text-align: left; font-weight: 800; padding: 0 0 .8mm; font-size: 9.2pt; }
.slip-t th, .slip-t td { border: 1px solid #9AA4B1; padding: .5mm 1.2mm; vertical-align: top; line-height: 1.22; }
.slip-t th { background: #EEF2F7; font-size: 7.6pt; font-weight: 700; }
.slip-t td.lbl { font-size: 8.6pt; }
.slip-t td.lbl b { font-weight: 600; }
.slip-t td.how { font-size: 6.9pt; color: #333; word-break: keep-all; overflow-wrap: anywhere; }
.slip-t td.amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 9pt; }
.slip-t .lbl small { display: block; font-size: 6.5pt; color: #555; line-height: 1.15; }
.slip-t tr.sum td { font-weight: 800; background: #F3F6FA; font-size: 8.6pt; }
.slip-net { display: flex; justify-content: space-between; align-items: center; margin-top: 2mm; border: 2px solid #2B3A4D; padding: 1.4mm 3mm; }
.slip-net .v { font-size: 14pt; font-weight: 900; }
.slip-net .acct { font-size: 8.6pt; color: #333; text-align: right; }
.slip-days { margin-top: 1.6mm; font-size: 7.4pt; color: #222; line-height: 1.3; }
.slip-days b { font-weight: 700; }
.slip-note { margin: 1mm 0 0; font-size: 6.9pt; color: #444; }

/* print */
#print { display: none; }
.pl-title { font-size: 13pt; font-weight: 800; margin: 0 0 3mm; display: flex; justify-content: space-between; align-items: baseline; }
.pl-title small { font-size: 8.5pt; font-weight: 500; color: #444; }
table.pl { border-collapse: collapse; width: 100%; font-size: 7.3pt; }
.pl th, .pl td { border: 1px solid #8C97A6; padding: .9mm 1mm; }
.pl th { background: #E9EEF5; font-weight: 700; }
.pl td { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl td:first-child { text-align: left; font-weight: 700; }
.pl tfoot td { font-weight: 800; background: #F1F4F8; }
.pl-sign { margin-top: 4mm; display: flex; justify-content: flex-end; gap: 6mm; font-size: 9pt; }
.pl-sign span { border: 1px solid #8C97A6; width: 26mm; height: 15mm; display: inline-flex; align-items: flex-start; justify-content: center; padding-top: 1mm; }
.pair { break-after: page; page-break-after: always; }
.pair:last-child { break-after: auto; page-break-after: auto; }
.pair .slip { width: 100%; max-width: none; break-inside: avoid; page-break-inside: avoid; }
.pair .slip + .slip { margin-top: 6mm; }
@media print {
  body { background: #fff; }
  body.printing > *:not(#print) { display: none !important; }
  body.printing #print { display: block; }
  .slip { border-width: 1.2px; }
}
@media screen and (max-width: 760px) {
  .sliplayout { grid-template-columns: 1fr; }
  .slipview { padding: 6px; }
  .slipview .slip { width: 100%; padding: 3mm; font-size: 10pt; }
  .slipview .slip-h { flex-wrap: wrap; gap: 4px; }
  .slipview .slip-who { grid-template-columns: 1fr; }
  .slipview .slip-cols { grid-template-columns: 1fr; gap: 3mm; }
  .slipview .slip-net { flex-wrap: wrap; gap: 4px; }
  .slipview .slip-t td.lbl { font-size: 10pt; }
  .slipview .slip-t td.how { font-size: 8pt; }
  .slipview .slip-t td.amt { font-size: 10pt; }
  .sliplist { flex-direction: row; flex-wrap: wrap; max-height: none; }
  .mnav b { min-width: 0; }
}

.loading { position: fixed; inset: 0; background: rgba(238,242,247,.6); z-index: 60; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--blue); }
.loading span { background: #fff; padding: 12px 20px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1B2430; color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 70; font-size: 14px; }
/* overtime grid */
.grid.otgrid { font-size: 12.5px; }
.grid.otgrid th, .grid.otgrid td { padding: 0; text-align: center; }
.grid.otgrid thead th { padding: 5px 2px; line-height: 1.15; }
.grid.otgrid thead th small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
.grid.otgrid th.hol, .grid.otgrid th.hol small { color: #B42318; }
.grid.otgrid th.hol, .grid.otgrid td.hol { background: #FCEFEF; }
.grid.otgrid td.name { padding: 6px 10px; text-align: left; }
.grid.otgrid td:first-child, .grid.otgrid th:first-child { text-align: left; padding-left: 10px; }
.grid.otgrid .sum1 { padding: 6px 8px; background: #F2F6FB; white-space: nowrap; }
.grid.otgrid tfoot td { padding: 6px 2px; }
.cellbtn { display: block; width: 100%; min-width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer; font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); }
.cellbtn:hover, .cellbtn:focus-visible { background: var(--blue-l); outline: 2px solid var(--blue); outline-offset: -2px; }
td.future { background: repeating-linear-gradient(135deg, #fff, #fff 4px, #F3F5F8 4px, #F3F5F8 8px); }
.h3 { font-size: 16px; margin: 22px 0 10px; }
.grid.hist { width: auto; min-width: 560px; }
.grid.hist td, .grid.hist th { padding: 5px 12px; }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; color: var(--blue); font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.modal-box.small { width: min(440px, 100%); }
.pl .hol { background: #FBEAEA; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
table.pl.ot td { text-align: center; padding: .9mm .3mm; }
table.pl.ot td:first-child { text-align: left; padding-left: 1.2mm; }
table.pl.ot th { padding: .7mm .2mm; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 0 0 14px; }
.kv div { background: #F5F8FC; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kv small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
.kv b { font-size: 18px; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--err-bg); color: var(--err); }
.pill.off { background: #EEF0F3; color: #6B7480; }
.note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
/* 근태 · 연차 (2026-11-22) */
.field input[type=date], .field input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid #B8C4D4; border-radius: 8px; background: #fff; font: inherit; }
.attm { display: inline-block; font-size: 10px; font-weight: 800; line-height: 14px; padding: 0 3px; border-radius: 4px; margin-left: 2px; vertical-align: 1px; }
.attm.a-un { background: #FDE7E7; color: #B42318; }
.attm.a-pd { background: #E3F2E8; color: #1E6B34; }
.attprev { grid-column: 1 / -1; margin: 0; padding: 10px 12px; border-radius: 10px; background: #F5F8FC; border: 1px solid var(--line); font-size: 14px; }
.attprev:empty { display: none; }
.attprev.minus { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.grid td.neg { color: var(--err); font-weight: 800; }
.attcell { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: #F5F8FC; font-size: 14px; }
.attcell ul { margin: 4px 0 8px; padding-left: 18px; }
#attSum th, #attSum td, #attList th, #attList td, #leaveTable th, #leaveTable td { white-space: nowrap; }
#attSum td:last-child { white-space: normal; min-width: 280px; }
#attList td:nth-child(5) { white-space: normal; min-width: 150px; }
#leaveTable td[colspan] { white-space: normal; }
.note li { margin: 3px 0; }
/* 월급제 · 여러 명 한꺼번에 (2026-11-22) */
.otgrid tr.salgrp td { position: static; text-align: left; padding: 8px 10px; background: #F5F8FC; color: #44516A; font-size: 13px; font-weight: 700; white-space: normal; }
.otgrid tr.sal td.name { color: #44516A; }
details.bulk { margin: 0 0 14px; padding: 4px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
details.bulk summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; color: var(--blue); font-weight: 700; }
details.bulk textarea { display: block; width: 100%; margin: 8px 0; padding: 8px 10px; border: 1px solid #B8C4D4; border-radius: 8px; font: 14px/1.6 ui-monospace, Consolas, monospace; resize: vertical; }
details.bulk code { padding: 0 4px; border-radius: 4px; background: #EEF2F7; }
.bulkbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
#bulkTable td, #bulkTable th, #payTable td.name { white-space: nowrap; }
#payTable td.chg { white-space: normal; min-width: 280px; }
.bulkmsg { margin: 8px 0 10px; font-weight: 700; color: var(--ok); }
.iconbtn.nmc-back { display: inline-flex; min-height: 0; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 11px 6px 7px; font-size: inherit; font-weight: 700; }
</style>

      '<li>칸 안의 <span class="attm a-un">결</span> <span class="attm a-un">지</span> <span class="attm a-un">무</span> <span class="attm a-pd">연</span> <span class="attm a-pd">반</span> = 근태 (결근 · 지각·조퇴 · 무급 휴가 · 연차 · 반차). 칸을 누르거나 「근태·연차」 칸에서 적습니다.</li>' +
      '<li>관리자 수정 내용은 구글 시트 「변경이력」에 「관리자 수정」으로 기록됩니다.</li></ul>' +
      '<h3 class="h3">최근 변경 기록 (이 달)</h3>' +
      (hist.length ? histTable(hist.slice(0, 10), minTxt) +
        (hist.length > 10 ? '<details class="more"><summary>이전 기록 ' + (hist.length - 10) + '건 더 표시</summary>' + histTable(hist.slice(10), minTxt) + '</details>' : '')
        : '<p class="muted">이 달의 변경 기록이 없습니다.</p>');
  }
  function histTable(list, minTxt) {
    return '<div class="scroll"><table class="grid hist"><thead><tr><th>시각</th><th>구분</th><th>이름</th><th>날짜</th><th class="n">이전</th><th class="n">이후</th></tr></thead><tbody>' +
      list.map(function (x) {
        return '<tr><td>' + esc(String(x.at).slice(5, 16)) + '</td><td>' + esc(histLabel(x.action)) + '</td><td class="name">' + esc(x.name) + '</td><td>' + esc(md(x.date)) + '</td>' +
          '<td class="n">' + minTxt(x.before) + '</td><td class="n">' + minTxt(x.after) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function endTime(min) {
    var p = String(S.month.config.otStart || '17:30').split(':');
    var t = Number(p[0]) * 60 + Number(p[1]) + min;
    var h = Math.floor(t / 60) % 24, m = t % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function viewCell() {
    var c = S.cell, lim = S.data.otLimits || { step: 30, maxMin: 300, maxHolidayMin: 720 };
    var hol = isHol(c.date), max = hol ? lim.maxHolidayMin : lim.maxMin;
    if (isSalaried(c.name) && !c.minutes) {   // 월급제: 잔업 칸 없이 근태만
      return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ct"><form class="modal-box small" id="cellForm">' +
        '<h3 id="ct">' + esc(c.name) + ' · ' + esc(md(c.date)) + ' · 월급제</h3>' +
        '<p class="note">월급제 직원이라 잔업을 기록하지 않습니다.</p>' + cellAttHtml(c) +
        '<div class="modal-actions"><button type="button" class="btn" data-act="closeCell">닫기</button></div></form></div>';
    }
    var opts = ['<option value="0"' + (c.minutes ? '' : ' selected') + '>' + (c.minutes ? '기록 삭제' : '기록 없음') + '</option>'];
    for (var m = lim.step; m <= max; m += lim.step) {
      opts.push('<option value="' + m + '"' + (m === c.minutes ? ' selected' : '') + '>' + P.hrs(m) + '시간' + (hol ? '' : ' (17:30~' + endTime(m) + ')') + '</option>');
    }
    return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ct"><form class="modal-box small" id="cellForm">' +
      '<h3 id="ct">' + esc(c.name) + ' · ' + esc(md(c.date)) + (hol ? ' · 휴일 근무' : ' · 평일 잔업') + '</h3>' +
      '<div class="field"><label for="c_min">시간</label><select id="c_min" name="minutes">' + opts.join('') + '</select>' +
      '<div class="hint">' + (hol ? '휴일은 당일 근무 시간 전체 (최대 ' + P.hrs(max) + '시간)' : '평일은 17:30부터의 잔업 시간 (최대 ' + P.hrs(max) + '시간)') + '</div></div>' +
      '<p class="note">현재 기록: ' + (c.minutes ? P.hrs(c.minutes) + '시간' : '없음') + '</p>' +
      cellAttHtml(c) +
      '<div class="modal-actions"><button type="button" class="btn" data-act="closeCell">닫기</button><button type="submit" class="btn primary">저장</button></div></form></div>';
  }
  function otPrintHtml() {
    var t = otTable(), ym = S.month.ym;
    var wk = 0, hol = 0;
    t.rows.forEach(function (r) { wk += r.wk; hol += r.hol; });
    return '<div class="pl-title"><span>' + ymTitle(ym) + ' 잔업 기록 · ' + esc(S.month.config.company) + '</span><small>평일 잔업 17:30부터 · 빨간 열은 휴일 근무 · 출력 ' +
      esc(new Date().toLocaleString('ko-KR')) + '</small></div>' +
      '<table class="pl ot"><thead><tr><th>이름</th>' + t.days.map(function (dt) {
        return '<th class="' + (isHol(dt) ? 'hol' : '') + '">' + Number(dt.slice(8)) + '<br>' + WD[new Date(dt + 'T00:00:00Z').getUTCDay()] + '</th>';
      }).join('') + '<th>평일</th><th>휴일</th><th>합계</th></tr></thead><tbody>' +
      t.rows.filter(function (r) { return !r.sal; }).map(function (r) {   // 잔업표 인쇄에는 월급제(잔업 기록 없음) 빼고
        return '<tr><td>' + esc(r.name) + '</td>' + r.cells.map(function (v, i) { return '<td class="' + (isHol(t.days[i]) ? 'hol' : '') + '">' + hTxt(v) + '</td>'; }).join('') +
          '<td>' + hTxt(r.wk) + '</td><td>' + hTxt(r.hol) + '</td><td><b>' + hTxt(r.wk + r.hol) + '</b></td></tr>';
      }).join('') + '</tbody><tfoot><tr><td>합계</td>' + t.dayTot.map(function (v, i) { return '<td class="' + (isHol(t.days[i]) ? 'hol' : '') + '">' + hTxt(v) + '</td>'; }).join('') +
      '<td>' + P.hrs(wk) + '</td><td>' + P.hrs(hol) + '</td><td>' + P.hrs(wk + hol) + '</td></tr></tfoot></table>' +
      '<div class="pl-sign"><span>담당</span><span>대표</span></div>';
  }

  /* 급여대장 */
  var PAY_KEYS = ['base', 'ot', 'night', 'hol', 'bonus', 'att', 'otherPay', 'gross'];
  var DED_KEYS = ['np', 'hi', 'ltc', 'ei', 'it', 'lt', 'dorm', 'otherDed', 'dedTotal'];
  var KEEP_COLS = ['name', 'base', 'gross', 'dedTotal', 'net'];
  function viewLedger() {
    var L = P.ledger(S.month);
    var t = S.month.totals;
    // 화면에서는 모두 0인 칸(야간·기타 등)을 숨깁니다. 인쇄·엑셀·시트 저장은 모든 칸을 그대로 씁니다.
    var show = P.LEDGER_COLS.map(function (c, i) {
      return KEEP_COLS.indexOf(c[0]) >= 0 || L.rows.some(function (r) { return r[i]; });
    });
    var cols = P.LEDGER_COLS.filter(function (c, i) { return show[i]; });
    L = {
      rows: L.rows.map(function (r) { return r.filter(function (v, i) { return show[i]; }); }),
      totals: L.totals.filter(function (v, i) { return show[i]; })
    };
    var head = '<tr>' + cols.map(function (c, i) {
      var cls = i === 0 ? '' : 'n';
      if (c[0] === 'base') cls += ' grp-pay';
      if (c[0] === 'np') cls += ' grp-ded';
      if (c[0] === 'net') cls += ' pin';
      return '<th class="' + cls + '" scope="col">' + esc(c[1]) + '</th>';
    }).join('') + '</tr>';
    var body = S.month.rows.map(function (r, ri) {
      var row = L.rows[ri];
      return '<tr>' + cols.map(function (c, i) {
        if (i === 0) {
          return '<td class="name"><button class="linkish" data-slip="' + esc(r.name) + '">' + esc(r.name) + '</button>' +
            (r.warnings.length ? '<span class="warnmark" title="' + esc(r.warnings.join(' / ')) + '">⚠</span>' : '') + '</td>';
        }
        var v = row[i];
        var cls = 'n' + (c[0] === 'base' ? ' grp-pay' : '') + (c[0] === 'np' ? ' grp-ded' : '') + (c[0] === 'net' ? ' net pin' : '');
        var txt = (c[0] === 'otH' || c[0] === 'holH') ? (v ? String(v) : '') : (v ? fmt(v) : '');
        return '<td class="' + cls + '">' + txt + '</td>';
      }).join('') + '</tr>';
    }).join('');
    var foot = '<tr>' + L.totals.map(function (v, i) {
      var c = cols[i];
      if (i === 0) return '<td style="white-space:nowrap">' + esc(v) + '</td>';
      var cls = 'n' + (c[0] === 'base' ? ' grp-pay' : '') + (c[0] === 'np' ? ' grp-ded' : '') + (c[0] === 'net' ? ' net pin' : '');
      return '<td class="' + cls + '">' + (c[0] === 'otH' || c[0] === 'holH' ? String(v) : fmt(v)) + '</td>';
    }).join('') + '</tr>';
    var warns = S.month.rows.filter(function (r) { return r.warnings.length; });
    return '<div class="toolbar"><h2>' + ymTitle(S.month.ym) + ' 급여대장</h2>' +
      '<button class="btn" data-act="printLedger">급여대장 인쇄</button>' +
      '<button class="btn" data-act="xlsxLedger">엑셀 다운로드</button>' +
      '<button class="btn primary" data-act="saveLedger">구글 시트에 저장</button></div>' +
      '<div class="kv">' +
      '<div><small>인원</small><b>' + S.month.rows.length + '명</b></div>' +
      '<div><small>지급 합계</small><b>' + fmt(t.gross || 0) + '원</b></div>' +
      '<div><small>공제 합계</small><b>' + fmt(t.dedTotal || 0) + '원</b></div>' +
      '<div><small>실지급액 합계 (통장 입금)</small><b>' + fmt(t.net || 0) + '원</b></div>' +
      '</div>' +
      ((S.month.others || []).length ? '<p class="banner info" id="salNote" style="margin:0 0 12px">월급제 ' + S.month.others.length + '명(' + S.month.others.map(function (r) { return esc(r.name); }).join(', ') +
        ')은 월급(기본급)을 넣지 않아 급여대장 · 명세서 · 이체 파일에서 뺐습니다. 「직원 설정」에서 월급을 넣으면 들어갑니다.</p>' : '') +
      '<div class="scroll"><table class="grid sticky1" id="ledgerTable"><thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
      (warns.length ? '<div class="warnlist"><b>확인할 것</b><ul>' + warns.map(function (r) {
        return '<li><b>' + esc(r.name) + '</b>: ' + r.warnings.map(esc).join(' · ') + '</li>';
      }).join('') + '</ul></div>' : '') +
      '<ul class="note">' +
      '<li>이름을 누르면 그 사람 명세서가 열립니다. 금액은 원 단위, 시간은 잔업 앱 기록 그대로입니다.</li>' +
      '<li>4대보험은 당월 급여 기준으로 계산했습니다. 공단 고지서 금액과 일치시키려면 「직원 설정」의 <b>보험 기준월액</b>에 신고한 보수월액을 입력하십시오.</li>' +
      '<li>소득세는 국세청 근로소득 간이세액표(2026.3.1. 시행)를 그대로 적용했습니다. 지방소득세는 소득세의 10%입니다.</li>' +
      '</ul>';
  }

  /* 명세서 */
  function slipHtml(r) {
    var m = S.month, cfg = m.config, e = r.emp;
    var ymT = ymTitle(m.ym);
    var enMonth = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][Number(m.ym.slice(5, 7)) - 1] + ' ' + m.ym.slice(0, 4);
    function rows(list) {
      return list.map(function (x) {
        return '<tr><td class="lbl"><b>' + esc(x.label) + '</b>' + (x.en ? '<small>' + esc(x.en) + '</small>' : '') + '</td>' +
          '<td class="how">' + esc(x.how || '') + '</td><td class="amt">' + fmt(x.amount) + '</td></tr>';
      }).join('');
    }
    var days = r.hours.days.map(function (d) {
      return md(d.date) + ' ' + P.hrs(d.minutes) + 'h' + (d.type === 'holiday' ? '(휴일)' : '');
    }).join(' · ');
    var hourTxt = '연장 ' + P.hrs(r.hours.ot * 60) + '시간' + (r.hours.night ? ' · 야간 ' + P.hrs(r.hours.night * 60) + '시간' : '') +
      ' · 휴일 ' + P.hrs((r.hours.hol + r.hours.holOver) * 60) + '시간';
    var acct = e.account ? esc(e.bank) + ' ' + esc(P.maskAccount(e.account)) + (e.holder ? ' (' + esc(e.holder) + ')' : '') : '미등록';
    return '<article class="slip">' +
      '<div class="slip-h"><div><div class="t1">' + ymT + ' 급여명세서</div><div class="t2">Payslip · ' + enMonth + '</div></div>' +
      '<div style="text-align:right"><div class="co">' + esc(cfg.company) + '</div><div class="t2">지급일 Pay date <b>' + esc(m.payDate) + '</b></div></div></div>' +
      '<div class="slip-who"><div>성명 Name&nbsp; <b>' + esc(r.name) + '</b></div>' +
      '<div>생년월일·사번 ID&nbsp; <b>' + esc(e.idno || '-') + '</b></div>' +
      '<div>국적 Nationality&nbsp; <b>' + esc(e.nation || '-') + '</b></div></div>' +
      '<div class="slip-cols">' +
      '<table class="slip-t"><caption>지급 내역 Earnings</caption><colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup><tr><th>항목</th><th>계산 방법</th><th>금액(원)</th></tr>' + rows(r.pay) +
      '<tr class="sum"><td colspan="2">지급 합계 Total earnings</td><td class="amt">' + fmt(r.gross) + '</td></tr></table>' +
      '<table class="slip-t"><caption>공제 내역 Deductions</caption><colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup><tr><th>항목</th><th>계산 방법</th><th>금액(원)</th></tr>' + rows(r.ded) +
      '<tr class="sum"><td colspan="2">공제 합계 Total deductions</td><td class="amt">' + fmt(r.dedTotal) + '</td></tr></table>' +
      '</div>' +
      '<div class="slip-net"><div>실지급액 Net pay&nbsp; <span class="v">' + fmt(r.net) + '원</span></div><div class="acct">입금 계좌 ' + acct + '</div></div>' +
      '<div class="slip-days"><b>근무 기록 Work record</b> ' + hourTxt + (days ? ' — ' + esc(days) : '') + '</div>' +
      slipLeaveHtml(r) +
      '<p class="slip-note">통상시급 ' + P.fmtRate(r.hourly) + '원 기준 · 연장근로 ×' + cfg.otRate + ' · 야간(22시~) +' + cfg.nightAdd +
      ' · 휴일 8시간까지 ×' + cfg.holRate + ', 8시간 넘으면 ×' + cfg.holOverRate +
      (r.otExempt ? ' · 비과세 연장근로수당 ' + fmt(r.otExempt) + '원' : '') + '</p>' +
      '</article>';
  }
  function viewSlips() {
    var rows = S.month.rows;

      }).join('') + '</div><div class="slipview">' + slipHtml(cur) + '</div></div>' : '<p>직원이 없습니다.</p>');
  }

  /* 직원 설정 */

          '<td>' + (e.account ? esc(P.maskAccount(e.account)) : '<span class="pill bad">없음</span>') + '</td>' +
          '<td><button class="btn small" data-editemp="' + esc(e.name) + '">수정</button></td></tr>';

  /* ───────── 동작 ───────── */
  function bindMain() {
    app.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { S.tab = b.getAttribute('data-tab'); S.adjEdit = null; render(); });
    });
    app.querySelectorAll('[data-slip]').forEach(function (b) {
      b.addEventListener('click', function () { S.slip = b.getAttribute('data-slip'); S.tab = 'slips'; render(); });
    });
    app.querySelectorAll('[data-cell]').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-cell'), i = v.lastIndexOf('|');
        var name = v.slice(0, i), date = v.slice(i + 1), cur = 0;
        (S.data.records || []).forEach(function (r) { if (r.name === name && r.date === date) cur = Number(r.minutes) || 0; });
        S.cell = { name: name, date: date, minutes: cur };
        render();
      });
    });
    var cform = document.getElementById('cellForm');
    if (cform) {
      cform.addEventListener('submit', function (ev) {
        ev.preventDefault();
        if (!cform.elements.minutes) { S.cell = null; render(); return; }   // 월급제 칸 (잔업 없음)
        var c = S.cell, m = Number(cform.elements.minutes.value) || 0;
        if (m === c.minutes) { S.cell = null; render(); return; }
        var req = m ? call('saveRecord', { name: c.name, date: c.date, minutes: m }) : call('deleteRecord', { name: c.name, date: c.date });
        guard(req).then(function (r) {
          S.data.records = r.records; S.data.holidays = r.holidays; S.data.history = r.history;
          S.cell = null;
          recompute();
          toast(c.name + ' ' + md(c.date) + (m ? ' ' + P.hrs(m) + '시간으로 저장했습니다' : ' 기록이 삭제되었습니다'));
        });
      });
      cform.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { S.cell = null; render(); } });
      var cfirst = cform.elements.minutes || cform.querySelector('button');
      if (cfirst) cfirst.focus();
    }

  function act(a) {
    var m = S.month;
    switch (a) {
      case 'prev': load(shiftYm(m.ym, -1)); break;
      case 'next': load(shiftYm(m.ym, 1)); break;
      case 'reload': load(m.ym).then(function () { toast('새로 불러왔습니다'); }); break;
      case 'logout':
        call('logout', {}).catch(function () {});
        logoutLocal('');
        break;
      case 'closeEdit': S.edit = null; render(); break;
      case 'closeCell': S.cell = null; render(); break;
      case 'attFromCell': if (S.cell) { S.attForm = { name: S.cell.name, date: S.cell.date }; S.cell = null; S.tab = 'att'; render(); } break;
      case 'bulkCheck': {
        var btx = document.getElementById('bulkText');
        S.bulk = { open: true, text: btx ? btx.value : '' };
        S.bulk.plan = bulkPlan(S.bulk.text);
        if (!S.bulk.plan.length) S.bulk.msg = '넣을 줄이 없습니다.';
        render();
        break;
      }
      case 'bulkSave': bulkSave(); break;
      case 'payCheck': {
        var ptx = document.getElementById('payText');
        S.pbulk = { open: true, text: ptx ? ptx.value : '' };
        S.pbulk.plan = payPlan(S.pbulk.text);
        if (!S.pbulk.plan.length) S.pbulk.msg = '넣을 줄이 없습니다.';
        render();
        break;
      }
      case 'paySave': paySave(); break;
      case 'printOt': printNow('ledger', otPrintHtml()); break;
      case 'cancelAdj': S.adjEdit = null; render(); break;
      case 'printLedger': printLedger(); break;
      case 'printSlips': printSlips(m.rows); break;
      case 'printOne': printSlips(m.rows.filter(function (r) { return r.name === S.slip; })); break;
      case 'xlsxLedger': {
        var L = P.ledger(m);
        var title = [ymTitle(m.ym) + ' 급여대장 · ' + m.config.company + ' · 지급일 ' + m.payDate];
        download('급여대장_' + m.ym + '.xlsx', XLSX.build('급여대장', [title, L.header].concat(L.rows, [L.totals]), { numStyle: true, widths: [12, 9, 9].concat(L.header.slice(3).map(function () { return 11; })) }));
        break;
      }
      case 'saveLedger': {
        var L2 = P.ledger(m);
        guard(call('saveLedger', { ym: m.ym, ledger: { header: L2.header, rows: L2.rows, totals: L2.totals } })).then(function (r) {
          S.data.ledgerSaved = r.savedAt; render(); toast('구글 시트에 저장했습니다');
        });
        break;
      }
      case 'xlsxBank': case 'csvBank': {
        var rows = P.bankRows(m).filter(function (r) { return r.ok; });
        var header = ['은행코드', '은행', '계좌번호', '예금주', '이체금액', '받는분통장표시', '내통장표시', '직원'];
        var body = rows.map(function (r) { return [r.code, r.bank, r.account, r.holder, r.amount, r.memoTo, r.memoFrom, r.name]; });
        if (a === 'xlsxBank') download('급여이체_' + m.ym + '.xlsx', XLSX.build('급여이체', [header].concat(body), { widths: [9, 12, 18, 16, 12, 16, 14, 10] }));
        else download('급여이체_' + m.ym + '.csv', CSV.build([header].concat(body)));
        break;
      }
      case 'cfgDefaults': {
        if (!confirm('계산 기준을 2026년 기본값으로 되돌릴까요? (회사 이름·통장 표시는 그대로)')) return;
        var d = {};
        P.CONFIG_FIELDS.forEach(function (f) { if (f[0] !== 'company' && f[0] !== 'memoTo' && f[0] !== 'memoFrom') d[f[0]] = P.CONFIG_DEFAULTS[f[0]]; });
        guard(call('saveConfig', { config: d })).then(function (cfg) { S.data.config = cfg; recompute(); toast('기본값으로 되돌렸습니다'); });
        break;
      }
    }
  }

  /* ───────── 인쇄 ───────── */
  function printNow(kind, html) {
    var box = document.getElementById('print');
    box.innerHTML = html;
    document.getElementById('pageStyle').textContent = kind === 'ledger'
      ? '@page { size: A4 landscape; margin: 8mm; }' : '@page { size: A4 portrait; margin: 8mm; }';
    document.body.classList.add('printing');
    setTimeout(function () { window.print(); }, 60);
  }
  window.addEventListener('afterprint', function () {
    document.body.classList.remove('printing');
    document.getElementById('print').innerHTML = '';
  });
  function ledgerPrintHtml() {
    var m = S.month, L = P.ledger(m);
    return '<div class="pl-title"><span>' + ymTitle(m.ym) + ' 급여대장 · ' + esc(m.config.company) + '</span><small>지급일 ' + esc(m.payDate) +
      ' · 출력 ' + esc(new Date().toLocaleString('ko-KR')) + '</small></div>' +
      '<table class="pl"><thead><tr>' + L.header.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      L.rows.map(function (r) {
        return '<tr>' + r.map(function (v, i) { return '<td>' + (i === 0 ? esc(v) : (i <= 2 ? (v ? String(v) : '') : (v ? fmt(v) : ''))) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody><tfoot><tr>' + L.totals.map(function (v, i) { return '<td>' + (i === 0 ? esc(v) : (i <= 2 ? String(v) : fmt(v))) + '</td>'; }).join('') + '</tr></tfoot></table>' +
      '<div class="pl-sign"><span>담당</span><span>대표</span></div>';
  }
  function printLedger() { printNow('ledger', ledgerPrintHtml()); }
  function slipsPrintHtml(rows) {
    var out = '';
    for (var i = 0; i < rows.length; i += 2) {
      out += '<div class="pair">' + slipHtml(rows[i]) + (rows[i + 1] ? slipHtml(rows[i + 1]) : '') + '</div>';
    }
    return out;
  }
  function printSlips(rows) { if (rows.length) printNow('slips', slipsPrintHtml(rows)); }

  /* ───────── 파일 ───────── */
  function download(name, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  var CSV = {
    build: function (rows) {
      var text = rows.map(function (r) {
        return r.map(function (v) {
          var s = String(v == null ? '' : v);
          return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',');
      }).join('\r\n');
      return new Blob(['﻿' + text + '\r\n'], { type: 'text/csv;charset=utf-8' });
    }
  };

  /* 작은 엑셀(.xlsx) 만들기 — 압축 없이 ZIP 으로 묶습니다 (외부 프로그램 없음) */
  var XLSX = (function () {
    var TABLE = (function () {
      var t = [];
      for (var n = 0; n < 256; n++) {

        t.push(c >>> 0);
      }
      return t;
    })();
    function crc32(b) {
      var c = 0xFFFFFFFF;
      for (var i = 0; i < b.length; i++) c = TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }
    function dos() {
      var d = new Date();
      return {
        time: (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2),
        date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()

    }
    function zip(files) {
      var enc = new TextEncoder(), parts = [], central = [], offset = 0, t = dos();
      files.forEach(function (f) {
        var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
        var h = new DataView(new ArrayBuffer(30));
        h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
        h.setUint16(10, t.time, true); h.setUint16(12, t.date, true); h.setUint32(14, crc, true);
        h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
        parts.push(new Uint8Array(h.buffer), name, data);
        var c = new DataView(new ArrayBuffer(46));
        c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
        c.setUint16(12, t.time, true); c.setUint16(14, t.date, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true);
        c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true);
        c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, offset, true);
        central.push(new Uint8Array(c.buffer), name);
        offset += 30 + name.length + data.length;
      });
      var size = 0;
      central.forEach(function (p) { size += p.length; });
      var e = new DataView(new ArrayBuffer(22));
      e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true); e.setUint16(8, files.length, true);
      e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, offset, true); e.setUint16(20, 0, true);
      return new Blob(parts.concat(central, [new Uint8Array(e.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

    function x(s) {
      return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function col(i) {

      i++;
      while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
      return s;
    }
    var HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    var STYLES = HEAD + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="1"><font><sz val="11"/><name val="Malgun Gothic"/></font></fonts>' +
      '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    function sheet(rows, opt) {

      if (opt.widths && opt.widths.length) {
        out += '<cols>' + opt.widths.map(function (w, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('') + '</cols>';
      }
      out += '<sheetData>';
      rows.forEach(function (row, r) {
        out += '<row r="' + (r + 1) + '">';
        row.forEach(function (v, c) {
          var ref = col(c) + (r + 1);
          if (typeof v === 'number' && isFinite(v)) out += '<c r="' + ref + '"' + (opt.numStyle && Math.abs(v) >= 1000 ? ' s="1"' : '') + '><v>' + v + '</v></c>';

    function build(name, rows, opt) {

        { name: '[Content_Types].xml', data: HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
        { name: '_rels/.rels', data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
        { name: 'xl/workbook.xml', data: HEAD + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + x(name) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
        { name: 'xl/_rels/workbook.xml.rels', data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
        { name: 'xl/styles.xml', data: STYLES },
        { name: 'xl/worksheets/sheet1.xml', data: sheet(rows, opt) }
      ]);
    }
    return { build: build };
