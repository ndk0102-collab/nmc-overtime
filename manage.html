<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMC 관리자</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
window.NMC_API = "https://script.google.com/macros/s/AKfycbzg5mbJ9hkPn6Ld7hzNICzRYcsTDM_vVFdWZXV2qAy6QSYJFQVOvREsvE5NjIyy_05M/exec";
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
<script src="nav.js"></script>
<script src="menu.js"></script>
<script src="push.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 관리자 창구 (2026-11-20 19:25 지시: "잔업입력과 생산만 딱 두개만 놓고 하나는 관리자 하나 창구 만들어서 거기서 모든게 다 들어가도록")
   첫 화면에는 잔업 입력 · 생산 · 관리자 세 칸만 두고, 관리자 업무는 모두 이 화면에서 엽니다. 비밀번호 한 번이면 아래 화면이 모두 열립니다. */
:root{
  --bg:#EEF2F7; --card:#FFFFFF; --ink:#0F172A; --ink2:#334155; --muted:#5B6474; --line:#DCE3EC;
  --navy:#1B3A6B; --gold:#B08A35;
  --ot:#1E5AA8; --ot-soft:#E6EFFB; --st:#1B7A43; --st-soft:#E4F3EA; --pl:#9A5B16; --pl-soft:#FBEFE1; --cs:#0E7490; --cs-soft:#E0F2F7; --dc:#7A3A14; --dc-soft:#F6EDE6; --wk:#3F3D8F; --wk-soft:#ECEBF7;
  --bad:#B42318;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}

.appbar{background:var(--navy);color:#fff;padding:14px 16px 18px;border-radius:0 0 24px 24px;box-shadow:0 2px 10px rgba(27,58,107,.3)}
.ab-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.brand{flex:1;min-width:0;margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand small{margin-left:8px;font-size:12px;font-weight:700;letter-spacing:.2em;color:#E9D7AC}
@media (max-width:420px){.brand small{display:none}}   /* 휴대폰: 영문 부제가 두 줄로 쪼개지지 않게 */
.out{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:#fff;color:var(--navy);font-size:14px;font-weight:800;cursor:pointer}

.wrap{max-width:560px;margin:0 auto;padding:16px 14px 36px}
/* 대분류 → 소분류 (2026-11-25): 메뉴 목록은 menu.js 한 곳 — 이 화면과 화면마다 '메뉴' 단추가 같이 씀 */
.mfind{display:flex;align-items:center;gap:8px;min-height:52px;margin:0 0 14px;padding:0 14px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--muted)}
.mfind:focus-within{border-color:var(--navy)}
.mfind input{flex:1;min-width:0;height:48px;border:0;outline:0;background:transparent;font-size:16.5px;color:var(--ink);-webkit-appearance:none;appearance:none}
.grid{display:grid;gap:14px}
.sect{min-width:0;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:20px;padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.sh{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--c)}
.sh h2{margin:0;font-size:22px;font-weight:800;line-height:1.2;color:var(--c)}
.sh p{margin:3px 0 0;font-size:13px;font-weight:700;line-height:1.35;color:var(--muted)}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sub{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:62px;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none}
.sub.wide{grid-column:1/-1}
.sub b{font-size:16.5px;font-weight:800;line-height:1.3}
.sub small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:600;line-height:1.4;color:var(--muted)}
.sub small.live{display:block;-webkit-line-clamp:unset;color:var(--ink2);font-weight:700;font-size:13.5px}
.sub small.live b{font-size:inherit;font-weight:800;color:var(--dc)}
.sub small.live b.r{color:#B42318}
.sub small.live b.w{color:var(--wk)}
.sub:focus-visible,.home:focus-visible,.out:focus-visible,.btn:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
@media (hover:hover){.sub:hover{border-color:var(--c);background:var(--soft)}}
.sub[data-best]{border-color:var(--c);border-style:dashed}   /* 찾기: 엔터로 열 메뉴 */
@media (max-width:330px){.subs{grid-template-columns:1fr}}
.mnone{margin:4px 0 0;padding:26px 10px;text-align:center;color:var(--muted);font-weight:700}
.pushline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0;padding:10px 12px;border-radius:14px;background:var(--dc-soft);font-size:14.5px;font-weight:700;color:var(--ink2)}
.pushline button{min-height:42px;padding:0 14px;border:0;border-radius:10px;background:var(--dc);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer}
.pushline button:disabled{opacity:.55}
@media (min-width:880px){.wrap{max-width:1180px;padding-top:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}   /* PC: 위 줄 업무 · 영업·출고 · 생산·재고 / 아래 줄 공사 · 재무 · 인사·급여 */

.login{max-width:440px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--navy);border-radius:20px;padding:20px 18px}
.login h2{margin:0 0 6px;font-size:21px;font-weight:800;color:var(--navy)}
.login p{margin:0;color:var(--muted);font-size:14.5px}
.login form{display:flex;gap:8px;margin-top:14px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px;background:#fff}
.login input:focus{outline:none;border-color:var(--navy)}
.btn{min-height:52px;padding:0 18px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.err{margin:10px 0 0;color:var(--bad);font-weight:700}
.wait{padding:40px 10px;text-align:center;color:var(--muted);font-weight:700}
.legend{display:flex;align-items:flex-start;gap:8px;margin:18px 4px 0;font-size:14px;color:var(--muted)}
.legend svg{flex-shrink:0;margin-top:3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3)}
</style>
</head>
<body>
<header class="appbar">
  <div class="ab-in" data-nmc-slot data-nmc-hub="./" data-nmc-hub-name="홈">
    <a class="home" href="./"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>홈</a>
    <h1 class="brand">관리자<small>MANAGEMENT</small></h1>
    <button type="button" class="out" id="outBtn" hidden>로그아웃</button>
  </div>
</header>
<main class="wrap">
  <p class="wait" id="wait">확인 중…</p>
  <section class="login" id="login" hidden aria-labelledby="lh">
    <h2 id="lh">관리자 로그인</h2>
    <p>관리자 비밀번호 입력 시 부서 업무 · 출고 · 거래명세서 · 매출 · 매입 · 손익계산서 · 도면 화면을 이용할 수 있습니다.</p>
    <form id="loginForm" autocomplete="off">
      <label for="pw" style="position:absolute;left:-9999px">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required maxlength="100">
      <button class="btn" type="submit">로그인</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <div id="menu" hidden>
    <label class="mfind"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="mq" type="search" placeholder="메뉴 찾기 (예: 명세서 · 급여 · ㄱㄹㅊ)" autocomplete="off" enterkeyhint="go" aria-label="메뉴 찾기"></label>
    <div class="grid" id="groups"></div>
    <p class="mnone" id="mNone" hidden>찾는 메뉴가 없습니다. 다른 말로 찾아 주십시오.</p>
    <p class="pushline" id="pushLine" hidden><span id="pushTxt">이 기기에 매일 아침 알림을 등록하시겠습니까?</span><button type="button" id="pushBtn">이 기기 알림 등록</button></p>
    <p class="legend"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span>1회 로그인으로 위 화면을 이용할 수 있습니다. 화면마다 위쪽 ‘메뉴’ 단추로 이 목록을 바로 열 수 있습니다. 창을 닫거나 유효 시간이 지나면 재로그인이 필요합니다.</span></p>
  </div>
</main>
<p class="toast" id="toast" role="status" hidden></p>

<script>
(function () {
  'use strict';
  var API = window.NMC_API || '';
  var KEY = 'nmc_pay_token';   // 모든 관리자 화면이 같이 쓰는 열쇠
  var PKEY = 'nmc_payroll_token';   // 직원 급여 비밀번호 열쇠 (v59) — 관리자 로그아웃 · 만료 때 같이 지움
  var $ = function (id) { return document.getElementById(id); };
  var waitEl = $('wait'), loginEl = $('login'), menuEl = $('menu'), outBtn = $('outBtn'), toastEl = $('toast');
  var ERR = { bad_pw: '비밀번호가 일치하지 않습니다.', locked: '비밀번호 입력 오류 횟수 초과로 15분간 잠금되었습니다.', net: '인터넷 연결을 확인해 주십시오.',
    expired: '로그인 유효 시간이 만료되었습니다. 비밀번호를 다시 입력해 주십시오.' };

  function getToken() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { if (t) sessionStorage.setItem(KEY, t); else { sessionStorage.removeItem(KEY); sessionStorage.removeItem(PKEY); } } catch (e) {} }
  function post(body) {
    return fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', cache: 'no-store', credentials: 'omit' })
      .then(function (res) { if (!res.ok) throw new Error('net'); return res.json(); }, function () { throw new Error('net'); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'server'); return j.data; });
  }
  function devId() {
    var k = 'nmc_dev', v = '';
    try { v = localStorage.getItem(k) || ''; } catch (e) {}
    if (!/^[0-9a-f]{32}$/.test(v)) {
      var a = new Uint8Array(16); crypto.getRandomValues(a);
      v = Array.prototype.map.call(a, function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
      try { localStorage.setItem(k, v); } catch (e) {}
    }
    return v;
  }
  function say(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(say.t); say.t = setTimeout(function () { toastEl.hidden = true; }, 2600); }
  function show(which, err) {
    waitEl.hidden = which !== 'wait';
    loginEl.hidden = which !== 'login';
    menuEl.hidden = which !== 'menu';
    outBtn.hidden = which !== 'menu';
    $('loginErr').textContent = err || '';
    if (which === 'login') { var pw = $('pw'); pw.value = ''; pw.focus(); var b = loginEl.querySelector('button'); b.disabled = false; b.textContent = '로그인'; }
  }
  /* 열쇠가 살아 있는지 서버에 물어봅니다 (생산 입력용 목록 요청에 열쇠를 붙여 봄 — 맞으면 admin:true) */
  function check() {
    var t = getToken();
    if (!t) { show('login'); return; }
    show('menu');
    post({ action: 'stock.call', fn: 'apiForm', args: [], token: t }).then(function (d) {
      if (d && d.admin === true) { pushCheck(); liveSum(); return; }
      setToken(''); show('login', ERR.expired);
    }, function (e) { if (String(e && e.message) !== 'net') { setToken(''); show('login', ERR.expired); } });
  }
  /* 아침 알림 (2026-11-21): 알림을 이미 허용한 브라우저인데 등록이 없으면 묻지 않고 다시 등록, 아직 안 받는 기기면 한 번 누르게 */
  function call(fn, args) { return post({ action: 'stock.call', fn: fn, args: args || [], token: getToken() }); }
  /* 오늘 숫자 (v56, 2026-11-22 22:10 지시 "우리가 무조건 컨트롤하기 쉽고 알아보기 쉽도록"): 들어오자마자 오늘 출고 · 입고 · 공문 할 일이 몇 건인지 */
  function liveSum() {
    call('apiBrief', []).then(function (d) {
      var b = d && d.brief;
      if (!b || !Array.isArray(b.docs)) return;
      var late = b.docs.filter(function (x) { return x.d != null && x.d < 0; }).length, nin = (b.made || []).length + (b.pj || []).length;
      var n = function (v, u) { return '<b>' + v + '</b>' + u; };
      var td = $('tdSum'), dc = $('dcSum');
      if (td) { td.className = 'live'; td.innerHTML = '오늘 출고 ' + n(b.out.length, '곳') + ' · 입고 ' + n(nin, '건') + ' · 공문 처리 대기 ' + n(b.docs.length, '건') + (b.late ? ' · <b class="r">미처리 출고예정 ' + b.late + '건</b>' : ''); }
      if (dc) { dc.className = 'live'; dc.innerHTML = '처리 대기 ' + n(b.docs.length, '건') + (late ? ' · <b class="r">기한 경과 ' + late + '건</b>' : '') + (b.pick && b.pick.n ? ' · 신청 · 참가 검토 ' + b.pick.n + '건' : ''); }
    }, function () { /* 숫자는 보조 — 못 받으면 설명 그대로 */ });
    call('apiWorkSum', []).then(function (w) {   // v58: 부서 업무 — 담당 · 처리 대기 · 기한 경과 · 오늘 일정
      if (!w || !w.depts || !w.depts.length) return;
      var M = window.NMCMenu, box = $('groups'), wk = box && box.querySelector('[data-g="work"] .subs');
      if (!M || !wk) return;
      M.setDepts(w.depts.map(function (d) { return String(d.name || ''); }));   // 메뉴 창도 같은 부서 (이름만)
      Array.prototype.forEach.call(wk.querySelectorAll('[data-dept]'), function (a) { a.parentNode.removeChild(a); });
      wk.insertAdjacentHTML('beforeend', w.depts.map(function (d) {
        var t = (d.head ? '담당 ' + e(d.head) + ' · ' : '') + (d.open ? '처리 대기 <b class="w">' + d.open + '</b>건' : '처리 대기 없음') +
          (d.late ? ' · <b class="r">기한 경과 ' + d.late + '건</b>' : '') + (d.ev ? ' · 오늘 일정 <b class="w">' + d.ev + '</b>건' : '');
        var it = M.deptItem(String(d.name || ''));
        return '<a class="sub" data-k="' + e(it.k) + '" data-dept="' + e(it.dept) + '" href="' + e(M.href(it)) + '"><b>' + e(it.n) + '</b><small class="live">' + t + '</small></a>';
      }).join(''));
      findNow();
    }, function () { /* 서버가 아직 v58 전이면 설명 그대로 */ });
  }
  /* ── 대분류 → 소분류 (2026-11-25 10:11 지시 "전체카테고리 -소카테고리로 해서 좀 정리를 하자. 정렬도 하고 전체적으로 체계적으로"): 목록은 menu.js ── */
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function buildMenu() {
    var M = window.NMCMenu, box = $('groups');
    if (!M) { box.innerHTML = '<p class="wait">메뉴를 불러오지 못했습니다. 새로고침해 주십시오.</p>'; return; }
    box.innerHTML = M.groups().map(function (g) {
      return '<section class="sect" data-g="' + g.k + '" style="--c:' + g.c + ';--soft:' + g.s + '" aria-labelledby="h-' + g.k + '">' +
        '<div class="sh"><span class="ic" aria-hidden="true">' + M.icon(g.k, 26) + '</span><div><h2 id="h-' + g.k + '">' + e(g.n) + '</h2><p>' + e(g.d) + '</p></div></div>' +
        '<div class="subs">' + g.items.map(function (it) {
          var id = it.k === 'today' ? ' id="tdSum"' : it.k === 'docs' ? ' id="dcSum"' : '';
          return '<a class="sub' + (it.w ? ' wide' : '') + '" data-k="' + e(it.k) + '"' + (it.dept ? ' data-dept="' + e(it.dept) + '"' : '') + ' href="' + e(M.href(it)) + '"><b>' + e(it.n) + '</b><small' + id + '>' + e(it.d) + '</small></a>';
        }).join('') + '</div></section>';
    }).join('');
    var wk = box.querySelector('[data-g="work"]');
    if (wk) wk.appendChild($('pushLine'));   // 아침 알림 등록은 업무 칸 아래
  }
  function findNow() {
    var M = window.NMCMenu, q = $('mq');
    if (!M || !q) return null;
    var r = M.filter($('groups'), q.value);
    $('mNone').hidden = r.any;
    return r;
  }
  buildMenu();
  $('mq').addEventListener('input', findNow);   // 칸은 그대로 두고 아래 목록만 걸러 보임 (한글 조합이 깨지지 않게)
  $('mq').addEventListener('keydown', function (ev) {
    if (ev.isComposing || ev.keyCode === 229) return;   // 한글 조합 중 엔터 · Esc는 건드리지 않음
    if (ev.key === 'Enter') { ev.preventDefault(); var r = findNow(); if (r && r.first && this.value.trim()) r.first.click(); }
    else if (ev.key === 'Escape' && this.value) { ev.preventDefault(); this.value = ''; findNow(); }
  });
  function pushCheck() {
    var P = window.NMCPush, line = $('pushLine');
    if (!P || !P.supported()) { line.hidden = true; return; }
    P.auto(call, API).then(function () { return P.state(); }).then(function (s) { line.hidden = s.state !== 'off' || Notification.permission === 'denied'; }, function () { line.hidden = true; });
  }
  $('pushBtn').addEventListener('click', function () {
    var b = $('pushBtn');
    b.disabled = true; b.textContent = '등록 중…';
    window.NMCPush.enable(call, API).then(function () {
      $('pushLine').hidden = true;
      say('이 기기에 매일 아침 알림을 등록했습니다');
    }, function (e) {
      b.disabled = false; b.textContent = '이 기기 알림 등록';
      var c = String((e && e.message) || '');
      say(c === 'denied' ? '브라우저 알림 차단 상태입니다 (사이트 설정 → 알림 → 허용)' : c === 'dismissed' ? '알림 허용 창에서 허용을 누르십시오' : '등록 실패 (' + c + ')');
    });
  });
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = $('pw').value;
    if (!v) return;
    var b = loginEl.querySelector('button'); b.disabled = true; b.textContent = '확인 중…';
    post({ action: 'login', pw: v, dev: devId() }).then(function (r) { setToken(r.token); show('menu'); liveSum(); },
      function (e) { var c = String((e && e.message) || ''); show('login', ERR[c] || ('로그인하지 못했습니다 (' + c + ')')); });
  });
  outBtn.addEventListener('click', function () {
    var t = getToken(), pt = '';
    try { pt = sessionStorage.getItem(PKEY) || ''; } catch (e) {}
    setToken('');
    if (t && pt) post({ action: 'pay.logout', token: t, ptoken: pt }).catch(function () {});
    if (t) post({ action: 'logout', token: t }).catch(function () {});
    show('login');
    say('로그아웃되었습니다');
  });
  check();
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
})();
</script>
</body>
</html>
