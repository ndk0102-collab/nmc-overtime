<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMC 잔업</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E5AA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NMC 잔업">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#EEF2F7; --card:#FFFFFF; --ink:#0F172A; --ink2:#334155; --muted:#5B6474;
  --line:#DCE3EC; --soft:#F3F6FA;
  --accent:#1E5AA8; --accent-strong:#174A8C; --accent-soft:#E6EFFB;
  --ot:#174A8C; --ot-bg:#DFEBFB; --hol:#C2272D; --hol-bg:#FCE4E4; --hol-col:#FFF5F5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans','Noto Sans KR','Noto Sans Thai','Noto Sans Myanmar','Malgun Gothic','Apple SD Gothic Neo','Leelawadee UI','Myanmar Text','Myanmar Sangam MN',Tahoma,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html[lang="th"] body{line-height:1.6}
html[lang="my"] body{line-height:1.75}
button{font:inherit;color:inherit}
.demo{margin:0;padding:8px 14px;background:#FFF4E5;color:#7A4A00;font-size:13px;font-weight:700;text-align:center}

/* 상단 바 */
.appbar{background:var(--accent);color:#fff;padding:14px 16px 18px;border-radius:0 0 24px 24px;box-shadow:0 2px 10px rgba(23,74,140,.25)}
.ab-in,.who{max-width:640px;margin:0 auto}
.ab-in{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-0.01em}
.logo{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:11px;background:#fff;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.04em}
.toplang{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.who b{font-size:23px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.wholink{min-height:44px;padding:0 4px;border:0;background:none;color:#fff;font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex-shrink:0}

/* 본문 */
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 32px}
.wrap.withnav{padding-bottom:110px}
.wrap.wide{max-width:1480px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.sec{font-size:15px;font-weight:800;color:var(--ink2);margin:0 0 12px}
.hint{font-size:14px;color:var(--muted);margin:12px 2px 0}

/* 날짜 버튼 */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:64px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;border-radius:18px;border:2px solid var(--line);background:#fff;cursor:pointer;scroll-snap-align:start}
.day .dw{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2;white-space:nowrap}
.day .dn{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.day .dh{min-width:30px;height:20px;padding:0 6px;border-radius:999px;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.day .dh.ot{background:var(--ot-bg);color:var(--ot)}
.day .dh.hol{background:var(--hol-bg);color:var(--hol)}
.day.hol .dw,.day.hol .dn{color:var(--hol)}
.day.other{color:var(--accent-strong);border-style:dashed;background:var(--soft)}
.day.other .dw{white-space:normal;text-align:center;font-size:11px;color:var(--accent-strong)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 12px rgba(30,90,168,.3)}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dn{color:#fff}
.day[aria-pressed="true"] .dh.ot,.day[aria-pressed="true"] .dh.hol{background:#fff;color:var(--accent-strong)}
.day.hol[aria-pressed="true"]{background:var(--hol);border-color:var(--hol);box-shadow:0 4px 12px rgba(194,39,45,.28)}
.day.hol[aria-pressed="true"] .dh.hol,.day.hol[aria-pressed="true"] .dh.ot{color:var(--hol)}
.selinfo{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.seldate{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:800}
.badge.ot{background:var(--ot-bg);color:var(--ot)}
.badge.hol{background:var(--hol-bg);color:var(--hol)}

/* 시간 버튼 */
.note{display:flex;align-items:flex-start;gap:8px;margin:0 0 14px;padding:10px 12px;border-radius:12px;background:#E7F4EC;color:#14532D;font-size:15px;font-weight:700}
.note svg{flex-shrink:0;margin-top:2px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hgrid.hol{grid-template-columns:repeat(4,minmax(0,1fr))}
.hbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;padding:6px 4px;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:pointer}
.hgrid.hol .hbtn{min-height:60px}
.hbtn b{font-size:25px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.hbtn span,.hbtn small{font-size:12px;font-weight:700;color:var(--muted);line-height:1.35}
.hbtn small{font-variant-numeric:tabular-nums}
.hbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hgrid.hol .hbtn[aria-pressed="true"]{background:var(--hol);border-color:var(--hol)}
.hbtn[aria-pressed="true"] span,.hbtn[aria-pressed="true"] small{color:#fff}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;margin:16px 0 0;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(30,90,168,.28)}
.primary:disabled{opacity:.55;cursor:default;box-shadow:none}
.secondary{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;margin:10px 0 0;border:2px solid #F3C5C0;border-radius:16px;background:#fff;color:var(--hol);font-size:16px;font-weight:700;cursor:pointer}
.foot{color:var(--muted);font-size:14px}
.foot .wk{display:flex;align-items:center;gap:6px;margin:4px 4px 0}
.help{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2px 14px;margin-top:10px;color:var(--ink2)}
.help summary{min-height:46px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.help p{font-size:15px;margin:2px 0 12px}
.install{border:2px solid #BFD3F0;background:#F5F9FF}
.inst-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:17px;font-weight:800;color:var(--accent-strong)}
.inst-head svg{flex-shrink:0}
.install .primary{margin:0 0 12px}
.inst-steps{margin:0;padding:0;list-style:none}
.inst-steps li{margin:0 0 8px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1.5}
.inst-main{margin:0 0 14px;padding:14px;border-radius:14px;background:var(--accent-soft);color:var(--accent-strong);font-size:18px;font-weight:800;line-height:1.6}
.linkbtn{display:block;width:100%;min-height:44px;margin:2px 0 0;border:0;background:none;color:var(--muted);font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* 월 이동 · 합계 */
.monthbar{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.mtitle{flex:1;margin:0;text-align:center;font-size:25px;font-weight:800;letter-spacing:-0.01em}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex-shrink:0;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.iconbtn:disabled{opacity:.35;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.stat{padding:12px 10px 10px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.stat span{display:block;font-size:13px;font-weight:800;color:var(--muted)}
.stat b{display:block;font-size:clamp(18px,5.6vw,28px);font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b small{font-size:13px;font-weight:700;margin-left:3px;color:var(--muted)}
.stat.ot b{color:var(--ot)}
.stat.hol b{color:var(--hol)}
.stat.sum{background:var(--ink);border-color:var(--ink)}
.stat.sum span,.stat.sum b small{color:#CBD5E1}
.stat.sum b{color:#fff}

/* 내 기록 달력 */
.cal{padding:12px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h span{padding:0 0 6px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.cal-h span.hol{color:var(--hol)}
.cday{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;padding:16px 2px 4px;border-radius:12px;border:1px solid transparent;background:var(--soft);font:inherit;color:inherit}
.cday .cd{position:absolute;top:3px;left:6px;font-size:12px;font-weight:700;color:var(--muted)}
.cday.hol{background:var(--hol-col)}
.cday.hol .cd{color:var(--hol)}
.cday .ch{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.cday.ot.has{background:var(--ot-bg);border-color:#C6DBF6}
.cday.hol.has{background:var(--hol-bg);border-color:#F4C4C4}
.cday .ch.ot{color:var(--ot)}
.cday .ch.hol{color:var(--hol)}
.cday.today{border:2px solid var(--accent)}
button.cday{cursor:pointer}
.cblank{min-height:58px}

/* 전체 현황 표 */
.board{padding:0;overflow:hidden}
.bscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bt{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
.bt th,.bt td{height:42px;padding:0;text-align:center;font-size:13px;border-bottom:1px solid #EDF1F6}
.bt thead th{height:50px;background:#F7F9FC;color:var(--ink2);font-weight:800;border-bottom:1px solid var(--line)}
.bt thead th.dc{min-width:36px;width:36px}
.bt .dnum{display:block;font-size:14px;line-height:1.1}
.bt .dwk{display:block;font-size:12px;font-weight:700;line-height:1.2;color:var(--muted)}
.bt thead th.hol{background:var(--hol);color:#fff}
.bt thead th.hol .dwk{color:#FFE1E1}
.bt td.hol{background:var(--hol-col)}
.bt thead th.today{box-shadow:inset 0 -4px 0 var(--accent)}
.bt thead th.hol.today{box-shadow:inset 0 -4px 0 #0F172A}
.bt td.today{background:#FFF8E1}
.bt .cname{position:sticky;left:0;z-index:2;min-width:88px;padding:0 10px;text-align:left;white-space:nowrap;background:#fff;font-size:14px;font-weight:800;border-right:1px solid var(--line)}
.bt thead .cname{background:#F7F9FC;color:var(--muted);font-size:13px}
.bt .cname i{display:inline-block;min-width:20px;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.bt .v{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 3px;border-radius:8px;font-size:13px;font-weight:800}
.bt .v.ot{background:var(--ot-bg);color:var(--ot)}
.bt .v.hol{background:var(--hol-bg);color:var(--hol)}
.bt .ct{min-width:52px;padding:0 6px;font-size:14px;font-weight:800}
.bt .ct.ot{color:var(--ot);background:#F4F8FE}
.bt .ct.hol{color:var(--hol);background:#FFF6F6}
.bt thead .ct.ot,.bt thead .ct.hol{font-size:13px}
.bt .csum{position:sticky;right:0;z-index:2;min-width:58px;padding:0 6px;background:var(--ink);color:#fff;font-size:15px;font-weight:800;border-bottom-color:#1E293B}
.bt thead .csum{background:var(--ink);color:#fff;font-size:13px}
.bt .z{color:#94A3B8;font-weight:600}
.bt tr.me .cname{color:var(--accent-strong);background:#EEF5FF}
.bt tr.me .cname i{color:var(--accent-strong)}
.bt tfoot th,.bt tfoot td{height:46px;background:#F7F9FC;font-weight:800;border-bottom:0}
.bt tfoot .cname{background:#F7F9FC;color:var(--ink2);font-size:13px}
.bt tfoot .csum{background:#1E293B}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px 12px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px}
.legend i.ot{background:var(--ot-bg);border:1px solid #9DBFEA}
.legend i.hol{background:var(--hol-bg);border:1px solid #EDA3A3}
.legend i.td{background:#FFF8E1;border:1px solid #F0D58A}

/* 첫 화면 */
.h1{font-size:22px;font-weight:800;line-height:1.5;margin:4px 0 16px}
.h2{font-size:21px;font-weight:800;margin:0 0 14px}
.langbtn{display:flex;align-items:center;width:100%;min-height:64px;margin:0 0 10px;padding:8px 18px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:21px;font-weight:700;text-align:left;cursor:pointer}
.langbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.namebtn{display:flex;align-items:center;gap:10px;min-height:66px;padding:6px 14px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:21px;font-weight:800;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.namebtn i{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent-strong);font-size:13px;font-style:normal}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:50vh;text-align:center;color:var(--muted)}
.center .primary{max-width:280px}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid #D5DCE6;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.muted{margin:0;color:var(--muted);font-size:15px}

/* 아래 메뉴 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(15,23,42,.06)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:4px;border:0;border-radius:14px;background:none;color:var(--muted);font-size:13px;font-weight:800;line-height:1.25;cursor:pointer}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}

/* 창 · 알림 */
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(15,23,42,.45)}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px;border-radius:22px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ghost,.danger{min-height:56px;border-radius:16px;font-size:17px;font-weight:800;cursor:pointer}
.ghost{border:2px solid var(--line);background:#fff}
.danger{border:0;background:var(--hol);color:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 28px);padding:14px 18px;border-radius:16px;background:#0F172A;color:#fff;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.up{bottom:96px}
.toast svg{flex-shrink:0}
button:focus-visible,summary:focus-visible{outline:3px solid #8FB3E8;outline-offset:2px}
</style>
</head>

      var inner = '<span class="cd">' + d + '</span>' + (v ? '<span class="ch ' + (dh ? 'hol' : 'ot') + '">' + fmtH(v) + '</span>' : '');
      if (editable(date)) {
        h += '<button type="button" class="' + cls + '" data-act="caledit" data-v="' + date + '" aria-label="' + esc(fmtDate(date)) + (v ? ' · ' + esc(hrs(v)) : '') + '">' + inner + '</button>';
      } else {
        h += '<div class="' + cls + '">' + inner + '</div>';
      }
    }
    h += '</div><p class="hint">' + esc(tr('tapToEdit', { n: S.backDays })) + '</p></section>';
    return h;
  }

  function viewAll() {
    var ym = S.viewYm, list = S.months[ym];
    var h = monthBar(true);
    if (!list) return h + monthPending(ym);
    var names = S.employees.slice();
    list.forEach(function (e) { if (names.indexOf(e.name) < 0) names.push(e.name); });
    var grid = {};
    names.forEach(function (n) { grid[n] = {}; });
    list.forEach(function (e) { grid[e.name][e.date] = (grid[e.name][e.date] || 0) + e.minutes; });
    var dates = [], n = daysIn(ym);
    for (var d = 1; d <= n; d++) dates.push(ym + '-' + pad(d));
    var colTot = {}, gOt = 0, gHol = 0;

    var t = '<table class="bt"><thead><tr><th scope="col" class="cname">' + esc(tr('name')) + '</th>';
    dates.forEach(function (date) {
      var dd = parseYmd(date);
      t += '<th scope="col" class="dc' + (isHol(date) ? ' hol' : '') + (date === S.today ? ' today' : '') + '"><span class="dnum">' + dd.getDate() + '</span><span class="dwk">' + esc(T().wds[dd.getDay()]) + '</span></th>';
    });
    t += '<th scope="col" class="ct ot">' + esc(tr('otLabel')) + '</th><th scope="col" class="ct hol">' + esc(tr('holLabel')) + '</th><th scope="col" class="csum">' + esc(tr('sumLabel')) + '</th></tr></thead><tbody>';
    names.forEach(function (name, idx) {
      var row = grid[name], ot = 0, hol = 0;
      t += '<tr' + (name === S.me ? ' class="me"' : '') + '><th scope="row" class="cname"><i>' + (idx + 1) + '</i>' + esc(name) + '</th>';
      dates.forEach(function (date) {
        var v = row[date], dh = isHol(date);
        if (v) {
          if (dh) hol += v; else ot += v;
          colTot[date] = (colTot[date] || 0) + v;
        }
        t += '<td class="' + (dh ? 'hol' : '') + (date === S.today ? ' today' : '') + '">' + (v ? '<span class="v ' + (dh ? 'hol' : 'ot') + '">' + fmtH(v) + '</span>' : '') + '</td>';
      });
      gOt += ot;
      gHol += hol;
      t += '<td class="ct ot">' + (ot ? fmtH(ot) : '<span class="z">0</span>') + '</td><td class="ct hol">' + (hol ? fmtH(hol) : '<span class="z">0</span>') + '</td><td class="csum">' + fmtH(ot + hol) + '</td></tr>';
    });
    t += '</tbody><tfoot><tr><th scope="row" class="cname">' + esc(tr('dayTotal')) + '</th>';
    dates.forEach(function (date) {
      var v = colTot[date];
      t += '<td class="' + (isHol(date) ? 'hol' : '') + (date === S.today ? ' today' : '') + '">' + (v ? fmtH(v) : '') + '</td>';
    });
    t += '<td class="ct ot">' + fmtH(gOt) + '</td><td class="ct hol">' + fmtH(gHol) + '</td><td class="csum">' + fmtH(gOt + gHol) + '</td></tr></tfoot></table>';

    h += stats(gOt, gHol);
    h += '<section class="card board"><div class="bscroll" id="bscroll">' + t + '</div>';
    h += '<div class="legend"><span><i class="ot"></i>' + esc(tr('otLabel')) + '</span><span><i class="hol"></i>' + esc(tr('holBadge')) + '</span><span><i class="td"></i>' + esc(tr('todayMark')) + '</span></div></section>';
    return h;
  }

  function sheetLang() {
    var h = '<div class="overlay" data-act="close"><div class="sheet" data-act="noop" role="dialog" aria-modal="true" aria-label="' + esc(tr('language')) + '">';
    LANGS.forEach(function (l) {
      h += '<button type="button" class="langbtn" lang="' + l[0] + '" data-act="lang" data-v="' + l[0] + '" aria-pressed="' + (S.lang === l[0]) + '">' + l[1] + '</button>';
    });
    return h + '<button type="button" class="ghost" style="width:100%" data-act="close">' + esc(tr('cancel')) + '</button></div></div>';
  }

  function sheetConfirm() {
    var ex = myEntry(S.date);
    var h = '<div class="overlay" data-act="close"><div class="sheet" data-act="noop" role="alertdialog" aria-modal="true" aria-label="' + esc(tr('confirmDel')) + '">';
    h += '<p class="h2">' + esc(tr('confirmDel')) + '</p>';
    if (ex) h += '<p class="muted">' + esc(fmtDate(S.date)) + ' · ' + esc(hrs(ex.minutes)) + '</p>';
    return h + '<div class="two"><button type="button" class="ghost" data-act="close">' + esc(tr('cancel')) + '</button><button type="button" class="danger" data-act="del">' + esc(tr('del')) + '</button></div></div></div>';
  }

  /* ───────── 동작 ───────── */
  function showToast(html) {
    S.toast = html;
    render();
    clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(function () { S.toast = null; render(); }, 2600);
  }
  function toast(text) { showToast('<span>' + esc(text) + '</span>'); }
  function toastOk(text) { showToast(ICON.check + '<span>' + esc(text) + '</span>'); }
  function errText(err) {
    var m = String((err && err.message) || err || '');
    if (m.indexOf('bad_date') >= 0) return tr('errDate', { n: S.backDays });
    if (m.indexOf('bad_name') >= 0) return tr('errName');
    return tr('errConn');
  }

  function applyInit(r) {
    S.employees = r.employees || [];
    S.holidays = r.holidays || [];
    S.today = r.today;
    S.oldest = r.oldest;
    S.otStart = r.otStart || '17:30';
    S.stepMin = r.stepMin || 30;
    S.maxMin = r.maxMin || 300;
    S.maxHolMin = r.maxHolidayMin || 720;
    S.backDays = r.backDays || 7;
    if (r.month) { S.months[r.month.ym] = r.month.entries; S.monthErr[r.month.ym] = false; }
    if (S.me && S.employees.indexOf(S.me) < 0) { S.me = null; store('nmc_ot_me', null); }
    if (!S.date || !editable(S.date)) { S.date = S.today; S.minutes = 0; }
    if (!S.viewYm) S.viewYm = ymOf(S.today);
  }

  function loadInit() {
    S.fatal = false;
    render();
    call('apiInit').then(function (r) {
      applyInit(r);
      S.minutes = pickedMinutesFor(S.date);
      S.ready = true;
      render();
      syncUrl();
    }, function () { S.fatal = true; render(); });
  }

  function loadMonth(ym, after) {
    if (S.loadingMonth[ym]) return;
    S.loadingMonth[ym] = true;
    call('apiMonth', ym).then(function (r) {
      S.loadingMonth[ym] = false;
      S.months[r.ym] = r.entries;
      if (r.holidays) S.holidays = r.holidays;
      S.monthErr[r.ym] = false;
      if (after) after();
      render();
    }, function () {
      S.loadingMonth[ym] = false;
      if (!S.months[ym]) S.monthErr[ym] = true;
      toast(tr('errConn'));
    });
  }
  function ensureMonth(ym, after) { if (!S.months[ym]) loadMonth(ym, after); }

  function pickedMinutesFor(date) { var e = myEntry(date); return e ? e.minutes : 0; }

  function setDate(d) {
    S.date = d;
    S.minutes = pickedMinutesFor(d);
    if (!S.months[ymOf(d)]) ensureMonth(ymOf(d), function () { if (S.date === d) S.minutes = pickedMinutesFor(d); });
    render();
  }

  function setLang(l) {
    if (!I18N[l]) return;
    S.lang = l;
    S.toast = null;
    clearTimeout(S.toastTimer);
    store('nmc_ot_lang', l);
    applyLang();
    syncUrl();
  }

  function setMe(n) {
    S.me = n;
    store('nmc_ot_me', n);
    S.tab = 'rec';
    S.date = S.today;
    S.minutes = pickedMinutesFor(S.date);
    syncUrl();
    render();
    window.scrollTo(0, 0);
  }

  function save() {
    if (S.busy) return;
    if (!S.minutes) { toast(tr('pickFirst')); return; }
    var had = !!myEntry(S.date), date = S.date, minutes = S.minutes;
    S.busy = true;
    render();
    call('apiSave', S.me, date, minutes).then(function (r) {
      S.busy = false;
      S.months[r.ym] = r.entries;
      if (r.holidays) S.holidays = r.holidays;
      toastOk(tr(had ? 'updated' : 'saved') + ' · ' + fmtDate(date) + ' · ' + hrs(minutes));
    }, function (err) {
      S.busy = false;
      toast(errText(err));
    });
  }

  function del() {
    if (S.busy) return;
    var date = S.date;
    S.busy = true;
    render();
    call('apiDelete', S.me, date).then(function (r) {
      S.busy = false;
      S.months[r.ym] = r.entries;
      if (S.date === date) S.minutes = 0;
      toastOk(tr('deleted') + ' · ' + fmtDate(date));
    }, function (err) {
      S.busy = false;
      toast(errText(err));
    });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    switch (act) {
      case 'noop': return;
      case 'lang': setLang(v); S.sheet = null; render(); if (!S.started) start(); return;
      case 'langsheet': S.sheet = 'lang'; render(); return;
      case 'close': S.sheet = null; render(); return;
      case 'retry': loadInit(); return;
      case 'me': setMe(v); return;
      case 'changeme': S.me = null; store('nmc_ot_me', null); syncUrl(); render(); window.scrollTo(0, 0); return;
      case 'tab': S.tab = v; if (v !== 'rec') ensureMonth(S.viewYm); render(); window.scrollTo(0, 0); return;
      case 'day': setDate(v); return;
      case 'min': S.minutes = Number(v); render(); return;
      case 'save': save(); return;
      case 'askdel': S.sheet = 'confirm'; render(); return;
      case 'del': S.sheet = null; del(); return;
      case 'mprev': S.viewYm = addMonths(S.viewYm, -1); ensureMonth(S.viewYm); render(); return;
      case 'mnext':
        if (S.viewYm < ymOf(S.today)) { S.viewYm = addMonths(S.viewYm, 1); ensureMonth(S.viewYm); render(); }
        return;
      case 'refresh': S.monthErr[S.viewYm] = false; render(); loadMonth(S.viewYm); return;
      case 'caledit':
        if (editable(v)) { S.tab = 'rec'; setDate(v); window.scrollTo(0, 0); }
        else toast(tr('tooOld', { n: S.backDays }));
        return;
      case 'install':
        if (!installEvt) { S.sheet = 'install'; render(); return; }
        try {
          installEvt.prompt();
          installEvt.userChoice.then(function () { installEvt = null; render(); }, function () {});
        } catch (e) { installEvt = null; render(); }
        return;
      case 'otherday':
        S.tab = 'mine';
        S.viewYm = ymOf(S.date || S.today);
        ensureMonth(S.viewYm);
        render();
        window.scrollTo(0, 0);
        return;
      case 'hideinstall': S.hideInstall = true; store('nmc_ot_hide_install', '1'); render(); return;
      case 'openext':
        if (envOf() === 'kakao') location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
        else location.href = 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end';
        return;
    }
  });

  /* 크롬이 '앱 설치'를 허락하면 화면에 설치 버튼을 보여 줍니다. */
  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    installEvt = ev;
    if (S.lang && S.ready && S.me) render();
  });
  window.addEventListener('appinstalled', function () {
    installEvt = null;
    S.hideInstall = true;
    store('nmc_ot_hide_install', '1');
    toastOk(tr('installed'));
  });

  /* 앱을 다시 열면(화면이 다시 보이면) 최신 기록으로 새로 고칩니다. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !S.ready || S.busy) return;
    call('apiInit').then(function (r) {
      var viewYm = S.viewYm;
      applyInit(r);
      if (viewYm !== ymOf(S.today) && S.months[viewYm]) loadMonth(viewYm);
      render();
    }, function () {});
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
  });

  function start() {
    S.started = true;
    loadInit();
  }

  readUrl(function (p) {
    S.hideInstall = stored('nmc_ot_hide_install') === '1';
    var l = p.l || stored('nmc_ot_lang');
    if (l && I18N[l]) S.lang = l;
    S.me = p.n || stored('nmc_ot_me') || null;
    if (S.me) store('nmc_ot_me', S.me);
    if (S.lang) store('nmc_ot_lang', S.lang);
    applyLang();
    render();
    start();
  });
})();
</script>
</body>
</html>
