/* 부서 업무 (2026-11-23 08:30 지시: 관리부 · 대외사업부 — 업무 지시 저장 · 담당자 업무 목록 · 일정 달력).
   부서 · 담당 · 업무 · 일정은 이 파일에 없고, 관리자 로그인 뒤 서버에서 받아 옵니다. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;

  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
b,td{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 12px;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.bar h1 small{display:block;font-size:13px;font-weight:600;color:#D9E3F2;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:#fff;color:var(--vc);font-size:14px;font-weight:800;cursor:pointer}
.home:focus-visible,.ref:focus-visible,.btn:focus-visible,.link:focus-visible,.tab:focus-visible,.cd:focus-visible,.segb button:focus-visible,select:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 90px}
@media (min-width:980px){.wrap{max-width:1180px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none}

.btn.ok{background:var(--ok)}
.btn.danger{background:#fff;color:var(--bad);border:2px solid #F2C4BF}

.link{display:inline-flex;align-items:center;min-height:36px;padding:0 4px;color:var(--vc);font-weight:800;background:none;border:0;cursor:pointer;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.err{margin:10px 0 0;color:var(--bad);font-weight:700}
.wait{padding:40px 10px;text-align:center;color:var(--muted);font-weight:700}
.empty{margin:0;padding:14px 6px;color:var(--muted);font-weight:700;text-align:center}
.login{max-width:440px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--vc);border-radius:20px;padding:20px 18px}
.login h2{margin:0 0 6px;font-size:20px;font-weight:800;color:var(--vc)}
.login p{margin:0;color:var(--muted);font-size:14.5px}
.login form{display:flex;gap:8px;margin-top:14px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3);z-index:60}
.toast .tbtn{min-height:36px;padding:0 12px;border:0;border-radius:9px;background:#fff;color:#0F172A;font-weight:800;cursor:pointer;white-space:nowrap}
/* 부서 칸 */
.tabs{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;margin:0 0 12px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:76px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left}
.tab b{font-size:18px;font-weight:800;line-height:1.25}
.tab small{font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.35}
.tab small.r{color:var(--bad)}
.tab[aria-pressed="true"]{background:var(--vc);border-color:var(--vc);color:#fff}
.tab[aria-pressed="true"] small{color:#D9E3F2}
.tab[aria-pressed="true"] small.r{color:#FFD3CE}

.dhead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 12px;border-top:5px solid var(--vc)}
.dhead .dl{flex:1;min-width:0}
.dhead h2{margin:0;font-size:22px;font-weight:800;color:var(--vc)}
.dhead p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin:6px 0 0}
.stat{display:inline-flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:700;color:var(--ink2)}
.stat b{font-size:16px;font-weight:800;color:var(--ink)}
.stat.r{background:var(--bad-soft);color:var(--bad)} .stat.r b{color:var(--bad)}
.adds{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin:0 0 6px}
.adds .btn{min-height:52px;padding:0 8px;font-size:15.5px}
.adds .btn.t{background:#fff;color:var(--task);border:2px solid #E9C79F}
.adds .btn.e{background:#fff;color:var(--ev);border:2px solid #B9CDEB}

.guide{margin:0 0 12px;color:var(--muted);font-size:13.5px;font-weight:600}
.segb{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 12px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.segb button{min-height:46px;border:0;background:#fff;font-weight:800;font-size:15.5px;cursor:pointer;color:var(--ink2)}
.segb button[aria-pressed="true"]{background:var(--ink2);color:#fff}
.cols[data-view="list"] .colR,.cols[data-view="cal"] .colL{display:none}

.gh{display:flex;align-items:baseline;gap:8px;margin:4px 2px 8px;font-size:17px;font-weight:800}
.gh small{font-size:14px;font-weight:700;color:var(--muted)}
.gh.ord{color:var(--ord)} .gh.task{color:var(--task)}
.wl{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.wi{padding:11px 12px;border:1px solid var(--line);border-left:6px solid #B9C2CE;border-radius:12px;background:#fff}
.wi.late,.wi.today{border-left-color:var(--bad)} .wi.soon{border-left-color:#E0A100} .wi.fin{border-left-color:var(--ok);background:#FAFCFA}
.wt{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 5px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.tag.ord{background:var(--ord);color:#fff} .tag.task{background:var(--task-soft);color:var(--task)} .tag.ev{background:var(--ev-soft);color:var(--ev)}
.tag.imp{background:#fff;color:var(--bad);border:1.5px solid var(--bad);padding:1px 8px}
.tag.late,.tag.today{background:var(--bad);color:#fff} .tag.soon{background:var(--warn-soft);color:var(--warn)} .tag.none{background:var(--soft);color:var(--muted)}
.tag.dp{background:#fff;color:var(--ink2);border:1.5px solid var(--line);padding:1px 8px}
.tag.st0{background:#fff;color:var(--muted);border:1.5px dashed #AEB7C3;padding:1px 8px} .tag.st1{background:var(--ev-soft);color:var(--ev)} .tag.st2{background:var(--ok-soft);color:var(--ok)}
.wtt{display:block;font-size:17px;font-weight:800;line-height:1.4}
.wb{margin:4px 0 0;color:var(--ink2);font-size:14.5px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wr{margin:6px 0 0;padding:7px 10px;border-radius:9px;background:var(--ok-soft);font-size:14.5px;white-space:pre-line}
.wr b{margin-right:6px;color:var(--ok)}
.wf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin:8px 0 0}
.wf small{color:var(--muted);font-size:13px;font-weight:600}
.wa{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.more{margin:0 0 14px}
.more>summary{display:flex;align-items:center;min-height:44px;cursor:pointer;font-weight:800;color:var(--ink2);list-style:revert}
/* 달력 */
.calc{padding:12px 10px}
.calh{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.calh h2{margin:0;flex:1;text-align:center;font-size:19px;font-weight:800}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 2px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cw{text-align:center;font-size:13px;font-weight:800;color:var(--muted);padding:2px 0}
.cw.sun,.cd.sun .n{color:var(--bad)} .cw.sat,.cd.sat .n{color:var(--blue)}
.cd{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:62px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#FAF8F6;cursor:pointer;text-align:left;font:inherit;color:inherit;overflow:hidden}
.cd.pad{border:0;background:none;cursor:default}
.cd.has{background:#fff}
.cd .n{font-size:14px;font-weight:800;line-height:1.1}
.cd .tdy{position:absolute;top:3px;right:3px;font-size:10.5px;font-weight:800;color:#8A5A00}
.cd.today{background:#FFF0B0;border:2px solid #D19600}
.cd.sel{box-shadow:0 0 0 3px var(--ink) inset}
.cc{display:block;padding:1px 4px;border-radius:5px;font-size:11.5px;font-weight:800;line-height:1.4;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc.ev{background:var(--ev)} .cc.ord{background:var(--ord)} .cc.task{background:var(--task)} .cc.late{background:var(--bad)}
.cc.more{background:none;color:var(--muted);padding:0 2px}
.cdots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cdots i{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;padding:0 3px;border-radius:5px;font-size:11px;font-style:normal;font-weight:800;color:#fff}
.cdots i.ev{background:var(--ev)} .cdots i.ord{background:var(--ord)} .cdots i.task{background:var(--task)}
.cd .cfull{display:none}

.dayh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:14px 2px 8px}
.dayh h3{margin:0;flex:1;min-width:0;font-size:17px;font-weight:800}
.dayh h3 small{margin-left:6px;font-size:14px;font-weight:700;color:var(--muted)}
.el{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ei{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--ev);border-radius:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ei.ord{border-left-color:var(--ord)} .ei.task{border-left-color:var(--task)} .ei.late{border-left-color:var(--bad)}
.ei .tm{flex-shrink:0;min-width:74px;font-weight:800;color:var(--ev);font-size:14.5px}
.ei.ord .tm{color:var(--ord)} .ei.task .tm,.ei.late .tm{color:var(--task)}
.ei .bd{flex:1;min-width:0}
.ei .bd b{display:block;font-size:16px;font-weight:800;line-height:1.35}
.ei .bd small{display:block;color:var(--muted);font-size:13.5px;font-weight:600}
/* 등록 · 수정 창 */
.shade{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:41;padding:0 14px 24px;box-shadow:0 -6px 24px rgba(15,23,42,.25)}

.sh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line);z-index:1}
.sh h2{flex:1;margin:0;font-size:18px;font-weight:800;line-height:1.35}
.x{min-width:44px;min-height:44px;border:0;border-radius:12px;background:var(--soft);font-size:20px;font-weight:800;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.seg button{min-height:46px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--vc);border-color:var(--vc);color:#fff}
.seg.st button[aria-pressed="true"][data-fst="완료"]{background:var(--ok);border-color:var(--ok)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .w{grid-column:1/-1}
.f label,.f .lb{display:block;font-size:13.5px;font-weight:800;color:var(--ink2);margin:0 0 3px}
.f input,.f select,.f textarea{width:100%;min-height:46px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.f textarea{min-height:92px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--vc)}
.f small{display:block;margin-top:3px;color:var(--muted);font-size:12.5px}
.f.chk label{display:flex;align-items:center;gap:8px;min-height:44px;margin:0;font-size:15.5px}
.f.chk input{width:22px;min-height:22px;height:22px}
.f .seg{margin:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{min-height:34px;padding:0 10px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:13.5px;font-weight:800;cursor:pointer;color:var(--ink2)}
.meta{margin:12px 0 0;color:var(--muted);font-size:13.5px}
.ferr{margin:10px 0 0;color:var(--bad);font-weight:800}
</style>

  function openForm(F) {
    S.F = F; S.ferr = ''; S.open = F.id || 'new:' + F.kind;
    sheetHtml();
    sheet.hidden = false; shade.hidden = false; document.body.classList.add('noscroll');
    var t = $(F.id ? 'shTitle' : 'f_title'); if (t) t.focus();
    if (window.NMCNav) NMCNav.sync();
  }
  function openItem(id) {
    var x = find(id);
    if (!x) { toast(ERR.not_found); return; }
    openForm({ id: x.id, dept: x.dept, kind: x.kind, title: x.title, body: x.body, due: x.due, imp: x.imp, st: x.st || '미착수', res: x.res, date: x.date || S.D.today, t1: x.t1, t2: x.t2, place: x.place, at: x.at, up: x.up, done: x.done });
  }
  function openDept() {
    var d = deptOf(S.dept);
    if (!d) return;
    S.F = { dept: d.name, head: d.head, duty: d.duty, deptForm: true }; S.ferr = ''; S.open = 'dept';
    sheet.innerHTML = '<div class="sh"><h2 id="shTitle" tabindex="-1">부서 정보 수정 — ' + esc(d.name) + '</h2><button type="button" class="x" data-act="close" aria-label="닫기">×</button></div>' +
      '<form id="deptForm" autocomplete="off"><div class="fg" style="margin-top:12px"><div class="f w"><label for="f_head">담당 (이름 · 직함)</label><input id="f_head" maxlength="30" value="' + esc(d.head) + '"></div>' +
      '<div class="f w"><label for="f_duty">담당 업무</label><input id="f_duty" maxlength="100" value="' + esc(d.duty) + '"><small>부서 화면 상단에 표시됩니다.</small></div></div>' +
      '<p class="ferr" id="ferr" role="alert"></p><div class="tools"><button type="submit" class="btn">저장</button><button type="button" class="btn ghost" data-act="close">취소</button></div></form>';
    sheet.hidden = false; shade.hidden = false; document.body.classList.add('noscroll');
    var t = $('f_head'); if (t) t.focus();
    if (window.NMCNav) NMCNav.sync();
  }
  function closeSheet(quiet) {
    S.open = ''; S.F = null; sheet.hidden = true; shade.hidden = true; sheet.innerHTML = ''; document.body.classList.remove('noscroll');
    if (!quiet && window.NMCNav) NMCNav.sync();
  }
  function readForm() {
    var F = S.F, v = function (id) { var e = $(id); return e ? e.value : null; };
    if (!F || F.deptForm) return F;
    ['dept', 'title', 'body', 'due', 'res', 'date', 't1', 't2', 'place'].forEach(function (k) { var x = v('f_' + k); if (x != null) F[k] = x; });
    var imp = $('f_imp'); if (imp) F.imp = imp.checked;
    return F;
  }
  function sheetHtml() {
    var F = S.F, ev = F.kind === '일정', ed = !!F.id, T = S.D.today;
    var h = '<div class="sh"><h2 id="shTitle" tabindex="-1">' + esc(F.kind) + ' ' + (ed ? '상세 · 수정' : '등록') + '</h2><button type="button" class="x" data-act="close" aria-label="닫기">×</button></div><form id="wkForm" autocomplete="off" novalidate>';
    h += '<div class="seg" role="group" aria-label="구분">' + KINDS.map(function (k) { return '<button type="button" data-fk="' + k + '" aria-pressed="' + (F.kind === k) + '">' + k + '</button>'; }).join('') + '</div>';
    h += '<div class="fg"><div class="f"><label for="f_dept">부서</label><select id="f_dept">' + S.D.depts.map(function (d) { return '<option value="' + esc(d.name) + '"' + (d.name === F.dept ? ' selected' : '') + '>' + esc(d.name) + (d.head ? ' (' + esc(d.head) + ')' : '') + '</option>'; }).join('') + '</select></div>';
    if (ev) h += '<div class="f"><label for="f_date">일자</label><input type="date" id="f_date" value="' + esc(F.date) + '" required></div>';
    else h += '<div class="f"><label for="f_due">기한</label><input type="date" id="f_due" value="' + esc(F.due) + '"><div class="quick"><button type="button" data-due="' + T + '">오늘</button><button type="button" data-due="' + addD(T, 1) + '">내일</button><button type="button" data-due="' + addD(T, 7) + '">1주 후</button><button type="button" data-due="">기한 없음</button></div></div>';
    h += '<div class="f w"><label for="f_title">제목</label><input id="f_title" maxlength="80" value="' + esc(F.title) + '" placeholder="' + (ev ? '예: 거래처 방문 · 회의 · 외근 · 연차' : '예: 월말 매입 세금계산서 대조') + '" required></div>';
    if (ev) h += '<div class="f"><label for="f_t1">시작 (선택)</label><input type="time" id="f_t1" value="' + esc(F.t1) + '"></div><div class="f"><label for="f_t2">종료 (선택)</label><input type="time" id="f_t2" value="' + esc(F.t2) + '"></div>' +
      '<div class="f w"><label for="f_place">장소 (선택)</label><input id="f_place" maxlength="60" value="' + esc(F.place) + '"></div>';
    h += '<div class="f w"><label for="f_body">내용 (선택)</label><textarea id="f_body" maxlength="1000" placeholder="' + (ev ? '참석자 · 준비 사항 등' : '세부 지시 · 처리 방법 · 참고 사항') + '">' + esc(F.body) + '</textarea></div>';
    if (!ev) {
      h += '<div class="f chk w"><label><input type="checkbox" id="f_imp"' + (F.imp ? ' checked' : '') + '> 중요 (목록 상단 · 빨간 표시)</label></div>';
      h += '<div class="f w"><span class="lb" id="stLab">상태</span><div class="seg st" role="group" aria-labelledby="stLab">' + STATES.map(function (s) { return '<button type="button" data-fst="' + s + '" aria-pressed="' + (F.st === s) + '">' + s + '</button>'; }).join('') + '</div></div>';
      h += '<div class="f w"><label for="f_res">처리 결과 (선택)</label><textarea id="f_res" maxlength="500" placeholder="진행 상황 · 완료 보고">' + esc(F.res) + '</textarea></div>';
    }
    h += '</div>';
    if (ed) h += '<p class="meta">등록 ' + esc(dtx(F.at)) + (F.up && F.up !== F.at ? ' · 수정 ' + esc(dtx(F.up)) : '') + (F.done ? ' · 완료 ' + esc(dtx(F.done)) : '') + '</p>';
    h += '<p class="ferr" id="ferr" role="alert">' + esc(S.ferr) + '</p><div class="tools"><button type="submit" class="btn"' + (S.busy ? ' disabled' : '') + '>' + (S.busy === 'save' ? '저장 중…' : ed ? '저장' : '등록') + '</button>' +
      '<button type="button" class="btn ghost" data-act="close">취소</button>' + (ed ? '<button type="button" class="btn danger" data-act="del" style="margin-left:auto">삭제</button>' : '') + '</div></form>';
    sheet.innerHTML = h;
  }
  function submitForm() {
    var F = readForm(), ev = F.kind === '일정';
    S.ferr = '';
    if (!String(F.title).trim()) S.ferr = ERR.need_title;
    else if (ev && !F.date) S.ferr = '일자를 선택해 주십시오.';
    else if (ev && ((F.t2 && !F.t1) || (F.t1 && F.t2 && F.t2 < F.t1))) S.ferr = ERR.bad_time;
    if (S.ferr) { sheetHtml(); var e0 = $('f_title'); if (e0 && !String(F.title).trim()) e0.focus(); return; }
    var x = { id: F.id || '', dept: F.dept, kind: F.kind, title: F.title, body: F.body };
    if (ev) { x.date = F.date; x.t1 = F.t1; x.t2 = F.t2; x.place = F.place; }
    else { x.due = F.due; x.imp = !!F.imp; x.st = F.st; x.res = F.res; }
    S.busy = 'save'; sheetHtml();
    call('apiWorkSave', [x]).then(function (d) {
      S.busy = ''; setD(d);
      var it = find(d.saved);
      if (it && it.kind === '일정' && !F.id) { S.ym = it.date.slice(0, 7); }
      if (it && S.dept !== 'all' && it.dept !== S.dept) S.dept = it.dept;   // 다른 부서로 등록 · 이동하면 그 부서로
      closeSheet(); render();
      toast(F.id ? '저장했습니다.' : obj(F.kind) + ' 등록했습니다.');
    }, function (e) { S.busy = ''; S.ferr = errText(e); if (S.F) sheetHtml(); });
  }
  function submitDept() {
    var F = S.F, head = $('f_head').value, duty = $('f_duty').value;
    S.busy = 'dept';
    call('apiWorkDept', [{ name: F.dept, head: head, duty: duty }]).then(function (d) { S.busy = ''; setD(d); closeSheet(); render(); toast('부서 정보를 저장했습니다.'); },
      function (e) { S.busy = ''; var fe = $('ferr'); if (fe) fe.textContent = errText(e); });
  }
  function setState(id, to, undo) {
    var x = find(id);
    if (!x || S.busy) return;
    var from = x.st;
    S.busy = 'st';
    call('apiWorkState', [id, to]).then(function (d) {
      S.busy = ''; setD(d); render();
      if (undo) toast('완료 처리를 취소했습니다.');
      else if (to === '완료') toast('완료 처리했습니다.', '취소', function () { setState(id, from === '완료' ? '진행 중' : from, true); });
      else toast(from === '완료' ? '미완료로 변경했습니다.' : '‘' + to + '’(으)로 변경했습니다.');
    }, function (e) { S.busy = ''; toast(errText(e)); });
  }
  function delItem() {
    var F = S.F;
    if (!F || !F.id || !window.confirm('이 ' + obj(F.kind) + ' 삭제하시겠습니까? (목록에서 제외 · 시트 기록은 보존)')) return;
    S.busy = 'del';
    call('apiWorkDel', [F.id]).then(function (d) { S.busy = ''; setD(d); closeSheet(); render(); toast('삭제했습니다.'); }, function (e) { S.busy = ''; S.ferr = errText(e); if (S.F) sheetHtml(); });
  }

  /* ── 시작 · 새로고침 ── */
  function start() {
    if (!getToken()) { S.mode = 'login'; render(); return; }
    S.mode = 'wait'; render();
    call('apiWork', []).then(function (d) { setD(d); S.mode = 'ok'; render(); navStart(); },
      function (e) { if (String(e && e.message) !== 'auth') { S.mode = 'error'; S.loginErr = errText(e); render(); } });
  }
  function reload(quiet) {
    if (S.mode !== 'ok') { start(); return; }
    call('apiWork', []).then(function (d) { setD(d); render(); if (S.F && S.F.id && !find(S.F.id)) closeSheet(); if (!quiet) toast('최신 정보로 갱신했습니다.'); }, function (e) { if (!quiet) toast(errText(e)); });
  }

  /* ── 뒤로 (온 길로): 부서 · 보기 · 선택 날짜 · 열린 창 ── */
  function navGet() { return { d: S.dept, v: S.view, day: S.day, open: S.open }; }
  function navSet(v) {
    v = v || {};
    if (v.d && v.d !== S.dept && (v.d === 'all' || deptOf(v.d))) S.dept = v.d;
    S.view = v.v === 'cal' ? 'cal' : 'list';
    S.day = v.day || '';
    if (S.day) S.ym = S.day.slice(0, 7);
    if (!v.open) { if (S.open) closeSheet(true); }
    else if (v.open !== S.open) {
      if (v.open === 'dept') openDept();
      else if (v.open.indexOf('new:') === 0) openForm(blank(v.open.slice(4)));
      else if (find(v.open)) openItem(v.open);
    }
    render();
  }
  function navStart() {
    if (!window.NMCNav || navStart.done) return;
    navStart.done = true;
    NMCNav.page({ get: navGet, set: navSet, base: function () { return { d: S.dept, v: S.view, day: '', open: '' }; },
      url: function (v) { return location.pathname + '?d=' + encodeURIComponent(v.d || '') + (v.v === 'cal' ? '&v=cal' : ''); } });
  }

  /* ── 누르기 ── */
  root.addEventListener('toggle', function (ev) { if (ev.target && ev.target.id === 'finBox') S.finOpen = ev.target.open; }, true);
  root.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-dept],[data-v],[data-add],[data-open],[data-st],[data-cal],[data-day],[data-act]');
    if (!t || t.disabled) return;
    if (t.hasAttribute('data-dept')) { S.dept = t.getAttribute('data-dept'); S.day = ''; render(); return; }
    if (t.hasAttribute('data-v')) { S.view = t.getAttribute('data-v'); render(); return; }
    if (t.hasAttribute('data-add')) { openForm(blank(t.getAttribute('data-add'), t.getAttribute('data-date') || '')); return; }
    if (t.hasAttribute('data-open')) { openItem(t.getAttribute('data-open')); return; }
    if (t.hasAttribute('data-st')) { setState(t.getAttribute('data-st'), t.getAttribute('data-to')); return; }
    if (t.hasAttribute('data-cal')) {
      var n = +t.getAttribute('data-cal');
      if (n === 0) S.ym = S.D.today.slice(0, 7);
      else { var y = +S.ym.slice(0, 4), m = +S.ym.slice(5, 7) + n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.ym = y + '-' + ('0' + m).slice(-2); }
      S.day = ''; render(); return;
    }
    if (t.hasAttribute('data-day')) {
      var k = t.getAttribute('data-day');
      S.day = k && k !== S.day ? k : '';
      render();
      var dh = $('dayHead');
      if (S.day && dh && window.innerWidth < 980) { try { dh.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { dh.scrollIntoView(); } }
      return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'retry') { S.mode = ''; start(); return; }
    if (act === 'dept') { openDept(); return; }
  });
  sheet.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act],[data-fk],[data-fst],[data-due]');
    if (!t || t.disabled) return;
    var act = t.getAttribute('data-act');
    if (act === 'close') { closeSheet(); return; }
    if (act === 'del') { delItem(); return; }
    if (t.hasAttribute('data-fk')) { var F = readForm(); F.kind = t.getAttribute('data-fk'); if (F.kind === '일정' && !F.date) F.date = S.D.today; if (!F.id) S.open = 'new:' + F.kind; sheetHtml(); return; }
    if (t.hasAttribute('data-fst')) { readForm().st = t.getAttribute('data-fst'); sheetHtml(); return; }
    if (t.hasAttribute('data-due')) { var e = $('f_due'); if (e) e.value = t.getAttribute('data-due'); readForm(); return; }
  });
  sheet.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (S.busy) return;
    if (ev.target.id === 'wkForm') submitForm();
    else if (ev.target.id === 'deptForm') submitDept();
  });
  shade.addEventListener('click', function () { if (!S.busy) closeSheet(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.open && !S.busy) closeSheet(); });
  root.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'loginForm') return;
    ev.preventDefault();
    var v = $('pw').value;
    if (!v) return;
    var btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = '확인 중…';
    post({ action: 'login', pw: v, dev: devId() }).then(function (r) { setToken(r.token); S.loginErr = ''; start(); },
      function (e) { S.loginErr = errText(e); render(); });
  });
  $('refBtn').addEventListener('click', function () { reload(false); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.at && Date.now() - S.at > 300000 && !S.open) reload(true); });
  window.__work = { state: function () { return S; } };   // 시험용
  start();
})();
</script>
</body>
</html>
