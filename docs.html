<style>
/* 공문함 (2026-11-21 14:12 지시). 공문 · 팩스 · 메일 내용은 이 파일에 없고, 관리자 로그인 뒤 서버(구글 시트 '공문함' · '공문 글자')에서 받아 옵니다. */
:root{
  --bg:#F2EFEC; --card:#FFFFFF; --ink:#151515; --ink2:#33302D; --muted:#625C56; --line:#DDD6CF; --soft:#EFEAE5;
  --vc:#7A3A14; --vsoft:#F6EDE6; --gold:#B08A35;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA; --blue:#1E5AA8; --blue-soft:#E6EEF9;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
b{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 12px;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800}
.wrap{max-width:820px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:18px;font-weight:800}
.cnt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.cnt button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left}
.cnt button b{font-size:22px;font-weight:800;line-height:1.1}
.cnt button span{font-size:13px;font-weight:700;color:var(--muted)}
.cnt button.late b{color:var(--bad)} .cnt button.soon b{color:var(--warn)} .cnt button.fresh b{color:var(--vc)}
.cnt button[aria-pressed="true"]{border-color:var(--vc);background:var(--vsoft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--vc);border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.danger{background:#fff;color:var(--bad);border:2px solid #F2C4BF}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.home:focus-visible,.it:focus-visible,.cnt button:focus-visible,.chip:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px}
.mail .mst{margin:4px 0 0;font-size:15.5px;font-weight:800}
.mail .mst.on{color:var(--ok)}
.mail .mst.on::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.mail .mst.wait{color:var(--warn)}
.mail .mst.off{color:var(--muted)}
.mail .mst.bad{color:var(--bad)}
.mail .mt{margin-top:12px}
.mkey{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--vsoft);border:2px solid var(--vc)}
.mkl{margin:0 0 6px;font-weight:800}
.mkl small{display:block;font-weight:500;color:var(--ink2);font-size:13.5px}
.mkey code{display:block;margin:0 0 10px;padding:10px;border-radius:8px;background:#fff;border:1px solid var(--line);font:700 15px/1.5 ui-monospace,Consolas,monospace;word-break:break-all;user-select:all;letter-spacing:.02em}
.mask{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--soft)}
.mask p{margin:0 0 10px}
.err{color:var(--bad);font-weight:700}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.filt input[type=search]{flex:1;min-width:180px;min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.filt select{min-height:44px;padding:0 10px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700}
.chip{min-height:40px;padding:0 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--vc);border-color:var(--vc);color:#fff}
.list{list-style:none;margin:0;padding:0}
.it{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;cursor:pointer}
.it.st-new{border-left-color:var(--vc)} .it.st-done{opacity:.72;border-left-color:#BFC6CE}
.it .t{display:block;font-size:16.5px;font-weight:800;line-height:1.35}
.it .m{display:block;margin-top:2px;color:var(--muted);font-size:14px;font-weight:600}
.it .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;color:var(--ink2);font-size:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;font-weight:800;vertical-align:2px;margin-right:5px;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.tag.bad{background:var(--bad);color:#fff} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.new{background:var(--vc);color:#fff} .tag.imp{background:var(--gold);color:#fff}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.kind{background:var(--blue-soft);color:var(--blue)}
.empty{padding:20px 10px;text-align:center;color:var(--muted);font-weight:700}
.more{margin:4px 0 0}
.more summary{cursor:pointer;font-weight:800;color:var(--ink2);min-height:36px;display:flex;align-items:center}
.steps{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:14.5px}
/* 한 건 (아래에서 올라오는 창) */
.shade{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:41;padding:0 14px 24px;box-shadow:0 -6px 24px rgba(15,23,42,.25)}
@media (min-width:860px){.sheet{left:50%;right:auto;bottom:auto;top:4vh;transform:translateX(-50%);width:800px;max-height:92vh;border-radius:20px}}
.sh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line);z-index:1}
.sh h2{flex:1;margin:0;font-size:18px;font-weight:800;line-height:1.35}
.x{min-width:44px;min-height:44px;border:0;border-radius:12px;background:var(--soft);font-size:20px;font-weight:800;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.seg button{min-height:46px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--vc);border-color:var(--vc);color:#fff}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .w{grid-column:1/-1}
.f label{display:block;font-size:13.5px;font-weight:800;color:var(--ink2);margin:0 0 3px}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:15.5px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--vc)}
.f small{display:block;margin-top:3px;color:var(--muted);font-size:12.5px}
.f.chk label{display:flex;align-items:center;gap:8px;min-height:44px;margin:0;font-size:15px}
.f.chk input{width:22px;min-height:22px;height:22px}
.files{list-style:none;margin:6px 0 0;padding:0}
.files li{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--soft)}
.files li:first-child{border-top:0}
.files .btn{flex:none;white-space:nowrap}
.text{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px;font-size:14px;max-height:50vh;overflow:auto;margin:6px 0 0}
.login{max-width:440px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--vc);border-radius:20px;padding:20px 18px}
.login h2{margin:0 0 6px;font-size:20px;font-weight:800;color:var(--vc)}
.login p{margin:0;color:var(--muted);font-size:14.5px}
.login form{display:flex;gap:8px;margin-top:14px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px;background:#fff}
.wait{padding:40px 10px;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3);z-index:60}
/* 분류 · 날짜별 (2026-11-21 22:14 지시: 발주서 · 세금계산서 · 각종 공문으로 나누고, 날짜별로 관리 · 전체는 날짜별로 따로) */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 10px}
.cats button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:60px;padding:8px 10px;border:2px solid var(--line);border-left-width:6px;border-radius:12px;background:#fff;cursor:pointer;text-align:left}
.cats button b{font-size:16px;font-weight:800;line-height:1.25}
.cats button span{font-size:12.5px;font-weight:700;color:var(--muted)}
.cats .c-all{border-left-color:#5B5550} .cats .c-po{border-left-color:#1E5AA8} .cats .c-tax{border-left-color:#1B7A43} .cats .c-gong{border-left-color:#7A3A14}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cats button[aria-pressed="true"] span{color:#E7E5E4}
.cats button:focus-visible,.cd:focus-visible,.link:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.chip.cal{display:inline-flex;align-items:center;gap:5px;border-color:var(--ink2)}
.chip.cal svg{flex:none}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:16px 2px 6px;font-size:16px;font-weight:800;color:var(--ink)}
.dh small{font-size:13.5px;font-weight:700;color:var(--muted)}
.dh.today{color:var(--vc)}
.dh .link{margin-left:auto}
.link{border:0;background:none;padding:4px 2px;color:var(--blue);font-weight:800;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tag.c-po{background:#E6EEF9;color:#1E5AA8} .tag.c-tax{background:#E4F3EA;color:#1B7A43} .tag.c-gong{background:#F6EDE6;color:#7A3A14}
.it.po{border-left-color:#1E5AA8} .it.po.st-done{border-left-color:#BFC6CE}
.it .a{display:block;margin-top:4px;color:#1E5AA8;font-size:13.5px;font-weight:700}
.cgh{margin:12px 2px 6px;font-size:15px;font-weight:800;padding-left:8px;border-left:5px solid}
.cgh.c-po{border-color:#1E5AA8;color:#1E5AA8} .cgh.c-tax{border-color:#1B7A43;color:#1B7A43} .cgh.c-gong{border-color:#7A3A14;color:#7A3A14}
/* 전체 — 달력 */
.calc{padding:12px 10px}
.calh{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.calh h2{margin:0;flex:1;text-align:center;font-size:19px;font-weight:800}
.calsum{margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;font-weight:700;color:var(--ink2)}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cw{text-align:center;font-size:13px;font-weight:800;color:var(--muted);padding:2px 0}
.cw.sun,.cd.sun .n{color:var(--bad)} .cw.sat,.cd.sat .n{color:var(--blue)}
.cd{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:66px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cd.pad{border:0;background:none;cursor:default}
.cd .n{font-size:14px;font-weight:800;line-height:1.1}
.cd .tdy{position:absolute;top:3px;right:3px;font-size:10.5px;font-weight:800;color:#8A5A00}
.cd.today{background:#FFF0B0;border:2px solid #D19600}
.cd.sel{box-shadow:0 0 0 3px var(--ink) inset}
.cd:not(.has):not(.today){background:#FAF8F6}
.cc{display:block;padding:1px 3px;border-radius:5px;font-size:11px;font-weight:800;line-height:1.35;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:clip}
.cc.c-po{background:#1E5AA8} .cc.c-tax{background:#1B7A43} .cc.c-gong{background:#7A3A14}
.calsum .cc{display:inline-block;padding:2px 8px;font-size:13px;border-radius:999px}
@media (min-width:640px){.cd{min-height:84px;padding:5px}.cd .n{font-size:15px}.cc{font-size:12.5px;padding:2px 5px}}
@media (max-width:639px){.cd .cc .cl,.cd .tdy{display:none}.cd .cc{text-align:center;font-size:12.5px}}   /* 휴대폰: 칸이 좁아 색 + 숫자만 (색 뜻은 달력 위 줄) */
/* 메일 한 통 · 첨부 · 받은 발주서 (2026-11-21 22:17 지시: 원본 열기 하면 이상한 글만 보임 → 메일을 그대로 읽고, 첨부 발주서는 출고로) */
.mailv{margin:12px 0;padding:12px;border-radius:12px;background:#F7F9FC;border:1px solid #D5DEEA}
.mh{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 8px;font-size:14.5px}
.mh dt{font-weight:800;color:var(--muted)} .mh dd{margin:0;overflow-wrap:anywhere}
.mb{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6;max-height:46vh;overflow:auto}
.muted{color:var(--muted)}
.atts h3,.pinfo h3{margin:14px 0 6px;font-size:15.5px;font-weight:800}
.atl{list-style:none;margin:0;padding:0}
.atl li{padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-left:5px solid #1E5AA8;border-radius:12px;background:#fff}
.atl .an b{display:block;font-size:15.5px;overflow-wrap:anywhere}
.atl .an small{display:block;margin-top:3px;color:var(--ink2);font-size:13.5px}
.atl .tools{margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0;font-size:15px}
.kv dt{font-weight:800;color:var(--muted)} .kv dd{margin:0}
.from{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:#F7F9FC;font-size:14.5px}
.fd{margin:10px 0 0;border-top:1px solid var(--line);padding-top:4px}
/* 세금계산서 총 금액 (2026-11-22 지시 "금액이 비어있어도 총 금액만 정리해라") */
.taxsum{border-left:6px solid #1B7A43}
.taxsum h2 small{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-top:2px}
.tk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 0}
.tk div{padding:10px 12px;border-radius:12px;background:#F3F8F5;border:1px solid #CFE6D8}
.tk small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.tk b{display:block;font-size:20px;font-weight:800;line-height:1.25;color:#14532D;overflow-wrap:anywhere}
.tk .big{grid-column:span 1}
.tk .unk b{color:var(--warn)}
table.tm{width:100%;border-collapse:collapse;margin:6px 0 0;font-size:14.5px;font-variant-numeric:tabular-nums}
.tm th,.tm td{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
.tm th:first-child,.tm td:first-child{text-align:left}
.tm thead th{font-size:13px;color:var(--muted);font-weight:800;border-bottom:2px solid var(--line)}
.tm tr.yr td{font-weight:800;background:#F3F8F5}
.tm .link{font-size:14.5px;padding:2px 0}
.it .amt{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:999px;font-size:14px;font-weight:800;background:#E4F3EA;color:#14532D}
.it .amt.none{background:var(--warn-soft);color:var(--warn)}
.dh .sum{font-size:13.5px;font-weight:800;color:#14532D}
@media (max-width:520px){.tk{grid-template-columns:1fr 1fr}.tk .big{grid-column:1/-1}}
.mt12{margin-top:12px}
@media (max-width:520px){.cnt{grid-template-columns:repeat(2,minmax(0,1fr))}.fg{grid-template-columns:1fr}.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<body>
<header class="bar">
  <div class="bin">
    <a class="home" href="manage.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>관리자</a>
    <h1>공문함</h1>
  </div>
</header>
<main class="wrap" id="root"><p class="wait">확인 중…</p></main>
<div class="shade" id="shade" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden></section>
<input type="file" id="fileIn" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.bmp,.tif,.tiff,.webp,.heic,.hwp,.hwpx,.docx,.doc,.rtf,.odt,.eml,.txt,image/*" hidden>
<p class="toast" id="toast" role="status" hidden></p>
<script>
(function () {
  'use strict';
  if (window.NMCNav) { NMCNav.hub('manage.html', '관리자'); NMCNav.mount(document.querySelector('header.bar .bin')); }   // 맨 앞 '뒤로' (온 길로)
  var DEMO = window.__SERVER__ || null;   // 시험용 화면에서만
  var API = DEMO ? '' : String(window.NMC_API || '');
  var TOKEN_KEY = 'nmc_pay_token';
  var $ = function (id) { return document.getElementById(id); };
  var root = $('root'), sheet = $('sheet'), shade = $('shade'), toastEl = $('toast'), fileIn = $('fileIn');

    }
    var cy = ev.target.closest('[data-calym]');
    if (cy) { S.f = 'cal'; S.calYm = cy.getAttribute('data-calym'); S.calDay = ''; render(); var cal = $('cal'); if (cal && cal.scrollIntoView) { try { cal.scrollIntoView({ block: 'start' }); } catch (e) {} } return; }
    var dy = ev.target.closest('[data-day]');
    if (dy) { var dk = dy.getAttribute('data-day'); S.calDay = dk === S.calDay ? '' : dk; render(); if (S.calDay) { var dh = root.querySelector('#cal + .dh'); if (dh && dh.scrollIntoView) { try { dh.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) { dh.scrollIntoView(); } } } return; }
    var f = ev.target.closest('[data-f]');
    if (f) {   // 위 숫자 칸 = 모든 분류에서 (다시 누르면 '처리할 것'으로)
      var nf = f.getAttribute('data-f'), top = f.parentNode.classList.contains('cnt');
      if (top) S.cat = 'all';
      S.f = nf === S.f && top ? 'open' : nf;
      render(); return;
    }
    var b = ev.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var a = b.getAttribute('data-act');
    if (a === 'reload') load();
    else if (a === 'mailkey' || a === 'mailoff') { S.mailAsk = a === 'mailkey' ? 'key' : 'off'; render(); }
    else if (a === 'mailaskx') { S.mailAsk = ''; render(); }
    else if (a === 'mailhide') { S.mailKey = ''; render(); }
    else if (a === 'mailkeygo' || a === 'mailoffgo') {
      S.busy = 'mail'; render();
      call(a === 'mailkeygo' ? 'apiMailKey' : 'apiMailOff', []).then(function (d) {
        S.busy = ''; S.mailAsk = ''; S.mailKey = a === 'mailkeygo' ? String(d.mailKey || '') : ''; put(d); render();
        toast(a === 'mailkeygo' ? '연결 키를 만들었습니다. ‘키 복사’를 눌러 설치 창에 붙여 넣으십시오.' : '연결을 끊었습니다.');
      }, function (e) { S.busy = ''; render(); toast(errText(e)); });
    }
    else if (a === 'mailcopy') {
      var kv = S.mailKey, done = function () { toast('키를 복사했습니다. 설치 창에 붙여 넣으십시오 (마우스 오른쪽 단추 또는 Ctrl+V).'); };
      var fall = function () { var r = document.createRange(), el = $('mailKey'); if (el) { r.selectNodeContents(el); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('키를 골라 두었습니다. Ctrl+C로 복사해 주십시오.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(kv).then(done, fall); else fall();
    }
    else if (a === 'pick') { fileIn.value = ''; fileIn.click(); }
    else if (a === 'run') {
      S.busy = 'run'; render();
      call('apiDocRun', []).then(function (d) {
        S.busy = ''; put(d); render();
        var r = d.run || {};
        toast(r.busy ? '다른 확인이 진행 중입니다. 잠시 후 다시 눌러 주십시오.' : r.err ? '확인 중 오류: ' + r.err : !r.files ? '새 파일이 없습니다.' :
          '파일 ' + r.files + '개 처리 · 새 공문 ' + (r.docs || 0) + '건' + (r.left ? ' · 남은 ' + r.left + '개는 다음 확인 때' : ''));
      }, function (e) { S.busy = ''; render(); toast(errText(e)); });
    }
  });
  root.addEventListener('input', function (ev) { if (ev.target.id === 'q') { S.q = ev.target.value; var pos = ev.target.selectionStart; render(); var q = $('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} } });
  root.addEventListener('change', function (ev) { if (ev.target.id === 'kindSel') { S.kind = ev.target.value; render(); } });
  function b64of(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { var s = String(r.result || ''); res(s.slice(s.indexOf(',') + 1)); };
      r.onerror = function () { rej(new Error('doc_bad')); };
      r.readAsDataURL(file);
    });
  }
  fileIn.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileIn.files || []);
    if (!files.length) return;
    var bad = files.filter(function (f) { return !EXT.test(f.name) && !/^image\//.test(f.type); });
    if (bad.length) { toast(ERR.doc_type + ' — ' + bad[0].name); return; }
    var big = files.filter(function (f) { return f.size > MAX; });
    if (big.length) { toast(ERR.doc_size + ' — ' + big[0].name); return; }
    var i = 0, okN = 0, last = '', notes = [];
    var next = function () {
      if (i >= files.length) {
        S.up = ''; render();
        toast(okN === files.length ? (okN === 1 ? '올려서 정리했습니다' : okN + '개를 올려서 정리했습니다') + (notes.length ? ' — ' + notes[0] : '.') : (okN + '개만 올렸습니다. ' + last));
        return;
      }
      var f = files[i++];
      S.up = '올리는 중 (' + i + '/' + files.length + ')…'; render();
      var name = f.name && EXT.test(f.name) ? f.name : '사진 ' + new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '') + '.' + ((f.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg'));
      b64of(f).then(function (data) { return call('apiDocUpload', [{ name: name, data: data }]); }).then(function (d) {
        okN++; put(d);
        if (d.put && d.put.dup) notes.push('같은 파일이 이미 있어 중복 폴더로 옮겼습니다');
        else if (d.put && d.put.note) notes.push(d.put.note);
        next();
      }, function (e) { last = errText(e); next(); });
    };
    next();
  });
  root.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'loginForm') return;
    ev.preventDefault();
    var v = $('pw').value;
    if (!v) return;
    var btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = '확인 중…';
    post({ action: 'login', pw: v, dev: devId() }).then(function (r) { setToken(r.token); S.authed = true; S.loginErr = ''; load(); },
      function (e) { S.loginErr = errText(e); render(); });
  });
  window.__docs = { state: function () { return S; } };
  if (S.authed) load(); else render();
})();
</script>
