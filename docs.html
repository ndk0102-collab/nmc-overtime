<style>
/* 공문함 (2026-11-21 14:12 지시). 공문 · 팩스 · 메일 내용은 이 파일에 없고, 관리자 로그인 뒤 서버(구글 시트 '공문함' · '공문 글자')에서 받아 옵니다. */
:root{
  --bg:#F2EFEC; --card:#FFFFFF; --ink:#151515; --ink2:#33302D; --muted:#625C56; --line:#DDD6CF; --soft:#EFEAE5;
  --vc:#7A3A14; --vsoft:#F6EDE6; --gold:#B08A35;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA; --blue:#1E5AA8; --blue-soft:#E6EEF9;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
b{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 12px;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800}
.wrap{max-width:1040px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:18px;font-weight:800}
.cnt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.cnt button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left}
.cnt button b{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cnt button span{font-size:13px;font-weight:700;color:var(--muted)}
.cnt button.late b{color:var(--bad)} .cnt button.soon b{color:var(--warn)} .cnt button.fresh b{color:var(--vc)}
.cnt button[aria-pressed="true"]{border-color:var(--vc);background:var(--vsoft);box-shadow:inset 0 -3px 0 var(--vc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--vc);border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.danger{background:#fff;color:var(--bad);border:2px solid #F2C4BF}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.home:focus-visible,.it:focus-visible,.cnt button:focus-visible,.chip:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px}
.mail .mst{margin:4px 0 0;font-size:15.5px;font-weight:800}
.mail .mst.on{color:var(--ok)}
.mail .mst.on::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.mail .mst.wait{color:var(--warn)}
.mail .mst.off{color:var(--muted)}
.mail .mst.bad{color:var(--bad)}
.mail .mt{margin-top:12px}
.mkey{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--vsoft);border:2px solid var(--vc)}
.mkl{margin:0 0 6px;font-weight:800}
.mkl small{display:block;font-weight:500;color:var(--ink2);font-size:13.5px}
.mkey code{display:block;margin:0 0 10px;padding:10px;border-radius:8px;background:#fff;border:1px solid var(--line);font:700 15px/1.5 ui-monospace,Consolas,monospace;word-break:break-all;user-select:all;letter-spacing:.02em}
.mask{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--soft)}
.mask p{margin:0 0 10px}
.err{color:var(--bad);font-weight:700}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.filt input[type=search]{flex:1;min-width:180px;min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.filt select{min-height:44px;padding:0 10px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700}
.chip{min-height:40px;padding:0 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--vc);border-color:var(--vc);color:#fff}
.list{list-style:none;margin:0;padding:0}
/* 목록 = 표 (2026-11-22 지시 "깔끔하고 보기 좋게 다시 만들어라. 제대로 정리 딱딱딱 기업같이"): 줄마다 같은 칸 · 넓은 화면은 머리줄 · 휴대폰은 두 줄 */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px}
.thr,.it{display:grid;grid-template-columns:var(--cols);column-gap:14px;align-items:center}
.thr{padding:9px 16px;background:#F5F2EF;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--muted)}
.thr .r,.it .r{text-align:right}
.it{width:100%;min-height:52px;padding:9px 16px;margin:0;border:0;border-bottom:1px solid #EEE8E2;border-radius:0;background:var(--card);text-align:left;cursor:pointer;font:inherit;color:inherit}
.list li:last-child .it{border-bottom:0}
.it:hover{background:#FAF7F4}
.it .cell{display:block;min-width:0;font-size:14px;line-height:1.35}
.it .br{display:none}
.it .cd1{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.it .t{display:block;min-width:0;font-size:15px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.st-done .t{font-weight:600;color:#45403B}
.it .s{display:block;margin-top:1px;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s.err{color:var(--bad);font-weight:700}
.it .m{display:block;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .n{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.it .amt{font-weight:800;color:#14532D;font-variant-numeric:tabular-nums}
.it .amt.none{font-weight:700;color:var(--warn);font-size:12.5px}
.lab{display:inline-block;max-width:100%;padding:1px 7px;border-radius:5px;font-size:12px;font-weight:800;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;background:var(--soft);color:var(--ink2)}
.lab.c-po{background:#E8EFF8;color:#1E5AA8} .lab.c-tax{background:#E6F2EA;color:#1B7A43} .lab.c-gong{background:#F4ECE5;color:#7A3A14}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;line-height:1.5;white-space:nowrap;border:1px solid transparent}
.pill.new{background:var(--vc);color:#fff} .pill.seen{border-color:var(--line);color:var(--ink2);background:#fff} .pill.done{color:#7F7973;background:#F1EEEB}
.pill.bad{background:var(--bad);color:#fff} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--blue-soft);color:var(--blue)}
.pill.imp{background:var(--gold);color:#fff;margin-left:4px}
.due{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink2)}
.due.late{color:var(--bad)} .due.soon{color:var(--warn)} .due.none{color:#B9B2AB;font-weight:500}
.tbl .dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0;padding:8px 16px;background:#FAF8F6;border-bottom:1px solid var(--line);font-size:14px;font-weight:800;color:var(--ink)}
.tbl .dh:not(:first-child){border-top:1px solid var(--line)}
.tbl .dh small{font-size:12.5px;font-weight:700;color:var(--muted)}
.tbl .dh.today{color:var(--vc)}
.tbl .dh .sum{margin-left:auto;font-size:13px;font-weight:800;color:#14532D;font-variant-numeric:tabular-nums}
.tbl .empty{padding:28px 12px}
.subt{display:grid;grid-template-columns:var(--cols);column-gap:14px;align-items:center;padding:10px 16px;background:#F3F7F4;border-top:2px solid #CFE2D6;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.subt .r{text-align:right}
.tnote{margin:0;padding:8px 16px 10px;font-size:12.5px;color:var(--muted);background:#FAFCFB;border-top:1px solid #E3EEE7}
.tbl .cgh{margin:0;padding:7px 16px;border-left-width:4px;border-bottom:1px solid var(--line);background:#FAF8F6;font-size:13.5px}
.tbl .wait{padding:24px 10px}
.it .tag{padding:0 6px;font-size:11.5px;margin-right:5px;vertical-align:1px}
/* 칸: 모두 · 각종 공문 = 받은 시각 · 분류 · 제목 · 발신 · 기한 · 상태 / 발주서 = 받은 시각 · 거래처 · 제목 · 출고 · 상태 / 세금계산서 = 작성일 · 거래처 · 공급가액 · 세액 · 합계 · 장부 */
.t-all,.t-gong{--cols:92px 86px minmax(0,1fr) minmax(0,180px) 92px 84px}
/* 정리 (v52, 2026-11-22 19:20 지시 "니가 분류하고 정리를 해라 … 자동으로 정리해서 딱 할수있도록") */
.brd h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.brd h2 small{font-size:13px;font-weight:600;color:var(--muted)}
.bsec{margin:12px 0 0}
.bsec>h3,.bsec>summary{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:15px;font-weight:800}
.bsec>summary{cursor:pointer;color:var(--ink2);list-style:revert}
.bsec h3 .bn{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--vc);color:#fff;font-size:12.5px}
.bsec h3 small{font-size:12.5px;font-weight:600;color:var(--muted)}
.bl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bi{display:flex;flex-direction:column;gap:3px;width:100%;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.bi:hover{background:#FAF7F4}
.bi:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.bi.k-todo{border-left-color:var(--vc)} .bi.k-meet{border-left-color:var(--blue)} .bi.k-deal{border-left-color:#6D28D9} .bi.k-pick{border-left-color:var(--gold)} .bi.k-note{border-left-color:var(--ok)}
.bh{display:flex;align-items:center;gap:8px;min-width:0}
.bt{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{flex:none;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink2);font-size:12.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.bd.late{background:var(--bad);color:#fff} .bd.soon{background:var(--warn-soft);color:var(--warn)}
.bdo{display:flex;flex-direction:column;gap:1px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.bm{font-size:12.5px;line-height:1.4;color:var(--muted)}
.bempty{margin:0;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--ink2);font-size:14px}
.bauto{margin:12px 0 0;font-size:13px;color:var(--muted)}
.bauto .btn{margin-left:6px;vertical-align:middle}
.lab.k-todo{background:var(--vsoft);color:var(--vc)} .lab.k-meet{background:var(--blue-soft);color:var(--blue)} .lab.k-deal{background:#EFE7FB;color:#6D28D9}
.lab.k-pick{background:#F8F0DC;color:#7A5C0E} .lab.k-note{background:var(--ok-soft);color:var(--ok)} .lab.k-info,.lab.k-ad,.lab.k-att,.lab.k-self{background:#F1EEEB;color:#7F7973}
.it .s.td{color:var(--ink2);font-weight:700}
.tdb{margin:10px 0 12px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--vc);border-radius:12px;background:#FFFCF9}
.tdb.k-meet{border-left-color:var(--blue)} .tdb.k-deal{border-left-color:#6D28D9} .tdb.k-pick{border-left-color:var(--gold)} .tdb.k-note{border-left-color:var(--ok)}
.tdb.k-info,.tdb.k-ad,.tdb.k-self{border-left-color:#C9C2BB;background:#FBFAF9}
.tdh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px}
.tdg{font-size:12.5px;font-weight:700;color:var(--muted)}
.tdd{margin:4px 0 8px;padding-left:22px;font-size:15.5px;font-weight:700;line-height:1.5}
.tdb .kv{margin:6px 0 0}
.tdm{margin:10px 0 0;font-size:13.5px}
.tdm ol{margin:4px 0 0;padding-left:20px} .tdm li{margin:2px 0} .tdm li.me>button{font-weight:800}
.tdw{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.tdn{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}
@media (max-width:759px){ .bt{white-space:normal;flex:1 1 70%} .bh{flex-wrap:wrap;row-gap:4px} .bh .bd{order:3} .bdo{font-size:14px} }
/* 세금계산서 품목 · 수량 (v54) */
.tli{margin:10px 0 12px}
.tli h3{margin:0 0 6px;font-size:15px;font-weight:800}
.tli h3 small{margin-left:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tlw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tl th,.tl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
.tl th{background:var(--soft);font-size:12.5px;font-weight:800;color:var(--ink2)}
.tl td.nm{white-space:normal;min-width:6.5em;font-weight:700}
.tl td.nm small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.tl .r{text-align:right}
.tl tbody tr:last-child td{border-bottom:0}
.tl tfoot td{border-top:1px solid var(--line);border-bottom:0;background:#FBFAF9;font-weight:800}
.tln{margin:8px 0 12px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--ink2)}
.it .s.ti{color:var(--ink);font-weight:600}
@media (max-width:559px){   /* 휴대폰: 품목 한 줄씩 카드처럼 (가로 넘김 없이) */
  .tl thead{display:none}
  .tl,.tl tbody,.tl tfoot,.tl tr{display:block;width:100%}
  .tl tr{padding:8px 10px;border-bottom:1px solid var(--line)}
  .tl tbody tr:last-child{border-bottom:0}
  .tl tfoot tr{border-top:1px solid var(--line);border-bottom:0;background:#FBFAF9}
  .tl td,.tl tfoot td{display:inline-block;padding:0 10px 0 0;border:0;background:none;font-size:13.5px;white-space:nowrap}
  .tl td.nm{display:block;padding:0 0 3px;font-size:14.5px}
  .tl tfoot td:first-child{display:block;padding:0 0 3px}
  .tl td[data-l]::before{content:attr(data-l) ' ';font-weight:600;color:var(--muted)}
  .tl td:empty{display:none}
}
.t-po{--cols:92px minmax(0,170px) minmax(0,1fr) 104px 104px}
.t-tax{--cols:64px minmax(0,1fr) 110px 92px 118px 132px 88px}
/* v62 처리 완료 바로 누르기 (2026-11-23 19:20 지시 "상태에서 바로 처리완료 누를수있도록 … 누르면 바로 반응하도록") */
.qd{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 11px;border:2px solid var(--ok);border-radius:999px;background:#fff;color:var(--ok);font-size:13px;font-weight:800;line-height:1;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none}
.qd:hover{background:var(--ok-soft)}
.qd:active{transform:scale(.95)}
.it .cell.qc{text-align:right}
.it.kept{background:#F4FAF6}
.savebar{position:fixed;right:14px;bottom:86px;z-index:59;margin:0;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.1);font-size:12.5px;font-weight:800;color:var(--muted)}
.tc.is-done{opacity:.72}
.tc.is-done .tc-t{text-decoration:line-through}
.tc-ok{display:flex;align-items:center;justify-content:center;min-height:46px;flex:1;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:800}
@media (max-width:759px){
  .thr{display:none}
  .it,.subt{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:3px;padding:10px 12px}
  .it .cell{order:3;font-size:12.5px;color:var(--muted)}
  .it .cell.tt{order:1;flex:1 1 0;min-width:0;color:inherit}
  .it .cell.st{order:2;flex:none;margin-left:auto}
  .it .br{display:block;order:2;flex-basis:100%;height:0}
  .it .cell.xs,.subt .xs{display:none}
  .it .l2 ~ .l2::before{content:'·';margin-right:8px;color:#C9C2BB}
  .it .t{font-size:15px}
  .it .m,.it .due,.it .cd1{font-size:12.5px}
  .it .m{display:inline;color:var(--muted)}
  .it .lab{font-size:11.5px}
  .it .amt{font-size:15px}
  .subt .r{margin-left:auto}
  .qd{min-height:38px;padding:0 13px}
  .it .cell.qc{order:4;margin-left:auto}
  .it .cell.l2 .s{display:inline;margin-left:5px}
  .dirs{width:100%}
  .dirs button{flex:1 1 0;padding:0 8px}
}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;font-weight:800;vertical-align:2px;margin-right:5px;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.tag.bad{background:var(--bad);color:#fff} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.new{background:var(--vc);color:#fff} .tag.imp{background:var(--gold);color:#fff}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.kind{background:var(--blue-soft);color:var(--blue)}
.empty{padding:20px 10px;text-align:center;color:var(--muted);font-weight:700;list-style:none}
.more{margin:4px 0 0}
.more summary{cursor:pointer;font-weight:800;color:var(--ink2);min-height:36px;display:flex;align-items:center}
