<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NMC 거래명세서</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
window.NMC_API = "https://script.google.com/macros/s/AKfycbzg5mbJ9hkPn6Ld7hzNICzRYcsTDM_vVFdWZXV2qAy6QSYJFQVOvREsvE5NjIyy_05M/exec";
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

<script src="nav.js"></script>
<!--PREVIEW_SERVER-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 거래명세서 (2026-11-20). 회사 · 거래처 정보와 금액은 이 파일에 없고, 관리자 로그인 뒤 서버(구글 시트 '거래명세서' · '거래처' · '회사정보')에서 받아 옵니다. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;
  --vc:#1B3A6B; --vsoft:#E8EEF7; --gold:#B08A35; --gold-soft:#F6EFDF; --blue:#1F5FBF;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
b,td,th,.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 0;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.bar h1 small{margin-left:8px;font-size:12px;font-weight:700;letter-spacing:.2em;color:#E9D7AC}
.vtabs{max-width:860px;margin:8px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.vtabs button{min-height:46px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer;padding:0 2px}
.vtabs button[aria-selected="true"]{background:var(--bg);color:var(--vc)}
.home:focus-visible,.vtabs button:focus-visible{outline:3px solid #F4B400;outline-offset:2px}

.wrap{max-width:860px;margin:0 auto;padding:12px 12px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px;font-weight:800}
.card h2 small{margin-left:6px;font-size:13px;font-weight:600;color:var(--muted)}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.nav:focus-visible,.ent:focus-visible,.link:focus-visible,.x:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.link{border:0;background:none;padding:6px 0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.tools .btn{flex:1 1 130px}
.err{margin:8px 0 0;color:var(--bad);font-weight:700}
.wait{padding:30px 10px;text-align:center;color:var(--muted);font-weight:700}
.warnbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.okbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-size:14px;font-weight:700}
.infobox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--vsoft);color:var(--vc);font-size:14px;font-weight:600}
.sealrow{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.sealrow img{width:60px;height:60px;flex-shrink:0}
.sealrow p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2);font-weight:600}
.sealrow p b{display:block;color:var(--ink);font-size:15px;font-weight:800}
.st{display:inline-block;padding:0 7px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--ink2);vertical-align:1px}
.st.void{background:var(--bad-soft);color:var(--bad)}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.gold{background:var(--gold-soft);color:#7A5C17}

/* 달 고르기 · 합계 */
.pnav{display:flex;align-items:center;gap:8px}
.nav{flex-shrink:0;width:50px;height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:26px;font-weight:800;line-height:1;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.plabel{flex:1;min-width:0;text-align:center}
.plabel b{display:block;font-size:19px;font-weight:800;line-height:1.3}
.plabel small{display:block;font-size:13px;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.sum div{padding:10px;border-radius:12px;background:var(--soft)}
.sum span{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.sum b{display:block;font-size:18px;font-weight:800;line-height:1.3;margin-top:2px}
.sum div.tot{background:var(--vc);color:#fff}
.sum div.tot span{color:#E9D7AC}
.kgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kgs span{padding:3px 10px;border-radius:999px;background:var(--vsoft);color:var(--vc);font-size:13.5px;font-weight:800}
@media (max-width:460px){.sum{grid-template-columns:1fr 1fr}.sum div.tot{grid-column:1/-1}}

/* 일일 기록 */
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 2px 6px;font-size:15px;font-weight:800;color:var(--vc)}
.dayh small{font-size:13.5px;color:var(--ink2);font-weight:700}
.ent{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ent.void{opacity:.62}
.ent .no{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:var(--vsoft);color:var(--vc);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.ent.void .no{background:var(--bad-soft);color:var(--bad)}
.ent .et{flex:1;min-width:0}
.ent .et b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .et b em{font-style:normal;font-weight:700;color:var(--muted);margin-left:6px;font-size:14px}
.ent .et small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .ea{flex-shrink:0;text-align:right}
.ent .ea b{display:block;font-size:16px;font-weight:800}
.ent .ea small{display:block;font-size:12px;color:var(--muted)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:700}

/* 작성 */
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fgrid .w2{grid-column:span 2}
@media (max-width:640px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .w2,.fgrid .wf{grid-column:1/-1}}
.fld{display:block;margin:0}
.fld > span{display:block;margin:0 0 5px;font-size:14px;font-weight:800;color:var(--ink2)}
.fld > span small{margin-left:4px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16.5px}
textarea.inp{min-height:70px;padding:10px 12px;resize:vertical;line-height:1.45}
select.inp{padding-right:30px}
.inp:focus{outline:none;border-color:var(--vc)}
.inp.r{text-align:right;font-weight:700}
.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.cinfo{margin-top:8px;padding:9px 11px;border-radius:10px;background:var(--soft);font-size:13.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.cinfo b{color:var(--vc)}
.cinfo .link{font-size:13.5px;padding:0}
.ln{position:relative;padding:12px 12px 10px;margin:10px 0 0;border:1px solid var(--line);border-left:5px solid var(--vc);border-radius:12px;background:#fff}
.ln.x{border-left-color:var(--gold)}
.ln.diff{background:var(--warn-soft)}
.lh{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.lh b{font-size:14px;font-weight:800;color:var(--vc)}
.ln.x .lh b{color:#7A5C17}
.lh small{flex:1;font-size:12.5px;color:var(--muted)}
.x{flex-shrink:0;width:38px;height:38px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:18px;font-weight:800;line-height:1;cursor:pointer;color:var(--muted)}
.lg{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.lg2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.lg3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:520px){.lg3{grid-template-columns:1fr 1fr}.lg3 .w{grid-column:1/-1}}
.lg .inp,.lg2 .inp,.lg3 .inp{min-height:46px;font-size:16px}
.mini{display:block;margin:0 0 3px;font-size:12.5px;font-weight:800;color:var(--muted)}
.amt{display:flex;align-items:center;justify-content:flex-end;min-height:46px;padding:0 4px;font-size:17px;font-weight:800;color:var(--vc)}
.ph{margin:5px 0 0;font-size:12.5px;color:var(--muted)}
.ph.est{color:var(--warn);font-weight:700}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.adds .btn{flex:1 1 180px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--vc)}
.totbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.totbox div{padding:10px;border-radius:12px;background:var(--soft);text-align:right}
.totbox span{display:block;font-size:12.5px;font-weight:800;color:var(--muted);text-align:left}
.totbox b{display:block;font-size:18px;font-weight:800;white-space:nowrap}
@media (max-width:460px){.totbox{grid-template-columns:1fr 1fr}.totbox div.t{grid-column:1/-1}}
.totbox div.t{background:var(--vc);color:#fff}
.totbox div.t span{color:#E9D7AC}
.han{margin:6px 2px 0;font-size:13px;color:var(--muted);text-align:right}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,23,42,.08)}
.savebar .in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center}
.savebar .in .btn{flex:1}
.savebar .in .btn.ghost{flex:0 0 auto}
.fwarn{margin:10px 0 0;padding:9px 11px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:600}

/* 보기 */
.vh{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 12px}
.vh .vt{flex:1;min-width:200px}
.vh .vt p{margin:0;font-size:13.5px;color:var(--muted);font-weight:700}
.vh .vt h2{margin:2px 0 0;font-size:20px}
.vh .vt h2 em{font-style:normal;font-weight:700;color:var(--muted);font-size:15px;margin-left:6px}
.vh .va{text-align:right}
.vh .va b{display:block;font-size:24px;font-weight:800;color:var(--vc)}
.vh .va small{display:block;font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.vh .va{width:100%;text-align:left}}
.difs{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.pvbox{position:relative;width:100%;overflow:hidden}
.pvk{transform-origin:0 0;width:210mm}
.pvk .pg{box-shadow:0 4px 18px rgba(15,23,42,.18);margin:0 0 6mm}

/* 거래처 · 회사 */
.find{width:100%;min-height:46px;margin:2px 0 6px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.crow:first-child{border-top:0}
.crow .ct{flex:1;min-width:0}
.crow .ct b{display:block;font-size:15.5px;font-weight:800}
.crow .ct small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cm{flex-shrink:0}

/* 창 */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:620px;max-height:94vh;max-height:94dvh;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25)}
@media (min-width:640px){#sheet{align-items:center;padding:16px}.sheet{border-radius:20px;max-height:92vh}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;margin:0;font-size:19px;font-weight:800;color:var(--vc)}
.sbody{flex:1;overflow:auto;padding:14px 16px 6px;-webkit-overflow-scrolling:touch}
.sbody .fld{margin:0 0 12px}
.sfoot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot .btn{flex:1 1 130px}
/* 거래처 송부 메일 (v60) */
.mrow{margin:8px 0 0;font-size:14px;color:var(--ink2)}
.mrow p{margin:0}
.mpv{margin:2px 0 8px;border:1px solid var(--line);border-radius:8px}
.mailoff{position:fixed;left:-10000px;top:0;width:210mm;pointer-events:none}

.login{max-width:440px;margin:20px auto}
.login form{display:flex;gap:8px;margin-top:12px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3)}

/* ───────── 인쇄 모양: A4 한 장에 위 '공급받는자 보관용' · 아래 '공급자 보관용' (회사 거래명세표 양식의 남색 · 금색) ─────────
   머리 칸: 로고 · 제목 · No.·일자·합계 — 양쪽 칸 폭을 같게 해 제목이 종이 한가운데 오도록 (2026-11-23 지시 "거래명세서가 중앙에 딱 위치해야") */
.pg{position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;color:#1E2430;font-family:var(--font);font-size:8pt;line-height:1.25;word-break:keep-all}
.cp{position:absolute;left:0;width:210mm;height:148.5mm;padding:7mm 11mm 5mm;display:flex;flex-direction:column}
.cp.t{top:0}.cp.b{top:148.5mm}
.cut{position:absolute;left:6mm;right:6mm;top:148.5mm;height:0;border-top:.3mm dashed #9FB0C9}
.cut span{position:absolute;left:50%;top:-1.9mm;transform:translateX(-50%);padding:0 2.4mm;background:#fff;font-size:5.8pt;color:#8A93A3;letter-spacing:.3em;white-space:nowrap}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:3mm;height:18.5mm;padding-bottom:1.6mm;border-bottom:.6mm solid #B08A35}
.hd .lgo{display:block;height:16.4mm;width:auto;justify-self:start}
.tt{text-align:center}
.tt b{display:block;font-size:17pt;font-weight:800;color:#1B3A6B;letter-spacing:.42em;margin-right:-.42em;line-height:1.15}
.tt i{display:block;font-style:normal;font-size:5.6pt;font-weight:700;color:#B08A35;letter-spacing:.36em;margin:.7mm -.36em 1.1mm 0}
.tt .bd{display:inline-block;padding:.5mm 2.6mm;border-radius:.6mm;font-size:7pt;font-weight:800;color:#fff;background:#1B3A6B;letter-spacing:.06em}
.tt .bd.b{background:#B08A35}
.mt{text-align:right}
.mt p{margin:0 0 .4mm;display:flex;justify-content:flex-end;align-items:baseline;gap:2mm;font-size:8.2pt;font-weight:700;white-space:nowrap}
.mt p span{font-size:6.4pt;font-weight:500;color:#8A93A3}
.mt p em{font-style:normal;color:#8A93A3;font-weight:500}
.mt .am{margin-top:.8mm}
.mt .am b{font-size:13.5pt;font-weight:800;color:#1F5FBF;letter-spacing:-.01em}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:2.4mm}
.pb{border:.25mm solid #9FB0C9}
.pb h4{margin:0;height:4.6mm;padding:0 2.4mm;display:flex;align-items:center;background:#1B3A6B;color:#fff;font-size:7.4pt;font-weight:800;letter-spacing:.08em}
.pb table{width:100%;border-collapse:collapse;table-layout:fixed}
.pb th{width:14.5mm;height:4.4mm;padding:0;background:#EDF2FA;border-top:.2mm solid #E3E8F0;font-size:6.5pt;font-weight:700;color:#1B3A6B;text-align:center;letter-spacing:.05em;white-space:nowrap}
.pb td{height:4.4mm;padding:0 2mm;border-top:.2mm solid #E3E8F0;border-left:.2mm solid #E3E8F0;font-size:7.3pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb td.b{font-weight:800;font-size:8pt}
.pb td.seal{position:relative;overflow:visible}
.pb td.seal i{position:absolute;right:2.2mm;top:0;bottom:0;display:flex;align-items:center;color:#8A93A3;font-style:normal;font-size:6.6pt}
/* 회사 도장 (2026-11-21): '(인)' 한가운데에 찍음 · 아래 글자가 비치게 곱하기 (도장 그림은 관리자 로그인 뒤 서버에서만 받음) */
.pb td.seal i .sl{position:absolute;left:50%;top:50%;width:13mm;height:13mm;max-width:none;transform:translate(-50%,-50%);mix-blend-mode:multiply;pointer-events:none}
.pb td.seal i.on{right:6mm}   /* 도장이 공급자 칸 테두리 안에 들어오게 (인)을 조금 왼쪽으로 */
.pb td.ad{white-space:normal;line-height:1.1;font-size:6.6pt}
.si{display:flex;align-items:stretch;margin-top:2mm;height:5.2mm;border:.25mm solid #9FB0C9}
