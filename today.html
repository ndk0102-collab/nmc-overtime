/* 오늘 할 일 · 아침 알림 (2026-11-21 14:15 지시). 출고 · 입고 · 공문 내용은 이 파일에 없고, 관리자 로그인(또는 알림을 등록한 기기의 열쇠) 뒤 서버에서 받아 옵니다. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;
  --vc:#1B3A6B; --vsoft:#E8EEF7; --gold:#B08A35;
  --out:#1B7A43; --out-soft:#E4F3EA; --in:#6B4FA0; --in-soft:#F0EAF8; --doc:#9A3D12; --doc-soft:#FBEBE3;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
b,td{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 12px;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.bar h1 small{display:block;font-size:13px;font-weight:600;color:#D9E3F2;letter-spacing:0}
.ref{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:#fff;color:var(--vc);font-size:14px;font-weight:800;cursor:pointer}
.home:focus-visible,.ref:focus-visible,.btn:focus-visible,.link:focus-visible,select:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c,var(--vc));border-radius:16px;padding:14px;margin:0 0 12px}
.card.out{--c:var(--out);--s:var(--out-soft)} .card.stw{--c:#1B3A6B;--s:#E8EEF8} .card.in{--c:var(--in);--s:var(--in-soft)} .card.doc{--c:var(--doc);--s:var(--doc-soft)} .card.set{--c:var(--vc);--s:var(--vsoft)}
.card h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin:0 0 8px;font-size:19px;font-weight:800;color:var(--c,var(--ink))}
.card h2 small{font-size:14px;font-weight:700;color:var(--ink2)}
.card h3{margin:14px 0 6px;font-size:15px;font-weight:800;color:var(--ink2)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--soft)}
.row:first-child{border-top:0}
.rl{flex:1;min-width:0}
.rl b{display:block;font-size:16.5px;font-weight:800;line-height:1.35}
.rl small{display:block;color:var(--muted);font-size:14px;font-weight:600;margin-top:1px}
.rr{flex-shrink:0;text-align:right;max-width:52%}
.rr b{display:block;font-size:15.5px;font-weight:800}
.rr small{display:block;color:var(--muted);font-size:13px}
.subs{list-style:none;margin:6px 0 0;padding:6px 10px;background:var(--s,var(--soft));border-radius:10px;font-size:14.5px}
.gk{margin:2px 0 0;font-size:15.5px;font-weight:800;color:var(--c,var(--ink))}
.subs li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.subs li span:last-child{font-weight:700;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:800;vertical-align:2px;margin-right:6px;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.tag.bad{background:var(--bad);color:#fff} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.new{background:var(--gold);color:#fff} .tag.ok{background:var(--ok-soft);color:var(--ok)}
.sum{margin:4px 0 0;color:var(--ink2);font-size:14.5px}
.empty{margin:0;color:var(--muted);font-weight:600}
.link{display:inline-flex;align-items:center;min-height:40px;padding:0 4px;color:var(--c,var(--vc));font-weight:800;text-decoration:none;background:none;border:0;cursor:pointer;font-size:15px}
.allnone{padding:22px 16px;text-align:center;font-size:17px;font-weight:700;color:var(--ink2)}
.late{background:var(--warn-soft);border:1px solid #EAD29A;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-weight:700;color:var(--warn);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--vc);border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
a.btn{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap;flex-shrink:0}
.btn.danger{background:#fff;color:var(--bad);border:2px solid #F2C4BF}
.btn:disabled{opacity:.55;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.devbox{background:var(--vsoft);border-radius:12px;padding:12px;margin:0 0 10px}
.devbox p{margin:0 0 4px}
.devbox .st{font-size:17px;font-weight:800}
.devbox .st.on{color:var(--ok)} .devbox .st.off{color:var(--ink2)} .devbox .st.bad{color:var(--bad)}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.setrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.setrow select{min-height:44px;padding:0 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
.devs{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.devs th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
.devs td{padding:8px 4px;border-bottom:1px solid var(--soft);vertical-align:top}
.devs td b{font-size:14.5px}
.devs .acts{white-space:nowrap;text-align:right}
.login{max-width:440px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--vc);border-radius:20px;padding:20px 18px}
.login h2{margin:0 0 6px;font-size:20px;font-weight:800;color:var(--vc)}
.login p{margin:0;color:var(--muted);font-size:14.5px}
.login form{display:flex;gap:8px;margin-top:14px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px;background:#fff}
.err{margin:10px 0 0;color:var(--bad);font-weight:700}
.wait{padding:40px 10px;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3);z-index:50}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--ink2);font-size:14.5px;margin:0 0 12px}
@media (max-width:420px){.rr{max-width:46%}.rr b{font-size:14.5px}}
/* 다시 짜기 (v56, 2026-11-22 22:09 지시 "아무것도 모르는사람도 들어가자마자 바로 알아보기 쉽게") */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:92px;padding:11px 12px;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tile.out{--c:var(--out)} .tile.in{--c:var(--in)} .tile.doc{--c:var(--doc)}
.tile b{font-size:25px;font-weight:800;line-height:1.15;color:var(--c)}
.tile span{font-size:15px;font-weight:800;color:var(--ink)}
.tile small{font-size:13px;font-weight:700;color:var(--muted);line-height:1.35}
.tile small.r{color:var(--bad)}
.tile:hover{background:#FAFBFD}
.tile:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
@media (max-width:420px){.tiles{gap:6px}.tile{padding:9px 9px;min-height:78px}.tile b{font-size:21px}.tile span{font-size:14px}.tile small{font-size:12px}.tile small:not(.r){display:none}}
.dcl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dc{padding:11px 12px;border:1px solid var(--line);border-left:5px solid #B9C2CE;border-radius:12px;background:#fff}
.dc.late{border-left-color:var(--bad)} .dc.soon{border-left-color:#E0A100} .dc.meet{border-left-color:#1E5AA8}
.dct{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px}
.dct .tag{margin:0;font-size:13.5px;padding:3px 10px}
.tag.meet{background:#E6EEF9;color:#1E5AA8}
.kd{font-size:13px;font-weight:800;color:var(--muted)}
.dtt{display:block;font-size:16.5px;font-weight:800;line-height:1.42}
.ddo{margin:7px 0 0;padding:8px 10px;border-radius:9px;background:#FFF6DC;font-size:15px;line-height:1.5}
.ddo b{margin-right:7px;color:#8A4B00}
.dsum{margin:6px 0 0;font-size:14.5px;color:var(--ink2)}
.dwho{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.dwho .link{min-height:36px;font-size:14.5px}
.btn.wide{display:flex;align-items:center;justify-content:center;width:100%;margin:10px 0 0}
details.card.set>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-height:48px;cursor:pointer;font-size:17px;font-weight:800;color:var(--vc);list-style:revert}
details.card.set>summary small{font-size:14px;font-weight:700;color:var(--ink2)}
details.card.set[open]>summary{margin-bottom:8px}
</style>

<script>
(function () {
  'use strict';
  var DEMO = window.__SERVER__ || null;   // 시험용 화면에서만
  var API = DEMO ? '' : String(window.NMC_API || '');
  var TOKEN_KEY = 'nmc_pay_token';        // 다른 관리자 화면과 같은 열쇠
  var P = window.NMCPush || null;
  var $ = function (id) { return document.getElementById(id); };
  var root = $('root'), toastEl = $('toast');
  var S = { mode: '', brief: null, noti: null, dev: null, at: 0, loginErr: '', busy: '', docAll: false, setOpen: false };
  var ERR = {
    auth: '로그인 유효 시간이 만료되었습니다. 비밀번호를 다시 입력해 주십시오.', bad_pw: '비밀번호가 일치하지 않습니다.', locked: '비밀번호 입력 오류 횟수 초과로 15분간 잠금되었습니다.',
    net: '인터넷 연결을 확인해 주십시오.', timeout: '응답이 지연되고 있습니다. 잠시 후 다시 시도해 주십시오.',
    bad_action: '서버가 아직 이 기능을 지원하지 않습니다. 서버 배포 후 다시 시도해 주십시오.', not_found: '해당 기기가 목록에 없습니다. 새로고침해 주십시오.',
    noti_endpoint: '이 브라우저의 알림 주소를 서버가 받지 않았습니다. 크롬 · 엣지 · 사파리(홈 화면 앱)에서 다시 시도해 주십시오.',
    noti_many: '등록 기기 수가 한도를 초과했습니다. 사용하지 않는 기기를 목록에서 삭제하십시오.',
    denied: '이 브라우저의 알림이 차단되어 있습니다. 주소창 왼쪽 자물쇠(사이트 설정) → 알림 → 허용으로 변경한 뒤 다시 누르십시오.',
    dismissed: '알림 허용 창을 닫았습니다. 다시 눌러 \'허용\'을 선택해 주십시오.',
    'ios-install': '아이폰은 사파리에서 공유 버튼 → \'홈 화면에 추가\'를 한 뒤, 홈 화면의 NMC 아이콘으로 실행한 뒤 \'이 기기 알림 등록\'을 누르십시오.',
    unsupported: '이 브라우저는 알림을 지원하지 않습니다. 크롬 · 엣지(컴퓨터 · 안드로이드) 또는 아이폰 홈 화면 앱을 사용하십시오.',
    no_key: '서버 알림 키 생성 실패. 잠시 후 다시 시도해 주십시오.', noti_crypto: '서버 알림 서명 검증 실패. 관리자에게 문의하십시오(알림 미발송).',
    bad_input: '입력 값을 확인해 주십시오.'
  };
  function errText(e) { var c = String((e && e.message) || e || ''); return ERR[c] || ('처리하지 못했습니다 (' + c + ')'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kg(n) { return Math.round(Number(n) || 0).toLocaleString('ko-KR') + ' kg'; }
  function md(s) { s = String(s || ''); return Number(s.slice(5, 7)) + '월 ' + Number(s.slice(8, 10)) + '일'; }
  function dtx(s) { s = String(s || ''); return s.length >= 16 ? md(s.slice(0, 10)) + ' ' + s.slice(11, 16) : s; }
  function toast(t) { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3600); }
  function getToken() { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function devId() {
    var k = 'nmc_dev', v = '';
    try { v = localStorage.getItem(k) || ''; } catch (e) {}
    if (!/^[0-9a-f]{32}$/.test(v)) {
      var a = new Uint8Array(16); crypto.getRandomValues(a);
      v = Array.prototype.map.call(a, function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
      try { localStorage.setItem(k, v); } catch (e) {}
    }
    return v;
  }
  function post(body) {
    if (DEMO) {
      return new Promise(function (res, rej) {
        setTimeout(function () { try { var j = JSON.parse(DEMO.post(JSON.stringify(body))); if (j.ok) res(j.data); else rej(new Error(j.error)); } catch (e) { rej(e); } }, 20);
      });
    }
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 60000);
    return fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); }, function (e) { throw new Error(e && e.name === 'AbortError' ? 'timeout' : 'net'); })
      .then(function (j) { clearTimeout(timer); if (!j || !j.ok) throw new Error((j && j.error) || 'server'); return j.data; }, function (e) { clearTimeout(timer); throw e; });
  }
  /** 관리자 열쇠로 */
  function call(fn, args) {
    var t = getToken();
    return post({ action: 'stock.call', fn: fn, args: args || [], token: t }).then(function (d) {
      if (d && d.admin !== true && t) throw new Error('auth');
      return d;
    }).catch(function (e) {
      if (String(e && e.message) === 'auth') { setToken(''); if (S.mode === 'admin') { S.mode = ''; start(); } }
      throw e;
    });
  }

  /* ── 시작: 관리자 로그인 → 오늘 할 일 + 알림 설정, 아니면 이 기기의 알림 열쇠 → 오늘 할 일만, 둘 다 없으면 로그인 ── */
  function start() {
    if (getToken()) {
      S.mode = 'admin-wait'; render();
      call('apiBrief', []).then(function (d) { S.mode = 'admin'; S.brief = d.brief; S.noti = d.noti; S.at = Date.now(); render(); devState(); },
        function (e) { if (String(e && e.message) !== 'auth') { S.mode = 'error'; S.loginErr = errText(e); render(); } });
      return;
    }
    (P ? P.cfg() : Promise.resolve(null)).then(function (cfg) {
      if (!cfg || !cfg.key) { S.mode = 'login'; render(); return; }
      S.mode = 'dev-wait'; render();
      post({ action: 'stock.call', fn: 'apiBriefDev', args: [cfg.key] }).then(function (d) { S.mode = 'device'; S.brief = d.brief; S.at = Date.now(); render(); },
        function (e) { S.mode = 'login'; S.loginErr = String(e && e.message) === 'auth' ? '이 기기의 알림 등록이 삭제되었습니다. 로그인 후 알림 등록을 다시 진행하십시오.' : errText(e); render(); });
    });
  }
  function devState() {
    if (!P) { S.dev = { state: 'unsupported' }; render(); return; }
    P.state().then(function (s) { S.dev = s; render(); }, function () { S.dev = { state: 'unsupported' }; render(); });
  }

  /* ── 그리기 ── */
  function render() {
    var b = S.brief;
    $('sub').textContent = b ? md(b.date) + ' (' + b.dow + ')' : '';
    $('refBtn').hidden = !(S.mode === 'admin' || S.mode === 'device');
    if (S.mode === 'login') { root.innerHTML = loginHtml(); var pw = $('pw'); if (pw) pw.focus(); return; }
    if (S.mode === 'error') { root.innerHTML = '<p class="err">' + esc(S.loginErr) + '</p><div class="tools"><button type="button" class="btn" data-act="retry">다시 시도</button></div>'; return; }

    if (act === 'docall') { S.docAll = true; render(); return; }
    if (act === 'on-me') {
      busy('on-me', P.enable(call, API), function (d) { if (d && d.data) S.noti = d.data; toast('이 기기에 매일 아침 알림을 등록했습니다. \'이 기기로 시험 알림\'으로 확인하십시오.'); })
        .then(function () { devState(); });   // 허용 · 거절 · 닫기 뒤 이 기기 상태를 다시 봄
      return;
    }
    if (act === 'off-me') {
      if (!window.confirm('이 기기의 아침 알림을 해제하시겠습니까? 다른 기기는 계속 수신합니다.')) return;
      busy('off-me', P.disable(call).then(function () { return call('apiNoti', []); }), function (d) { S.noti = d; toast('이 기기 알림을 해제했습니다.'); devState(); });
      return;
    }
    if (act === 'test-me' || act === 'test') {
      var tid = act === 'test' ? id : (S.dev && S.dev.cfg && S.dev.cfg.id);
      if (!tid) return;
      busy(act, call('apiNotiTest', [tid]), function (d) { S.noti = d; toast(d.sent && d.sent.ok ? '시험 알림을 발송했습니다. 수 초 내 해당 기기에 표시됩니다.' : '발송 실패. 기기 목록의 결과를 확인하십시오.'); });
      return;
    }
    if (act === 'del') {
      if (!window.confirm('이 기기를 목록에서 삭제하시겠습니까? 해당 기기는 더 이상 알림을 수신하지 않습니다.')) return;
      var mine = S.dev && S.dev.cfg && S.dev.cfg.id === id;
      busy('del', call('apiNotiDel', [id]).then(function (d) { return mine && P ? P.disable(null).then(function () { return d; }) : d; }),
        function (d) { S.noti = d; toast(mine ? '이 기기를 삭제했습니다. 이 기기는 더 이상 알림을 수신하지 않습니다.' : '삭제했습니다.'); devState(); });
      return;
    }
    if (act === 'trig-on' || act === 'trig-off') {
      busy(act, call('apiNotiSet', [{ on: act === 'trig-on' }]), function (d) { S.noti = d; toast(d.on ? '매일 아침 알림을 켰습니다.' : '매일 아침 알림을 껐습니다.'); });
    }
  });
  root.addEventListener('change', function (ev) {
    if (ev.target.id !== 'atSel') return;
    var v = ev.target.value;
    busy('at', call('apiNotiSet', [{ at: v }]), function (d) { S.noti = d; toast('매일 ' + v + '에 알림을 발송합니다.'); });
  });
  root.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'loginForm') return;
    ev.preventDefault();
    var v = $('pw').value;
    if (!v) return;
    var btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = '확인 중…';
    post({ action: 'login', pw: v, dev: devId() }).then(function (r) { setToken(r.token); S.loginErr = ''; S.mode = ''; start(); },
      function (e) { S.loginErr = errText(e); render(); });
  });
  $('refBtn').addEventListener('click', function () { reload(false); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.at && Date.now() - S.at > 300000) reload(true); });
  window.__today = { state: function () { return S; }, restart: function () { S.mode = ''; S.brief = null; S.noti = null; S.dev = null; start(); } };   // 시험용
  start();
})();
</script>
</body>
</html>
