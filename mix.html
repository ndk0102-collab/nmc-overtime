<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NMC 배합 시뮬레이션</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

<!--PREVIEW_SERVER-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 배합 시뮬레이션 (2026-11-21) — 홈페이지 '디자인' 창구의 칩 표면 그리기(granule)를 앱으로 옮긴 것.
   NM01 ~ NM22 색과 포대 비율로 섞은 바닥을 미리 봅니다. 프로젝트 번호(?pj=)로 열면 확정 도면의 배합을 불러옵니다(관리자). */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;
  --vc:#1B3A6B; --vsoft:#E8EEF7; --gold:#B08A35; --blue:#1F5FBF; --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800}
.bar h1 small{margin-left:8px;font-size:12px;font-weight:700;letter-spacing:.2em;color:#E9D7AC}
.wrap{max-width:1180px;margin:0 auto;padding:12px 12px 60px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.col{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px;font-weight:800;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.card h2 small{font-size:13px;font-weight:600;color:var(--muted)}
.hint{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:38px;padding:0 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.pal button:focus-visible,.rec:focus-visible,.pm:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:14.5px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--vc);background:var(--vc);color:#fff}

/* 미리보기 */
.stage{position:relative;width:100%;aspect-ratio:1/.68;border-radius:12px;overflow:hidden;background:#888}
.stage canvas{display:block;width:100%;height:100%}
.floor{position:absolute;inset:0;overflow:hidden;perspective:980px;background:linear-gradient(180deg,#B9D3EA 0%,#DCE8F2 30%,#EEF2F5 34%)}
.plane{position:absolute;left:50%;width:2400px;height:2600px;margin-left:-1200px;transform-origin:50% 0;background-repeat:repeat;background-size:220px 220px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.shade{position:absolute;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(0,0,0,.10))}
.stage .busy{position:absolute;right:10px;top:10px;padding:2px 10px;border-radius:999px;background:rgba(15,23,42,.6);color:#fff;font-size:12.5px;font-weight:700}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin:0 0 10px}
.avg{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.avg .sw{width:38px;height:38px;border-radius:10px;border:1px solid rgba(0,0,0,.15)}
.avg b{font-size:15.5px}
.avg small{display:block;color:var(--muted);font-size:13px}
.code{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* 배합 */
.mrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .sw{flex-shrink:0;width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
.mrow .mt{flex:1;min-width:0}
.mrow .mt b{display:block;font-size:15px}
.mrow .mt small{display:block;font-size:12.5px;color:var(--muted)}
.pm{width:38px;height:38px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:19px;font-weight:800;line-height:1;cursor:pointer}
.mrow .n{min-width:44px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.pal{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;margin-top:8px}
@media (max-width:520px){.pal{grid-template-columns:repeat(6,minmax(0,1fr))}}
.pal button{position:relative;aspect-ratio:1;border:2px solid rgba(0,0,0,.08);border-radius:10px;cursor:pointer;padding:0}
.pal button[aria-pressed="true"]{outline:3px solid var(--vc);outline-offset:1px}
.pal button span{position:absolute;left:0;right:0;bottom:-1px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:center}
.recs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:520px){.recs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rec{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer;overflow:hidden;font:inherit;color:inherit}
.rec canvas{display:block;width:100%;aspect-ratio:1/.62;background:#999}
.rec b{display:block;padding:5px 8px 0;font-size:13.5px}
.rec small{display:block;padding:0 8px 6px;font-size:11.5px;color:var(--muted)}
.pmix{display:flex;align-items:center;gap:10px;width:100%;padding:8px;margin:0 0 6px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.pmix canvas{flex-shrink:0;width:86px;height:56px;border-radius:8px;background:#999}
.pmix .pt{flex:1;min-width:0}
.pmix .pt b{display:block;font-size:14.5px}
.pmix .pt small{display:block;font-size:12.5px;color:var(--muted)}
.pmix[aria-pressed="true"]{border-color:var(--vc);box-shadow:inset 0 0 0 1px var(--vc)}
.login form{display:flex;gap:8px;margin-top:10px}
.login input{flex:1;min-width:0;min-height:46px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:16px}
.err{margin:8px 0 0;color:var(--bad);font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3)}
</style>
</head>
<body>
<header class="bar">
  <div class="bin">
    <a class="home" id="back" href="manage.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backT">관리자</span></a>
    <h1>배합 시뮬레이션<small>MIX</small></h1>
  </div>
</header>
<main class="wrap">
  <div class="col">
    <section class="card">
      <div class="vrow">
        <div class="chips" role="group" aria-label="보기" id="views"></div>
        <div class="chips"><button type="button" class="chip" id="fin" aria-pressed="false" title="수지 광택">광택</button><button type="button" class="btn ghost sm" id="reseed" title="같은 배합을 다른 칩 배치로 다시 그립니다">다시 섞기</button></div>
      </div>
      <div class="stage" id="stage"><canvas id="cv" aria-label="배합 표면 미리보기"></canvas><div class="floor" id="floor" hidden><div class="plane" id="plane"></div><div class="shade"></div></div><span class="busy" id="busy" hidden>그리는 중…</span></div>
      <div class="avg"><span class="sw" id="avgSw"></span><span><b id="avgT"></b><small id="avgS"></small></span></div>
      <div class="code" id="code"></div>
      <p class="hint" id="vnote"></p>
    </section>
    <section class="card" id="pjCard" hidden></section>
  </div>
  <div class="col">
    <section class="card">
      <h2>배합 <small id="mixN"></small></h2>
      <div id="mixList"></div>
      <div class="chips" style="margin-top:10px" role="group" aria-label="비율">
        <button type="button" class="chip" data-ratio="1">단색</button><button type="button" class="chip" data-ratio="3,1">3:1</button><button type="button" class="chip" data-ratio="2,1,1">2:1:1</button><button type="button" class="chip" data-ratio="1,1,1,1">1:1:1:1</button>
      </div>
      <p class="hint">색을 누르면 배합에 1포씩 더해집니다 (최대 8색 · 색마다 20포). 숫자는 섞는 포대 수입니다.</p>
      <div class="pal" id="pal"></div>
    </section>
    <section class="card">
      <h2>추천 배합 <small>3:1 · 2:1:1 조합 500가지 중</small></h2>
      <div class="recs" id="recs"></div>
      <div style="margin-top:10px"><button type="button" class="btn ghost sm" id="more">다른 추천 보기</button></div>
    </section>
  </div>
</main>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<script>
(function () {
  'use strict';
  var DEMO = window.__SERVER__ || null;

  var TOKEN_KEY = 'nmc_pay_token';

  /* ───────── 색 (홈페이지 · 도면과 같은 NM01 ~ NM22) ───────── */
  var NM = [['NM01', '로즈', '#B81820'], ['NM02', '분홍', '#B44A7C'], ['NM03', '주황', '#D94A1B'], ['NM04', '노랑', '#CDB534'], ['NM05', '겨자', '#C89320'],
    ['NM06', '연두', '#6FAF46'], ['NM07', '녹색', '#2E9B57'], ['NM08', '진녹', '#425242'], ['NM09', '카키', '#709B6C'], ['NM10', '청녹', '#51CDDD'],
    ['NM11', '하늘', '#4ABFF2'], ['NM12', '청색', '#0B3FD1'], ['NM13', '진청', '#1E2C4F'], ['NM14', '연보라', '#C594DE'], ['NM15', '보라', '#5C33A0'],
    ['NM16', '아이보리', '#EFE9DE'], ['NM17', '황토', '#C4854D'], ['NM18', '연갈', '#B99F76'], ['NM19', '적갈', '#8A3324'], ['NM20', '진갈', '#3A2517'],
    ['NM21', '회색', '#8D8B84'], ['NM22', '검정', '#1C1C20']];
  var COL = {};
  NM.forEach(function (c) { COL[c[0]] = { code: c[0], name: c[1], hex: c[2] }; });
  var MAX_COLORS = 8, MAX_PARTS = 20, CHIP_MM = [2, 3];

  /* ───────── 칩 표면 그리기 (홈페이지 lib/granule.ts 를 그대로 옮김) ─────────
     1~4mm 각진 칩을 바인더에 채워 넣은 모양: 칩마다 몸통 그라데이션 · 하이라이트 · 접촉 그림자 · 모서리를 구운 조각을 수만 개 붙이고,
     빛 떨어짐 · 광택 · 가장자리 어둡게 · 미세 입자로 마무리합니다. 회색 입자 사진(texture)은 앱에 없어 빼고 그립니다. */
  function hexToRgb(hex) { var h = hex.replace('#', ''); var n = parseInt(h.length === 3 ? h.replace(/(.)/g, '$1$1') : h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

  function rgbToHsl(r, g, b) {
    var R = r / 255, G = g / 255, B = b / 255, mx = Math.max(R, G, B), mn = Math.min(R, G, B), l = (mx + mn) / 2, h = 0, s = 0;
    if (mx !== mn) {

    mix.forEach(function (m) { var c = hexToRgb(m.hex), w = m.pct / total; r += Math.pow(c[0] / 255, 2.2) * w; g += Math.pow(c[1] / 255, 2.2) * w; b += Math.pow(c[2] / 255, 2.2) * w; });

  function makeCanvas(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

    ctx.save(); ctx.filter = 'blur(' + (r * 0.28).toFixed(2) + 'px)'; ctx.fillStyle = hsl(h, s * 0.9, Math.max(4, l * 0.3), 0.5); path(r * 0.16, r * 0.22); ctx.fill(); ctx.restore();
    var g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);

    ctx.fillStyle = g; path(0, 0); ctx.fill();
    ctx.lineWidth = Math.max(0.6, r * 0.09); ctx.strokeStyle = hsl(h, s * 0.7, l - 26, 0.85); ctx.stroke();
    var ao = ctx.createRadialGradient(cx + r * 0.35, cy + r * 0.4, 0, cx + r * 0.35, cy + r * 0.4, r * 1.1);
    ao.addColorStop(0, 'rgba(0,0,0,0.34)'); ao.addColorStop(1, 'rgba(0,0,0,0)');

    var peak = 0.26, sp = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.34, 0, cx - r * 0.3, cy - r * 0.34, r * 0.46);
    sp.addColorStop(0, 'rgba(255,255,255,' + peak + ')'); sp.addColorStop(0.45, 'rgba(255,255,255,' + peak * 0.22 + ')'); sp.addColorStop(1, 'rgba(255,255,255,0)');

    return cv;
  }
  function buildAtlas(mix, r, finish, rnd) {
    var sprites = [], weights = [], total = mix.reduce(function (s, m) { return s + m.pct; }, 0) || 1;
    mix.forEach(function (m) {
      var c = hexToRgb(m.hex), hs = rgbToHsl(c[0], c[1], c[2]), share = m.pct / total / (TONES_PER_COLOUR * SHAPES_PER_TONE);
      for (var t = 0; t < TONES_PER_COLOUR; t++) {
        var dl = (rnd() - 0.5) * 13, ds = (rnd() - 0.5) * 12, dh = (rnd() - 0.5) * 6;   // 안료 생산 회차마다 조금씩 다른 색
        for (var k = 0; k < SHAPES_PER_TONE; k++) {

    if (!mix.length) return;

    var r = Math.max(1.1, ((o.sizeMm[0] + o.sizeMm[1]) / 4) * o.pxPerMm);

    markPj();
  }
  function loadPj() {
    if (!/^\d{4}-\d{3,}$/.test(pjNo)) return;
    renderPj();
    if (!token) return;
    post({ action: 'stock.call', fn: 'apiPjGet', args: [pjNo] }).then(function (d) {
      S.pj = d.pj; S.pjErr = '';
      var ms = pjMixes();
      if (!qm && ms.length) S.bags = ms[0].mix.slice(0, MAX_COLORS).map(function (x) { return { code: x.code, parts: Math.min(MAX_PARTS, Math.max(1, x.bags)) }; });   // 넓은 배합부터
      renderPj(); changed();
    }, function (e) {
      if (String(e && e.message) === 'auth') { token = ''; try { sessionStorage.removeItem(TOKEN_KEY); } catch (x) {} }
      S.pjErr = errText(e); renderPj();
    });
  }

  /* ───────── 누르기 ───────── */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('button');
    if (!el || el.disabled) return;
    var a;
    if ((a = el.getAttribute('data-view'))) { S.view = a; renderViews(); renderInfo(); draw(); return; }
    if ((a = el.getAttribute('data-cam'))) { S.cam = a; renderViews(); draw(); return; }
    if (el.id === 'fin') { S.finish = S.finish === 'gloss' ? 'matte' : 'gloss'; renderViews(); draw(); return; }
    if (el.id === 'reseed') { S.seed = 1 + Math.floor(Math.random() * 99999); draw(); return; }
    if (el.id === 'more') { S.recs = makeBlends(8); renderRecs(); return; }
    if ((a = el.getAttribute('data-add'))) {
      var b = S.bags.filter(function (x) { return x.code === a; })[0];
      if (b) { if (b.parts < MAX_PARTS) b.parts++; else toast('한 색은 ' + MAX_PARTS + '포까지입니다.'); }
      else if (S.bags.length >= MAX_COLORS) { toast('최대 ' + MAX_COLORS + '색까지 섞을 수 있습니다.'); return; }
      else S.bags.push({ code: a, parts: 1 });
      changed(); return;
    }
    if (el.hasAttribute('data-plus')) { var p1 = S.bags[Number(el.getAttribute('data-plus'))]; if (p1 && p1.parts < MAX_PARTS) { p1.parts++; changed(); } return; }
    if (el.hasAttribute('data-minus')) {
      var i = Number(el.getAttribute('data-minus')), p2 = S.bags[i];
      if (!p2) return;
      if (p2.parts > 1) p2.parts--; else if (S.bags.length > 1) S.bags.splice(i, 1);
      changed(); return;
    }
    if (el.hasAttribute('data-del')) { if (S.bags.length > 1) { S.bags.splice(Number(el.getAttribute('data-del')), 1); changed(); } return; }
    if ((a = el.getAttribute('data-ratio'))) {
      var parts = a.split(',').map(Number), sorted = S.bags.slice().sort(function (x, y) { return y.parts - x.parts; });
      var used = sorted.map(function (x) { return x.code; });
      NM.forEach(function (c) { if (used.length < parts.length && used.indexOf(c[0]) < 0) used.push(c[0]); });   // 색이 모자라면 팔레트 앞에서 채움
      S.bags = parts.map(function (n, k) { return { code: used[k], parts: n }; });
      changed(); return;
    }
    if (el.hasAttribute('data-rec')) { var r = S.recs[Number(el.getAttribute('data-rec'))]; if (r) { S.bags = r.bags.map(function (x) { return { code: x.code, parts: x.parts }; }); changed(); window.scrollTo({ top: 0, behavior: 'smooth' }); toast('「' + r.name + '」 배합을 불러왔습니다.'); } return; }
    if (el.hasAttribute('data-pjm')) {
      var m = pjMixes()[Number(el.getAttribute('data-pjm'))];
      if (m) { S.bags = m.mix.slice(0, MAX_COLORS).map(function (x) { return { code: x.code, parts: Math.min(MAX_PARTS, Math.max(1, x.bags)) }; }); changed(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      return;
    }
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'loginForm') return;
    ev.preventDefault();
    var v = $('pw') ? $('pw').value : '';
    if (!v) return;
    post({ action: 'login', pw: v, dev: devId() }).then(function (r) {
      token = r.token || ''; try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) {}
      S.pjErr = ''; loadPj();
    }, function (e) { S.pjErr = errText(e); renderPj(); });
  });
  var rw = 0;
  window.addEventListener('resize', function () { var w = stageW(); if (Math.abs(w - rw) > 24) { rw = w; draw(); } });

  renderViews(); renderMix(); renderInfo();
  S.recs = makeBlends(8); renderRecs();
  rw = stageW(); draw();
  loadPj();
  if (DEMO) window.__mix = { get S() { return S; }, averageHex: averageHex, pool: POOL, parseMix: parseMix, get rendered() { return rendered; } };
})();
</script>
