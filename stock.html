<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMC 재고</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E5AA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
window.NMC_API = "https://script.google.com/macros/s/AKfycbzg5mbJ9hkPn6Ld7hzNICzRYcsTDM_vVFdWZXV2qAy6QSYJFQVOvREsvE5NjIyy_05M/exec";
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  /* 한 화면에 한 가지 일: 위에 합계, 아래에 색상별 표. 숫자는 오른쪽 정렬·같은 폭 숫자. 상태색(긴급·생산준비)은 강조색과 따로 씁니다. */
  --bg:#EEF1F5;
  --card:#FFFFFF;
  --ink:#121820;
  --ink2:#2E3742;
  --muted:#5A6471;
  --line:#D5DBE3;
  --soft:#EBEEF3;
  --accent:#1E5AA8;
  --accent-strong:#174A8C;
  --accent-soft:#E6EEF9;
  --bad:#B42318;
  --bad-soft:#FDE9E7;
  --warn:#8A5300;
  --warn-soft:#FCF0D6;
  --ok:#1B7A43;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
.wrap{max-width:980px;margin:0 auto;padding:10px 16px 40px}
.wrap.with-bar{padding-bottom:120px}
.num,.big,.tile b,.mx,.mt,.qin,.nums dd,.ckg,.lkg,.rqty{font-variant-numeric:tabular-nums}
.demo{background:#FFF4E5;color:#6E4300;border:1px solid #F2D7A6;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin:0 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}
.brand{font-size:21px;font-weight:800;letter-spacing:-0.01em;line-height:1.3}
.brand span{display:inline-block;background:var(--accent);color:#fff;border-radius:7px;padding:1px 7px;margin-right:6px;font-size:15px;letter-spacing:.06em;vertical-align:2px}
.sub{font-size:14px;color:var(--muted);font-weight:500}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink2);flex-shrink:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:5px;background:#DFE5EC;border-radius:14px;margin:0 0 12px}
@media (max-width:379px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tab{position:relative;min-height:48px;padding:0 2px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:15px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab .dot{display:inline-block;min-width:17px;height:17px;margin-left:3px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;line-height:17px;vertical-align:2px}
.tab[aria-selected="true"]{background:var(--card);color:var(--accent-strong);box-shadow:0 1px 2px rgba(18,24,32,.15)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:0 0 8px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.muted{color:var(--muted);font-size:15px}
.small{font-size:13px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 4px}
.big{font-size:34px;font-weight:800;letter-spacing:-0.01em;line-height:1.25}
.big small{font-size:17px;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--soft);border-radius:10px;padding:9px 12px;min-width:0}
.tile span{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.tile b{display:block;font-size:20px;font-weight:800;line-height:1.35}
.tile small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.datebox{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"],.datebox[data-on="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.datebox{overflow:hidden}
.datebox input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.segbtn{min-height:58px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:19px;font-weight:800;cursor:pointer}
.segbtn.sm{min-height:46px;font-size:16px}
.segbtn[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.daterow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 8px}
.daterow .label{margin:0}
.bigdate{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.text{display:block;width:100%;min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:17px}
.text:focus{border-color:var(--accent);outline:none}
select.text{padding-right:8px}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.ptab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 13px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.ptab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.pgl{flex:0 0 100%;font-size:12px;font-weight:800;color:var(--muted);margin:6px 0 -2px;letter-spacing:.02em}
.pgl:first-child{margin-top:0}
.glabel{font-size:15px;font-weight:800;color:var(--ink);margin:0}
.gsum.next{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.lbreak{list-style:none;margin:12px 0 0;padding:0}
.lbtn{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:12px;min-height:44px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lbtn b{font-size:15px;font-weight:800;flex-shrink:0}
.lbtn span{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:13px;font-weight:800}
.badge:empty{display:none}
.sw{display:inline-block;width:15px;height:15px;border-radius:4px;border:1px solid rgba(18,24,32,.22);flex-shrink:0;vertical-align:-2px;margin-right:7px}
.qlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:28px}
@media (min-width:760px){.qlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:6px 10px;padding:7px 0;border-bottom:1px solid var(--soft)}
.qname{display:flex;align-items:center;min-width:0;cursor:pointer}
.qname b{display:block;font-size:17px;line-height:1.3}
.qname small{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qname small.bad{color:var(--bad)}
.qname small.warn{color:var(--warn)}
.qname small.stk{display:block;margin-top:1px;font-size:13px;color:var(--muted);line-height:1.3}
.qname small.stk .now,.qname small.stk .aft b{display:inline}
.qname small.stk .now{font-size:23px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.qname small.stk .aft{display:block;color:var(--accent-strong);font-weight:700}
.qname small.stk .aft b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.qname small.stk .aft.neg{color:var(--bad)}
.ptot{margin:10px 0 0;font-size:15px;color:var(--muted)}
.ptot b{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.card > .daterow:first-child{margin-top:0}
/* 전체관리: 현황 · 분석 */
.tabs.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.addtitle{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--ink)}
.sumper{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-top:10px}
.sumper h3{margin:0 0 8px;font-size:16px;font-weight:800;color:var(--ink)}
.sumper h3 small{font-size:13px;font-weight:600;color:var(--muted);margin-left:8px}
.sumtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sumtiles > div{background:var(--soft);border-radius:10px;padding:8px 8px 7px;min-width:0}
.sumtiles span{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.sumtiles b{display:block;font-size:19px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;word-break:keep-all;color:var(--ink)}
.sumtiles b.money{font-size:16px}
.sumtiles b small{font-size:12px;font-weight:700;color:var(--muted);margin-left:1px}
.sumtiles i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.optseg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.optseg button{min-height:40px;padding:0 14px;border:2px solid var(--line);border-radius:20px;background:var(--card);font-size:15px;font-weight:800;color:var(--ink2);cursor:pointer}
.optseg button[aria-checked="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.optseg.big{margin:0}
.optseg.big button{min-height:44px;flex:1 1 auto}
.anarange{margin:-2px 2px 0;font-size:13.5px;color:var(--muted)}
.tent{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:10px}
.tent th,.tent td{padding:6px 3px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
.tent th[scope="row"]{white-space:normal;word-break:keep-all;line-height:1.3}
.tent thead th{font-size:12.5px;line-height:1.25;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);vertical-align:bottom}
.tent thead th small{font-size:11px;font-weight:700}
.tent thead th.cur{color:var(--accent-strong)}
.tent thead th:first-child,.tent th[scope="row"]{text-align:left}
.tent th[scope="row"]{font-weight:600;color:var(--ink2)}
.tent th[scope="row"] small{font-size:11.5px;color:var(--muted);font-weight:600}
.tent .tprod th,.tent .tprod td{background:var(--soft);font-weight:800;color:var(--ink)}
.tent .tcol{padding-left:8px}
.tent .tcol .sw{width:12px;height:12px;margin-right:4px;vertical-align:-1px}
.tent tfoot th,.tent tfoot td{font-weight:800;color:var(--ink);border-top:2px solid var(--line);border-bottom:0}
.tent td.neg{color:var(--bad)}
.anasum{margin:0 0 6px;font-size:15px;color:var(--ink2)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;column-gap:8px;padding:8px 0 7px;border-bottom:1px solid var(--soft)}
.rank li:last-child{border-bottom:0}
.rank .rk{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rank .rn{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:15px}
.rank .rn > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rv{text-align:right;white-space:nowrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .rv b{font-size:16px;color:var(--ink)}
.rank .rv small{display:block;font-size:12px}
.rank .rbar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.rank .rbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:10px 0;border-bottom:1px solid var(--soft)}
.plist .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0}
.plist .pn{font-size:17px;font-weight:800}
.plist .pp{font-size:14px;color:var(--muted);white-space:nowrap}
.plist .pp b{font-size:18px;color:var(--ink)}
.plist .pp.neg b,.plist b.neg,.ptotal b.neg{color:var(--bad)}
.plist .pd{margin:4px 0 0;font-size:14px;line-height:1.55;color:var(--ink2);word-break:keep-all}
.plist .pd.warnline{color:var(--warn)}
.hint.mt0{margin-top:0}
.plist .pd.dim{color:var(--muted);font-size:13px}
.ptotal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin:10px 0 0;padding-top:10px;border-top:2px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.ptotal dt{margin:0;color:var(--ink2)}
.ptotal dt small{font-size:12px;color:var(--muted);margin-left:4px}
.ptotal dd{margin:0;text-align:right;font-weight:700;white-space:nowrap}
.ptotal .sub{font-weight:800;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--soft)}
.ptotal .fin{font-size:17px;font-weight:800;color:var(--ink)}
.ptotal dd.neg{color:var(--bad)}
.tips .sub{margin:6px 0 0;padding-left:16px;list-style:disc}
.tips .sub li{margin:0 0 4px;font-size:14px;line-height:1.5}
.tips b.neg{color:var(--bad)}
.tips{margin:0;padding-left:20px}
.tips li{margin:0 0 12px;font-size:15px;line-height:1.65;color:var(--ink2);word-break:keep-all}
.tips li:last-child{margin-bottom:4px}
.tips li b{color:var(--ink)}
.trend{display:block;width:100%;height:auto;margin-top:6px}
.trend .bm{fill:#9DB3CF}
.trend .bo{fill:var(--accent)}
.trend .ax{stroke:var(--line);stroke-width:1}
.trend text{font-size:11px;fill:var(--muted)}
.calleg .lg.tm::before{background:#9DB3CF}
.calleg .lg.to::before{background:var(--accent)}
.calback{padding:10px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 2px}
.calhead h2{margin:0;font-size:21px;font-weight:800}
.calhead .ghost{min-width:48px;min-height:44px}
.calsum{margin:0 0 10px;font-size:14px;color:var(--muted);text-align:center;word-break:keep-all}
.calsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);padding:2px 0}
.cw.sun,.cd.sun .dn{color:#C62828}
.cw.sat,.cd.sat .dn{color:#1E5AA8}
.cd{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;min-height:64px;padding:4px 2px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit}
.cd.empty{border:0;background:transparent;cursor:default;min-height:0}
.cd .dn{font-size:13px;font-weight:800;line-height:1.2}
.cd .co,.cd .cp{display:block;font-size:11px;font-weight:800;line-height:1.3;letter-spacing:-0.02em;border-radius:5px;padding:0 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cd .co{background:#E3E8EF;color:var(--ink)}
.cd .cp{border:1px dashed var(--accent);color:var(--accent-strong)}
.cd .cx{display:block;font-size:10.5px;font-weight:800;color:var(--warn);line-height:1.2}
.cd.short{border-color:var(--bad);background:var(--bad-soft)}
.cd.short .cp{border-color:var(--bad);color:var(--bad);background:#fff}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.sel{border-color:var(--accent);background:var(--accent-soft)}
.cd.sel.short{background:var(--bad-soft)}
.cd:focus-visible{outline:3px solid #F4B400;outline-offset:1px}
.calleg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.calleg .lg::before{content:'';display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;box-sizing:border-box}
.calleg .lg.co::before{background:#E3E8EF}
.calleg .lg.cp::before{border:1px dashed var(--accent)}
.calleg .lg.cs::before{background:var(--bad-soft);border:1px solid var(--bad)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 4px}
.dayhead h2{margin:0;font-size:22px;font-weight:800}
.dtag{font-size:13px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
.dsec{margin:14px 0 4px;font-size:15px;font-weight:800;color:var(--ink2)}
.dlist{list-style:none;margin:0;padding:0}
.drow{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--soft)}
.dmain{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;padding:10px 2px;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.dmain .dn2{display:flex;align-items:center;gap:8px;min-width:0}
.dmain .dn2 b{display:block;font-size:15px}
.dmain .dn2 small{display:block;color:var(--muted);font-size:13px;word-break:keep-all}
.dmain .dq{text-align:right;white-space:nowrap}
.dmain .dq b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.dmain .dq small{display:block;font-size:12.5px;color:var(--muted)}
.dmain .dq small.bad{color:var(--bad);font-weight:800}
.dmain .dq small.ok{color:var(--ok);font-weight:700}
.dcf{flex-shrink:0;min-height:40px;padding:0 12px}
.dadd{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:14px}
.gate{color:var(--ink2);word-break:keep-all}
.qbox{display:flex;align-items:center;gap:6px}
.qin{width:100%;min-width:0;height:48px;border:2px solid var(--line);border-radius:10px;padding:0 10px;font-size:19px;font-weight:800;text-align:right;background:var(--card)}
.qin:focus{border-color:var(--accent);outline:none}
.qin.filled{border-color:var(--accent);background:var(--accent-soft)}
.unit{font-size:14px;color:var(--muted);font-weight:700}
.qwarn{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--bad);line-height:1.35}
.qwarn:empty{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.98);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(18,24,32,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:948px;margin:0 auto;display:flex;align-items:center;gap:10px}
.barinfo{flex:1;min-width:0;font-size:15px;color:var(--ink2)}
.barinfo b{font-size:18px;font-weight:800;color:var(--ink)}
.primary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}

<script>

   *  stock.html           = 생산량 입력 (관리자 열쇠가 있어도 쓰지 않음)
   *  stock.html?view=out  = 출고량: 달력 (날짜마다 출고·출고예정, 날짜를 눌러 넣기·고치기·지우기·확정, 예정은 그날 재고가 남는지 부족한지)
   *  stock.html?view=in   = 반입량: 반입 넣기
   *  stock.html?view=all  = 전체관리 (예전 주소 ?admin=1 도 여기로): 입력 없이 보고 분석하는 곳
   *        현황(이때까지 생산·출고·매출, 10일 단위 색상별) · 분석(많이 나간 색상·매출·원가·이익·추이·이윤 늘릴 점) · 현재고 · 예정 · 기록 */
  var VIEW = (function () {
    var m = /[?&]view=(out|in|all)(?:&|$)/.exec(location.search);
    if (m) return m[1];
    return /[?&]admin=1(?:&|$)/.test(location.search) ? 'all' : 'prod';
  })();
  var ADMIN_VIEW = VIEW !== 'prod';
  var QUICK = VIEW === 'out' || VIEW === 'in';
  var VIEW_NAME = { prod: '생산량 입력', out: '출고량', 'in': '반입량', all: '전체관리' }[VIEW];

  /* 화면 표시용 색 (실제 제품 색과 똑같지는 않습니다) */
  var SWATCH = {
    '검정': '#1F1F1F', '겨자': '#C9A43B', '노랑': '#F4C430', '녹색': '#2E8540', '로즈': '#B3123A',

  /* ───────── 전체관리: 현황 · 분석 (2026-11-15 지시) ─────────
     현황: 이때까지(이번 달·올해·기록 전체) 생산·출고·매출, 10일 단위(1~10일·11~20일·21일~말일)로 어느 색상을 얼마나 생산·출고·반입했는지.
     분석: 많이 나간 색상, 매출, 만드는 데 드는 돈과 이익(손익 화면과 같은 식의 추정), 거래처, 달마다 추이, 이윤을 늘릴 점.
     자료: 서버 apiStats(해) — 달·10일 구간·구분·품목별 합계 (관리자 열쇠로만).
     원가·기본 단가·고정비는 손익 서버의 설정에서 관리자 열쇠로 받습니다. 이 파일에는 회사 숫자를 적지 않습니다.
     매출 규칙(손익 화면과 같음): 남명(자사 시공) 출고는 매출에서 뺌. 단가 = 기록 단가 → 품목 기준 단가 → 손익 기본 단가(추정). */
  var TIRE_KEYS = { s57: 1, s23: 1, s12: 1, mibun: 1, cord: 1, bead: 1 };
  var PERIODS = [['m', '이번 달'], ['3m', '최근 3개월'], ['y', '올해'], ['all', '전체']];
  function num0(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function pct(v) { return Math.round(num0(v) * 1000) / 10 + '%'; }
  function sum3(v) { return v[0] + v[1] + v[2]; }
  function curYm() { return S.today.slice(0, 7); }
  function daysIn(ym) { return new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate(); }
  /* 그 달 중 센 날의 비율: 지난 달은 1, 이번 달은 오늘까지 (고정비·한 달 평균에 씀) */
  function monFrac(ym) { return ym === curYm() ? Number(S.today.slice(8, 10)) / daysIn(ym) : 1; }
  function ymRange(a, b) { var out = []; for (var ym = a; ym <= b; ym = addMonths(ym, 1)) out.push(ym); return out; }
  function kgTxt(n) { return fmt(Math.round(n)) + '<small>kg</small>'; }
  function wonTxt(n) { return n < 0 ? '-' + won(-n) : won(n); }
  /* 매출 가운데 추정 단가(기준·기본 단가)로 셈한 몫 */
  function estNote(est, rev) {

    if (p >= 100 && est < rev) p = 99;
    return '추정 단가 ' + Math.max(1, p) + '%';
  }
  function man(v) { return fmt(Math.round(v / 10000)); }
  function shortYm(ym) { return (ym.slice(0, 4) === S.today.slice(0, 4) ? '' : ym.slice(2, 4) + '년 ') + Number(ym.slice(5, 7)) + '월'; }
  function redrawStats() { if ((S.tab === 'sum' || S.tab === 'ana') && !S.sheet && !S.allAdd) render(); }

  function ensureStats(y) {
    if (!S.stats) { S.stats = {}; S.sLoading = {}; S.sErr = {}; }
    if (S.stats[y] || S.sLoading[y] || S.sErr[y]) return;
    var L = S.sLoading, E = S.sErr, gen = S.gen;
    L[y] = true;
    call('apiStats', y).then(function (r) {
      L[y] = false;
      if (gen !== S.gen) return;
      S.stats[y] = r;
      redrawStats();
    }, function (e) {
      L[y] = false;
      if (gen !== S.gen) return;
      if (isAuth(e)) { lockDown(ERR.expired); return; }
      E[y] = errText(e) || '불러오지 못했습니다';
      redrawStats();
    });
  }
  /* 손익 설정(원가표·기본 단가·고정비)과 손익에 저장된 달(급여). 관리자 열쇠로 손익 서버에서 */
  function ensurePnl() {

    postAction({ action: 'pnl.call', fn: 'init', token: getToken() }).then(function (r) {
      S.pnlLoading = false;

      else S.pnlErr = true;

  }
  /* 기초를 뺀 첫 기록 달. 이번 해 묶음을 받아야 압니다 (받기 전 null) */
  function firstYm() {
    var y = S.today.slice(0, 4);
    ensureStats(y);
    var st = S.stats[y];
    return st ? (st.first ? st.first.slice(0, 7) : curYm()) : null;
  }
  function firstDay() { var st = S.stats && S.stats[S.today.slice(0, 4)]; return st && st.first ? st.first : S.today; }
  /* 고른 달들의 묶음 줄 [달, 구간, 구분, 제품, 색상, kg, 기록 단가 금액, 그 kg, 남명 kg]. 아직 못 받은 해가 있으면 null */
  function rowsOf(yms) {
    var ys = {}, want = {}, ok = true, out = [];
    yms.forEach(function (ym) { ys[ym.slice(0, 4)] = 1; want[ym] = 1; });
    Object.keys(ys).forEach(function (y) { ensureStats(y); if (!S.stats[y]) ok = false; });
    if (!ok) return null;
    Object.keys(ys).forEach(function (y) { S.stats[y].rows.forEach(function (r) { if (want[r[0]]) out.push(r); }); });
    return out;
  }
  function custOf(yms) {
    var want = {}, out = {};
    yms.forEach(function (ym) { want[ym] = 1; });
    Object.keys(S.stats || {}).forEach(function (y) {
      if (!S.stats[y]) return;
      S.stats[y].cust.forEach(function (c) {
        if (!want[c[0]]) return;
        var o = out[c[1]] || (out[c[1]] = { name: c[1], kg: 0, revK: 0, kgK: 0 });
        o.kg += c[2]; o.revK += c[3]; o.kgK += c[4];
      });
    });
    return out;
  }
  function statsErr() { var e = S.sErr || {}, k = Object.keys(e).filter(function (y) { return e[y]; })[0]; return k ? e[k] : ''; }
  function statsWait() {
    var e = statsErr();
    return '<section class="card"><p class="hint">' + (e ? esc(e) : '불러오는 중…') + '</p>' +
      (e ? '<button type="button" class="ghost wide mt8" data-act="statsretry">다시 불러오기</button>' : '') + '</section>';
  }
  /* 손익 품목 (nm·lok·s57…). 서버가 손익 화면과 같은 규칙으로 정해 보냅니다 */
  function lkOf(k) {
    for (var y in (S.stats || {})) if (S.stats[y] && S.stats[y].keys && Object.prototype.hasOwnProperty.call(S.stats[y].keys, k)) return S.stats[y].keys[k];
    return '';
  }
  function isOwn(c) { return String(c || '').replace(/\s+/g, '') === OWN; }
  /* 단가 기록이 없는 판매에 쓰는 단가: 품목 기준 단가 → 손익 기본 단가 */
  function refOf(k) {
    var it = S.byKey[k];
    if (it && typeof it.price === 'number' && it.price > 0) return { p: it.price, src: '기준 단가' };
    var lk = lkOf(k), p = S.pnl && lk && S.pnl.set.prices ? num0(S.pnl.set.prices[lk]) : 0;
    return p > 0 ? { p: p, src: '손익 기본 단가' } : null;
  }
  function refPrice(k) { var r = refOf(k); return r ? r.p : null; }
  /* 출고 줄 → 판매(남명 뺌) kg·매출. est = 단가 기록이 없어 기준·기본 단가로 셈한 몫, none = 단가를 전혀 모르는 kg */
  function saleOf(r) {
    var sold = r[5] - r[8], rest = sold - r[7], p = rest > 0 ? refPrice(r[3] + '|' + r[4]) : null, e = p != null ? rest * p : 0;
    return { sold: sold, own: r[8], rev: r[6] + e, est: e, none: rest > 0 && p == null ? rest : 0 };
  }
  /* 재료·운송비 (손익 화면 계산과 같은 식). 칼라칩(nm·lok): 판매 kg × kg당 원료비 + 매출 × 운송비율. 폐타이어 품목: 매출 × 원가율. 모르는 품목 null */
  function matCost(lk, kg, rev) {
    var st = S.pnl && S.pnl.set;
    if (!st) return null;
    if (lk === 'nm') return kg * num0(st.matNM) + rev * num0(st.epdmTr);
    if (lk === 'lok') return kg * num0(st.matLOK) + rev * num0(st.epdmTr);
    if (TIRE_KEYS[lk]) return rev * num0(st.tireRate);
    return null;
  }
  function matPerKg(lk) { var st = S.pnl && S.pnl.set; return !st ? null : lk === 'nm' ? num0(st.matNM) : lk === 'lok' ? num0(st.matLOK) : null; }
  /* 그 달 고정비 (손익 화면과 같음: 그 달 손익에 급여가 저장돼 있으면 인건비 = 급여 + 그 밖, 아니면 설정값). 이번 달은 오늘까지 날 수만큼. 이자·원금 뺌 */
  function fixedOf(ym) {
    var st = S.pnl.set, fx = st.fixed || {}, F = 0;
    Object.keys(fx).forEach(function (k) { if (k !== 'labor') F += num0(fx[k]); });
    var fl = num0(fx.labor), rec = S.pnl.months && S.pnl.months[ym], pay = rec && rec.pay, lab = fl;
    if (pay && num0(pay.gross) > 0) lab = num0(pay.gross) + (st.laborOther == null || st.laborOther === '' ? Math.max(0, fl - num0(pay.gross)) : num0(st.laborOther));
    return (F + lab) * monFrac(ym);
  }

  /* 기간 자료 묶기: 품목별·제품별 판매·매출·원가·이익 */
  function anaData(yms, rows) {
    var it = {}, D = { yms: yms, units: 0, out: 0, sold: 0, own: 0, rev: 0, est: 0, none: 0, revK: 0, kgK: 0, made: 0 };
    yms.forEach(function (ym) { D.units += monFrac(ym); });
    rows.forEach(function (r) {
      var k = r[3] + '|' + r[4];
      var o = it[k] || (it[k] = { key: k, p: r[3], c: r[4], lk: lkOf(k), out: 0, sold: 0, own: 0, rev: 0, est: 0, none: 0, revK: 0, kgK: 0, made: 0 });
      if (r[2] === '생산') { o.made += r[5]; D.made += r[5]; return; }
      if (r[2] !== '출고') return;
      var v = saleOf(r);
      o.out += r[5]; o.sold += v.sold; o.own += v.own; o.rev += v.rev; o.est += v.est; o.none += v.none; o.revK += r[6]; o.kgK += r[7];
      D.out += r[5]; D.sold += v.sold; D.own += v.own; D.rev += v.rev; D.est += v.est; D.none += v.none; D.revK += r[6]; D.kgK += r[7];
    });
    D.items = Object.keys(it).map(function (k) { return it[k]; });
    D.it = it;
    D.cost = !!(S.pnl && S.pnl.set);
    if (!D.cost) return D;
    var st = S.pnl.set, share = Math.min(1, Math.max(0, num0(st.epdmShare)));
    D.F = 0;
    yms.forEach(function (ym) { D.F += fixedOf(ym); });
    D.FE = D.F * share; D.FT = D.F - D.FE;
    D.kgE = 0; D.kgT = 0; D.kgNM = 0; D.kgLOK = 0; D.revE = 0; D.unknown = [];
    D.items.forEach(function (o) {
      o.grp = o.lk === 'nm' || o.lk === 'lok' ? 'E' : TIRE_KEYS[o.lk] ? 'T' : '';
      o.mat = o.sold > 0 ? matCost(o.lk, o.sold, o.rev) : 0;
      if (o.grp === 'E') { D.kgE += o.sold; D.revE += o.rev; if (o.lk === 'nm') D.kgNM += o.sold; else D.kgLOK += o.sold; }
      else if (o.grp === 'T') D.kgT += o.sold;
      else if (o.sold > 0) D.unknown.push(o);
    });
    var pr = {};
    D.items.forEach(function (o) {
      o.fix = o.grp === 'E' ? (D.kgE ? D.FE * o.sold / D.kgE : 0) : o.grp === 'T' ? (D.kgT ? D.FT * o.sold / D.kgT : 0) : 0;
      if (o.sold <= 0 || !o.grp) return;
      var q = pr[o.p] || (pr[o.p] = { p: o.p, sold: 0, own: 0, rev: 0, est: 0, none: 0, mat: 0, fix: 0 });
      q.sold += o.sold; q.rev += o.rev; q.est += o.est; q.none += o.none; q.mat += o.mat; q.fix += o.fix;
    });
    D.items.forEach(function (o) { if (o.own && pr[o.p]) pr[o.p].own += o.own; });
    D.prods = Object.keys(pr).map(function (k) {
      var q = pr[k];
      q.contrib = q.rev - q.mat;
      q.cKg = q.contrib / q.sold;
      q.profit = q.contrib - q.fix;
      q.perKg = q.profit / q.sold;
      return q;
    }).sort(function (a, b) { return b.contrib - a.contrib; });
    D.mat = 0;
    D.prods.forEach(function (q) { D.mat += q.mat; });
    D.unalloc = (D.kgE ? 0 : D.FE) + (D.kgT ? 0 : D.FT);
    D.revKnownCost = 0;
    D.prods.forEach(function (q) { D.revKnownCost += q.rev; });
    D.contrib = D.revKnownCost - D.mat;
    D.profit = D.contrib - D.F;
    D.eMargin = D.kgE ? (D.revE * (1 - num0(st.epdmTr)) - D.kgNM * num0(st.matNM) - D.kgLOK * num0(st.matLOK)) / D.kgE : null;
    return D;
  }

  /* ── 현황 ── */
  function viewSum() {
    if (S.money) ensurePnl();
    var cur = curYm(), y = cur.slice(0, 4), fy = firstYm();
    if (!fy) return '<div class="stack">' + statsWait() + '</div>';
    if (S.money && !S.pnl && !S.pnlErr) return '<div class="stack"><section class="card"><p class="hint">불러오는 중…</p></section></div>';
    if (!S.sumYm || S.sumYm > cur || S.sumYm < fy) S.sumYm = cur;
    if (!S.sumType) S.sumType = '출고';
    var cands = [['이번 달', [cur], fmtYm(cur) + ' 1일~' + Number(S.today.slice(8, 10)) + '일'],
      ['올해', ymRange(fy > y + '-01' ? fy : y + '-01', cur), fy > y + '-01' ? y + '년 · ' + fmtDate(firstDay()) + '부터' : y + '년'],
      ['전체', ymRange(fy, cur), fmtDate(firstDay()) + '부터']];
    var shown = [], last = '';
    cands.forEach(function (c) { var sig = c[1].join(','); if (sig !== last) { shown.push(c); last = sig; } });
    var allRows = rowsOf(ymRange(fy, cur));
    if (!allRows) return '<div class="stack">' + statsWait() + '</div>';
    var h = '<div class="stack"><section class="card"><h2 class="label">이때까지 · ' + esc(fmtDate(S.today)) + ' 기준</h2>';
    shown.forEach(function (c) {
      var want = {}, t = { made: 0, out: 0, ban: 0, own: 0, rev: 0, est: 0, none: 0 };
      c[1].forEach(function (ym) { want[ym] = 1; });
      allRows.forEach(function (r) {
        if (!want[r[0]]) return;
        if (r[2] === '생산') t.made += r[5];
        else if (r[2] === '반입') t.ban += r[5];
        else if (r[2] === '출고') { var v = saleOf(r); t.out += r[5]; t.own += v.own; t.rev += v.rev; t.est += v.est; t.none += v.none; }
      });
      h += '<div class="sumper"><h3>' + esc(c[0]) + '<small>' + esc(c[2]) + '</small></h3><div class="sumtiles">' +
        '<div><span>생산</span><b>' + kgTxt(t.made) + '</b>' + (t.ban ? '<i>+ 반입 ' + fmt(t.ban) + ' kg</i>' : '') + '</div>' +
        '<div><span>출고</span><b>' + kgTxt(t.out) + '</b>' + (t.own ? '<i>남명 ' + fmt(t.own) + ' kg 포함</i>' : '') + '</div>' +
        (S.money ? '<div><span>매출</span><b class="money">' + esc(won(t.rev)) + '</b>' + (t.est || t.none ? '<i>' + [estNote(t.est, t.rev), t.none ? '단가 모르는 ' + fmt(t.none) + ' kg 뺌' : ''].filter(Boolean).join(' · ') + '</i>' : '') + '</div>' : '') +
        '</div></div>';
    });
    if (shown.length === 1 && fy === cur) h += '<p class="note">기록은 ' + esc(fmtDate(firstDay())) + '부터 있어 이번 달이 곧 전체입니다.</p>';
    if (S.money) h += '<p class="note">매출 = 판매 kg × 단가. 남명(자사 시공)으로 나간 것은 판매가 아니라서 뺐습니다(손익 화면과 같음). 단가를 적지 않은 출고는 품목 기준 단가, 없으면 손익 설정의 기본 단가로 계산한 추정입니다.' +
      (S.pnlErr ? ' 손익 설정을 불러오지 못해 기본 단가는 쓰지 못했습니다.' : S.pnl ? '' : ' (손익 설정 불러오는 중)') + '</p>';
    h += '</section>';

    // 10일 단위
    var ym = S.sumYm, t = S.sumType, rows = rowsOf([ym]);
    h += '<section class="card"><div class="calhead"><button type="button" class="ghost sm" data-act="sumprev"' + (ym > fy ? '' : ' disabled') + ' aria-label="이전 달">◀</button>' +
      '<h2>' + esc(fmtYm(ym)) + '</h2><button type="button" class="ghost sm" data-act="sumnext"' + (ym < cur ? '' : ' disabled') + ' aria-label="다음 달">▶</button></div>' +
      '<p class="calsum">10일 단위 · 어느 색상이 얼마나</p>';
    h += '<div class="optseg" role="radiogroup" aria-label="구분">' + ['출고', '생산', '반입'].map(function (x) {
      return '<button type="button" role="radio" aria-checked="' + (t === x) + '" data-act="sumtype" data-v="' + x + '">' + x + '</button>';
    }).join('') + '</div>';
    if (!rows) h += '<p class="hint">불러오는 중…</p>';
    else h += tenDayTable(ym, t, rows);
    return h + '</section></div>';
  }
  function tenDayTable(ym, t, rows) {
    var per = {}, ptot = {}, b = [0, 0, 0];
    rows.forEach(function (r) {
      if (r[2] !== t) return;
      var k = r[3] + '|' + r[4];
      var o = per[k] || (per[k] = { p: r[3], c: r[4], v: [0, 0, 0] });
      o.v[r[1]] += r[5];
      b[r[1]] += r[5];
      (ptot[r[3]] || (ptot[r[3]] = [0, 0, 0]))[r[1]] += r[5];
    });
    var order = S.prods.filter(function (p) { return ptot[p]; }).concat(Object.keys(ptot).filter(function (p) { return S.prods.indexOf(p) < 0; }));
    if (!order.length) return '<p class="hint">' + esc(fmtYm(ym)) + '에는 ' + t + ' 기록이 없습니다.</p>';
    var last = daysIn(ym), isCur = ym === curYm(), td = Number(S.today.slice(8, 10));
    var heads = [[1, 10], [11, 20], [21, last]].map(function (x, i) {
      var live = isCur && td >= x[0] && td <= x[1] && td < x[1];
      return '<th scope="col"' + (live ? ' class="cur"' : '') + '>' + x[0] + '~' + x[1] + '일' + (live ? '<br><small>' + td + '일까지</small>' : '') + '</th>';
    }).join('');
    var cell = function (x) { return '<td>' + (x ? fmt(x) : '<span class="z">–</span>') + '</td>'; };
    var h = '<div class="tscroll"><table class="tent"><thead><tr><th scope="col">제품 · 색상</th>' + heads + '<th scope="col">합계</th></tr></thead><tbody>';
    order.forEach(function (p) {
      var pt = ptot[p];
      h += '<tr class="tprod"><th scope="row">' + ptxt(p) + '</th>' + pt.map(cell).join('') + '<td>' + fmt(sum3(pt)) + '</td></tr>';
      Object.keys(per).filter(function (k) { return per[k].p === p; }).sort(function (a, c) { return sum3(per[c].v) - sum3(per[a].v); }).forEach(function (k) {
        var o = per[k];
        h += '<tr><th scope="row" class="tcol">' + sw(o.c, o.p) + esc(o.c) + '</th>' + o.v.map(cell).join('') + '<td><b>' + fmt(sum3(o.v)) + '</b></td></tr>';
      });
    });
    h += '</tbody><tfoot><tr><th scope="row">모두</th>' + b.map(cell).join('') + '<td>' + fmt(sum3(b)) + '</td></tr></tfoot></table></div>';
    return h + '<p class="note">단위 kg. 제품마다 그 달 ' + t + '이 많은 색상부터 적었습니다.' + (t === '출고' ? ' 남명(자사 시공) 출고도 들어 있습니다.' : '') + '</p>';
  }

  /* ── 분석 ── */

  function topCard(D) {

    var h = '<section class="card"><h2 class="label">많이 나간 색상</h2>';

      (S.money ? ' · 매출 <b>' + esc(won(D.rev)) + '</b>' + (D.est ? ' (' + estNote(D.est, D.rev) + ')' : '') : '') + '</p><ol class="rank">';
    top.slice(0, 10).forEach(function (o, i) {

        '<span class="rv"><b>' + fmt(o.out) + '</b> kg<small>' + Math.round(o.out / D.out * 100) + '%' + (S.money && o.rev ? ' · ' + esc(won(o.rev)) : '') + '</small></span>' +

    }

  }

  function profitCard(D) {

        (q.none ? '<p class="pd warnline">단가를 모르는 ' + fmt(q.none) + ' kg은 매출에 넣지 못했습니다.</p>' : '') + '</li>';
    });
    var per = D.yms.length === 1 ? shortYm(D.yms[0]) : shortYm(D.yms[0]) + '~' + shortYm(D.yms[D.yms.length - 1]);
    h += '</ul><dl class="ptotal">' +
      '<dt>매출</dt><dd>' + esc(won(D.revKnownCost)) + '</dd>' +

      '<dt class="sub">재료비 빼고 남는 돈</dt><dd class="sub">' + esc(wonTxt(D.contrib)) + '</dd>' +

      '<dt class="fin">이익</dt><dd class="fin' + (D.profit < 0 ? ' neg' : '') + '">' + esc(wonTxt(D.profit)) + '</dd></dl>';
    if (D.unalloc > 0) h += '<p class="note">이 기간 판매가 없는 쪽(칼라칩 또는 폐타이어)의 고정비 ' + esc(won(D.unalloc)) + '도 고정비에 들어 있습니다.</p>';

    var st = S.pnl.set;

  }

  function custCard2(D) {

        '<span class="rv"><b>' + fmt(c.kg) + '</b> kg<small>' + Math.round(c.kg / D.out * 100) + '%' + (S.money && c.kgK ? ' · 단가 적힌 ' + fmt(c.kgK) + ' kg ' + esc(won(c.revK)) : '') + '</small></span>' +

  /* 달마다 생산·출고·매출·이익 (기록이 있는 달, 최근 12달) */
  function trendCard(fy) {
    var cur = curYm(), a = addMonths(cur, -11);
    if (a < fy) a = fy;
    var yms = ymRange(a, cur), rows = rowsOf(yms);
    var h = '<section class="card"><h2 class="label">달마다 추이</h2>';
    if (!rows) return h + '<p class="hint">불러오는 중…</p></section>';
    var M = yms.map(function (ym) { return { ym: ym, made: 0, out: 0, rows: [] }; }), idx = {};
    yms.forEach(function (ym, i) { idx[ym] = i; });
    rows.forEach(function (r) {
      var m = M[idx[r[0]]];
      if (r[2] === '생산') m.made += r[5];
      else if (r[2] === '출고') m.out += r[5];
      m.rows.push(r);
    });
    var cost = S.money && S.pnl;
    M.forEach(function (m) {
      if (!S.money) return;
      var D = anaData([m.ym], m.rows);
      m.rev = D.rev; m.est = D.est;
      if (cost) m.profit = D.profit;
    });
    if (M.length >= 2) {
      var mx = 1;
      M.forEach(function (m) { mx = Math.max(mx, m.made, m.out); });
      var n = M.length, W = 340, H = 150, top = 8, bot = 22, gw = W / Math.max(n, 6), bw = Math.min(14, gw / 3);
      var svg = '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="달마다 생산과 출고">';
      M.forEach(function (m, k) {
        var x = k * gw + gw / 2, hm = (H - top - bot) * m.made / mx, ho = (H - top - bot) * m.out / mx;
        svg += '<rect x="' + (x - bw - 1).toFixed(1) + '" y="' + (H - bot - hm).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hm.toFixed(1) + '" rx="2" class="bm"><title>' + esc(fmtYm(m.ym)) + ' 생산 ' + fmt(m.made) + ' kg</title></rect>' +
          '<rect x="' + (x + 1).toFixed(1) + '" y="' + (H - bot - ho).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + ho.toFixed(1) + '" rx="2" class="bo"><title>' + esc(fmtYm(m.ym)) + ' 출고 ' + fmt(m.out) + ' kg</title></rect>' +
          '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + Number(m.ym.slice(5)) + '월</text>';
      });
      svg += '<line x1="0" x2="' + W + '" y1="' + (H - bot) + '" y2="' + (H - bot) + '" class="ax"/></svg>';
      h += svg + '<p class="calleg"><span class="lg tm">생산</span><span class="lg to">출고</span></p>';
    }
    h += '<div class="tscroll"><table class="tent trendt"><thead><tr><th scope="col">달</th><th scope="col">생산<br><small>kg</small></th><th scope="col">출고<br><small>kg</small></th>' +
      (S.money ? '<th scope="col">매출<br><small>만원</small></th>' + (cost ? '<th scope="col">이익<br><small>만원</small></th>' : '') : '') + '</tr></thead><tbody>';
    M.slice().reverse().forEach(function (m) {
      h += '<tr><th scope="row">' + esc(shortYm(m.ym)) + (m.ym === cur ? '<br><small>' + Number(S.today.slice(8, 10)) + '일까지</small>' : '') + '</th><td>' + fmt(m.made) + '</td><td>' + fmt(m.out) + '</td>' +
        (S.money ? '<td>' + man(m.rev) + '</td>' + (cost ? '<td class="' + (m.profit < 0 ? 'neg' : '') + '">' + man(m.profit) + '</td>' : '') : '') + '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="note">' + (S.money ? '매출·이익은 위 계산과 같은 추정입니다(이익은 고정비까지 뺀 것). ' : '') + (M.length < 2 ? '기록이 ' + esc(fmtYm(fy)) + '부터라 달마다 비교 그래프는 다음 달부터 보입니다.' : '') + '</p>';
    return h + '</section>';
  }

  /* 이윤을 늘리려면: 기록·설정에서 바로 나오는 사실만 */
  function tipsCard(D) {
    var tips = [], st = D.cost ? S.pnl.set : null;
    // 1) 단가 기록
    if (S.money && D.sold > 0) {
      var kr = D.kgK / D.sold;
      if (kr < 0.8) tips.push('<b>단가 기록</b>: 판매 ' + fmt(D.sold) + ' kg 가운데 단가가 적힌 것은 ' + fmt(D.kgK) + ' kg(' + Math.round(kr * 100) + '%)입니다. 나머지 매출은 기준·기본 단가로 셈한 추정이라 실제 받은 돈과 다를 수 있습니다. 출고를 넣을 때 단가를 같이 넣으면 이 분석이 실제 금액이 됩니다.');
    }
    // 2) 제품별 kg당 이익
    if (st) {
      var ranked = D.prods.filter(function (q) { return q.sold >= 100; }).slice().sort(function (a, b) { return b.cKg - a.cKg; });
      if (ranked.length >= 2) {
        /* 바꿔 팔 수 있는 것은 같은 설비로 만드는 칼라칩끼리 (폐타이어 품목은 따로 나오는 것이라 비교에서 뺌) */
        var chips = ranked.filter(function (q) { return D.items.some(function (o) { return o.p === q.p && o.grp === 'E'; }); });
        var t2 = '<b>제품마다 kg당 남는 돈</b> (재료·운송비만 뺀 것, 추정): ' + ranked.map(function (q) { return ptxt(q.p) + ' ' + fmt(q.cKg) + '원'; }).join(' · ') + '.';
        if (chips.length >= 2 && chips[0].cKg - chips[chips.length - 1].cKg >= 30) {
          var hi = chips[0], lo = chips[chips.length - 1];
          t2 += ' 고정비는 무엇을 팔든 나가므로, 같은 설비로 만드는 칼라칩 가운데 kg당 더 남는 것을 더 팔수록 이익이 커집니다. ' + ptxt(hi.p) + '을(를) ' + ptxt(lo.p) + ' 대신 1톤 팔면 약 ' + esc(won((hi.cKg - lo.cKg) * 1000)) + ' 더 남습니다.';
        }
        if (D.rev > 0 && D.est / D.rev > 0.5) t2 += ' 다만 매출 대부분이 추정 단가라, 이 차이는 실제 판 값이 아니라 손익 설정의 단가 차이에 가깝습니다.';
        tips.push(t2);
      }
      // 3) 칼라칩 손익분기
      if (D.eMargin != null && D.units > 0) {
        var fE1 = D.F / D.units * Math.min(1, Math.max(0, num0(st.epdmShare))), avgE = D.kgE / D.units;
        if (D.eMargin > 0) {
          var be = fE1 / D.eMargin, r100 = function (x) { return fmt(Math.round(x / 100) * 100); };
          tips.push('<b>칼라칩 손익분기</b>: 칼라칩은 kg당 재료·운송비를 빼면 약 ' + fmt(D.eMargin) + '원이 남습니다(추정). 칼라칩 몫 고정비 한 달 약 ' + esc(won(fE1)) + '을 채우려면 한 달에 약 <b>' + r100(be) + ' kg</b>을 팔아야 합니다. ' +
            '이 기간 판매를 한 달로 환산하면 약 ' + r100(avgE) + ' kg' + (avgE >= be ? '으로 넘습니다.' : '으로 <b>' + r100(be - avgE) + ' kg 모자랍니다</b>. 판매량을 늘리거나 단가를 올려야 고정비를 채웁니다.') +
            ' kg당 단가를 100원 올리면 같은 양으로 한 달 약 ' + esc(won(avgE * 100)) + '이 더 남습니다.');
        } else tips.push('<b>칼라칩 손익분기</b>: 지금 단가로는 칼라칩 kg당 재료·운송비도 채우지 못합니다(추정). 단가 또는 원료비를 먼저 점검해야 합니다.');
      }
      // 폐타이어 쪽 손익분기 (판매가 있을 때)
      if (D.kgT > 0 && D.units > 0) {
        var revT = 0, matT = 0;
        D.items.forEach(function (o) { if (o.grp === 'T') { revT += o.rev; matT += o.mat; } });
        var tMargin = (revT - matT) / D.kgT, fT1 = D.F / D.units - D.F / D.units * Math.min(1, Math.max(0, num0(st.epdmShare))), avgT = D.kgT / D.units;
        if (tMargin > 0 && fT1 > 0) {
          var beT = fT1 / tMargin, r100t = function (x) { return fmt(Math.round(x / 100) * 100); };
          tips.push('<b>폐타이어 손익분기</b>: 폐타이어 품목은 kg당 약 ' + fmt(tMargin) + '원이 남아, 그 몫 고정비 한 달 약 ' + esc(won(fT1)) + '을 채우려면 한 달 약 ' + r100t(beT) + ' kg을 팔아야 합니다(추정). ' +
            '이 기간 판매를 한 달로 환산하면 약 ' + r100t(avgT) + ' kg' + (avgT >= beT ? '으로 넘습니다.' : '으로 <b>' + r100t(beT - avgT) + ' kg 모자랍니다</b>. 폐타이어 판매를 이 앱에 모두 넣고 있는지도 확인해 주세요(빠진 출고가 있으면 실제보다 나쁘게 보입니다).'));
        }
      }
    }
    // 4) 먼저 생산할 색상 (한 달 출고보다 현재고가 적거나, 예정 출고에 모자람)
    var hot = D.items.map(function (o) {
      var dem = D.units > 0 ? o.out / D.units : 0, s = stockOf(o.key), ps = S.plan.sum[o.key], need = ps ? ps.need : 0;
      return { o: o, dem: dem, s: s, need: need, m: dem > 0 ? s / dem : Infinity };
    }).filter(function (z) { return z.need > 0 || (z.dem >= 100 && z.s < z.dem); }).sort(function (a, b) { return (b.need > 0) - (a.need > 0) || a.m - b.m; }).slice(0, 6);
    if (hot.length) tips.push('<b>먼저 생산할 색상</b>: 한 달 나가는 양보다 재고가 적거나, 잡힌 출고예정에 모자랍니다. 떨어지면 주문을 놓칩니다.<ul class="sub">' + hot.map(function (z) {
      return '<li>' + ptxt(z.o.p) + ' ' + esc(z.o.c) + ' — 현재고 ' + fmt(z.s) + ' kg' + (z.dem ? ' · 한 달 출고 약 ' + fmt(z.dem) + ' kg' : '') + (z.need ? ' · <b class="neg">예정에 ' + fmt(z.need) + ' kg 부족</b>' : '') + '</li>';
    }).join('') + '</ul>');
    // 5) 쌓인 재고
    var outBy = D.it;
    var cold = S.items.map(function (x) {
      var o = outBy[x.key], dem = o && D.units > 0 ? o.out / D.units : 0, s = stockOf(x.key);
      return { x: x, dem: dem, s: s };
    }).filter(function (z) { return z.s >= 1000 && (z.dem === 0 || z.s > z.dem * 6); }).sort(function (a, b) { return b.s - a.s; });
    if (cold.length) {
      var tied = 0, tiedKnown = false;
      cold.forEach(function (z) { var mp = matPerKg(lkOf(z.x.key)); if (mp) { tied += z.s * mp; tiedKnown = true; } });
      tips.push('<b>쌓인 재고</b>: 지금 나가는 속도로 6달 넘게 팔 양이거나 이 기간 출고가 없습니다. 이 색상은 생산을 줄이고 팔 곳을 먼저 찾는 것이 좋습니다.' +
        (tiedKnown ? ' 이 재고에 들어간 원료비만 약 ' + esc(won(tied)) + '입니다(추정).' : '') + '<ul class="sub">' + cold.slice(0, 6).map(function (z) {
        return '<li>' + ptxt(z.x.prod) + ' ' + esc(z.x.color) + ' — ' + fmt(z.s) + ' kg · ' + (z.dem ? '한 달 약 ' + fmt(z.dem) + ' kg 나감 (약 ' + Math.round(z.s / z.dem) + '달치)' : '이 기간 출고 없음') + '</li>';
      }).join('') + (cold.length > 6 ? '<li>그 밖에 ' + (cold.length - 6) + '개 색상</li>' : '') + '</ul>');
    }
    // 6) 기준가보다 싸게 판 색상
    if (S.money) {
      var low = D.items.map(function (o) {
        var ref = refOf(o.key), avg = o.kgK ? o.revK / o.kgK : null;
        return { o: o, ref: ref, avg: avg, lost: ref && avg != null && avg < ref.p ? (ref.p - avg) * o.kgK : 0 };
      }).filter(function (z) { return z.lost > 0; }).sort(function (a, b) { return b.lost - a.lost; }).slice(0, 5);
      if (low.length) tips.push('<b>정해 둔 단가보다 낮게 판 색상</b>: 단가가 적힌 출고만 봤습니다. 거래처 단가를 점검할 만합니다.<ul class="sub">' + low.map(function (z) {
        return '<li>' + ptxt(z.o.p) + ' ' + esc(z.o.c) + ' — 판 단가 평균 ' + fmt(z.avg) + '원, ' + z.ref.src + ' ' + fmt(z.ref.p) + '원 → ' + fmt(z.o.kgK) + ' kg에서 ' + esc(won(z.lost)) + ' 적게 받음</li>';
      }).join('') + '</ul>');
    }
    // 7) 거래처 쏠림
    var cs = custOf(D.yms), sold = Object.keys(cs).filter(function (k) { return !isOwn(k); }).map(function (k) { return cs[k]; }).sort(function (a, b) { return b.kg - a.kg; });
    var soldKg = sold.reduce(function (s, c) { return s + c.kg; }, 0);
    if (soldKg > 0 && sold[0].kg / soldKg >= 0.4) tips.push('<b>거래처 쏠림</b>: 판매의 ' + Math.round(sold[0].kg / soldKg * 100) + '%가 ' + esc(sold[0].name || '거래처 없음') + ' 한 곳입니다. 이 거래처의 단가·물량이 이익을 크게 좌우하므로, 단가 협의와 다른 거래처 늘리기를 함께 보는 것이 안전합니다.');
    var h = '<section class="card"><h2 class="label">이윤을 늘리려면 · 데이터로 본 점</h2>';
    if (!tips.length) return h + '<p class="hint">이 기간 자료로는 짚을 점이 없습니다.</p></section>';
    return h + '<ul class="tips">' + tips.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      '<p class="note">이 앱의 출고·생산 기록, 현재고, 예정, 손익 설정에서 바로 계산한 것입니다. ‘추정’은 원가표·고정비를 나눈 계산값이라 실제와 다를 수 있습니다. 한 달 출고는 이 기간 출고를 한 달로 환산한 값입니다.</p></section>';
  }

  function viewLoading() {
    return '<div class="center"><div class="spinner" aria-hidden="true"></div><p>불러오는 중…</p></div>';
  }
  function viewFatal() {
    return '<div class="center"><p>' + esc(errText('')) + '</p><button type="button" class="primary" data-act="retry">다시 불러오기</button></div>';
  }

  function dateChips(act, cur, idFor) {
    var y = addDays(S.today, -1);
    var other = cur !== S.today && cur !== y;
    var h = '<div class="chips">';
    h += '<button type="button" class="chip" aria-pressed="' + (cur === S.today) + '" data-act="' + act + '" data-v="' + S.today + '">오늘</button>';
    h += '<button type="button" class="chip" aria-pressed="' + (cur === y) + '" data-act="' + act + '" data-v="' + y + '">어제</button>';
    h += '<label class="datebox" data-on="' + other + '">' + ICON.cal + '<span>' + (other ? esc(fmtDate(cur)) : '다른 날짜') + '</span>' +
      '<input type="date" id="' + idFor + '" data-ch="' + act + '" max="' + S.today + '" value="' + cur + '" aria-label="다른 날짜 고르기"></label>';
    return h + '</div>';
  }

  /* 입력 */
  function planDateChips() {
    var cur = S.inPDate, t1 = addDays(S.today, 1), t2 = addDays(S.today, 2);
    var other = [S.today, t1, t2].indexOf(cur) < 0;
    var h = '<div class="chips">' + chip('오늘', cur === S.today, 'inpdate', S.today) + chip('내일', cur === t1, 'inpdate', t1) + chip('모레', cur === t2, 'inpdate', t2);
    h += '<label class="datebox" data-on="' + other + '">' + ICON.cal + '<span>' + (other ? esc(fmtDate(cur)) : '다른 날짜') + '</span>' +
      '<input type="date" id="in-pdate" data-ch="inpdate" min="' + S.today + '" max="' + planMax() + '" value="' + cur + '" aria-label="예정 날짜 고르기"></label>';
    return h + '</div>';
  }

  function viewIn() {
    var t = S.inType, plan = isPlan(t), sale = isSale(t);
    var h = '<div class="stack">';
    if (QUICK || S.allAdd) h += '<section class="card">' + (S.allAdd ? '<p class="addtitle">' + esc(S.allAdd) + ' 넣기</p>' : '');
    else {
    h += '<section class="card"><h2 class="label" id="h-type">구분</h2><div role="radiogroup" aria-labelledby="h-type"><div class="seg">';
    ACT_TYPES.forEach(function (x) {
      h += '<button type="button" class="segbtn" role="radio" aria-checked="' + (t === x) + '" data-act="intype" data-v="' + x + '">' + x + '</button>';
    });
    h += '</div><p class="seglabel">예정 · 현재고에는 아직 들어가지 않습니다</p><div class="seg two">';
    PLAN_TYPES.forEach(function (x) {
      h += '<button type="button" class="segbtn sm" role="radio" aria-checked="' + (t === x) + '" data-act="intype" data-v="' + x + '">' + x + (x === '출고예정' ? ' (발주)' : '') + '</button>';
    });
    h += '</div></div>';
    }
    h += '<div class="daterow"><h2 class="label">' + (plan ? '예정 날짜' : '날짜') + '</h2><p class="bigdate">' + esc(fmtDate(curDate())) + '</p></div>';
    h += (VIEW === 'out' ? '<p class="hint">날짜는 달력에서 고른 날입니다. 바꾸려면 ‘← 달력으로’를 누르세요.</p>' : plan ? planDateChips() : dateChips('indate', S.inDate, 'in-date')) + '</section>';

    if (t === '출고' || t === '생산') {
      var pt = t + '예정';
      var due = S.plan.lines.filter(function (l) { return !l.fut && l.type === pt && l.date <= S.today; });
      if (due.length) {
        h += '<div class="warnbox">오늘까지 날짜인 ' + pt + ' ' + due.length + '건이 아직 확정되지 않았습니다. 그 ' + t + '이라면 여기서 새로 넣지 말고 ' + (VIEW === 'out' ? '달력에서 그 날짜를 눌러' : '예정 화면에서') + ' \'확정\'을 누르세요. 두 번 들어가면 재고가 틀어집니다.' +
          '<br>' + (VIEW === 'out' ? '<button type="button" class="link" data-act="calback">← 달력으로</button>' : QUICK ? '<a class="link" href="stock.html?view=all">전체관리의 예정 화면으로</a>' : '<button type="button" class="link" data-act="tab" data-v="plan">예정 화면으로</button>') + '</div>';
      }
    }

    if (sale) {
      h += '<section class="card"><label class="label" for="in-cust">거래처</label>';
      h += '<input id="in-cust" class="text" type="text" data-in="cust" list="cust-list" autocomplete="off" maxlength="60" placeholder="거래처 이름" value="' + esc(S.inCust) + '">';
      var top = S.customers.slice(0, 8);
      if (top.length) {
        h += '<div class="chips mt8">';
        top.forEach(function (c) {
          h += '<button type="button" class="chip" aria-pressed="' + (S.inCust === c) + '" data-act="cust" data-v="' + esc(c) + '">' + esc(c) + '</button>';
        });
        h += '</div>';
      }
      if (t === '출고예정') {
        h += '<label class="label mt12" for="in-po">발주번호·현장 (선택)</label>';
        h += '<input id="in-po" class="text" type="text" data-in="po" maxlength="60" autocomplete="off" value="' + esc(S.inPo) + '" placeholder="예: 발주서 번호, 현장 이름">';
      }
      h += '</section>';
    }

    h += '<section class="card"><h2 class="label">제품별 수량 (kg)</h2>' + prodTabs('inprod', S.inProd, true);
    if (QUICK || S.allAdd) h += '<p class="ptot" id="ptot">' + ptotHtml(S.inProd) + '</p>';
    var vl = vlabel(S.inProd);
    var hint = {

  /* 재고 전체(관리자)로 들어왔는데 로그인 전: 비밀번호 안내만 */
