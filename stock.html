  function savedLocked(type, n, tot, ls, r) {
    if (r && r.stock) { S.stock = r.stock; S.hasStock = true; }
    if (type === '생산') {
      S.saved.unshift({ date: curDate(), n: n, kg: tot, text: ls.slice(0, 6).map(function (l) { return l.it.prod + ' ' + l.it.color + ' ' + fmt(l.qty) + 'kg'; }).join(' · ') +
        (ls.length > 6 ? ' 외 ' + (ls.length - 6) + '건' : '') });
      S.saved = S.saved.slice(0, 5);
    }
    S.qty = {}; S.inMemo = ''; S.price = {}; S.sheet = null;
    var msg = '저장했습니다 · ' + type + ' ' + n + '건 ' + fmt(tot) + ' kg';
    if (S.admin) { lockDown(); toastOk(msg + ' · 관리자 로그인 시간이 지나 잠겼습니다'); return; }
    render();
    window.scrollTo(0, 0);
    toastOk(msg);
  }

  /* 제품 탭. 분류가 둘 이상이면 분류 이름을 줄 머리로 넣습니다. badges = 입력 화면의 '넣은 줄 수' 표시 */
  function prodTabs(act, cur, badges) {
    var h = '<div class="ptabs" role="tablist" aria-label="제품">', last = null;
    S.prods.forEach(function (p, i) {
      if (multiLine() && lineOf(p) !== last) { last = lineOf(p); h += '<span class="pgl" aria-hidden="true">' + esc(lineName(last)) + '</span>'; }
      h += '<button type="button" class="ptab ' + pcls(p) + '" role="tab" aria-selected="' + (cur === p) + '" data-act="' + act + '" data-v="' + esc(p) + '">' + esc(p) +
        (badges ? '<span class="badge" id="badge-' + i + '">' + (countIn(p) || '') + '</span>' : '') + '</button>';
    });
    return h + '</div>';
  }

  function barInner() {
    var ls = validLines(), bad = badLines().length, tot = 0;
    ls.forEach(function (l) { tot += l.qty; });
    var h = '<div class="bar-in"><p class="barinfo">';
    if (ls.length) h += esc(S.inType) + ' <b>' + ls.length + '건</b> · <b>' + fmt(tot) + '</b> kg';
    else h += '수량을 넣으면 합계가 여기 나옵니다';
    if (bad) h += '<br><span class="bad">숫자가 아닌 칸 ' + bad + '개</span>';
    h += '</p>';
    if (ls.length || bad) h += '<button type="button" class="link" data-act="clearin">비우기</button>';
    h += '<button type="button" class="primary" data-act="review"' + (ls.length ? '' : ' disabled') + '>확인</button></div>';
    return h;
  }

  function onQty(el) {
    var k = el.getAttribute('data-k');
    var it = S.byKey[k];
    if (!it) return;
    var v = el.value.trim();
    if (v) S.qty[k] = v; else delete S.qty[k];
    el.classList.toggle('filled', !!v);
    var w = document.getElementById('w-' + it.idx);
    if (w) w.textContent = warnFor(it);
    var sk = document.getElementById('s-' + it.idx);
    if (sk) sk.innerHTML = stkHtml(it);
    var pt = document.getElementById('ptot');
    if (pt && it.prod === S.inProd) pt.innerHTML = ptotHtml(S.inProd);
    var b = document.getElementById('badge-' + S.prods.indexOf(it.prod));
    if (b) b.textContent = countIn(it.prod) || '';
    var bar = document.getElementById('inbar');
    if (bar) bar.innerHTML = barInner();
  }

  function review() {
    var bad = badLines();
    if (bad.length) {
      S.inProd = bad[0].it.prod;
      render();
      var el = document.getElementById('q-' + bad[0].it.idx);
      if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
      toast('숫자가 아닌 칸이 있습니다 · ' + bad[0].it.prod + ' ' + bad[0].it.color);
      return;
    }
    if (!validLines().length) { toast(ERR.no_lines); return; }
    if (isSale(S.inType) && !S.inCust.trim()) {
      toast(ERR.need_cust);
      var c = document.getElementById('in-cust');
      if (c) { c.focus(); c.scrollIntoView({ block: 'center' }); }
      return;
    }
    openSheet({ kind: 'review' });
  }

  /* pk = 단가 키 (색상 제품은 제품 이름, 규격·종류 제품은 '제품|규격') */
  function amtText(pk, kg) {
    var s = cleanNum(S.price[pk]), bp = baseOf(pk);
    if (/^\d+$/.test(s)) return '금액 ' + won(kg * Number(s));
    if (s) return '';
    if (typeof bp === 'number') return '기준 단가로 약 ' + won(kg * bp);
    return '';
  }
  function priceRow(pk, label, kg, gid) {
    var bp = baseOf(pk);
    return '<div class="pricerow"><label for="pr-' + gid + '">' + esc(label) + ' 단가 (원/kg, 선택)</label>' +
      '<input id="pr-' + gid + '" class="text sm" type="text" inputmode="numeric" autocomplete="off" data-in="price" data-p="' + esc(pk) + '" data-k="' + kg + '" data-g="' + gid +
      '" value="' + esc(S.price[pk] || '') + '" placeholder="' +
      (!S.money ? '알면 넣고, 모르면 비워 두세요' : typeof bp === 'number' ? '비우면 기준 단가 ' + fmt(bp) + '원' : bp === 'mixed' ? '비우면 색상별 기준 단가' : '비우면 매출 계산에서 빠짐') +
      '"><span class="pamt" id="pamt-' + gid + '">' + esc(amtText(pk, kg)) + '</span></div>';
  }

  function sheetReview() {
    var t = S.inType, sale = isSale(t), date = curDate(), ls = validLines(), tot = 0, over = 0, worse = 0;
    var P = project(ls.map(function (l) { return { type: t, prod: l.it.prod, color: l.it.color, qty: l.qty, date: date }; }));
    var mine = {};
    P.lines.forEach(function (x) { if (x.x) mine[x.l.prod + '|' + x.l.color] = x; });
    var h = '<h2 class="h2" id="sh-title">' + esc(fmtDate(date)) + ' · ' + esc(t) + (sale ? ' · ' + esc(S.inCust.trim()) : '') + '</h2>';
    if (t === '출고예정' && S.inPo.trim()) h += '<p class="muted">발주번호·현장: ' + esc(S.inPo.trim()) + '</p>';
    var groups = [], by = {};
    ls.forEach(function (l) { if (!by[l.it.prod]) { by[l.it.prod] = []; groups.push(l.it.prod); } by[l.it.prod].push(l); });
    groups.forEach(function (p, gi) {
      var gl = by[p], gk = 0, perLine = sale && S.kind[p] && S.kind[p] !== 'color';
      gl.forEach(function (l) { gk += l.qty; });
      h += '<div class="rgroup"><p class="rghead">' + ptag(p) + '<span>' + gl.length + '건 · ' + fmt(gk) + ' kg</span></p>';
      if (sale && !perLine) h += priceRow(p, p, gk, String(gi));
      h += '<ul class="cflist">';
      gl.forEach(function (l) {
        tot += l.qty;
        var k = l.it.key, x = mine[k], note = '', cls = '';
        var more = P.sum[k] ? P.sum[k].need - needOf(k) : 0;
        if (t === '출고') {
          if (l.qty > stockOf(k)) { note = '현재 재고 ' + fmt(stockOf(k)) + ' kg보다 많음'; cls = 'bad'; over++; }
          else if (more > 0) { note = '이 출고로 뒤의 출고예정에 ' + fmt(more) + ' kg 부족이 생김'; cls = 'bad'; worse++; }
        } else if (t === '출고예정' && x) {
          if (x.short > 0) { note = '부족 ' + fmt(x.short) + ' kg · 그날 쓸 수 있는 재고 ' + fmt(Math.max(x.before, 0)) + ' kg'; cls = 'bad'; over++; }
          else if (more > 0) { note = '가능 · 다만 뒤의 출고예정에 ' + fmt(more) + ' kg 부족이 생김'; cls = 'bad'; worse++; }
          else { note = '가능 · 출고 뒤 ' + fmt(x.after) + ' kg 남음'; cls = 'okc'; }
        } else if (t === '생산예정') {
          var nb = needOf(k), na = P.sum[k] ? P.sum[k].need : 0;
          if (nb > 0 && na < nb) { note = '부족 ' + fmt(nb) + ' kg → ' + (na ? fmt(na) + ' kg' : '없음'); cls = na ? 'bad' : 'okc'; }
          else if (nb > 0) { note = '이 날짜로는 부족 ' + fmt(nb) + ' kg이 줄지 않습니다 · 부족 시작 ' + fmtDate(S.plan.sum[k] ? S.plan.sum[k].shortEff : S.today); cls = 'bad'; }
        }
        h += '<li class="cfrow"><span class="cfname">' + sw(l.it.color, l.it.prod) + esc(l.it.color) + '</span><b>' + fmt(l.qty) + ' kg</b>' +
          (note ? '<small class="' + cls + '">' + esc(note) + '</small>' : '') + '</li>';
      });
      h += '</ul>';
      // 규격·종류마다 단가가 달라서 줄마다 받습니다 (예: 고무분말 5-7mm와 2-3mm)
      if (perLine) gl.forEach(function (l, li) { h += priceRow(l.it.key, l.it.color, l.qty, gi + '-' + li); });
      h += '</div>';
    });
    h += '<p class="cftotal"><span>합계 ' + ls.length + '건</span><span>' + fmt(tot) + ' kg</span></p>';
    if (S.inMemo.trim()) h += '<p class="muted">메모: ' + esc(S.inMemo.trim()) + '</p>';
    if (t === '출고' && over) h += '<p class="warnbox mt8">재고보다 많이 나가는 줄이 ' + over + '개 있습니다. 제품과 색상·규격이 맞는지 확인해 주세요. 맞으면 그대로 저장하면 됩니다.</p>';
    if (t === '출고예정' && (over || worse)) h += '<p class="warnbox mt8">재고가 모자라는 줄이 있어도 저장할 수 있습니다. 저장하면 예정 화면에서 언제까지 얼마를 생산해야 하는지 볼 수 있습니다.</p>';
    if (t === '출고' && worse) h += '<p class="warnbox mt8">이 출고 때문에 이미 받은 발주(출고예정)에 쓸 재고가 모자라게 됩니다. 그래도 맞으면 저장하세요.</p>';
    h += '<div class="two mt16"><button type="button" class="ghost" data-act="close">고치기</button>' +
      '<button type="button" class="primary" data-act="save"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '저장 중…' : '저장') + '</button></div>';
    return h;
  }

  function save() {
    if (S.busy) return;
    var ls = validLines();
    if (!ls.length) return;
    var tot = 0;
    ls.forEach(function (l) { tot += l.qty; });
    var type = S.inType, n = ls.length, sale = isSale(type);
    if (sale) {
      var bad = Object.keys(S.price).filter(function (pk) {
        var s = cleanNum(S.price[pk]);
        return s && !/^\d+$/.test(s) && ls.some(function (l) { return pkeyOf(l.it) === pk; });
      })[0];
      if (bad != null) {
        toast(ERR.bad_price);
        var pe = sheetEl.querySelector('[data-in="price"][data-p="' + bad.replace(/"/g, '\\"') + '"]');
        if (pe) pe.focus();
        return;
      }
    }
    var d0 = curDate();
    S.busy = true;
    renderSheet();
    call('apiSave', {
      type: type, date: curDate(), cust: sale ? S.inCust.trim() : '', memo: S.inMemo.trim(), po: type === '출고예정' ? S.inPo.trim() : '',
      lines: ls.map(function (l) { return { prod: l.it.prod, color: l.it.color, qty: l.qty, price: sale ? cleanNum(S.price[pkeyOf(l.it)]) : '' }; })
    }).then(function (r) {
      S.busy = false;
      if (!isAdminResp(r)) { savedLocked(type, n, tot, ls, r); return; }
      apply(r);
      S.qty = {};
      S.inMemo = '';
      S.price = {};
      if (sale) { S.inCust = ''; S.inPo = ''; }
      S.sheet = null;
      if (isPlan(type)) { S.tab = 'plan'; store('nmc_inv_tab2', 'plan'); }
      if (VIEW === 'out') { S.outMode = 'cal'; S.calDay = d0; S.calYm = d0.slice(0, 7); }
      if (VIEW === 'all' && S.allAdd) { S.tab = S.allAddFrom === 'stock' ? 'stock' : 'plan'; store('nmc_inv_tab2', S.tab); S.allAdd = ''; }
      render();
      window.scrollTo(0, 0);
      var ps = planStats();
      toastOk('저장했습니다 · ' + type + ' ' + n + '건 ' + fmt(tot) + ' kg' + (isPlan(type) ? (ps.shortItems ? ' · 부족 ' + ps.shortItems + '품목' : ' · 부족 없음') : ''));
    }, function (e) {
      S.busy = false;
      renderSheet();
      failed(e);
    });
  }

  /* 현재고 */
  function viewStock() {
    var h = '<div class="stack">';
    if (S.badRows.length) {
      h += '<p class="warnbox">구글 시트 \'기록\'에서 읽지 못한 줄이 있습니다 (행 ' + esc(S.badRows.join(', ')) + '). 날짜·구분·수량을 확인해 주세요. 이 줄은 재고에 들어가지 않았습니다.</p>';
    }
    var total = 0, per = {}, nb = 0, nw = 0;
    S.items.forEach(function (it) {
      var kg = stockOf(it.key), st = statusOf(it, kg);
      total += kg;
      per[it.prod] = (per[it.prod] || 0) + kg;
      if (st === 'bad') nb++; else if (st === 'warn') nw++;
    });
    // 분류(칼라칩·폐타이어)가 둘 이상이면 합계를 분류마다 따로 냅니다. 칩과 분말·분철을 한 숫자로 섞지 않습니다.
    var multi = multiLine();
    h += '<section class="card"><p class="label">' + (multi ? '재고' : '전체 재고') + ' · ' + esc(fmtDate(S.today)) + ' 기준</p>';
    (S.lines.length ? S.lines : ['']).forEach(function (ln, gi) {
      var ps = prodsOfLine(ln), gt = 0;
      ps.forEach(function (p) { gt += per[p] || 0; });
      h += '<div class="gsum' + (gi ? ' next' : '') + '">' + (multi ? '<p class="glabel">' + esc(lineName(ln)) + '</p>' : '') +
        '<p class="big">' + fmt(multi ? gt : total) + '<small> kg</small></p><div class="tiles">' + ps.map(function (p) {
          return '<div class="tile tl ' + pcls(p) + '"><span>' + ptxt(p) + '</span><b>' + fmt(per[p] || 0) + '</b></div>';
        }).join('') + '</div></div>';
    });
    var ps = planStats();
    if (ps.n) {
      var txt = '출고예정 ' + ps.nOut + '건 · ' + fmt(ps.outKg) + ' kg · ' + (ps.shortItems ? '부족 ' + ps.shortItems + '품목 ' + fmt(ps.needKg) + ' kg' : '부족 없음') +
        (ps.overdue ? ' · 지난 예정 ' + ps.overdue + '건' : '');
      h += '<button type="button" class="planstrip' + (ps.shortItems || ps.overdue ? ' alert' : '') + '" data-act="tab" data-v="plan"><span>' + esc(txt) + '</span>' + ICON.chevR + '</button>';
    }
    h += '<div class="chips mt12">' + chip('모두', !S.low, 'low', '0') + chip('부족한 것만 · 긴급 ' + nb + ' · 생산준비 ' + nw, S.low, 'low', '1') + '</div></section>';
    h += '<div class="chips" role="group" aria-label="제품 고르기">' + chip('모든 제품', !S.stProd, 'stprod', '') +
      S.prods.map(function (p) { return chip(p, S.stProd === p, 'stprod', p); }).join('') + '</div>';
    var prods = S.stProd ? [S.stProd] : S.prods;
    if (S.low) h += lowList(prods);
    else h += '<div class="pgrid">' + prods.map(function (p) { return productCard(p); }).join('') + '</div>';
    h += '<p class="legend"><span class="pill bad">긴급</span>긴급 기준 미만 <span class="pill warn">생산준비</span>OK 기준 미만 · 줄을 누르면 자세히 볼 수 있습니다. 기준은 구글 시트 \'재고품목\'에서 바꿉니다. 예정(발주)은 현재고에 들어가지 않습니다.</p>';
    return h + '</div>';
  }

  function stockRow(it) {
    var kg = stockOf(it.key), st = statusOf(it, kg), s = S.plan.sum[it.key];
    var sub = '';
    if (s) {
      sub = s.need > 0 ? '<small class="bad">예정 반영 시 ' + fmt(s.need) + ' kg 부족 · ' + esc(fmtDate(s.shortEff)) + '부터</small>'
        : '<small>예정 반영 후 ' + fmt(s.final) + ' kg</small>';
    }
    return '<li><button type="button" class="srow ' + st + '" data-act="item" data-v="' + esc(it.key) + '" aria-label="' +
      esc(it.prod + ' ' + it.color + ' ' + fmt(kg) + 'kg ' + STATUS_LABEL[st]) + '"><span class="sname">' + sw(it.color, it.prod) + esc(it.color) + '</span>' +
      '<span class="sright">' + (st !== 'ok' ? pill(st) : '') + '<b class="skg">' + fmt(kg) + '</b></span>' + sub + '</button></li>';
  }

  function productCard(p) {
    var list = itemsOf(p), tot = 0, nb = 0, nw = 0;
    list.forEach(function (it) {
      var kg = stockOf(it.key), st = statusOf(it, kg);
      tot += kg;
      if (st === 'bad') nb++; else if (st === 'warn') nw++;
    });
    return '<section class="pcard ' + pcls(p) + '"><div class="phead"><h2>' + esc(p) + '</h2><p><b>' + fmt(tot) + '</b> kg</p></div>' +
      '<p class="psub">' + vlabel(p) + ' ' + list.length + '개 · 긴급 ' + nb + ' · 생산준비 ' + nw + '</p><ul class="slist">' + list.map(stockRow).join('') + '</ul></section>';
  }

  function lowList(prods) {
    var h = '', any = false;
    prods.forEach(function (p) {
      var list = itemsOf(p).map(function (it) {
        var kg = stockOf(it.key);
        return { it: it, kg: kg, st: statusOf(it, kg) };
      }).filter(function (x) { return x.st !== 'ok'; });
      if (!list.length) return;
      any = true;
      list.sort(function (a, b) { return a.st === b.st ? a.kg - b.kg : (a.st === 'bad' ? -1 : 1); });
      h += '<section class="pcard ' + pcls(p) + '"><div class="phead"><h2>' + esc(p) + '</h2><p>' + list.length + '개</p></div><ul class="slist">' +
        list.map(function (x) { return stockRow(x.it); }).join('') + '</ul></section>';
    });
    if (!any) h += '<section class="card"><p class="muted">기준보다 적은 품목이 없습니다.</p></section>';
    return any ? '<div class="pgrid">' + h + '</div>' : h;
  }

  /* mode 'item': 품목 창 (날짜가 제목), 'day': 기록 화면 (구분·거래처는 묶음 제목에 있음) */
  function recRow(r, mode) {
    var neg = r.type === '출고' || (r.type === '조정' && r.qty < 0);
    var shown = r.type === '출고' ? '-' + fmt(r.qty) : r.type === '조정' ? sfmt(r.qty) : '+' + fmt(r.qty);
    var title, meta = [];
    if (mode === 'item') {
      title = fmtDate(r.date) + ' · ' + TYPE_LABEL[r.type];
      if (r.cust) meta.push(r.cust);
    } else {
      title = r.prod + ' · ' + r.color;
    }
    if (r.memo) meta.push(r.memo);
    return '<li><button type="button" class="rrow" data-act="edit" data-v="' + esc(r.id) + '"' + (r.id ? '' : ' disabled') + '>' +
      '<span class="rmain">' + sw(r.color, r.prod) + '<span><b>' + esc(title) + '</b>' + (meta.length ? '<small>' + esc(meta.join(' · ')) + '</small>' : '') + '</span></span>' +
      '<span class="rqty ' + (neg ? 'out' : 'in') + '">' + shown + ' kg</span></button></li>';
  }

  function sheetItem() {
    var k = S.sheet.key, it = S.byKey[k];
    if (!it) return '<p>품목을 찾을 수 없습니다.</p><button type="button" class="ghost wide mt16" data-act="close">닫기</button>';
    var kg = stockOf(k), st = statusOf(it, kg), ym = S.today.slice(0, 7), m = S.months[ym];
    if (!m) ensureMonth(ym);
    var h = '<h2 class="h2" id="sh-title">' + sw(it.color, it.prod) + '<span>' + ptxt(it.prod) + ' · ' + esc(it.color) + '</span></h2>';
    h += '<p class="big">' + fmt(kg) + '<small> kg</small> ' + pill(st) + '</p>';
    h += '<p class="muted">' + (it.alert || it.ok ? '긴급: ' + fmt(it.alert) + ' kg 미만 · OK: ' + fmt(it.ok) + ' kg 이상'
      : '긴급·OK 기준이 없습니다. 구글 시트 \'재고품목\'의 C·D열에 넣으면 부족 표시가 나옵니다.') + '</p>';
    if (m) {
      var x = monthRows(m)[k] || zero();
      h += '<div class="tiles">' + tile(Number(ym.slice(5)) + '월 생산', x.prod) + tile(Number(ym.slice(5)) + '월 출고', x.out) + tile(Number(ym.slice(5)) + '월 반입', x.ban) +
        (x.adj ? tile('재고조정', x.adj) : '') + '</div>';
      var recs = m.records.filter(function (r) { return r.prod + '|' + r.color === k; }).slice(-8).reverse();
      h += '<h3 class="label mt16">이번 달 기록 (최근 ' + recs.length + '건)</h3>';
      if (!recs.length) h += '<p class="muted">이번 달 기록이 없습니다.</p>';
      else h += '<ul class="rlist">' + recs.map(function (r) { return recRow(r, 'item'); }).join('') + '</ul>';
    } else {
      h += '<p class="muted mt12">' + (S.mErr[ym] ? esc(errText('')) : '불러오는 중…') + '</p>';
    }
    var ps = S.plan.sum[k], ev = S.plan.lines.filter(function (l) { return l.prod + '|' + l.color === k; });
    if (ev.length) {
      h += '<h3 class="label mt16">예정 ' + ev.length + '건 · 모두 반영하면 ' + fmt(ps.final) + ' kg</h3>';
      if (ps.need > 0) h += '<p class="warnbox">' + esc(fmtDate(ps.shortEff)) + '부터 모자랍니다 · 그때까지 <b>' + fmt(ps.need) + ' kg</b> 생산이 필요합니다.</p>';
      h += '<ul class="rlist">' + ev.map(function (l) { return planRow(l, 'item'); }).join('') + '</ul>';
      if (ps.need > 0) h += '<button type="button" class="ghost wide mt8" data-act="planprod" data-v="' + esc(k) + '">부족분 ' + fmt(ps.need) + ' kg 생산예정 넣기</button>';
    }
    h += '<button type="button" class="ghost wide mt16" data-act="adjust" data-v="' + esc(k) + '">재고 맞추기</button>';
    h += '<button type="button" class="ghost wide mt8" data-act="close">닫기</button>';
    return h;
  }

  function adjDiffText() {
    var it = S.byKey[S.sheet.key], n = parseKg(S.sheet.val);
    if (!it || S.sheet.val === '' || n === null) return '';
    var d = n - stockOf(it.key);
    if (d === 0) return '장부 재고와 같습니다';
    return '차이 ' + sfmt(d) + ' kg (' + (d > 0 ? '장부보다 많음' : '장부보다 적음') + ')';
  }

  function sheetAdjust() {
    var k = S.sheet.key, it = S.byKey[k];
    if (!it) return '';
    var kg = stockOf(k);
    var h = '<h2 class="h2" id="sh-title">재고 맞추기</h2>';
    h += '<p class="cfname">' + sw(it.color, it.prod) + '<b>' + ptxt(it.prod) + ' · ' + esc(it.color) + '</b></p>';
    h += '<p class="muted mt8">장부 재고는 <b>' + fmt(kg) + ' kg</b>입니다. 창고에서 실제로 센 양을 넣으면 차이만큼 오늘(' + esc(fmtDate(S.today)) + ') 날짜로 \'재고조정\'이 기록됩니다.</p>';
    h += '<label class="label mt12" for="adj-val">실제 재고 (kg)</label>';
    h += '<input id="adj-val" class="text" type="text" inputmode="numeric" autocomplete="off" data-in="adj" value="' + esc(S.sheet.val) + '">';
    h += '<p class="diff" id="adj-diff">' + esc(adjDiffText()) + '</p>';
    h += '<label class="label mt8" for="adj-memo">메모 (선택)</label>';
    h += '<input id="adj-memo" class="text" type="text" data-in="adjmemo" maxlength="200" value="' + esc(S.sheet.memo) + '">';
    h += '<div class="two mt16"><button type="button" class="ghost" data-act="item" data-v="' + esc(k) + '">뒤로</button>' +
      '<button type="button" class="primary" data-act="adjsave"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '저장 중…' : '저장') + '</button></div>';
    return h;
  }

  /* 예정 */
  function planRow(l, mode) {
    var out = isSale(l.type);
    var title = mode === 'item' ? esc(fmtDate(l.date) + ' · ' + TYPE_LABEL[l.type]) : ptag(l.prod) + esc(l.color);
    var meta = [];
    if (mode !== 'item' && (l.type !== '출고예정' || l.fut)) meta.push(TYPE_LABEL[l.type] + (l.fut ? ' (미래 날짜 기록)' : ''));
    if (l.cust) meta.push(l.cust);
    else if (l.type === '출고예정') meta.push('거래처 없음');
    if (l.overdue) meta.push('예정일 ' + fmtDate(l.date) + ' 지남');
    if (l.po) meta.push(l.po);
    var stat = out ? (l.short > 0 ? '<span class="pst bad">부족 ' + fmt(l.short) + '</span>' : '<span class="pst ok">가능</span>')
      : '<span class="pst in">뒤 재고 ' + fmt(l.after) + '</span>';
    return '<li><button type="button" class="rrow" data-act="pline" data-v="' + esc(l.id) + '">' +
      '<span class="rmain">' + (mode === 'item' ? sw(l.color, l.prod) : '') + '<span><b>' + title + '</b><small>' + esc(meta.join(' · ')) + '</small></span></span>' +
      '<span class="rside"><span class="rqty ' + (out ? 'out' : 'in') + '">' + (out ? '-' : '+') + fmt(l.qty) + ' kg</span>' + stat + '</span></button></li>';
  }

  function viewPlan() {
    var ps = planStats(), L = S.plan.lines;
    var real = L.filter(function (l) { return !l.fut; });
    var h = '<div class="stack"><section class="card"><p class="label">예정 · ' + esc(fmtDate(S.today)) + ' 기준</p>';
    if (!real.length) h += '<p class="muted">들어온 발주(출고예정)나 생산 계획(생산예정)이 없습니다.</p>';
    else {
      h += '<div class="tiles">' + tile('출고예정 (kg)', ps.outKg, ps.nOut + '건') + tile('생산예정 (kg)', ps.inKg, ps.nIn + '건') +
        '<div class="tile' + (ps.shortItems ? ' tbad' : '') + '"><span>부족 (kg)</span><b>' + (ps.shortItems ? fmt(ps.needKg) : '없음') + '</b><small>' +
        (ps.shortItems ? ps.shortItems + '품목' : '예정대로 모두 나갈 수 있음') + '</small></div></div>';
    }
    h += '<div class="two mt12"><button type="button" class="ghost" data-act="newplan" data-v="출고예정">출고예정 넣기</button>' +
      '<button type="button" class="ghost" data-act="newplan" data-v="생산예정">생산예정 넣기</button></div>';
    h += '<p class="note">발주서 파일(엑셀·PDF·사진·카톡 캡처)은 Claude 채팅에 올리시면 읽어서 출고예정으로 넣고, 모자라는 품목을 알려 드립니다.</p></section>';

    var sk = shortKeys();
    if (sk.length) {
      h += '<section class="card alertcard"><h2 class="label">생산이 필요한 품목 ' + sk.length + '개 · 모두 ' + fmt(ps.needKg) + ' kg</h2><ul class="llist">';
      sk.forEach(function (k) {
        var s = S.plan.sum[k], p = k.split('|');
        h += '<li class="nrow"><button type="button" class="nmain" data-act="item" data-v="' + esc(k) + '">' + ptag(p[0]) +
          '<span class="lname">' + sw(p[1], p[0]) + esc(p[1]) + '</span><span class="nwhen">' + esc(fmtDate(s.shortEff)) + '부터</span><b class="lkg bad">' + fmt(s.need) + ' kg</b></button>' +
          '<button type="button" class="ghost sm" data-act="planprod" data-v="' + esc(k) + '">생산예정</button></li>';
      });
      h += '</ul><p class="note">지금 재고에서 예정을 날짜 순으로 빼고 더했을 때 가장 많이 모자라는 양입니다. 표시된 날짜까지 이만큼 생산하면 예정대로 나갈 수 있습니다. 같은 날 생산예정은 그날 출고보다 먼저 들어오는 것으로 계산합니다.</p></section>';
    }

    var od = real.filter(function (l) { return l.overdue; });
    if (od.length) {
      h += '<section class="card alertcard"><h2 class="label">날짜가 지난 예정 ' + od.length + '건 · 확정하거나 지워 주세요</h2>' +
        '<p class="note" style="margin:0 0 6px">확정하기 전까지는 오늘 나가는(들어오는) 것으로 계산합니다.</p><ul class="rlist">' +
        od.map(function (l) { return planRow(l, 'plan'); }).join('') + '</ul>' +
        '<button type="button" class="primary wide mt12" data-act="confirmall">' + od.length + '건 모두 확정</button></section>';
    }

    var dates = [], byDate = {};
    real.forEach(function (l) {
      if (l.overdue) return;
      if (!byDate[l.date]) { byDate[l.date] = []; dates.push(l.date); }
      byDate[l.date].push(l);
    });
    dates.forEach(function (d) {
      var g = byDate[d], o = 0, i = 0, ns = 0;
      g.forEach(function (l) { if (l.type === '출고예정') o += l.qty; else i += l.qty; if (l.short > 0) ns++; });
      var rel = d === S.today ? '오늘' : d === addDays(S.today, 1) ? '내일' : '';
      var parts = [];
      if (o) parts.push('출고 ' + fmt(o));
      if (i) parts.push('생산 ' + fmt(i));
      h += '<section class="card"><div class="dhead"><h2>' + esc(fmtDate(d)) + (rel ? ' <span class="rel">' + rel + '</span>' : '') + '</h2><p>' +
        esc(parts.join(' · ')) + ' kg' + (ns ? ' · <b class="bad">부족 ' + ns + '줄</b>' : '') + '</p></div><ul class="rlist">' +
        g.map(function (l) { return planRow(l, 'plan'); }).join('') + '</ul>';
      if (d === S.today) h += '<button type="button" class="ghost wide mt8" data-act="confirmday" data-v="' + d + '">오늘 예정 ' + g.length + '건 모두 확정</button>';
      h += '</section>';
    });

    var fut = L.filter(function (l) { return l.fut; });
    if (fut.length) {
      h += '<section class="card"><h2 class="label">미래 날짜로 적힌 실제 기록 ' + fut.length + '건</h2><p class="note" style="margin:0 0 6px">구글 시트에 직접 넣은 줄로 보입니다. 현재고에는 빠지고 예정 계산에만 들어갑니다. 날짜를 고치거나 출고예정으로 다시 넣어 주세요.</p><ul class="rlist">' +
        fut.map(function (l) { return planRow(l, 'plan'); }).join('') + '</ul></section>';
    }
    if (real.length) h += '<p class="hint">줄을 누르면 그 품목의 날짜별 예상 재고를 보고, 확정·고치기·지우기를 할 수 있습니다.</p>';
    return h + '</div>';
  }

  function sheetPlanLine() {
    var l = findPlan(S.sheet.id);
    if (!l) return '<p>그 사이에 바뀌었거나 지워진 예정입니다.</p><button type="button" class="ghost wide mt16" data-act="close">닫기</button>';
    var out = isSale(l.type), k = l.prod + '|' + l.color;
    var h = '<h2 class="h2" id="sh-title">' + sw(l.color, l.prod) + esc(l.prod) + ' · ' + esc(l.color) + '</h2>';
    h += '<p class="big">' + (out ? '-' : '+') + fmt(l.qty) + '<small> kg</small></p><dl class="kv">';
    h += '<dt>구분</dt><dd>' + esc(TYPE_LABEL[l.type] + (l.fut ? ' (미래 날짜로 적힌 실제 기록)' : '')) + '</dd>';
    h += '<dt>' + (l.fut ? '날짜' : '예정일') + '</dt><dd>' + esc(fmtDate(l.date) + (l.overdue ? ' · 지남 (오늘로 계산 중)' : '')) + '</dd>';
    if (isSale(l.type)) h += '<dt>거래처</dt><dd>' + (l.cust ? esc(l.cust) : '<span class="bad">없음 · 확정할 때 넣어 주세요</span>') + '</dd>';
    if (l.po) h += '<dt>발주번호</dt><dd>' + esc(l.po) + '</dd>';
    if (l.price != null) h += '<dt>단가</dt><dd>' + fmt(l.price) + ' 원/kg · 금액 ' + esc(won(l.price * l.qty)) + '</dd>';
    if (l.memo) h += '<dt>메모</dt><dd>' + esc(l.memo) + '</dd>';
    h += '</dl>';
    if (out) {
      h += l.short > 0
        ? '<p class="warnbox mt12">' + esc(fmtDate(l.eff)) + '에 쓸 수 있는 재고 ' + fmt(Math.max(l.before, 0)) + ' kg → <b>' + fmt(l.short) + ' kg 부족</b></p>'
        : '<p class="okbox mt12">가능 · ' + esc(fmtDate(l.eff)) + ' 출고 전 ' + fmt(l.before) + ' kg → 출고 뒤 ' + fmt(l.after) + ' kg</p>';
    } else {
      h += '<p class="okbox mt12">' + esc(fmtDate(l.eff)) + ' 생산 뒤 재고 ' + fmt(l.after) + ' kg</p>';
    }
    var ev = S.plan.lines.filter(function (x) { return x.prod + '|' + x.color === k; });
    h += '<h3 class="label mt16">' + esc(l.color) + ' 예상 재고 (날짜 순)</h3><ol class="tline"><li><span>지금 재고</span><span></span><b>' + fmt(stockOf(k)) + '</b></li>';
    ev.forEach(function (x) {
      h += '<li' + (x.id === l.id ? ' class="me"' : '') + '><span>' + esc(fmtDate(x.eff) + ' ' + TYPE_LABEL[x.type] + (x.cust ? ' · ' + x.cust : '')) + '</span><span>' +
        sfmt(signed(x)) + '</span><b class="' + (x.after < 0 ? 'bad' : '') + '">' + fmt(x.after) + '</b></li>';
    });
    h += '</ol>';
    if (!l.fut) {
      h += '<div class="two mt16"><button type="button" class="ghost" data-act="edit" data-v="' + esc(l.id) + '">고치기·지우기</button>' +
        '<button type="button" class="primary" data-act="confirm1" data-v="' + esc(l.id) + '">' + (l.type === '출고예정' ? '출고 확정' : '생산 확정') + '</button></div>';
    } else {
      h += '<button type="button" class="ghost wide mt16" data-act="edit" data-v="' + esc(l.id) + '">고치기·지우기</button>';
    }
    h += '<button type="button" class="ghost wide mt8" data-act="close">닫기</button>';
    return h;
  }

  function openConfirm(ids) {
    var ls = ids.map(findPlan).filter(function (l) { return l && !l.fut; });
    if (!ls.length) { toast(ERR.not_found); return; }
    var allPast = ls.every(function (l) { return l.date <= S.today; });
    openSheet({ kind: 'confirm', ids: ls.map(function (l) { return l.id; }), dmode: allPast ? 'keep' : 'date', date: S.today, qty: '', cust: '', keepRest: true });
  }

  function restHtml() {
    var sh = S.sheet, l = findPlan(sh.ids[0]);
    if (!l) return '';
    var n = parseKg(sh.qty);
    if (String(sh.qty || '').trim() === '') return '비워 두면 예정 수량 ' + fmt(l.qty) + ' kg으로 확정합니다.';
    if (n === null || n <= 0) return '<span class="bad">수량을 kg 숫자로 넣어 주세요.</span>';
    if (n < l.qty) {
      return '<label class="check"><input type="checkbox" data-in="cfrest"' + (sh.keepRest ? ' checked' : '') + '> 남은 ' + fmt(l.qty - n) + ' kg은 ' + esc(fmtDate(l.date)) + ' ' + l.type + '으로 남겨 두기</label>';
    }
    if (n > l.qty) return '예정보다 ' + fmt(n - l.qty) + ' kg 많게 확정합니다.';
    return '';
  }

  function sheetConfirm() {
    var sh = S.sheet, ls = sh.ids.map(findPlan).filter(Boolean);
    if (!ls.length) return '<p>그 사이에 바뀌었거나 지워진 예정입니다.</p><button type="button" class="ghost wide mt16" data-act="close">닫기</button>';
    var single = ls.length === 1, l = ls[0];
    var allPast = ls.every(function (x) { return x.date <= S.today; });
    var noCust = single ? 0 : ls.filter(function (x) { return x.type === '출고예정' && !x.cust; }).length;
    var h = '<h2 class="h2" id="sh-title">' + (single ? (l.type === '출고예정' ? '출고 확정' : '생산 확정') : ls.length + '건 확정') + '</h2>';
    h += '<p class="muted">확정하면 현재고에 들어갑니다(' + (single ? (l.type === '출고예정' ? '출고' : '생산') : '출고예정 → 출고, 생산예정 → 생산') + ').</p>';
    h += '<ul class="cflist">' + ls.map(function (x) {
      return '<li class="cfrow"><span class="cfname">' + sw(x.color, x.prod) + '<span>' + ptxt(x.prod) + ' · ' + esc(x.color) + '</span></span><b>' + (isSale(x.type) ? '-' : '+') + fmt(x.qty) + ' kg</b>' +
        '<small class="muted">' + esc(x.type + ' · ' + fmtDate(x.date) + (x.cust ? ' · ' + x.cust : '')) + '</small></li>';
    }).join('') + '</ul>';
    h += '<p class="label mt16">실제 날짜</p><div class="chips">';
    if (allPast) h += chip('예정 날짜대로' + (single ? ' (' + fmtDate(l.date) + ')' : ''), sh.dmode === 'keep', 'cfkeep', 'keep');
    var y = addDays(S.today, -1), isDate = sh.dmode === 'date', other = isDate && sh.date !== S.today && sh.date !== y;
    h += chip('오늘', isDate && sh.date === S.today, 'cfdate', S.today) + chip('어제', isDate && sh.date === y, 'cfdate', y);
    h += '<label class="datebox" data-on="' + other + '">' + ICON.cal + '<span>' + (other ? esc(fmtDate(sh.date)) : '다른 날짜') + '</span>' +
      '<input type="date" id="cf-date" data-ch="cfdate" max="' + S.today + '" value="' + sh.date + '" aria-label="실제 날짜 고르기"></label></div>';
    if (single) {
      h += '<label class="label mt16" for="cf-qty">실제 수량 (kg)</label><input id="cf-qty" class="text" type="text" inputmode="numeric" autocomplete="off" data-in="cfqty" value="' + esc(sh.qty) + '" placeholder="' + fmt(l.qty) + '">';
      h += '<div class="hint" id="cf-rest">' + restHtml() + '</div>';
      if (l.type === '출고예정' && !l.cust) {
        h += '<label class="label mt12" for="cf-cust">거래처</label><input id="cf-cust" class="text" type="text" list="cust-list" autocomplete="off" maxlength="60" data-in="cfcust" value="' + esc(sh.cust) + '">';
      }
    } else if (noCust) {
      h += '<p class="warnbox mt12">거래처가 없는 출고예정 ' + noCust + '건이 있어 한꺼번에 확정할 수 없습니다. 그 줄을 눌러 거래처를 넣고 하나씩 확정해 주세요.</p>';
    }
    h += '<div class="two mt16"><button type="button" class="ghost" data-act="close">취소</button><button type="button" class="primary" data-act="cfsave"' +
      (S.busy || noCust ? ' disabled' : '') + '>' + (S.busy ? '저장 중…' : '확정') + '</button></div>';
    return h;
  }

  function confirmSave() {
    if (S.busy) return;
    var sh = S.sheet, ls = sh.ids.map(findPlan).filter(Boolean);
    if (!ls.length) { toast(ERR.not_found); return; }
    var single = ls.length === 1;
    var p = { ids: ls.map(function (l) { return l.id; }), date: sh.dmode === 'keep' ? 'keep' : sh.date };
    if (p.date !== 'keep' && (!isYmd(p.date) || p.date > S.today)) { toast(ERR.future_date); return; }
    if (single) {
      var q = cleanNum(sh.qty);
      if (q) {
        if (!/^\d+$/.test(q) || Number(q) <= 0) { toast(ERR.bad_qty); return; }
        p.qty = q;
        p.keepRest = !!sh.keepRest;
      }
      if (ls[0].type === '출고예정' && !ls[0].cust) {
        if (!String(sh.cust || '').trim()) { toast(ERR.need_cust); var c = document.getElementById('cf-cust'); if (c) c.focus(); return; }
        p.cust = String(sh.cust).trim();
      }
    }
    S.busy = true;
    renderSheet();
    call('apiConfirm', p).then(function (r) {
      S.busy = false;
      apply(r);
      S.sheet = null;
      render();
      toastOk('확정했습니다 · ' + ls.length + '건 · 현재고에 반영');
    }, function (e) {
      S.busy = false;
      renderSheet();
      failed(e);
    });
  }

  function goPlanProd(k) {
    var it = S.byKey[k], s = S.plan.sum[k];
    if (!it) return;
    S.allAddFrom = S.tab;
    S.allAdd = '생산예정';
    S.inType = '생산예정';
    store('nmc_inv_type', '생산예정');
    S.price = {}; S.inMemo = ''; S.inCust = ''; S.inPo = '';
    S.inPDate = s && s.shortEff && s.shortEff >= S.today ? s.shortEff : S.today;
    S.qty = {};
    if (s && s.need) S.qty[k] = String(s.need);
    S.inProd = it.prod;
    S.sheet = null;
    render();
    var el = document.getElementById('q-' + it.idx);
    if (el) { el.scrollIntoView({ block: 'center' }); el.focus({ preventScroll: true }); }
    toast('부족분을 넣어 두었습니다. 날짜와 수량을 확인하고 저장하세요.');
  }

  /* 연간 */
  function zeroY() { return { prod: 0, out: 0, ban: 0, adj: 0, rev: 0, revKnown: 0, kgKnown: 0, kgEst: 0, kgNone: 0, planOut: 0, planProd: 0, close: 0 }; }
  function addY(t, x) { Object.keys(t).forEach(function (f) { t[f] += x[f] || 0; }); }

  function ensureYear(y) {
    if (S.years[y] || S.yLoading[y] || S.yErr[y]) return;
    S.yLoading[y] = true;
    var gen = S.gen;
    call('apiYear', y).then(function (Y) {
      if (gen !== S.gen) { render(); return; }
      S.yLoading[y] = false;
      S.years[Y.y] = Y;
      render();
    }, function (e) {
      if (gen !== S.gen) return;
      if (isAuth(e)) { lockDown(ERR.expired); return; }
      S.yLoading[y] = false;
      S.yErr[y] = true;
      render();
    });
  }

  function revText(x) {
    if (!x.out) return '–';
    if (!x.rev) return '단가 없음';
    return won(x.rev);
  }
  function revMarks(x) {
    var m = '';
    if (x.kgEst) m += '<span class="est">추정</span>';
    if (x.kgNone && x.rev) m += '<span class="est">일부 빠짐</span>';
    return m;
  }

  function viewYear() {
    var y = S.yv, Y = S.years[y];
    var h = '<div class="stack"><div class="month"><button type="button" class="iconbtn" data-act="yprev" aria-label="이전 해"' + (y <= S.yMin ? ' disabled' : '') + '>' + ICON.chevL + '</button>' +
      '<span class="ml">' + esc(y) + '년</span><button type="button" class="iconbtn" data-act="ynext" aria-label="다음 해"' + (y >= S.yMax ? ' disabled' : '') + '>' + ICON.chevR + '</button></div>';
    if (!Y) {
      ensureYear(y);
      if (S.yErr[y]) return h + '<section class="card"><p class="muted">' + esc(errText('')) + '</p><button type="button" class="primary mt12" data-act="yretry" data-v="' + y + '">다시 불러오기</button></section></div>';
      return h + '<section class="card"><p class="muted">불러오는 중…</p></section></div>';
    }
    // 고르기: '' = 전체, 제품 이름, 'line:분류' = 분류 하나(칼라칩·폐타이어)의 합
    var lines = [];
    Y.prods.forEach(function (p) { if (lines.indexOf(lineOf(p)) < 0) lines.push(lineOf(p)); });
    var multi = lines.length > 1;
    var sel = S.yProd || '';
    var selLine = sel.indexOf('line:') === 0 ? sel.slice(5) : null;
    if (selLine != null && (!multi || lines.indexOf(selLine) < 0)) selLine = null;
    var P = selLine == null && sel && Y.prods.indexOf(sel) >= 0 ? sel : '';
    var lineSum = function (o, ln) {
      var t = zeroY();
      Y.prods.forEach(function (p) { if (lineOf(p) === ln && o.p[p]) addY(t, o.p[p]); });
      return t;
    };
    var pick = function (o) { return selLine != null ? lineSum(o, selLine) : P ? (o.p[P] || zeroY()) : o.t; };
    h += '<div class="chips" role="group" aria-label="제품 고르기">' + chip(multi ? '전체' : '모든 제품', !P && selLine == null, 'yprod', '') +
      (multi ? lines.map(function (ln) { return chip(lineName(ln) + ' 전체', selLine === ln, 'yprod', 'line:' + ln); }).join('') : '') +
      Y.prods.filter(function (p) { return S.prods.indexOf(p) >= 0 || Y.months.some(function (o) { return o.p[p] && (o.p[p].out || o.p[p].prod); }); })
        .map(function (p) { return chip(p, P === p, 'yprod', p).replace('class="chip"', 'class="chip ' + pcls(p) + '"'); }).join('') + '</div>';

    var tot = zeroY(), done = [], cur = null, firstM = '';
    Y.months.forEach(function (o) {
      var x = pick(o);
      if (o.state === 'done' || o.state === 'cur') { addY(tot, x); if (!firstM) firstM = o.ym; }
      if (o.state === 'done') done.push(x);
      if (o.state === 'cur') cur = x;
    });
    var label = selLine != null ? lineName(selLine) + ' 전체' : P ? P : '전체';
    h += '<section class="card"><p class="sumhead">' + esc(y) + '년 ' + esc(label) + ' · ' + (firstM ? Number(firstM.slice(5)) + '월부터 기록' : '기록 없음') + (cur ? ' (이번 달은 오늘까지)' : '') + '</p>';
    if (firstM) {
      h += '<div class="sumrow">' + '<div class="tile"><span>생산</span><b>' + tons(tot.prod) + '톤</b><small>' + fmt(tot.prod) + ' kg</small></div>' +
        '<div class="tile"><span>판매 (출고)</span><b>' + tons(tot.out) + '톤</b><small>' + fmt(tot.out) + ' kg</small></div>' +
        (S.money ? '<div class="tile"><span>매출</span><b>' + esc(revText(tot)) + '</b><small>' + (tot.rev ? (tot.kgEst ? '기준 단가 추정 포함' : '기록된 단가') + (tot.kgNone ? ' · 단가 없는 ' + fmt(tot.kgNone) + ' kg 빠짐' : '') : '기준 단가를 넣으면 계산됩니다') + '</small></div>' : '') + '</div>';
      // 전체를 볼 때는 분류별 내역을 같이 보여 줍니다 (누르면 그 분류만 봄)
      if (multi && !P && selLine == null) {
        h += '<ul class="lbreak">' + lines.map(function (ln) {
          var x = zeroY();
          Y.months.forEach(function (o) { if (o.state === 'done' || o.state === 'cur') addY(x, lineSum(o, ln)); });
          return '<li><button type="button" class="lbtn" data-act="yprod" data-v="' + esc('line:' + ln) + '"><b>' + esc(lineName(ln)) + '</b><span>생산 ' + tons(x.prod) + '톤 · 판매 ' + tons(x.out) +
            '톤' + (S.money ? ' · 매출 ' + esc(revText(x)) + (x.kgEst ? ' (추정 포함)' : '') : '') + '</span></button></li>';
        }).join('') + '</ul>';
      }
    }
    h += '<p class="sumhead">한 달 평균 · 끝난 달 기준</p>';
    if (done.length) {
      var avg = zeroY();
      done.forEach(function (x) { addY(avg, x); });
      h += '<div class="sumrow"><div class="tile"><span>생산</span><b>' + tons(avg.prod / done.length) + '톤</b><small>끝난 달 ' + done.length + '개 평균</small></div>' +
        '<div class="tile"><span>판매</span><b>' + tons(avg.out / done.length) + '톤</b><small>끝난 달 ' + done.length + '개 평균</small></div>' +
        (S.money ? '<div class="tile"><span>매출</span><b>' + esc(avg.rev ? won(avg.rev / done.length) : '단가 없음') + '</b><small>' + (avg.kgEst ? '추정 포함' : avg.rev ? '기록된 단가' : '') + '</small></div>' : '') + '</div>';
    } else {
      h += '<p class="muted">아직 끝난 달이 없어 평균을 낼 수 없습니다. 지난 달 엑셀 재고현황을 옮겨 넣으면 바로 계산됩니다.</p>';
    }
    if (cur && Y.pace && Y.pace.days > 0) {
      var pc = Y.pace, f = pc.dim / pc.days;
      h += '<p class="sumhead">이번 달 · ' + Number(pc.ym.slice(5)) + '월 ' + pc.from + '~' + pc.to + '일 (' + pc.days + '일)</p>' +
        '<div class="sumrow"><div class="tile"><span>생산 (실제)</span><b>' + tons(cur.prod) + '톤</b><small>이 속도면 한 달 약 ' + tons(cur.prod * f) + '톤 <span class="est">추정</span></small></div>' +
        '<div class="tile"><span>판매 (실제)</span><b>' + tons(cur.out) + '톤</b><small>이 속도면 한 달 약 ' + tons(cur.out * f) + '톤 <span class="est">추정</span></small></div></div>';
      h += '<p class="note">추정 = 지금까지의 실제 양 ÷ ' + pc.days + '일 × ' + pc.dim + '일. 쉬는 날이나 큰 출고 한 번에 따라 크게 달라질 수 있습니다.</p>';
    }
    h += '</section>';

    // 월별 표
    // 기록 없는 달·예정 없는 다음 달이 이어지면 한 줄로 묶습니다 (예: 1~9월)
    var rows = [];
    Y.months.forEach(function (o) {
      var x = pick(o), empty = (o.state === 'none' && !o.hasClose) || (o.state === 'future' && !x.planOut) ? o.state : '';
      var last = rows[rows.length - 1];
      if (empty && last && last.empty === empty) { last.to = o.ym; return; }
      rows.push({ o: o, x: x, empty: empty, to: o.ym });
    });
    var mlabel = function (r) { var a = Number(r.o.ym.slice(5)), b = Number(r.to.slice(5)); return a === b ? a + '월' : a + '~' + b + '월'; };
    h += '<section class="card"><h2 class="label">월별 · 톤 (1톤 = 1,000 kg)</h2><div class="tscroll wide-only"><table class="mt yt"><thead><tr><th scope="col">월</th><th scope="col">생산</th><th scope="col">판매</th>' + (S.money ? '<th scope="col">매출</th>' : '') + '<th scope="col">월말 재고</th><th scope="col">출고예정</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var o = r.o, x = r.x, m = mlabel(r) + (o.state === 'cur' ? ' (진행 중)' : '');
      h += '<tr class="' + o.state + '"><th scope="row">' + esc(m) + '</th>';
      if (o.state === 'none') h += '<td class="none" colspan="' + (S.money ? 3 : 2) + '">기록 없음</td>';
      else if (o.state === 'future') h += '<td class="none" colspan="' + (S.money ? 3 : 2) + '"></td>';
      else h += '<td>' + tons(x.prod) + '</td><td>' + tons(x.out) + '</td>' + (S.money ? '<td>' + esc(revText(x)) + revMarks(x) + '</td>' : '');
      h += '<td>' + (o.hasClose && o.state !== 'future' ? tons(x.close) : '<span class="z">–</span>') + '</td><td>' + (x.planOut ? tons(x.planOut) : '<span class="z">–</span>') + '</td></tr>';
    });
    h += '</tbody><tfoot><tr><th scope="row">합계</th><td>' + tons(tot.prod) + '</td><td>' + tons(tot.out) + '</td>' + (S.money ? '<td>' + esc(revText(tot)) + '</td>' : '') + '<td></td><td></td></tr></tfoot></table></div>';
    h += '<ul class="mlist narrow-only">';
    rows.forEach(function (r) {
      var o = r.o, x = r.x, m = mlabel(r);
      if (o.state === 'future' && !x.planOut) return;
      var main, sub = [];
      if (o.state === 'none') { main = '기록 없음'; if (o.hasClose) sub.push('월말 재고 ' + tons(x.close) + '톤'); }
      else if (o.state === 'future') { main = '–'; sub.push('출고예정 ' + tons(x.planOut) + '톤'); }
      else {
        main = '판매 ' + tons(x.out) + '톤';
        sub.push('생산 ' + tons(x.prod) + '톤');
        if (S.money) sub.push('매출 ' + revText(x) + (x.kgEst ? ' (추정)' : ''));
        sub.push((o.state === 'cur' ? '현재 재고 ' : '월말 재고 ') + tons(x.close) + '톤');
        if (x.planOut) sub.push('출고예정 ' + tons(x.planOut) + '톤');
      }
      h += '<li class="mrow' + (o.state === 'none' ? ' none' : '') + '"><span class="mname">' + esc(m) + (o.state === 'cur' ? ' <span class="rel">진행 중</span>' : '') + '</span><b class="mclose">' + esc(main) + '</b>' +
        (sub.length ? '<small>' + esc(sub.join(' · ')) + '</small>' : '') + '</li>';
    });
    h += '</ul>';
    if (S.money) h += '<p class="note">판매 = 출고(남명 자사 시공 포함). 매출 = 출고 kg × 단가. 기록에 단가가 있으면 그 값을, 없으면 제품의 기준 단가를 씁니다(<span class="est">추정</span>). 단가를 알 수 없는 출고는 매출에서 빠집니다(<span class="est">일부 빠짐</span>). 기록 없음 = 이 앱에 기록이 들어오기 전의 달.</p>';
    else h += '<p class="note">판매 = 출고(남명 자사 시공 포함). 매출 금액과 기준 단가는 관리자 화면에서 로그인하면 보입니다. 기록 없음 = 이 앱에 기록이 들어오기 전의 달.</p>';
    if (S.money) h += '<button type="button" class="ghost wide mt12" data-act="bpopen">기준 단가 넣기·고치기</button>';
    h += '</section>';
    return h + '</div>';
  }

  /* 기준 단가 칸: 색상 제품은 제품마다 하나, 규격·종류 제품(고무분말 5-7mm, 타이어 코드 등)은 줄마다 */
  function priceKeys() {
    var out = [];
    S.prods.forEach(function (p) {
      if (S.kind[p] && S.kind[p] !== 'color') itemsOf(p).forEach(function (it) { out.push({ k: it.key, label: p + ' · ' + it.color }); });
      else out.push({ k: p, label: p });
    });
    return out;
  }

  function sheetPrice() {
    var h = '<h2 class="h2" id="sh-title">기준 단가 (원/kg)</h2>';
    h += '<p class="muted">출고 기록에 단가가 없으면 이 값으로 매출을 추정합니다. 색상 제품은 모든 색상에 같은 값이 들어가고, 규격·종류로 나뉜 제품은 하나씩 넣습니다. 색상마다 다르게 하려면 구글 시트 \'재고품목\'의 E열에서 고치세요.</p><div class="form">';
    priceKeys().forEach(function (x, i) {
      var bp = baseOf(x.k);
      h += '<label class="label" for="bp-' + i + '">' + esc(x.label) + '</label><input id="bp-' + i + '" class="text" type="text" inputmode="numeric" autocomplete="off" data-in="bp" data-p="' + esc(x.k) + '" value="' +
        esc(S.sheet.v[x.k] || '') + '" placeholder="' + (bp === 'mixed' ? '색상마다 다름 (그대로 두기)' : '비어 있음') + '">';
    });
    h += '</div><div class="two mt16"><button type="button" class="ghost" data-act="close">취소</button><button type="button" class="primary" data-act="bpsave"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '저장 중…' : '저장') + '</button></div>';
    return h;
  }

  function openPrice() {
    var v = {}, orig = {};
    priceKeys().forEach(function (x) { var bp = baseOf(x.k); v[x.k] = orig[x.k] = typeof bp === 'number' ? String(bp) : ''; });
    openSheet({ kind: 'price', v: v, orig: orig });
  }

  function priceSave() {
    if (S.busy) return;
    var sh = S.sheet, prices = {}, n = 0, bad = null;
    priceKeys().forEach(function (x) {
      var s = cleanNum(sh.v[x.k]);
      if (s === cleanNum(sh.orig[x.k])) return;
      if (s === '' && baseOf(x.k) === 'mixed') return;
      if (s && !/^\d+$/.test(s)) { if (bad == null) bad = x.label; return; }
      prices[x.k] = s;
      n++;
    });
    if (bad != null) { toast(ERR.bad_price + ' (' + bad + ')'); return; }
    if (!n) { closeSheet(); return; }
    S.busy = true;
    renderSheet();
    call('apiPrice', { prices: prices }).then(function (r) {
      S.busy = false;
      apply(r);
      S.sheet = null;
      render();
      toastOk('기준 단가를 저장했습니다 · ' + n + '개');
    }, function (e) {
      S.busy = false;
      renderSheet();
      failed(e);
    });
  }

  function monthBar() {
    var cur = S.today.slice(0, 7);
    return '<div class="month"><button type="button" class="iconbtn" data-act="mprev" aria-label="이전 달"' + (S.ym <= S.firstYm ? ' disabled' : '') + '>' + ICON.chevL + '</button>' +
      '<span class="ml">' + esc(fmtYm(S.ym)) + '</span>' +
      '<button type="button" class="iconbtn" data-act="mnext" aria-label="다음 달"' + (S.ym >= cur ? ' disabled' : '') + '>' + ICON.chevR + '</button></div>';
  }

  function pendingCard(ym) {
    if (S.mErr[ym]) return '<section class="card"><p class="muted">' + esc(errText('')) + '</p><button type="button" class="primary mt12" data-act="mretry" data-v="' + ym + '">다시 불러오기</button></section>';
    return '<section class="card"><p class="muted">불러오는 중…</p></section>';
  }

  function nz(v) { return v ? fmt(v) : '<span class="z">–</span>'; }
  function snz(v) { return v ? sfmt(v) : '<span class="z">–</span>'; }

  function viewMonth() {
    var ym = S.ym, m = S.months[ym];
    var h = '<div class="stack">' + monthBar();
    if (!m) { ensureMonth(ym); return h + pendingCard(ym) + '</div>'; }
    var rows = monthRows(m), isCur = ym === S.today.slice(0, 7);
    var prods = S.prods.slice();
    Object.keys(rows).forEach(function (k) { var p = k.split('|')[0]; if (prods.indexOf(p) < 0) prods.push(p); });
    var T = {}, G = zero(), LT = {}, lines = [];
    prods.forEach(function (p) { T[p] = zero(); var ln = lineOf(p); if (!LT[ln]) { LT[ln] = zero(); lines.push(ln); } });
    Object.keys(rows).forEach(function (k) { var p = k.split('|')[0]; addTo(T[p], rows[k]); addTo(G, rows[k]); addTo(LT[lineOf(p)], rows[k]); });
    var own = {}, ownAll = 0;
    m.records.forEach(function (r) {
      if (r.type !== '출고' || r.cust !== OWN) return;
      own[lineOf(r.prod)] = (own[lineOf(r.prod)] || 0) + r.qty;
      ownAll += r.qty;
    });
    var multi = lines.length > 1;
    var tl = function (x, o) {
      return tile('생산', x.prod) + tile('출고', x.out, o ? OWN + ' ' + fmt(o) + ' 포함 (자사 시공)' : '') + tile('반입', x.ban) +
        (x.adj ? tile('재고조정', x.adj) : '') + tile(isCur ? '현재 재고' : '월말 재고', x.close);
    };
    h += '<section class="card"><p class="label">' + esc(fmtYm(ym)) + (isCur ? ' · ' + esc(fmtDate(S.today)) + '까지' : '') + ' 합계 (kg)</p>';
    if (!multi) h += '<div class="tiles">' + tl(G, ownAll) + '</div>';
    else lines.forEach(function (ln, gi) {
      h += '<div class="gsum' + (gi ? ' next' : '') + '"><p class="glabel">' + esc(lineName(ln)) + '</p><div class="tiles">' + tl(LT[ln], own[ln]) + '</div></div>';
    });
    h += '</section>';

    h += '<section class="card"><h2 class="label">제품별 (kg)</h2>';
    prods.forEach(function (p) { h += prodBlock(p, T[p], false); });
    if (multi) lines.forEach(function (ln) { h += prodBlock(lineName(ln) + ' 합계', LT[ln], true); });
    else h += prodBlock('전체', G, true);
    h += '</section>';

    h += colorTable(rows);
    h += custCard(m);
    return h + '</div>';
  }

  function prodBlock(name, x, total) {
    var h = '<div class="pblock' + (total ? ' total' : '') + '"><p class="pname">' + esc(name) + '</p><dl class="nums">';
    h += '<div><dt>이월</dt><dd>' + fmt(x.open) + '</dd></div><div><dt>생산</dt><dd>' + fmt(x.prod) + '</dd></div>' +
      '<div><dt>반입</dt><dd>' + fmt(x.ban) + '</dd></div><div><dt>출고</dt><dd>' + fmt(x.out) + '</dd></div>';
    if (x.adj) h += '<div><dt>재고조정</dt><dd>' + sfmt(x.adj) + '</dd></div>';
    h += '<div class="em"><dt>월말</dt><dd>' + fmt(x.close) + '</dd></div></dl></div>';
    return h;
  }

  function colorTable(rows) {
    var p = S.mProd, vl = vlabel(p);
    var h = '<section class="card"><h2 class="label">' + vl + '별 (kg)</h2>' + prodTabs('mprod', p, false);
    var list = itemsOf(p).map(function (it) { return { it: it, x: rows[it.key] || zero() }; });
    var shown = S.mAll ? list : list.filter(function (o) { var x = o.x; return x.open || x.prod || x.ban || x.out || x.adj || x.close; });
    var hasAdj = list.some(function (o) { return o.x.adj; });
    h += '<div class="tscroll mt8 wide-only"><table class="mt"><thead><tr><th scope="col">' + vl + '</th><th scope="col">이월</th><th scope="col">생산</th><th scope="col">반입</th><th scope="col">출고</th>' +
      (hasAdj ? '<th scope="col">재고조정</th>' : '') + '<th scope="col">월말</th></tr></thead><tbody>';

    list.forEach(function (o) { addTo(t, o.x); });
    shown.forEach(function (o) {
      var x = o.x;
      h += '<tr><th scope="row">' + sw(o.it.color, o.it.prod) + esc(o.it.color) + '</th><td>' + nz(x.open) + '</td><td>' + nz(x.prod) + '</td><td>' + nz(x.ban) + '</td><td>' + nz(x.out) + '</td>' +

      (hasAdj ? '<td>' + sfmt(t.adj) + '</td>' : '') + '<td>' + fmt(t.close) + '</td></tr></tfoot></table></div>';
    h += '<p class="mhead narrow-only"><span>' + vl + '</span><span>월말</span></p><ul class="mlist narrow-only">';

      if (x.ban) a.push('반입 ' + fmt(x.ban));
      if (x.out) a.push('출고 ' + fmt(x.out));
      if (x.adj) a.push('재고조정 ' + sfmt(x.adj));
      return a.length ? a.join(' · ') : '움직임 없음';
    }
    shown.forEach(function (o) {
      h += '<li class="mrow"><span class="mname">' + sw(o.it.color, o.it.prod) + esc(o.it.color) + '</span><b class="mclose">' + fmt(o.x.close) + '</b><small>' + esc(parts(o.x)) + '</small></li>';
    });

  function custCard(m) {
    var by = {}, order = [], total = 0;
    m.records.forEach(function (r) {
      if (r.type !== '출고') return;
      var c = r.cust || '(거래처 없음)';
      if (!by[c]) { by[c] = { kg: 0, n: 0, lines: {} }; order.push(c); }
      by[c].kg += r.qty;
      by[c].n++;
      var k = r.prod + ' · ' + r.color;
      by[c].lines[k] = (by[c].lines[k] || 0) + r.qty;
      total += r.qty;
    });
    order.sort(function (a, b) { return by[b].kg - by[a].kg; });
    var h = '<section class="card"><h2 class="label">거래처별 출고 (kg)</h2>';
    if (!order.length) return h + '<p class="muted">이 달 출고 기록이 없습니다.</p></section>';
    h += '<ul class="clist">';
    order.forEach(function (c) {
      var o = by[c], open = S.custOpen === c;
      h += '<li><button type="button" class="crow" data-act="custopen" data-v="' + esc(c) + '" aria-expanded="' + open + '"><span class="cname">' + esc(c) +
        (c === OWN ? ' <small>자사 시공</small>' : '') + '</span><span class="cn">' + o.n + '건</span><span class="ckg">' + fmt(o.kg) + '</span><span class="cpct">' +
        (total ? Math.round(o.kg / total * 100) : 0) + '%</span></button>';
      if (open) {
        var ks = Object.keys(o.lines).sort(function (a, b) { return o.lines[b] - o.lines[a]; });
        h += '<div class="cdetail">' + ks.map(function (k) { return '<p><span>' + esc(k) + '</span><b>' + fmt(o.lines[k]) + '</b></p>'; }).join('') + '</div>';
      }
      h += '</li>';
    });
    h += '</ul><p class="cftotal"><span>합계</span><span>' + fmt(total) + ' kg</span></p></section>';
    return h;
  }

  /* 기록 */
  function viewLog() {
    var d = S.day, ym = d.slice(0, 7), m = S.months[ym];
    var first = S.firstYm + '-01';
    var h = '<div class="stack"><div class="daybar"><button type="button" class="iconbtn" data-act="dprev" aria-label="전날"' + (d <= first ? ' disabled' : '') + '>' + ICON.chevL + '</button>' +
      '<label class="datebox">' + ICON.cal + '<span>' + esc(fmtDate(d)) + '</span><input type="date" id="log-date" data-ch="day" min="' + first + '" max="' + S.today + '" value="' + d + '" aria-label="날짜 고르기"></label>' +
      '<span class="mgroup">' + (d !== S.today ? '<button type="button" class="chip" data-act="dtoday">오늘</button>' : '') +
      '<button type="button" class="iconbtn" data-act="dnext" aria-label="다음날"' + (d >= S.today ? ' disabled' : '') + '>' + ICON.chevR + '</button></span></div>';
    if (!m) { ensureMonth(ym); return h + pendingCard(ym) + '</div>'; }
    var recs = m.records.filter(function (r) { return r.date === d; });
    var zt = function () { return { '생산': 0, '출고': 0, '반입': 0, '조정': 0, '기초': 0 }; };
    var t = zt(), LT = {}, lns = [];
    recs.forEach(function (r) {
      t[r.type] += r.qty;
      var ln = lineOf(r.prod);
      if (!LT[ln]) { LT[ln] = zt(); lns.push(ln); }
      LT[ln][r.type] += r.qty;
    });
    var at = function (ln) { var i = S.lines.indexOf(ln); return i < 0 ? 999 : i; };
    lns.sort(function (a, b) { return at(a) - at(b); });
    var dt = function (x) {
      return tile('생산', x['생산']) + tile('출고', x['출고']) + tile('반입', x['반입']) + (x['조정'] ? tile('재고조정', x['조정']) : '') + (x['기초'] ? tile('기초재고', x['기초']) : '');
    };
    h += '<section class="card"><p class="label">' + esc(fmtDate(d)) + ' 합계 (kg)</p>';
    if (multiLine() && lns.length) lns.forEach(function (ln, gi) {
      h += '<div class="gsum' + (gi ? ' next' : '') + '"><p class="glabel">' + esc(lineName(ln)) + '</p><div class="tiles">' + dt(LT[ln]) + '</div></div>';
    });
    else h += '<div class="tiles">' + dt(t) + '</div>';
    h += '</section>';
    if (!recs.length) return h + '<section class="card"><p class="muted">이 날짜에는 기록이 없습니다.</p></section></div>';
    var groups = [];
    function grp(title, list) { if (list.length) groups.push([title, list]); }
    grp('생산', recs.filter(function (r) { return r.type === '생산'; }));
    var custs = [];
    recs.forEach(function (r) { if (r.type === '출고' && custs.indexOf(r.cust) < 0) custs.push(r.cust); });
    custs.forEach(function (c) { grp('출고 · ' + (c || '거래처 없음'), recs.filter(function (r) { return r.type === '출고' && r.cust === c; })); });
    grp('반입', recs.filter(function (r) { return r.type === '반입'; }));
    grp('재고조정', recs.filter(function (r) { return r.type === '조정'; }));
    grp('기초재고', recs.filter(function (r) { return r.type === '기초'; }));
    groups.forEach(function (g) {
      var sum = 0;
      g[1].forEach(function (r) { sum += r.qty; });
      h += '<section class="card"><h2 class="label">' + esc(g[0]) + ' · ' + g[1].length + '건 · ' + (g[0] === '재고조정' ? sfmt(sum) : fmt(sum)) + ' kg</h2><ul class="rlist">' +
        g[1].map(function (r) { return recRow(r, 'day'); }).join('') + '</ul></section>';
    });
    h += '<p class="hint">기록을 누르면 고치거나 지울 수 있습니다.</p>';
    return h + '</div>';
  }

      h += '<label class="label" for="ed-po">발주번호·현장 (선택)</label><input id="ed-po" class="text" type="text" autocomplete="off" maxlength="60" data-ed="po" value="' + esc(d.po) + '">';
      h += '<label class="label" for="ed-price">단가 (원/kg, 선택)</label><input id="ed-price" class="text" type="text" inputmode="numeric" autocomplete="off" data-ed="price" value="' + esc(d.price) + '" placeholder="비우면 기준 단가로 추정">';

    h += '<button type="button" class="danger-link mt8" data-act="eddel"' + (S.busy ? ' disabled' : '') + '>' + (S.sheet.confirmDel ? '한 번 더 누르면 지웁니다' : '이 기록 지우기') + '</button>';
    return h;

  function editSave() {
    if (S.busy) return;
    var d = S.sheet.draft, orig = S.sheet.orig;
    var q = String(d.qty).replace(/[,\s]/g, '');
    var ok = orig.type === '조정' ? /^-?\d+$/.test(q) : /^\d+$/.test(q);
    if (!ok || Number(q) === 0) { toast(ERR.bad_qty); return; }
    if (!isYmd(d.date)) { toast(ERR.bad_date); return; }
    var plan = isPlan(d.type);
    if (!plan && d.date > S.today) { toast(ERR.future_date); return; }
    if (plan && d.date < S.today && d.date !== orig.date) { toast(ERR.past_plan); return; }
    if (plan && d.date > planMax()) { toast(ERR.bad_date); return; }
    if (isSale(d.type) && !String(d.cust).trim()) { toast(ERR.need_cust); return; }
    var pr = cleanNum(d.price);
    if (isSale(d.type) && pr && !/^\d+$/.test(pr)) { toast(ERR.bad_price); return; }
    S.busy = true;
    renderSheet();
    var body = { date: d.date, type: d.type, prod: d.prod, color: d.color, qty: q, cust: String(d.cust).trim(), memo: String(d.memo).trim() };
    if (isSale(d.type)) { body.price = pr; body.po = String(d.po || '').trim(); }
    call('apiUpdate', S.sheet.id, body)
      .then(function (r) {
        S.busy = false;
        apply(r);
        S.sheet = null;
        render();
        toastOk('고쳤습니다');
      }, function (e) {
        S.busy = false;
        renderSheet();
        failed(e);
      });
  }

  function editDelete() {
    if (S.busy) return;
    if (!S.sheet.confirmDel) { S.sheet.confirmDel = true; renderSheet(); return; }
    S.busy = true;
    renderSheet();
    call('apiDelete', S.sheet.id).then(function (r) {
      S.busy = false;
      apply(r);
      S.sheet = null;
      render();
      toastOk('지웠습니다');
    }, function (e) {
      S.busy = false;
      renderSheet();
      failed(e);
    });
  }

  function adjSave() {
    if (S.busy) return;
    var k = S.sheet.key, it = S.byKey[k];
    var s = String(S.sheet.val || '').replace(/[,\s]/g, '');
    if (!/^\d+$/.test(s)) { toast('실제 재고를 kg 숫자로 넣어 주세요.'); return; }
    S.busy = true;
    renderSheet();
    call('apiAdjust', { prod: it.prod, color: it.color, actual: s, memo: String(S.sheet.memo || '').trim() }).then(function (r) {
      S.busy = false;
      apply(r);
      S.sheet = { kind: 'item', key: k };
      render();
      if (r.noChange) toast('장부 재고와 같아서 바꾸지 않았습니다');
      else toastOk('재고를 맞췄습니다 · 차이 ' + sfmt(r.diff) + ' kg');
    }, function (e) {
      S.busy = false;
      renderSheet();
      failed(e);
    });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    switch (act) {
      case 'overlay': if (ev.target === el) closeSheet(); return;
      case 'close': closeSheet(); return;
      case 'tab': S.tab = v; store('nmc_inv_tab2', v); S.allAdd = ''; S.sheet = null; render(); window.scrollTo(0, 0); return;
      case 'refresh': S.pnl = null; S.pnlErr = false; refresh(true); return;
      case 'login': openSheet({ kind: 'login', err: '' }); return;
      case 'dologin': doLogin(); return;
      case 'logout': doLogout(); return;
      case 'calprev': S.calYm = addMonths(S.calYm, -1); render(); return;
      case 'calnext': S.calYm = addMonths(S.calYm, 1); render(); return;
      case 'calday': S.calDay = v; render(); var dc = document.getElementById('daycard'); if (dc && dc.scrollIntoView) dc.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return;
      case 'caladd': S.inType = v === '출고예정' ? '출고예정' : '출고'; if (S.inType === '출고') S.inDate = S.calDay; else S.inPDate = S.calDay; S.qty = {}; S.price = {}; S.inCust = ''; S.inPo = ''; S.inMemo = ''; S.outMode = 'add'; S.sheet = null; render(); window.scrollTo(0, 0); return;
      case 'calback': S.outMode = 'cal'; S.qty = {}; S.price = {}; S.sheet = null; render(); return;
      case 'alladdback': S.allAdd = ''; S.qty = {}; S.price = {}; S.sheet = null; render(); window.scrollTo(0, 0); return;
      case 'sumprev': S.sumYm = addMonths(S.sumYm, -1); render(); return;
      case 'sumnext': S.sumYm = addMonths(S.sumYm, 1); render(); return;
      case 'sumtype': S.sumType = v; render(); return;
      case 'anaper': S.anaPer = v; render(); return;
      case 'statsretry': S.sErr = {}; S.pnlErr = false; render(); return;
      case 'retry': start(); return;
      case 'intype': S.inType = v; store('nmc_inv_type', v); render(); return;
      case 'indate': S.inDate = v; render(); return;
      case 'inpdate': S.inPDate = v; render(); return;
      case 'newplan': S.allAddFrom = S.tab; S.allAdd = v; S.inType = v; store('nmc_inv_type', v); S.qty = {}; S.price = {}; S.inMemo = ''; S.inCust = ''; S.inPo = ''; S.sheet = null; render(); window.scrollTo(0, 0); return;
      case 'planprod': goPlanProd(v); return;
      case 'pline': openSheet({ kind: 'pline', id: v }); return;
      case 'confirm1': openConfirm([v]); return;
      case 'confirmday': openConfirm(S.plan.lines.filter(function (l) { return !l.fut && !l.overdue && l.date === v; }).map(function (l) { return l.id; })); return;
      case 'confirmall': openConfirm(S.plan.lines.filter(function (l) { return l.overdue; }).map(function (l) { return l.id; })); return;
      case 'cfkeep': S.sheet.dmode = 'keep'; renderSheet(); return;
      case 'cfdate': S.sheet.dmode = 'date'; S.sheet.date = v; renderSheet(); return;
      case 'cfsave': confirmSave(); return;
      case 'stprod': S.stProd = v; render(); return;
      case 'yprev': if (S.yv > S.yMin) { S.yv = String(Number(S.yv) - 1); render(); } return;
      case 'ynext': if (S.yv < S.yMax) { S.yv = String(Number(S.yv) + 1); render(); } return;
      case 'yretry': S.yErr[v] = false; render(); return;
      case 'yprod': S.yProd = v; render(); return;
      case 'bpopen': openPrice(); return;
      case 'bpsave': priceSave(); return;
      case 'cust': S.inCust = v; render(); return;
      case 'inprod': S.inProd = v; render(); return;
      case 'clearin': S.qty = {}; render(); return;
      case 'review': review(); return;
      case 'save': save(); return;
      case 'low': S.low = v === '1'; render(); return;
      case 'item': openSheet({ kind: 'item', key: v }); return;
      case 'initem': goInput(v); return;
      case 'adjust': openSheet({ kind: 'adjust', key: v, val: '', memo: '' }); return;
      case 'adjsave': adjSave(); return;
      case 'edit': openEdit(v); return;
      case 'edtype': S.sheet.draft.type = v; renderSheet(); return;
      case 'edsave': editSave(); return;
      case 'eddel': editDelete(); return;
      case 'mprev': if (S.ym > S.firstYm) { S.ym = addMonths(S.ym, -1); S.custOpen = null; render(); } return;
      case 'mnext': if (S.ym < S.today.slice(0, 7)) { S.ym = addMonths(S.ym, 1); S.custOpen = null; render(); } return;
      case 'mretry': S.mErr[v] = false; render(); return;
      case 'mprod': S.mProd = v; render(); return;
      case 'mall': S.mAll = !S.mAll; render(); return;
      case 'custopen': S.custOpen = S.custOpen === v ? null : v; render(); return;
      case 'dprev': setDay(addDays(S.day, -1)); return;
      case 'dnext': if (S.day < S.today) setDay(addDays(S.day, 1)); return;
      case 'dtoday': setDay(S.today); return;
    }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var k = el.getAttribute('data-in');
    if (k === 'qty') { onQty(el); return; }
    if (k === 'cust') {
      S.inCust = el.value;
      var chips = root.querySelectorAll('[data-act="cust"]');
      for (var i = 0; i < chips.length; i++) chips[i].setAttribute('aria-pressed', String(chips[i].getAttribute('data-v') === el.value));
      return;
    }
    if (k === 'memo') { S.inMemo = el.value; return; }
    if (k === 'po') { S.inPo = el.value; return; }
    if (k === 'price') {
      var p = el.getAttribute('data-p');
      S.price[p] = el.value;
      var pa = document.getElementById('pamt-' + el.getAttribute('data-g'));
      if (pa) pa.textContent = amtText(p, Number(el.getAttribute('data-k')) || 0);
      return;
    }
    if (k === 'adj' && S.sheet) { S.sheet.val = el.value; var dd = document.getElementById('adj-diff'); if (dd) dd.textContent = adjDiffText(); return; }
    if (k === 'adjmemo' && S.sheet) { S.sheet.memo = el.value; return; }
    if (k === 'cfqty' && S.sheet) { S.sheet.qty = el.value; var cr = document.getElementById('cf-rest'); if (cr) cr.innerHTML = restHtml(); return; }
    if (k === 'cfcust' && S.sheet) { S.sheet.cust = el.value; return; }
    if (k === 'bp' && S.sheet) { S.sheet.v[el.getAttribute('data-p')] = el.value; return; }
    var e2 = el.getAttribute('data-ed');
    if (e2 && S.sheet && S.sheet.kind === 'edit' && ['qty', 'cust', 'memo', 'price', 'po'].indexOf(e2) >= 0) S.sheet.draft[e2] = el.value;
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var a = el.getAttribute('data-ch');
    if (a === 'indate') {
      if (isYmd(el.value) && el.value <= S.today) S.inDate = el.value;
      else toast(el.value > S.today ? ERR.future_date : ERR.bad_date);
      render();
      return;
    }
    if (a === 'inpdate') {
      if (isYmd(el.value) && el.value >= S.today && el.value <= planMax()) S.inPDate = el.value;
      else toast(el.value < S.today ? ERR.past_plan : ERR.bad_date);
      render();
      return;
    }
    if (a === 'cfdate' && S.sheet && S.sheet.kind === 'confirm') {
      if (isYmd(el.value) && el.value <= S.today) { S.sheet.dmode = 'date'; S.sheet.date = el.value; }
      else toast(ERR.future_date);
      renderSheet();
      return;
    }
    if (el.getAttribute('data-in') === 'cfrest' && S.sheet) { S.sheet.keepRest = el.checked; return; }
    if (a === 'day') { if (el.value) setDay(el.value); return; }
    var e2 = el.getAttribute('data-ed');
    if (!e2 || !S.sheet || S.sheet.kind !== 'edit') return;
    var d = S.sheet.draft;
    if (e2 === 'prod') {
      d.prod = el.value;
      if (!S.byKey[d.prod + '|' + d.color]) { var cs = itemsOf(d.prod); if (cs.length) d.color = cs[0].color; }
      renderSheet();
    } else if (e2 === 'color') d.color = el.value;
    else if (e2 === 'date') d.date = el.value;
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
    var t = ev.target;
    if (ev.key === 'Enter' && t && t.id === 'lg-pw') { ev.preventDefault(); doLogin(); return; }
    if (ev.key === 'Enter' && t && t.classList && t.classList.contains('qin')) {
      ev.preventDefault();
      var all = Array.prototype.slice.call(root.querySelectorAll('.qin'));
      var i = all.indexOf(t);
      if (i >= 0 && i < all.length - 1) all[i + 1].focus();
      else { var b = root.querySelector('[data-act="review"]'); if (b && !b.disabled) b.focus(); }
    }
  });

  function refresh(loud) {
    if (S.busy || !S.ready) return;
    if (!S.admin) {
      if (ADMIN_VIEW) return;
      formCall().then(function (r) { applyForm(r); render(); if (loud) toastOk('새로 불러왔습니다'); }, function (e) { if (loud) toast(errText(e)); });
      return;
    }
    call('apiInit').then(function (r) {
      if (!isAdminResp(r)) { lockDown(ERR.expired); return; }
      apply(r);
      render();
      if (loud) toastOk('최신 기록을 불러왔습니다');
    }, function (e) { if (isAuth(e)) { lockDown(ERR.expired); return; } if (loud) toast(errText(e)); });
  }

  /* 다른 사람이 넣은 기록도 보이도록, 화면이 다시 보이면 새로 불러옵니다. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !S.ready || S.busy) return;
    refresh(false);
  });

  /* 생산 입력 화면용 자료 (제품·색상 목록만) */
  function applyForm(r) {
    S.gen++;
    S.today = r.today;
    setItems(r.items || []);
    S.stock = r.stock || {}; S.hasStock = !!r.stock; S.customers = []; S.firstYm = r.today.slice(0, 7); S.badRows = []; S.ver = r.ver || '';
    S.money = false;
    S.plan = { lines: [], sum: {} };
    S.months = {}; S.mErr = {}; S.mLoading = {}; S.years = {}; S.yErr = {}; S.yLoading = {};
    S.inType = '생산';
    if (!S.inDate || S.inDate > S.today) S.inDate = S.today;
    Object.keys(S.qty).forEach(function (k) { if (!S.byKey[k]) delete S.qty[k]; });
  }

  /* 첫 화면의 '재고 전체 (관리자)'로 들어오면(stock.html?admin=1) 로그인 창을 바로 엽니다. 주소의 ?admin=1 은 지웁니다. */
  function start(quiet) {
    S.fatal = false;
    render();
    if (!ADMIN_VIEW) {
      formCall().then(function (r) { S.admin = false; applyForm(r); S.ready = true; render(); }, function () { S.fatal = true; render(); });
      return;
    }
    var tok = getToken();
    var first = tok ? call('apiInit').then(function (r) { if (!isAdminResp(r)) throw new Error('auth'); return r; }) : Promise.reject(new Error('auth'));
    first.then(function (r) {
      S.admin = true;
      var t = stored('nmc_inv_type');
      S.inType = ACT_TYPES.concat(PLAN_TYPES).indexOf(t) >= 0 ? t : '출고';
      apply(r);
      S.ready = true;
      render();
    }, function (e) {
      if (!isAuth(e)) { S.fatal = true; render(); return; }
      if (tok) { setToken(''); toast(ERR.expired); }
      S.admin = false;
      S.ready = true;
      render();
      if (!quiet) openSheet({ kind: 'login', err: '' });
    });
  }

  if (DEMO) window.__nmc = { S: S, project: project };   // 미리보기에서만: 화면 시험용
  start();
})();
</script>
</body>
</html>
