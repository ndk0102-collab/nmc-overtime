<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMC 재고</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E5AA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
window.NMC_API = "https://script.google.com/macros/s/AKfycbzg5mbJ9hkPn6Ld7hzNICzRYcsTDM_vVFdWZXV2qAy6QSYJFQVOvREsvE5NjIyy_05M/exec";
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  /* 한 화면에 한 가지 일: 위에 합계, 아래에 색상별 표. 숫자는 오른쪽 정렬·같은 폭 숫자. 상태색(긴급·생산준비)은 강조색과 따로 씁니다. */
  --bg:#EEF1F5;
  --card:#FFFFFF;
  --ink:#121820;
  --ink2:#2E3742;
  --muted:#5A6471;
  --line:#D5DBE3;
  --soft:#EBEEF3;
  --accent:#1E5AA8;
  --accent-strong:#174A8C;
  --accent-soft:#E6EEF9;
  --bad:#B42318;
  --bad-soft:#FDE9E7;
  --warn:#8A5300;
  --warn-soft:#FCF0D6;
  --ok:#1B7A43;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
.wrap{max-width:980px;margin:0 auto;padding:10px 16px 40px}
.wrap.with-bar{padding-bottom:120px}
.num,.big,.tile b,.mx,.mt,.qin,.nums dd,.ckg,.lkg,.rqty{font-variant-numeric:tabular-nums}
.demo{background:#FFF4E5;color:#6E4300;border:1px solid #F2D7A6;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin:0 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}
.brand{font-size:21px;font-weight:800;letter-spacing:-0.01em;line-height:1.3}
.brand span{display:inline-block;background:var(--accent);color:#fff;border-radius:7px;padding:1px 7px;margin-right:6px;font-size:15px;letter-spacing:.06em;vertical-align:2px}
.sub{font-size:14px;color:var(--muted);font-weight:500}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink2);flex-shrink:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:5px;background:#DFE5EC;border-radius:14px;margin:0 0 12px}
@media (max-width:379px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tab{position:relative;min-height:48px;padding:0 2px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:15px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab .dot{display:inline-block;min-width:17px;height:17px;margin-left:3px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;line-height:17px;vertical-align:2px}
.tab[aria-selected="true"]{background:var(--card);color:var(--accent-strong);box-shadow:0 1px 2px rgba(18,24,32,.15)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:0 0 8px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.muted{color:var(--muted);font-size:15px}
.small{font-size:13px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 4px}
.big{font-size:34px;font-weight:800;letter-spacing:-0.01em;line-height:1.25}
.big small{font-size:17px;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--soft);border-radius:10px;padding:9px 12px;min-width:0}
.tile span{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.tile b{display:block;font-size:20px;font-weight:800;line-height:1.35}
.tile small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.datebox{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"],.datebox[data-on="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.datebox{overflow:hidden}
.datebox input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.segbtn{min-height:58px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:19px;font-weight:800;cursor:pointer}
.segbtn.sm{min-height:46px;font-size:16px}
.segbtn[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.daterow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 8px}
.daterow .label{margin:0}
.bigdate{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.text{display:block;width:100%;min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:17px}
.text:focus{border-color:var(--accent);outline:none}
select.text{padding-right:8px}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.ptab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 13px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.ptab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.pgl{flex:0 0 100%;font-size:12px;font-weight:800;color:var(--muted);margin:6px 0 -2px;letter-spacing:.02em}
.pgl:first-child{margin-top:0}
.glabel{font-size:15px;font-weight:800;color:var(--ink);margin:0}
.gsum.next{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.lbreak{list-style:none;margin:12px 0 0;padding:0}
.lbtn{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:12px;min-height:44px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lbtn b{font-size:15px;font-weight:800;flex-shrink:0}
.lbtn span{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:13px;font-weight:800}
.badge:empty{display:none}
.sw{display:inline-block;width:15px;height:15px;border-radius:4px;border:1px solid rgba(18,24,32,.22);flex-shrink:0;vertical-align:-2px;margin-right:7px}
.qlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:28px}
@media (min-width:760px){.qlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:6px 10px;padding:7px 0;border-bottom:1px solid var(--soft)}
.qname{display:flex;align-items:center;min-width:0;cursor:pointer}
.qname b{display:block;font-size:17px;line-height:1.3}
.qname small{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qname small.bad{color:var(--bad)}
.qname small.warn{color:var(--warn)}
.qname small.stk{display:block;margin-top:1px;font-size:13px;color:var(--muted);line-height:1.3}
.qname small.stk .now,.qname small.stk .aft b{display:inline}
.qname small.stk .now{font-size:23px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.qname small.stk .aft{display:block;color:var(--accent-strong);font-weight:700}
.qname small.stk .aft b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.qname small.stk .aft.neg{color:var(--bad)}
.ptot{margin:10px 0 0;font-size:15px;color:var(--muted)}
.ptot b{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.card > .daterow:first-child{margin-top:0}
/* 전체관리: 현황 · 분석 */
.tabs.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.addtitle{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--ink)}
.sumper{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-top:10px}
.sumper h3{margin:0 0 8px;font-size:16px;font-weight:800;color:var(--ink)}
.sumper h3 small{font-size:13px;font-weight:600;color:var(--muted);margin-left:8px}
.sumtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sumtiles > div{background:var(--soft);border-radius:10px;padding:8px 8px 7px;min-width:0}
.sumtiles span{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.sumtiles b{display:block;font-size:19px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;word-break:keep-all;color:var(--ink)}
.sumtiles b.money{font-size:16px}
.sumtiles b small{font-size:12px;font-weight:700;color:var(--muted);margin-left:1px}
.sumtiles i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.optseg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.optseg button{min-height:40px;padding:0 14px;border:2px solid var(--line);border-radius:20px;background:var(--card);font-size:15px;font-weight:800;color:var(--ink2);cursor:pointer}
.optseg button[aria-checked="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.optseg.big{margin:0}
.optseg.big button{min-height:44px;flex:1 1 auto}
.anarange{margin:-2px 2px 0;font-size:13.5px;color:var(--muted)}
.tent{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:10px}
.tent th,.tent td{padding:6px 3px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
.tent th[scope="row"]{white-space:normal;word-break:keep-all;line-height:1.3}
.tent thead th{font-size:12.5px;line-height:1.25;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);vertical-align:bottom}
.tent thead th small{font-size:11px;font-weight:700}
.tent thead th.cur{color:var(--accent-strong)}
.tent thead th:first-child,.tent th[scope="row"]{text-align:left}
.tent th[scope="row"]{font-weight:600;color:var(--ink2)}
.tent th[scope="row"] small{font-size:11.5px;color:var(--muted);font-weight:600}
.tent .tprod th,.tent .tprod td{background:var(--soft);font-weight:800;color:var(--ink)}
.tent .tcol{padding-left:8px}
.tent .tcol .sw{width:12px;height:12px;margin-right:4px;vertical-align:-1px}
.tent tfoot th,.tent tfoot td{font-weight:800;color:var(--ink);border-top:2px solid var(--line);border-bottom:0}
.tent td.neg{color:var(--bad)}
.anasum{margin:0 0 6px;font-size:15px;color:var(--ink2)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;column-gap:8px;padding:8px 0 7px;border-bottom:1px solid var(--soft)}
.rank li:last-child{border-bottom:0}
.rank .rk{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rank .rn{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:15px}
.rank .rn > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rv{text-align:right;white-space:nowrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .rv b{font-size:16px;color:var(--ink)}
.rank .rv small{display:block;font-size:12px}
.rank .rbar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.rank .rbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:10px 0;border-bottom:1px solid var(--soft)}
.plist .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0}
.plist .pn{font-size:17px;font-weight:800}
.plist .pp{font-size:14px;color:var(--muted);white-space:nowrap}
.plist .pp b{font-size:18px;color:var(--ink)}
.plist .pp.neg b,.plist b.neg,.ptotal b.neg{color:var(--bad)}
.plist .pd{margin:4px 0 0;font-size:14px;line-height:1.55;color:var(--ink2);word-break:keep-all}
.plist .pd.warnline{color:var(--warn)}
.hint.mt0{margin-top:0}
.plist .pd.dim{color:var(--muted);font-size:13px}
.ptotal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin:10px 0 0;padding-top:10px;border-top:2px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.ptotal dt{margin:0;color:var(--ink2)}
.ptotal dt small{font-size:12px;color:var(--muted);margin-left:4px}
.ptotal dd{margin:0;text-align:right;font-weight:700;white-space:nowrap}
.ptotal .sub{font-weight:800;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--soft)}
.ptotal .fin{font-size:17px;font-weight:800;color:var(--ink)}
.ptotal dd.neg{color:var(--bad)}
.tips .sub{margin:6px 0 0;padding-left:16px;list-style:disc}
.tips .sub li{margin:0 0 4px;font-size:14px;line-height:1.5}
.tips b.neg{color:var(--bad)}
.tips{margin:0;padding-left:20px}
.tips li{margin:0 0 12px;font-size:15px;line-height:1.65;color:var(--ink2);word-break:keep-all}
.tips li:last-child{margin-bottom:4px}
.tips li b{color:var(--ink)}
.trend{display:block;width:100%;height:auto;margin-top:6px}
.trend .bm{fill:#9DB3CF}
.trend .bo{fill:var(--accent)}
.trend .ax{stroke:var(--line);stroke-width:1}
.trend text{font-size:11px;fill:var(--muted)}
.calleg .lg.tm::before{background:#9DB3CF}
.calleg .lg.to::before{background:var(--accent)}
/* 출고량 달력: 거래처별 묶음과 날짜 바꾸기 */
.dgrp{margin-top:6px}
.dgh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 0;padding:6px 6px 6px 10px;background:var(--soft);border-radius:10px;font-size:14px;color:var(--ink2)}
.dgh b{color:var(--ink)}
.dgh > span{min-width:0}
.dgh .ghost.sm{white-space:nowrap;flex:none;background:var(--card)}
.mvlist{margin-top:6px}
.mvrow{align-items:center}
.mvchk{display:flex;align-items:center;gap:10px;min-height:40px;min-width:0;cursor:pointer}
.mvchk input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
.mvrow > small{grid-column:1 / 3;padding-left:32px;font-size:13px}
/* 작은 달력 (다른 날짜 · 옮길 날짜) */
button.datebox{font-family:inherit}
.mcal{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--card)}
.mcal.pop{box-shadow:0 6px 18px rgba(16,24,40,.10)}
.mchead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mchead b{font-size:16px;font-weight:800;color:var(--ink)}
.mchead .ghost.sm{flex:none;min-width:44px}
.mcgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mcw{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:2px 0}
.mcw.sun,.mcd.sun .mn{color:#C62828}
.mcw.sat,.mcd.sat .mn{color:#1E5AA8}
.mcd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-width:0;min-height:44px;padding:5px 0 3px;border:2px solid transparent;border-radius:10px;background:var(--soft);font:inherit;color:var(--ink);cursor:pointer}
.mcd .mn{font-size:15px;font-weight:700;line-height:1.2}
.mcd .mq{font-size:10.5px;font-weight:800;line-height:1.1;color:var(--accent-strong);letter-spacing:-0.02em}
.mcd.today{border-color:var(--accent)}
.mcd.mark{background:#FFF1CC}
.mcd.sel{background:var(--accent);border-color:var(--accent)}
.mcd.sel .mn,.mcd.sel .mq{color:#fff}
.mcd:disabled{background:transparent;cursor:default}
.mcd:disabled .mn,.mcd:disabled .mq{color:#C4CAD3}
.mcleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 2px 0;font-size:12.5px;color:var(--muted)}
.mcleg .lg::before{content:'';display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mcleg .mk::before{background:#FFF1CC;border:1px solid #E5C46A}
.mcleg .sl::before{background:var(--accent)}
.mcleg .q::before{display:none}
.mvsel{color:var(--accent-strong)}
/* 묶음 단추 · 물표 */
.dgb{display:inline-flex;gap:6px;flex:none}
/* 전체 확정 · 대기열 (2026-11-17) */
.dgh{flex-wrap:wrap}.dgb{flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.dgh .dcfall{white-space:nowrap;flex:none;min-height:36px;padding:0 12px;font-size:14px}
.pochip.qwait{background:#FFF4D6;color:#8A5A00}
.poqueue{border:2px solid #F1D08A}
.poqueue .podh{color:#8A5A00}
.poqueue .podh h2{margin:0}
.poql{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 0;font-size:13.5px;color:var(--ink2)}
.poql > span{display:inline-flex;align-items:center;gap:5px}
.poql .sw{width:12px;height:12px;border-radius:3px;flex:none}
.poqbtn{border-color:#E0B54A;color:#8A5A00}
.bigdate.qwait{color:#8A5A00}
.labcap{display:flex;align-items:center;gap:8px}
.labcap .ghost{flex:none;width:48px;min-width:48px;font-size:22px;padding:0}
.labcap input{width:80px;flex:none;text-align:center;font-size:20px;font-weight:800}
.labcap span{font-size:15px;font-weight:700;color:var(--ink2)}
.labwrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin:14px 0 24px}
.labsvg{display:block;width:100%;max-width:760px;height:auto;aspect-ratio:595.28/841.89;background:#fff;border:1px solid #C9CED6;box-shadow:0 2px 12px rgba(16,24,40,.10)}
/* 물표 고치기 (2026-11-17) — 발주목록 · 고치기 · 물표를 한눈에 */
body.labmode .wrap{max-width:1480px}
.labset{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.labset .label{margin-top:0}
.labset .labcap{flex-wrap:wrap}
@media (min-width:520px){.labset{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.labset{grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto auto;align-items:end}}
.labgrid{display:grid;gap:12px;align-items:start}
.labside,.labmain{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:1100px){
  .labgrid{grid-template-columns:minmax(320px,400px) minmax(0,1fr)}
  .labside{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;padding-bottom:4px}
  .labstrip{display:none !important}
}

<body>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<div id="toast" aria-live="polite"></div>
<datalist id="cust-list"></datalist>
<!--PREVIEW_SERVER-->
<script>
(function () {
  'use strict';

  var DEMO = window.__SERVER__ || null;                       // 시험용 화면에서만
  var API = DEMO ? '' : String(window.NMC_API || '');
  var LIVE = !!API;
  var TOKEN_KEY = 'nmc_pay_token';                             // 관리자 화면에서 로그인하면 생기는 열쇠 (금액 보기용)
  /* 재고 화면 네 가지 (첫 화면에서 고름). 생산량만 누구나, 나머지는 관리자 비밀번호.
   *  stock.html           = 생산량 입력 (관리자 열쇠가 있어도 쓰지 않음)
   *  stock.html?view=out  = 출고량: 달력 (날짜마다 출고·출고예정, 날짜를 눌러 넣기·고치기·지우기·확정, 예정은 그날 재고가 남는지 부족한지)
   *  stock.html?view=in   = 반입량: 반입 넣기
   *  stock.html?view=all  = 전체관리 (예전 주소 ?admin=1 도 여기로): 입력 없이 보고 분석하는 곳
   *        현황(이때까지 생산·출고·매출, 10일 단위 색상별) · 분석(많이 나간 색상·매출·원가·이익·추이·이윤 늘릴 점) · 현재고 · 예정 · 기록 */
  var VIEW = (function () {
    var m = /[?&]view=(out|in|all)(?:&|$)/.exec(location.search);
    if (m) return m[1];
    return /[?&]admin=1(?:&|$)/.test(location.search) ? 'all' : 'prod';
  })();
  var ADMIN_VIEW = VIEW !== 'prod';
  var PO_AUTO = VIEW === 'out' && /[?&]po=1(?:&|$)/.test(location.search);   // 첫 화면 '발주서 올리기'로 들어오면 맨 위 올리기 칸을 잠깐 강조
  var QUICK = VIEW === 'out' || VIEW === 'in';
  var VIEW_NAME = { prod: '생산', out: '출고', 'in': '반입', all: '전체관리' }[VIEW];

  /* 화면 표시용 색 (실제 제품 색과 똑같지는 않습니다) */
  var SWATCH = {
    '검정': '#1F1F1F', '겨자': '#C9A43B', '노랑': '#F4C430', '녹색': '#2E8540', '로즈': '#B3123A',
    '보라': '#6A3D9A', '분홍': '#EE8AA8', '아이보리': '#E8E2D2', '연갈색': '#B88A5B', '연두': '#9BCB3C',
    '연보라': '#B7A3D6', '적색': '#B03A2E', '주황': '#EE7F2D', '진갈색': '#5B3A24', '진녹': '#1F5A33',
    '진청': '#1F2E5C', '청록': '#127C7A', '청색': '#1F5FB0', '카키': '#7C7A4A', '하늘색': '#7CC3E6',
    '황토': '#C58A3A', '회색': '#8C9096'
  };
  var TYPE_LABEL = { '기초': '기초재고', '생산': '생산', '출고': '출고', '반입': '반입', '조정': '재고조정', '출고예정': '출고예정', '생산예정': '생산예정' };
  var ACT_TYPES = ['생산', '출고', '반입'];
  var PLAN_TYPES = ['출고예정', '생산예정'];
  var STATUS_LABEL = { bad: '긴급', warn: '생산준비', ok: 'OK' };
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var OWN = '남명';
  var UI_VER = '3-앱';
  var TABS = [['sum', '현황'], ['ana', '분석'], ['stock', '현재고'], ['plan', '예정'], ['log', '기록']];
  var ERR = {
    need_cust: '거래처를 넣어 주세요.',
    future_date: '실제 기록은 오늘 이후 날짜로 넣을 수 없습니다. 앞으로 나갈 것은 출고예정으로 넣어 주세요.',
    past_plan: '예정 날짜는 오늘이나 그 뒤로 넣어 주세요.',
    bad_price: '단가는 원 단위 숫자로 넣어 주세요.',
    bad_year: '연도를 확인해 주세요.',
    bad_date: '날짜를 확인해 주세요.',
    bad_item: "구글 시트 '재고품목'에 없는 제품·색상(규격)입니다.",
    bad_qty: '수량은 kg 단위 숫자로 넣어 주세요.',
    dup_item: '같은 품목이 두 번 들어갔습니다.',
    no_lines: '수량을 넣은 칸이 없습니다.',
    over_stock: '지금 재고보다 많이 뺄 수 없습니다. 수량을 확인해 주세요.',
    bad_lines: '한 번에 너무 많은 줄입니다. 나눠서 저장해 주세요.',
    bad_type: '이 기록은 구분을 바꿀 수 없습니다.',
    not_found: '그 사이에 지워졌거나 바뀐 기록입니다. 새로고침해 주세요.',
    bad_month: '달을 확인해 주세요.',
    auth: '관리자 로그인이 필요합니다.',
    expired: '관리자 로그인 시간이 지나 잠겼습니다. 생산 입력만 할 수 있습니다.',
    bad_pw: '비밀번호가 맞지 않습니다.',
    locked: '비밀번호를 여러 번 틀려서 15분 동안 잠겼습니다. 잠시 뒤 다시 해 주세요.',
    po_type: 'PDF·엑셀(xls·xlsx)·CSV·사진(jpg·png)만 올릴 수 있습니다. 한글·워드 파일은 PDF로 저장해서 올려 주세요.',
    po_files: '한 번에 6개까지 올릴 수 있습니다.',
    po_size: '파일이 너무 큽니다. 한 번에 20MB까지 올릴 수 있습니다.',
    po_bad: '파일을 읽지 못했습니다. 다시 골라 주세요.',
    po_read: '파일을 읽지 못했습니다. 다시 골라 주세요.',
    po_heic: '이 사진 형식(HEIC)은 이 기기에서 바꿀 수 없습니다. 화면을 캡처하거나 JPG로 저장해서 올려 주세요.',
    po_done: '이미 넣은 발주서입니다. 고치려면 달력에서 그 날짜를 눌러 고치세요.',
    po_busy: '지금 읽고 있습니다. 잠시 뒤 다시 해 주세요.',
    po_moved: '그 사이에 기록이 바뀌었습니다(확정·삭제 등). 발주서를 다시 읽어 왔으니 한 번 더 봐 주세요.',
    po_not_done: '넣은 발주서가 아니어서 되돌릴 것이 없습니다.',
    mixed_prod: '같은 날 같은 현장에서 같은 색은 한 제품으로만 나갑니다(일반 EPDM·NM-CHIP·락칩은 같은 색이라도 색이 조금씩 다릅니다). 제품을 맞춰 주세요.'
  };

  function svg(d, size) {
    return '<svg aria-hidden="true" width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  }
  var ICON = {
    home: svg('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>', 20),
    refresh: svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>', 22),
    chevL: svg('<path d="M15 5l-7 7 7 7"/>', 22),
    chevR: svg('<path d="M9 5l7 7-7 7"/>', 22),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    cal: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', 18),
    down: svg('<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>', 18)
  };

  var S = {
    ready: false, fatal: false, busy: false, gen: 0,
    today: '', items: [], byKey: {}, prods: [], kind: {}, lineOf: {}, lines: [], money: false, admin: false, saved: [], outMode: 'cal', calYm: '', calDay: '', pick: null, po: false, poNeedDate: false, inZone: '', zoneOwn: false, poLast: null, poFiles: [], poNote: '', poBusy: '', poMsg: null, poList: null, poLoading: false, poErr: false, poMore: false, poEdit: '', poEditNote: '', poFlash: false, poRev: null, poShow: null, poOpening: '', poUndoAsk: '', allAdd: '', allAddFrom: '', sumYm: '', sumType: '', anaPer: '',
    stats: {}, sLoading: {}, sErr: {}, pnl: null, pnlLoading: false, pnlErr: false,
    stock: {}, customers: [], firstYm: '', badRows: [], ver: '',
    plan: { lines: [], sum: {} },
    months: {}, mLoading: {}, mErr: {},
    years: {}, yLoading: {}, yErr: {}, yv: '', yMin: '', yMax: '', yProd: '',
    tab: stored('nmc_inv_tab2') || 'sum',
    inType: stored('nmc_inv_type') || '출고', inDate: '', inPDate: '', inCust: '', inMemo: '', inPo: '', inProd: '', qty: {}, price: {},
    low: false, stProd: '',
    ym: '', mProd: '', mAll: false, custOpen: null,
    day: '',
    sheet: null
  };
  if (!TABS.some(function (t) { return t[0] === S.tab; })) S.tab = 'sum';
  if (ACT_TYPES.concat(PLAN_TYPES).indexOf(S.inType) < 0) S.inType = '출고';

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* ───────── 서버 호출 ───────── */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var token = '';
      if (ADMIN_VIEW) { try { token = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) {} }
      if (LIVE) {
        var ctl = window.AbortController ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctl) ctl.abort(); }, fn === 'apiPoUpload' ? 180000 : /^apiPo(Read|Apply|Undo)$/.test(fn) ? 120000 : 60000);
        fetch(API, { method: 'POST', body: JSON.stringify({ action: 'stock.call', fn: fn, args: args, token: token }), redirect: 'follow',
          cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
          .then(function (res) { if (!res.ok) throw new Error('net'); return res.json(); })
          .then(function (j) {
            clearTimeout(timer);
            if (j && j.ok) resolve(j.data); else reject(new Error((j && j.error) || 'server'));
          }, function (e) { clearTimeout(timer); reject(new Error(e && e.name === 'AbortError' ? 'timeout' : 'net')); });
      } else if (DEMO) {
        setTimeout(function () {
          try { DEMO.__token = token; resolve(JSON.parse(JSON.stringify(DEMO[fn].apply(null, args)))); } catch (e) { reject(e); } finally { DEMO.__token = undefined; }
        }, 180);
      } else {
        reject(new Error('no_server'));
      }
    });
  }
  /* ───────── 관리자 열쇠 (잔업·급여·손익 화면과 같은 열쇠) ───────── */
  function getToken() { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  /* 이 기기의 표시 (비밀번호를 여러 번 틀리면 이 기기만 잠깁니다) */
  function devId() {
    var k = 'nmc_dev', v = '';
    try { v = localStorage.getItem(k) || ''; } catch (e) {}
    if (!/^[0-9a-f]{32}$/.test(v)) {
      var a = new Uint8Array(16);
      crypto.getRandomValues(a);
      v = Array.prototype.map.call(a, function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
      try { localStorage.setItem(k, v); } catch (e) {}
    }
    return v;
  }
  /* 로그인·로그아웃 (잔업·급여 관리자 서버로) */
  function postAction(body) {
    return new Promise(function (resolve, reject) {
      if (LIVE) {
        fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', cache: 'no-store', credentials: 'omit' })
          .then(function (res) { if (!res.ok) throw new Error('net'); return res.json(); })
          .then(function (j) { if (j && j.ok) resolve(j.data); else reject(new Error((j && j.error) || 'server')); }, function () { reject(new Error('net')); });
      } else if (DEMO && DEMO.__post) {
        setTimeout(function () { try { resolve(DEMO.__post(body)); } catch (e) { reject(e); } }, 120);
      } else {
        reject(new Error('no_server'));
      }
    });
  }
  function isAuth(e) { return /auth/.test(String((e && e.message) || e || '')); }
  /* 관리자 화면을 닫고 생산 입력 화면으로. 넣던 숫자는 지웁니다 (출고 등으로 넣던 것이 생산으로 저장되지 않게). */
  function lockDown(msg, quiet) {
    setToken('');
    S.admin = false; S.money = false; S.ready = false; S.busy = false; S.sheet = null;
    S.qty = {}; S.price = {}; S.inMemo = ''; S.inCust = ''; S.inPo = '';
    S.allAdd = ''; S.pnl = null; S.pnlErr = false; S.stats = {}; S.sLoading = {}; S.sErr = {};
    start(quiet);
    if (msg) toast(msg);
  }
  function failed(e) { if (S.admin && isAuth(e)) { lockDown(ERR.expired); return; } toast(errText(e)); }
  /* 관리자로 받은 자료인지 (예전 판 서버는 admin 없이 money만 보냅니다) */
  function isAdminResp(r) { return !!r && (r.admin === true || r.money === true); }
  /* 생산 입력 화면 자료. 서버가 예전 판이면(apiForm 없음) apiInit에서 제품 목록만 씁니다. */
  function formCall() {
    return call('apiForm').catch(function (e) {
      if (!/bad_action/.test(String((e && e.message) || ''))) throw e;
      return call('apiInit').then(function (r) {
        return { ver: r.ver, today: r.today, admin: false, money: false,
          items: (r.items || []).map(function (it) { return { prod: it.prod, color: it.color, line: it.line }; }) };
      });
    });
  }

  function errText(e) {
    var m = String((e && e.message) || e || '');
    if (m.indexOf('mixed_prod') >= 0) { var md = (m.split('mixed_prod:')[1] || '').trim(); return ERR.mixed_prod + (md ? ' (' + md + ')' : ''); }
    for (var k in ERR) if (m.indexOf(k) >= 0) return ERR[k];
    return '연결이 원활하지 않습니다. 잠시 뒤 다시 해 주세요.';
  }

  /* ───────── 형식 ───────── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) {
    n = Math.round(Number(n) || 0);
    var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? '-' : '') + s;
  }
  function sfmt(n) { return (n > 0 ? '+' : '') + fmt(n); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parseYmd(s) { var p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  function ymdOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymdOf(d); }
  function addMonths(ym, n) { var p = ym.split('-'); var d = new Date(Number(p[0]), Number(p[1]) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function fmtDate(s) { var d = parseYmd(s); return (d.getMonth() + 1) + '.' + d.getDate() + ' (' + WD[d.getDay()] + ')'; }
  function fmtDateLong(s) { var d = parseYmd(s); return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')'; }
  function fmtYm(ym) { var p = ym.split('-'); return p[0] + '년 ' + Number(p[1]) + '월'; }
  function isYmd(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && ymdOf(parseYmd(s)) === s; }
  /* 색 견본은 색상 제품에만 그립니다. 규격(5-7mm·미분)이나 종류(타이어 코드·비드)로 나뉜 제품에는 없습니다. */
  function sw(c, p) {
    if (p && S.kind[p] && S.kind[p] !== 'color') return '';
    return '<span class="sw" style="background:' + (SWATCH[c] || '#C8CDD3') + '" aria-hidden="true"></span>';
  }
  /* 제품의 나눔 방식: 색 이름이 하나라도 있으면 색상, 모두 크기(5-7mm·미분)면 규격, 아니면 종류 */
  function kindOf(colors) {
    if (colors.some(function (c) { return SWATCH[c]; })) return 'color';
    if (colors.length && colors.every(function (c) { return /\d\s*-\s*\d|\dmm|미분/i.test(c); })) return 'size';
    return 'type';
  }
  function vlabel(p) { var k = S.kind[p]; return k === 'size' ? '규격' : k === 'type' ? '종류' : '색상'; }
  /* 분류(칼라칩·폐타이어): '재고품목' 시트 F열. 둘 이상일 때만 화면에서 나눠 보여 줍니다. */
  function lineOf(p) { return S.lineOf[p] || ''; }
  function lineName(l) { return l || '기타'; }
  function multiLine() { return S.lines.length > 1; }
  function prodsOfLine(l, prods) { return (prods || S.prods).filter(function (p) { return lineOf(p) === l; }); }
  /* 단가 키: 색상 제품은 제품 하나에 한 값, 규격·종류 제품은 줄마다 */
  function pkeyOf(it) { return S.kind[it.prod] && S.kind[it.prod] !== 'color' ? it.key : it.prod; }
  function baseOf(pk) { var it = S.byKey[pk]; return it ? it.price : basePrice(pk); }
  function prodHead(p) { return '<span class="ptx ' + pcls(p) + '">' + esc(p).replace(/[ \-]/, '<br>') + '</span>'; }
  function pill(st) { return '<span class="pill ' + st + '">' + STATUS_LABEL[st] + '</span>'; }
  function tile(label, v, sub) {
    return '<div class="tile"><span>' + esc(label) + '</span><b>' + fmt(v) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>';
  }
  function parseKg(v) {
    var s = String(v == null ? '' : v).replace(/[,\s]/g, '');
    if (!/^\d+$/.test(s)) return null;
    return Number(s);
  }
  /* 생산 '빼기' (2026-11-16): 실제보다 재고가 많게 나오면 −100 처럼 넣어 뺌. 생산일 때만, 저장은 서버에서 '재고조정'으로. */
  function minusOk() { return S.inType === '생산'; }
  function qtyOf(v) {
    var s = String(v == null ? '' : v).replace(/[,\s]/g, '').replace(/^[\u2212\u2013\u2014]/, '-');
    if (minusOk() && /^-\d+$/.test(s)) return -Number(s.slice(1));
    if (minusOk() && s === '-') return 0;
    return parseKg(s);
  }
  function isMinus(v) { return minusOk() && /^\s*[-\u2212\u2013\u2014]/.test(String(v == null ? '' : v)); }
  function negBtn(it) {
    if (!minusOk()) return '';
    return '<button type="button" class="qneg" data-act="qneg" data-v="' + esc(it.key) + '" aria-pressed="' + isMinus(S.qty[it.key]) + '" aria-label="' +
      esc(it.prod + ' ' + it.color) + ' 재고에서 빼기(−)">−</button>';
  }
  function sumKg(ls) { var p = 0, m = 0, np = 0, nm = 0; ls.forEach(function (l) { if (l.qty < 0) { m -= l.qty; nm++; } else { p += l.qty; np++; } }); return { p: p, m: m, np: np, nm: nm }; }
  function isPlan(t) { return t === '출고예정' || t === '생산예정'; }
  function isSale(t) { return t === '출고' || t === '출고예정'; }
  function signed(l) { return isSale(l.type) ? -l.qty : l.qty; }
  function pcls(p) { return p === 'NM-CHIP' ? 'pc-nm' : p === 'LOK-CHIP' ? 'pc-lok' : p === '일반 EPDM' ? 'pc-plain' : 'pc-etc'; }
  function ptag(p) { return '<span class="ptag ' + pcls(p) + '">' + esc(p) + '</span>'; }
  /* 제품 이름 글자에 색: NM-CHIP 빨강, LOK-CHIP 초록 (다른 제품은 그대로) */
  function ptxt(p) { return '<span class="ptx ' + pcls(p) + '">' + esc(p) + '</span>'; }
  function paintProds(html) { return String(html).replace(/NM-CHIP|LOK-CHIP/g, function (m) { return '<span class="ptx ' + pcls(m) + '">' + m + '</span>'; }); }
  function chip(label, on, act, v) {
    return '<button type="button" class="chip" aria-pressed="' + !!on + '" data-act="' + act + '" data-v="' + esc(v) + '">' + esc(label) + '</button>';
  }
  /* 톤: 소수 첫째 자리 */
  function tons(kg) {
    var t = Math.round((Number(kg) || 0) / 100) / 10;
    var neg = t < 0, a = Math.abs(t), w = Math.floor(a), f = Math.round((a - w) * 10);
    if (f === 10) { w++; f = 0; }
    return (neg ? '-' : '') + fmt(w) + '.' + f;
  }
  /* 돈: 1억 이상은 '억 만원', 1만 이상은 '만원' (만원 아래 반올림) */
  function won(n) {
    n = Math.round(Number(n) || 0);
    if (n >= 100000000) {
      var eok = Math.floor(n / 100000000), man = Math.round((n % 100000000) / 10000);
      if (man === 10000) { eok++; man = 0; }
      return fmt(eok) + '억' + (man ? ' ' + fmt(man) + '만' : '') + '원';
    }
    if (n >= 10000) return fmt(Math.round(n / 10000)) + '만원';
    return fmt(n) + '원';
  }
  function cleanNum(v) { return String(v == null ? '' : v).replace(/[,\s원]/g, ''); }
  /* 제품의 기준 단가: 색상 모두 같으면 그 값, 다르면 'mixed', 없으면 null */
  function basePrice(p) {
    var vals = [];
    itemsOf(p).forEach(function (it) { if (it.price != null && vals.indexOf(it.price) < 0) vals.push(it.price); });
    return vals.length === 1 ? vals[0] : vals.length ? 'mixed' : null;
  }
  function curDate() { return isPlan(S.inType) ? S.inPDate : S.inDate; }
  function planMax() { return addDays(S.today, 730); }
  function findPlan(id) {
    var L = S.plan.lines;
    for (var i = 0; i < L.length; i++) if (L[i].id === id) return L[i];
    return null;
  }
  function needOf(k) { var s = S.plan.sum[k]; return s ? s.need : Math.max(0, -stockOf(k)); }

  /* 예정 계산 (서버 planOf_와 같은 규칙). extra = 아직 저장하지 않은 줄 [{type, prod, color, qty, date}]
     날짜 순, 같은 날은 들어오는 것(생산예정) 먼저, 날짜가 지난 예정은 오늘로. */
  function ordOf(e) { return e.l.row != null ? e.l.row : e.idx; }
  function project(extra, skip) {
    var ev = [];
    S.plan.lines.forEach(function (l, i) { if (skip && skip[l.id]) return; ev.push({ l: l, eff: l.eff, inb: signed(l) > 0 ? 0 : 1, idx: i }); });
    (extra || []).forEach(function (l, i) {
      ev.push({ l: l, eff: l.date < S.today ? S.today : l.date, inb: signed(l) > 0 ? 0 : 1, idx: 1e9 + i, x: true });
    });
    ev.sort(function (a, b) {
      return (a.eff < b.eff ? -1 : a.eff > b.eff ? 1 : 0) || (a.inb - b.inb) ||
        (a.l.date < b.l.date ? -1 : a.l.date > b.l.date ? 1 : 0) || (ordOf(a) - ordOf(b));
    });
    var bal = {}, sum = {}, out = [];
    ev.forEach(function (e) {
      var l = e.l, k = l.prod + '|' + l.color;
      if (!(k in bal)) {
        bal[k] = stockOf(k);
        sum[k] = { cur: bal[k], min: bal[k], minEff: S.today, shortEff: bal[k] < 0 ? S.today : '', need: 0, nShort: 0, inQ: 0, outQ: 0, final: 0 };
      }
      var s = sum[k], before = bal[k], d = signed(l), short = 0;
      bal[k] = before + d;
      if (d < 0) { short = Math.max(0, l.qty - Math.max(before, 0)); s.outQ += l.qty; } else s.inQ += l.qty;
      if (short > 0) { s.nShort++; if (!s.shortEff) s.shortEff = e.eff; }
      if (bal[k] < s.min) { s.min = bal[k]; s.minEff = e.eff; }
      out.push({ l: l, x: !!e.x, eff: e.eff, before: before, after: bal[k], short: short });
    });
    Object.keys(sum).forEach(function (k) { sum[k].final = bal[k]; sum[k].need = Math.max(0, -sum[k].min); });
    return { lines: out, sum: sum };
  }
  function planStats() {
    var o = { n: 0, nOut: 0, nIn: 0, outKg: 0, inKg: 0, overdue: 0, shortItems: 0, needKg: 0 };
    S.plan.lines.forEach(function (l) {
      if (l.fut) return;
      o.n++;
      if (l.type === '출고예정') { o.nOut++; o.outKg += l.qty; } else { o.nIn++; o.inKg += l.qty; }
      if (l.overdue) o.overdue++;
    });
    Object.keys(S.plan.sum).forEach(function (k) { var s = S.plan.sum[k]; if (s.need > 0) { o.shortItems++; o.needKg += s.need; } });
    return o;
  }
  function shortKeys() {
    return Object.keys(S.plan.sum).filter(function (k) { return S.plan.sum[k].need > 0; }).sort(function (a, b) {
      var x = S.plan.sum[a], y = S.plan.sum[b];
      return (x.shortEff < y.shortEff ? -1 : x.shortEff > y.shortEff ? 1 : 0) || (y.need - x.need);
    });
  }

  /* ───────── 데이터 ───────── */
  function setItems(items) {
    S.items = items.map(function (it, i) {
      return { prod: it.prod, color: it.color, alert: Number(it.alert) || 0, ok: Number(it.ok) || 0, price: it.price == null ? null : Number(it.price),
        line: String(it.line == null ? '' : it.line).trim(), key: it.prod + '|' + it.color, idx: i };
    });
    S.byKey = {};
    var prods = [], colors = {};
    S.lineOf = {};
    S.items.forEach(function (it) {
      S.byKey[it.key] = it;
      if (!Object.prototype.hasOwnProperty.call(colors, it.prod)) { colors[it.prod] = []; prods.push(it.prod); S.lineOf[it.prod] = it.line; }
      colors[it.prod].push(it.color);
    });
    S.prods = prods;
    S.kind = {};
    prods.forEach(function (p) { S.kind[p] = kindOf(colors[p]); });
    S.lines = [];
    prods.forEach(function (p) { if (S.lines.indexOf(S.lineOf[p]) < 0) S.lines.push(S.lineOf[p]); });
    if (S.prods.indexOf(S.inProd) < 0) S.inProd = S.prods[0] || '';
    if (S.prods.indexOf(S.mProd) < 0) S.mProd = S.prods[0] || '';
  }

  function apply(r) {
    S.mixWarnNext = (r && r.mixWarn) || '';
    S.gen++;
    S.today = r.today;
    setItems(r.items || []);
    S.stock = r.stock || {};
    S.customers = r.customers || [];
    S.firstYm = r.firstYm || r.today.slice(0, 7);
    S.badRows = r.badRows || [];
    S.ver = r.ver || '';
    S.money = r.money !== false;
    S.plan = r.plan || { lines: [], sum: {} };
    S.months = {};
    S.mErr = {};
    S.mLoading = {};
    if (r.month) S.months[r.month.ym] = r.month;
    S.years = {};
    S.yErr = {};
    S.yLoading = {};
    S.stats = {}; S.sLoading = {}; S.sErr = {};
    if (r.year) { S.years[r.year.y] = r.year; S.yMin = r.year.minY; S.yMax = r.year.maxY; }
    if (!S.yv || S.yv < S.yMin || S.yv > S.yMax) S.yv = r.today.slice(0, 4);
    if (!S.inDate || S.inDate > S.today) S.inDate = S.today;
    if (!S.inPDate || S.inPDate < S.today || S.inPDate > planMax()) S.inPDate = S.today;
    if (!S.ym || S.ym > S.today.slice(0, 7)) S.ym = S.today.slice(0, 7);
    if (!S.day || S.day > S.today) S.day = S.today;
    Object.keys(S.qty).forEach(function (k) { if (!S.byKey[k]) delete S.qty[k]; });
    var dl = document.getElementById('cust-list');
    if (dl) dl.innerHTML = S.customers.map(function (c) { return '<option value="' + esc(c) + '"></option>'; }).join('');
  }

  function stockOf(k) { return S.stock[k] || 0; }
  function statusOf(it, kg) {
    if (kg < it.alert) return 'bad';
    if (kg < it.ok) return 'warn';
    return 'ok';
  }
  function itemsOf(p) { return S.items.filter(function (it) { return it.prod === p; }); }

  function ensureMonth(ym) {
    if (S.months[ym] || S.mLoading[ym] || S.mErr[ym]) return;
    S.mLoading[ym] = true;
    var gen = S.gen;
    call('apiMonth', ym).then(function (m) {
      if (gen !== S.gen) { render(); return; }
      S.mLoading[ym] = false;
      S.months[m.ym] = m;
      render();
    }, function (e) {
      if (gen !== S.gen) return;
      if (isAuth(e)) { lockDown(ERR.expired); return; }
      S.mLoading[ym] = false;
      S.mErr[ym] = true;
      render();
    });
  }

  function zero() { return { open: 0, prod: 0, ban: 0, out: 0, adj: 0, close: 0 }; }
  function addTo(t, x) { t.open += x.open; t.prod += x.prod; t.ban += x.ban; t.out += x.out; t.adj += x.adj; t.close += x.close; }
  function monthRows(m) {
    var rows = {};
    function row(k) {
      if (!rows[k]) { rows[k] = zero(); rows[k].open = m.opening[k] || 0; }
      return rows[k];
    }
    Object.keys(m.opening).forEach(row);
    m.records.forEach(function (r) {
      var x = row(r.prod + '|' + r.color);
      if (r.type === '기초') x.open += r.qty;
      else if (r.type === '생산') x.prod += r.qty;
      else if (r.type === '반입') x.ban += r.qty;
      else if (r.type === '출고') x.out += r.qty;
      else if (r.type === '조정') x.adj += r.qty;
    });
    Object.keys(rows).forEach(function (k) { var x = rows[k]; x.close = x.open + x.prod + x.ban - x.out + x.adj; });
    return rows;
  }
  function findRecord(id) {
    var yms = Object.keys(S.months);
    for (var i = 0; i < yms.length; i++) {
      var list = S.months[yms[i]].records;
      for (var j = 0; j < list.length; j++) if (list[j].id === id) return list[j];
    }
    return null;
  }

  /* 입력 줄 */
  function enteredLines() {
    var out = [];
    S.items.forEach(function (it) {
      var v = S.qty[it.key];
      if (v == null || String(v).trim() === '') return;
      out.push({ it: it, qty: qtyOf(v) });
    });
    return out;
  }
  function validLines() { return enteredLines().filter(function (l) { return l.qty !== null && l.qty !== 0 && Math.abs(l.qty) <= 1000000 && (l.qty > 0 || -l.qty <= stockOf(l.it.key)); }); }
  function badLines() { return enteredLines().filter(function (l) { return l.qty === null || Math.abs(l.qty) > 1000000 || (l.qty < 0 && -l.qty > stockOf(l.it.key)); }); }
  function countIn(p) { return validLines().filter(function (l) { return l.it.prod === p; }).length; }
  function warnFor(it) {
    var v = S.qty[it.key];
    if (v == null || String(v).trim() === '') return '';
    var n = qtyOf(v);
    if (n === null) return minusOk() ? '숫자만 넣어 주세요 (뺄 때는 앞에 −)' : '숫자만 넣어 주세요';
    if (Math.abs(n) > 1000000) return '수량이 너무 큽니다';
    if (n < 0 && -n > stockOf(it.key)) return '지금 재고 ' + fmt(stockOf(it.key)) + ' kg보다 많이 뺄 수 없습니다';
    if (n <= 0 || (S.inType !== '출고' && S.inType !== '출고예정')) return '';
    if (S.inType === '출고' && n > stockOf(it.key)) return '현재 재고 ' + fmt(stockOf(it.key)) + ' kg보다 많습니다';
    var p = project([{ type: S.inType, prod: it.prod, color: it.color, qty: n, date: curDate() }]);
    var mine = p.lines.filter(function (x) { return x.x; })[0];
    if (S.inType === '출고예정' && mine && mine.short > 0) {
      return fmtDate(mine.eff) + '에 ' + fmt(mine.short) + ' kg 부족 · 그날 쓸 수 있는 재고 ' + fmt(Math.max(mine.before, 0)) + ' kg';
    }
    var more = p.sum[it.key].need - needOf(it.key);
    if (more > 0) return (S.inType === '출고' ? '이 출고로 ' : '') + '뒤의 출고예정에 ' + fmt(more) + ' kg 부족이 생깁니다';
    return '';
  }

  /* ───────── 화면 ───────── */
  var root = document.getElementById('app');
  var sheetEl = document.getElementById('sheet');
  var toastEl = document.getElementById('toast');

  function render() {
    if (PO_AUTO && S.ready && S.admin && VIEW === 'out' && S.outMode === 'cal' && !S.sheet) {
      PO_AUTO = false;
      try { history.replaceState(null, '', location.pathname + '?view=out'); } catch (e) {}

    }

    h += header();

      bar = true;
    }
    else {
      h += tabsHtml();
      if (S.tab === 'sum') h += viewSum();
      else if (S.tab === 'ana') h += viewAna();

      else if (S.tab === 'plan') h += viewPlan();

      h += footer();
    }
    root.className = 'wrap' + (bar ? ' with-bar' : '');

    root.innerHTML = h;
    if (document.body.className.indexOf('labmode') >= 0) {

    }

  }

  function renderSheet() { renderSheet0(); navSync(); }
  function renderSheet0() {
    if (!S.sheet || !S.ready) { sheetEl.innerHTML = ''; return; }

      : S.sheet.kind === 'item' ? sheetItem()

      : S.sheet.kind === 'edit' ? sheetEdit()
      : S.sheet.kind === 'pline' ? sheetPlanLine()

  }

  /* ── 뒤로 (2026-11-17) ── */
  function subLevel() {
    if (!S.ready || !S.admin) return false;
    if (VIEW === 'out') return S.outMode === 'label' || S.outMode === 'porev' || S.outMode === 'add';
    if (VIEW === 'all') return !!S.allAdd;
    return false;
  }
  function backTo() {
    if (VIEW === 'all') return S.allAddFrom === 'stock' ? '현재고' : '예정';
    return '출고 달력';
  }
  /** 한 단계 전으로. 돌아갈 곳이 없으면 false */
  function goBack() {
    if (S.sheet && S.ready) { S.sheet = null; render(); return true; }
    if (VIEW === 'out' && S.outMode === 'label') {
      S.outMode = 'cal'; render();
      var y = S.labFromY;
      if (y != null) window.scrollTo(0, y);
      else { var dc0 = document.getElementById('daycard'); if (dc0 && dc0.scrollIntoView) { try { dc0.scrollIntoView({ block: 'nearest' }); } catch (e) { dc0.scrollIntoView(); } } }
      return true;
    }
    if (VIEW === 'out' && S.outMode === 'porev') { S.poRev = null; S.outMode = 'cal'; render(); window.scrollTo(0, 0); return true; }
    if (VIEW === 'out' && S.outMode === 'add') { S.outMode = 'cal'; S.po = false; S.poNeedDate = false; S.poQueue = false; S.pick = null; S.qty = {}; S.price = {}; S.sheet = null; render(); return true; }
    if (VIEW === 'all' && S.allAdd) { S.allAdd = ''; S.qty = {}; S.price = {}; S.sheet = null; render(); window.scrollTo(0, 0); return true; }
    render();
    return false;
  }
  /* 브라우저 기록: 안쪽 화면 1칸 + 시트 1칸. 앱 안에서 닫으면 그만큼 기록도 되돌림(그때 오는 popstate는 건너뜀) */
  var NAV_DEPTH = 0, NAV_SKIP = 0;
  function navDepth() { return (subLevel() ? 1 : 0) + (S.sheet && S.ready ? 1 : 0); }
  function navSync() {
    var want = navDepth();
    try {
      while (NAV_DEPTH < want) { history.pushState({ nmcNav: NAV_DEPTH + 1 }, ''); NAV_DEPTH++; }
      if (NAV_DEPTH > want) { var n = NAV_DEPTH - want; NAV_DEPTH = want; NAV_SKIP++; history.go(-n); }
    } catch (e) { /* 기록을 못 쓰는 곳: 단추로만 */ }
  }
  window.addEventListener('popstate', function () {
    if (NAV_SKIP > 0) { NAV_SKIP--; return; }
    if (NAV_DEPTH > 0) NAV_DEPTH--;
    if (S.busy) {
      try { history.pushState({ nmcNav: NAV_DEPTH + 1 }, ''); NAV_DEPTH++; } catch (e) { /* 그대로 */ }
      toast('저장하는 중입니다. 끝난 뒤 다시 눌러 주세요');
      return;
    }
    goBack();
  });

  function header() {
    var sub = VIEW_NAME + (S.today ? ' · ' + fmtDateLong(S.today) : '');
    if (ADMIN_VIEW && S.ready && !S.admin) sub = VIEW_NAME + ' · 관리자';
    var nav = (subLevel() ? '<button type="button" class="ghost sm navbtn backbtn" data-act="back" aria-label="뒤로 (' + esc(backTo()) + ')">' + ICON.chevL + '<span>뒤로</span></button>' : '') +
      '<a class="ghost sm navbtn" href="./" aria-label="홈 (첫 화면)">' + ICON.home + '<span>홈</span></a>';
    if (S.admin) nav += '<button type="button" class="ghost sm navbtn" data-act="logout">로그아웃</button>';
    else if (ADMIN_VIEW && S.ready) nav += '<button type="button" class="ghost sm navbtn" data-act="login">관리자 로그인</button>';
    return '<header class="top"><div><h1 class="brand"><span>NMC</span>재고</h1><p class="sub">' + esc(sub) + '</p></div>' +
      '<div class="hbtns">' + nav +
      '<button type="button" class="iconbtn" data-act="refresh" aria-label="새로고침"' + (S.ready ? '' : ' disabled') + '>' + ICON.refresh + '</button></div></header>';
  }

  function tabsHtml() {
    var h = '<nav class="tabs t' + TABS.length + '" role="tablist" aria-label="화면 고르기">';
    var ps = planStats(), alert = ps.shortItems + ps.overdue;

      var pt = ptot[p];

      Object.keys(per).filter(function (k) { return per[k].p === p; }).sort(function (a, c) { return sum3(per[c].v) - sum3(per[a].v); }).forEach(function (k) {
        var o = per[k];
        h += '<tr><th scope="row" class="tcol">' + sw(o.c, o.p) + esc(o.c) + '</th>' + o.v.map(cell).join('') + '<td><b>' + fmt(sum3(o.v)) + '</b></td></tr>';
      });
    });
    h += '</tbody><tfoot><tr><th scope="row">모두</th>' + b.map(cell).join('') + '<td>' + fmt(sum3(b)) + '</td></tr></tfoot></table></div>';
    return h + '<p class="note">단위 kg. 제품마다 그 달 ' + t + '이 많은 색상부터 적었습니다.' + (t === '출고' ? ' 남명(자사 시공) 출고도 들어 있습니다.' : '') + '</p>';
  }

  /* ── 분석 ── */
  function viewAna() {
    if (S.money) ensurePnl();
    if (!S.anaPer) S.anaPer = '3m';
    var cur = curYm(), fy = firstYm();
    var h = '<div class="stack"><div class="optseg big" role="radiogroup" aria-label="기간">' + PERIODS.map(function (x) {
      return '<button type="button" role="radio" aria-checked="' + (S.anaPer === x[0]) + '" data-act="anaper" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>';
    if (!fy) return h + statsWait() + '</div>';
    var per = S.anaPer, a = per === 'm' ? cur : per === '3m' ? addMonths(cur, -2) : per === 'y' ? cur.slice(0, 4) + '-01' : fy;
    if (a < fy) a = fy;
    var yms = ymRange(a, cur), rows = rowsOf(yms);
    if (!rows) return h + statsWait() + '</div>';
    if (S.money && !S.pnl && !S.pnlErr) return h + '<section class="card"><p class="hint">손익 설정(원가표) 불러오는 중…</p></section></div>';
    var D = anaData(yms, rows);
    var range = esc(fmtDate(a === fy ? firstDay() : a + '-01')) + ' ~ ' + esc(fmtDate(S.today));
    h += '<p class="anarange">' + range + (a === fy && per !== 'm' ? ' (기록 시작부터)' : '') + '</p>';
    h += topCard(D) + (S.money ? profitCard(D) : '') + custCard2(D) + trendCard(fy) + tipsCard(D);
    if (S.money) h += '<button type="button" class="ghost wide" data-act="bpopen">기준 단가 넣기·고치기</button>';
    return h + '</div>';
  }

  function topCard(D) {
    var top = D.items.filter(function (o) { return o.out > 0; }).sort(function (a, b) { return b.out - a.out; });
    var h = '<section class="card"><h2 class="label">많이 나간 색상</h2>';
    if (!top.length) return h + '<p class="hint">이 기간에 출고가 없습니다.</p></section>';
    var mx = top[0].out;
    h += '<p class="anasum">출고 <b>' + fmt(D.out) + '</b> kg' + (D.own ? ' (남명 ' + fmt(D.own) + ' kg 포함)' : '') +
      (S.money ? ' · 매출 <b>' + esc(won(D.rev)) + '</b>' + (D.est ? ' (' + estNote(D.est, D.rev) + ')' : '') : '') + '</p><ol class="rank">';
    top.slice(0, 10).forEach(function (o, i) {
      h += '<li><span class="rk">' + (i + 1) + '</span><span class="rn">' + sw(o.c, o.p) + '<span>' + ptxt(o.p) + ' ' + esc(o.c) + '</span></span>' +
        '<span class="rv"><b>' + fmt(o.out) + '</b> kg<small>' + Math.round(o.out / D.out * 100) + '%' + (S.money && o.rev ? ' · ' + esc(won(o.rev)) : '') + '</small></span>' +
        '<span class="rbar" aria-hidden="true"><i style="width:' + Math.max(2, Math.round(o.out / mx * 100)) + '%"></i></span></li>';
    });
    h += '</ol>';
    if (top.length > 10) {
      var rest = top.slice(10).reduce(function (s, o) { return s + o.out; }, 0);
      h += '<p class="note">나머지 ' + (top.length - 10) + '개 색상 · 모두 ' + fmt(rest) + ' kg (' + Math.round(rest / D.out * 100) + '%)</p>';
    }
    return h + '</section>';
  }

  function profitCard(D) {
    var h = '<section class="card"><h2 class="label">제품별 매출 · 만드는 데 드는 돈 · 남는 돈 (추정)</h2>';
    if (!D.cost) return h + '<p class="hint">손익 설정을 불러오지 못해 원가를 계산할 수 없습니다. 원가표는 손익 화면의 설정에 있습니다.</p></section>';
    if (!D.prods.length) return h + '<p class="hint">이 기간에 판매(남명 뺀 출고)가 없습니다.</p></section>';
    h += '<p class="hint mt0">남는 돈 = 매출 − 재료·운송비. 고정비(인건비·전기 등)는 무엇을 팔든 나가는 돈이라 맨 아래 모두에서 뺍니다.</p><ul class="plist">';
    D.prods.forEach(function (q) {
      var unit = q.rev / q.sold, mk = q.mat / q.sold, fk = q.fix / q.sold;
      h += '<li><p class="ph"><span class="pn">' + ptxt(q.p) + '</span><span class="pp' + (q.contrib < 0 ? ' neg' : '') + '">남는 돈 <b>' + esc(wonTxt(q.contrib)) + '</b></span></p>' +
        '<p class="pd">판매 ' + fmt(q.sold) + ' kg · 매출 ' + esc(won(q.rev)) + (q.est ? ' (' + estNote(q.est, q.rev) + ')' : '') + (q.own ? ' · 남명 ' + fmt(q.own) + ' kg은 판매에서 뺌' : '') + '</p>' +
        '<p class="pd">kg당 · 판매가 <b>' + fmt(unit) + '원</b> − 재료·운송 <b>' + fmt(mk) + '원</b> = <b class="' + (q.cKg < 0 ? 'neg' : '') + '">' + fmt(q.cKg) + '원</b> 남음</p>' +
        '<p class="pd dim">고정비를 판매 kg으로 나눈 몫(kg당 ' + fmt(fk) + '원)까지 빼면 kg당 ' + fmt(q.perKg) + '원 · 모두 ' + esc(wonTxt(q.profit)) + '</p>' +
        (q.none ? '<p class="pd warnline">단가를 모르는 ' + fmt(q.none) + ' kg은 매출에 넣지 못했습니다.</p>' : '') + '</li>';
    });
    var per = D.yms.length === 1 ? shortYm(D.yms[0]) : shortYm(D.yms[0]) + '~' + shortYm(D.yms[D.yms.length - 1]);
    h += '</ul><dl class="ptotal">' +
      '<dt>매출</dt><dd>' + esc(won(D.revKnownCost)) + '</dd>' +
      '<dt>재료·운송비</dt><dd>− ' + esc(won(D.mat)) + '</dd>' +
      '<dt class="sub">재료비 빼고 남는 돈</dt><dd class="sub">' + esc(wonTxt(D.contrib)) + '</dd>' +
      '<dt>고정비 <small>' + esc(per) + (D.yms.indexOf(curYm()) >= 0 ? ', 이번 달은 오늘까지' : '') + '</small></dt><dd>− ' + esc(won(D.F)) + '</dd>' +
      '<dt class="fin">이익</dt><dd class="fin' + (D.profit < 0 ? ' neg' : '') + '">' + esc(wonTxt(D.profit)) + '</dd></dl>';
    if (D.unalloc > 0) h += '<p class="note">이 기간 판매가 없는 쪽(칼라칩 또는 폐타이어)의 고정비 ' + esc(won(D.unalloc)) + '도 고정비에 들어 있습니다.</p>';
    if (D.unknown.length) h += '<p class="note">원가 규칙을 모르는 품목은 빼고 계산했습니다: ' + D.unknown.map(function (o) { return esc(o.p + ' ' + o.c); }).join(', ') + '.</p>';
    var st = S.pnl.set;
    h += '<p class="note">모두 손익 화면의 설정으로 계산한 추정입니다. 재료·운송비 = 칼라칩은 판매 kg × kg당 원료비(NM ' + fmt(num0(st.matNM)) + '원 · LOK ' + fmt(num0(st.matLOK)) + '원) + 매출 × 운송비 ' + pct(st.epdmTr) +
      ', 폐타이어 품목은 매출 × ' + pct(st.tireRate) + '. 고정비 = 손익 설정의 달 고정비(급여가 저장된 달은 급여 반영)이고 이자·원금은 넣지 않았습니다. 제품별 고정비 몫은 칼라칩 ' + pct(st.epdmShare) + ' · 폐타이어 나머지로 나눈 뒤 판매 kg 비율로 나눈 값입니다.</p>';
    return h + '</section>';
  }

  function custCard2(D) {
    var cs = custOf(D.yms), list = Object.keys(cs).map(function (k) { return cs[k]; }).sort(function (a, b) { return b.kg - a.kg; });
    var h = '<section class="card"><h2 class="label">거래처별 출고</h2>';
    if (!list.length) return h + '<p class="hint">이 기간에 출고가 없습니다.</p></section>';
    var mx = list[0].kg;
    h += '<ol class="rank">';
    list.slice(0, 10).forEach(function (c, i) {
      var own = isOwn(c.name);
      h += '<li><span class="rk">' + (i + 1) + '</span><span class="rn"><span>' + esc(c.name || '거래처 없음') + (own ? ' <small class="muted">자사 시공</small>' : '') + '</span></span>' +
        '<span class="rv"><b>' + fmt(c.kg) + '</b> kg<small>' + Math.round(c.kg / D.out * 100) + '%' + (S.money && c.kgK ? ' · 단가 적힌 ' + fmt(c.kgK) + ' kg ' + esc(won(c.revK)) : '') + '</small></span>' +
        '<span class="rbar" aria-hidden="true"><i style="width:' + Math.max(2, Math.round(c.kg / mx * 100)) + '%"></i></span></li>';
    });
    h += '</ol>';
    if (list.length > 10) h += '<p class="note">나머지 ' + (list.length - 10) + '곳</p>';
    return h + '</section>';
  }

  /* 달마다 생산·출고·매출·이익 (기록이 있는 달, 최근 12달) */
  function trendCard(fy) {
    var cur = curYm(), a = addMonths(cur, -11);
    if (a < fy) a = fy;
    var yms = ymRange(a, cur), rows = rowsOf(yms);
    var h = '<section class="card"><h2 class="label">달마다 추이</h2>';
    if (!rows) return h + '<p class="hint">불러오는 중…</p></section>';
    var M = yms.map(function (ym) { return { ym: ym, made: 0, out: 0, rows: [] }; }), idx = {};
    yms.forEach(function (ym, i) { idx[ym] = i; });
    rows.forEach(function (r) {
      var m = M[idx[r[0]]];
      if (r[2] === '생산') m.made += r[5];
      else if (r[2] === '출고') m.out += r[5];
      m.rows.push(r);
    });
    var cost = S.money && S.pnl;
    M.forEach(function (m) {
      if (!S.money) return;
      var D = anaData([m.ym], m.rows);
      m.rev = D.rev; m.est = D.est;
      if (cost) m.profit = D.profit;
    });
    if (M.length >= 2) {
      var mx = 1;
      M.forEach(function (m) { mx = Math.max(mx, m.made, m.out); });
      var n = M.length, W = 340, H = 150, top = 8, bot = 22, gw = W / Math.max(n, 6), bw = Math.min(14, gw / 3);
      var svg = '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="달마다 생산과 출고">';
      M.forEach(function (m, k) {
        var x = k * gw + gw / 2, hm = (H - top - bot) * m.made / mx, ho = (H - top - bot) * m.out / mx;
        svg += '<rect x="' + (x - bw - 1).toFixed(1) + '" y="' + (H - bot - hm).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hm.toFixed(1) + '" rx="2" class="bm"><title>' + esc(fmtYm(m.ym)) + ' 생산 ' + fmt(m.made) + ' kg</title></rect>' +
          '<rect x="' + (x + 1).toFixed(1) + '" y="' + (H - bot - ho).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + ho.toFixed(1) + '" rx="2" class="bo"><title>' + esc(fmtYm(m.ym)) + ' 출고 ' + fmt(m.out) + ' kg</title></rect>' +
          '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + Number(m.ym.slice(5)) + '월</text>';
      });
      svg += '<line x1="0" x2="' + W + '" y1="' + (H - bot) + '" y2="' + (H - bot) + '" class="ax"/></svg>';
      h += svg + '<p class="calleg"><span class="lg tm">생산</span><span class="lg to">출고</span></p>';
    }
    h += '<div class="tscroll"><table class="tent trendt"><thead><tr><th scope="col">달</th><th scope="col">생산<br><small>kg</small></th><th scope="col">출고<br><small>kg</small></th>' +
      (S.money ? '<th scope="col">매출<br><small>만원</small></th>' + (cost ? '<th scope="col">이익<br><small>만원</small></th>' : '') : '') + '</tr></thead><tbody>';
    M.slice().reverse().forEach(function (m) {
      h += '<tr><th scope="row">' + esc(shortYm(m.ym)) + (m.ym === cur ? '<br><small>' + Number(S.today.slice(8, 10)) + '일까지</small>' : '') + '</th><td>' + fmt(m.made) + '</td><td>' + fmt(m.out) + '</td>' +
        (S.money ? '<td>' + man(m.rev) + '</td>' + (cost ? '<td class="' + (m.profit < 0 ? 'neg' : '') + '">' + man(m.profit) + '</td>' : '') : '') + '</tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="note">' + (S.money ? '매출·이익은 위 계산과 같은 추정입니다(이익은 고정비까지 뺀 것). ' : '') + (M.length < 2 ? '기록이 ' + esc(fmtYm(fy)) + '부터라 달마다 비교 그래프는 다음 달부터 보입니다.' : '') + '</p>';
    return h + '</section>';
  }

  /* 이윤을 늘리려면: 기록·설정에서 바로 나오는 사실만 */
  function tipsCard(D) {
    var tips = [], st = D.cost ? S.pnl.set : null;
    // 1) 단가 기록
    if (S.money && D.sold > 0) {
      var kr = D.kgK / D.sold;
      if (kr < 0.8) tips.push('<b>단가 기록</b>: 판매 ' + fmt(D.sold) + ' kg 가운데 단가가 적힌 것은 ' + fmt(D.kgK) + ' kg(' + Math.round(kr * 100) + '%)입니다. 나머지 매출은 기준·기본 단가로 셈한 추정이라 실제 받은 돈과 다를 수 있습니다. 출고를 넣을 때 단가를 같이 넣으면 이 분석이 실제 금액이 됩니다.');
    }
    // 2) 제품별 kg당 이익
    if (st) {
      var ranked = D.prods.filter(function (q) { return q.sold >= 100; }).slice().sort(function (a, b) { return b.cKg - a.cKg; });
      if (ranked.length >= 2) {
        /* 바꿔 팔 수 있는 것은 같은 설비로 만드는 칼라칩끼리 (폐타이어 품목은 따로 나오는 것이라 비교에서 뺌) */
        var chips = ranked.filter(function (q) { return D.items.some(function (o) { return o.p === q.p && o.grp === 'E'; }); });
        var t2 = '<b>제품마다 kg당 남는 돈</b> (재료·운송비만 뺀 것, 추정): ' + ranked.map(function (q) { return ptxt(q.p) + ' ' + fmt(q.cKg) + '원'; }).join(' · ') + '.';
        if (chips.length >= 2 && chips[0].cKg - chips[chips.length - 1].cKg >= 30) {
          var hi = chips[0], lo = chips[chips.length - 1];
          var los = chips.filter(function (q) { return Math.abs(q.cKg - lo.cKg) < 1; }).map(function (q) { return ptxt(q.p); }).join('·');
          t2 += ' 고정비는 무엇을 팔든 나가므로, 같은 설비로 만드는 칼라칩 가운데 kg당 더 남는 것을 더 팔수록 이익이 커집니다. ' + ptxt(hi.p) + '을(를) ' + los + ' 대신 1톤 팔면 약 ' + esc(won((hi.cKg - lo.cKg) * 1000)) + ' 더 남습니다.';
        }
        if (D.rev > 0 && D.est / D.rev > 0.5) t2 += ' 다만 매출 대부분이 추정 단가라, 이 차이는 실제 판 값이 아니라 손익 설정의 단가 차이에 가깝습니다.';
        tips.push(t2);
      }
      // 3) 칼라칩 손익분기
      if (D.eMargin != null && D.units > 0) {
        var fE1 = D.F / D.units * Math.min(1, Math.max(0, num0(st.epdmShare))), avgE = D.kgE / D.units;
        if (D.eMargin > 0) {
          var be = fE1 / D.eMargin, r100 = function (x) { return fmt(Math.round(x / 100) * 100); };
          tips.push('<b>칼라칩 손익분기</b>: 칼라칩은 kg당 재료·운송비를 빼면 약 ' + fmt(D.eMargin) + '원이 남습니다(추정). 칼라칩 몫 고정비 한 달 약 ' + esc(won(fE1)) + '을 채우려면 한 달에 약 <b>' + r100(be) + ' kg</b>을 팔아야 합니다. ' +
            '이 기간 판매를 한 달로 환산하면 약 ' + r100(avgE) + ' kg' + (avgE >= be ? '으로 넘습니다.' : '으로 <b>' + r100(be - avgE) + ' kg 모자랍니다</b>. 판매량을 늘리거나 단가를 올려야 고정비를 채웁니다.') +
            ' kg당 단가를 100원 올리면 같은 양으로 한 달 약 ' + esc(won(avgE * 100)) + '이 더 남습니다.');
        } else tips.push('<b>칼라칩 손익분기</b>: 지금 단가로는 칼라칩 kg당 재료·운송비도 채우지 못합니다(추정). 단가 또는 원료비를 먼저 점검해야 합니다.');
      }
      // 폐타이어 쪽 손익분기 (판매가 있을 때)
      if (D.kgT > 0 && D.units > 0) {
        var revT = 0, matT = 0;
        D.items.forEach(function (o) { if (o.grp === 'T') { revT += o.rev; matT += o.mat; } });
        var tMargin = (revT - matT) / D.kgT, fT1 = D.F / D.units - D.F / D.units * Math.min(1, Math.max(0, num0(st.epdmShare))), avgT = D.kgT / D.units;
        if (tMargin > 0 && fT1 > 0) {
          var beT = fT1 / tMargin, r100t = function (x) { return fmt(Math.round(x / 100) * 100); };
          tips.push('<b>폐타이어 손익분기</b>: 폐타이어 품목은 kg당 약 ' + fmt(tMargin) + '원이 남아, 그 몫 고정비 한 달 약 ' + esc(won(fT1)) + '을 채우려면 한 달 약 ' + r100t(beT) + ' kg을 팔아야 합니다(추정). ' +
            '이 기간 판매를 한 달로 환산하면 약 ' + r100t(avgT) + ' kg' + (avgT >= beT ? '으로 넘습니다.' : '으로 <b>' + r100t(beT - avgT) + ' kg 모자랍니다</b>. 폐타이어 판매를 이 앱에 모두 넣고 있는지도 확인해 주세요(빠진 출고가 있으면 실제보다 나쁘게 보입니다).'));
        }
      }
    }
    // 4) 먼저 생산할 색상 (한 달 출고보다 현재고가 적거나, 예정 출고에 모자람)
    var hot = D.items.map(function (o) {
      var dem = D.units > 0 ? o.out / D.units : 0, s = stockOf(o.key), ps = S.plan.sum[o.key], need = ps ? ps.need : 0;
      return { o: o, dem: dem, s: s, need: need, m: dem > 0 ? s / dem : Infinity };
    }).filter(function (z) { return z.need > 0 || (z.dem >= 100 && z.s < z.dem); }).sort(function (a, b) { return (b.need > 0) - (a.need > 0) || a.m - b.m; }).slice(0, 6);
    if (hot.length) tips.push('<b>먼저 생산할 색상</b>: 한 달 나가는 양보다 재고가 적거나, 잡힌 출고예정에 모자랍니다. 떨어지면 주문을 놓칩니다.<ul class="sub">' + hot.map(function (z) {
      return '<li>' + ptxt(z.o.p) + ' ' + esc(z.o.c) + ' — 현재고 ' + fmt(z.s) + ' kg' + (z.dem ? ' · 한 달 출고 약 ' + fmt(z.dem) + ' kg' : '') + (z.need ? ' · <b class="neg">예정에 ' + fmt(z.need) + ' kg 부족</b>' : '') + '</li>';

    // 5) 쌓인 재고

        return '<li>' + ptxt(z.x.prod) + ' ' + esc(z.x.color) + ' — ' + fmt(z.s) + ' kg · ' + (z.dem ? '한 달 약 ' + fmt(z.dem) + ' kg 나감 (약 ' + Math.round(z.s / z.dem) + '달치)' : '이 기간 출고 없음') + '</li>';

    if (S.money) {
      var low = D.items.map(function (o) {

        return '<li>' + ptxt(z.o.p) + ' ' + esc(z.o.c) + ' — 판 단가 평균 ' + fmt(z.avg) + '원, ' + z.ref.src + ' ' + fmt(z.ref.p) + '원 → ' + fmt(z.o.kgK) + ' kg에서 ' + esc(won(z.lost)) + ' 적게 받음</li>';

      '<p class="note">이 앱의 출고·생산 기록, 현재고, 예정, 손익 설정에서 바로 계산한 것입니다. ‘추정’은 원가표·고정비를 나눈 계산값이라 실제와 다를 수 있습니다. 한 달 출고는 이 기간 출고를 한 달로 환산한 값입니다.</p></section>';

  /* ───────── 날짜 바꾸기 (2026-11-16 지시: "16일에 등록한 4톤이 18일로 바뀌면 날짜만 쉽게 바꿀 수 있게") ─────────
     출고량 달력에서 날짜를 누르면 그날 줄이 거래처별로 묶여 나오고, 묶음마다 '날짜 바꾸기'가 있습니다.

     예정은 오늘부터의 날짜로, 실제 출고는 날짜를 고칠 수 있고, 실제 출고를 앞날로 옮기면 아직 안 나간 것이라 출고예정이 됩니다. */
  function recOf(id) { return findPlan(id) || findRecord(id); }

      return '<div class="dgrp"><div class="dgh"><span><b>' + esc(name) + '</b>' + (x.po ? ' · ' + esc(x.po) : '') + ' · ' + x.rows.length + '줄 · ' + fmt(x.kg) + ' kg</span>' +

          (x.type === '생산예정' ? '' : x.rows.every(function (r) { return packOf(r) === 'ton'; }) ? '<span class="dgtb">톤백 · 물표 없음</span>' :
            '<button type="button" class="ghost sm" data-act="labopen" data-v="' + esc(x.rows.map(function (r) { return r.id; }).join(',')) + '">물표</button>') +
          '<button type="button" class="ghost sm" data-act="mvopen" data-v="' + esc(x.rows.map(function (r) { return r.id; }).join(',')) + '">날짜 바꾸기</button></span>' : '') + '</div>' +
        (same ? '<p class="dgm">' + esc(same) + '</p>' : '') + mixWarnHtml(x) + '<ul class="dlist">' + x.rows.map(function (r) { return dayRow(r, !!same); }).join('') + '</ul></div>';

  function mvShort(d) { var x = parseYmd(d), t = parseYmd(S.today); return x.getMonth() === t.getMonth() ? x.getDate() + '일' : (x.getMonth() + 1) + '.' + x.getDate(); }

  }
  /* 옮긴 뒤 예정 계산: 옮길 예정 줄을 빼고 새 날짜로 다시 넣어 봅니다 */
  function movePreview(ls, date) {

      if (prev && prev.newShort > 0) h += '<p class="warnbox mt12">이렇게 옮기면 다른 출고예정에 ' + fmt(prev.newShort) + ' kg 부족이 새로 생깁니다.</p>';

  }
  function moveSave() {
    if (S.busy || !S.sheet) return;

  /* ───────── 작은 달력으로 날짜 고르기 (2026-11-16 지시) ─────────

      '<b>' + esc(fmtYm(ym)) + '</b>' +
      '<button type="button" class="ghost sm" data-act="mcnav" data-v="' + key + '|' + nm + '"' + (max && nm > max.slice(0, 7) ? ' disabled' : '') + ' aria-label="다음 달">▶</button></div>' +
      '<div class="mcgrid">' + WD_SHORT.map(function (w, i) { return '<span class="mcw' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</span>'; }).join('');

  }
  /* '다른 날짜' 단추: 누르면 바로 밑에 달력이 열리고, 날짜를 누르면 닫힙니다 */
  function otherBtn(key, cur, isOther, open) {

      ICON.cal + '<span>' + (isOther ? esc(fmtDate(cur)) : '다른 날짜') + '</span></button>';
  }
  function pickOpenNow(key) { return !!(S.pick && S.pick.key === key); }

    return pickOpenNow(key) ? miniCal(key, S.pick.ym, cur, min, max, { cls: 'pop' }) : '';
  }

  function pickOpen(key) {

  function mcNav(v) {

  /* ── 직접 쓰기 (2026-11-17 다시 지시) ──

  function labAddRow(n) {
