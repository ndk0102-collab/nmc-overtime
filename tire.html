<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 폐타이어 관리대장 (2026-11-25). 회사 숫자 · 업체 · 거래처는 이 파일에 없고, 관리자 로그인 뒤 서버(구글 시트 '타이어입고' · '타이어생산' · '타이어판매' · '타이어설정' · '재고기록')에서 받아 옵니다. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;
  --accent:#1E5AA8; --accent-soft:#E6EEF9;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA;
  --vc:#44505C; --vsoft:#E9EDF1;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
b,.big,td,th{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 0;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtabs{max-width:980px;margin:8px auto 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.vtabs button{min-height:46px;padding:2px 4px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:15.5px;line-height:1.2;cursor:pointer}
@media (max-width:560px){.bar{padding-bottom:8px}.vtabs{grid-template-columns:repeat(3,minmax(0,1fr))}.vtabs button{min-height:40px;border-radius:10px;font-size:14px}}   /* 휴대폰: 서식 5가지 = 3 + 2 */
.vtabs button[aria-selected="true"]{background:var(--bg);color:var(--vc)}
.home:focus-visible,.vtabs button:focus-visible{outline:3px solid #F4B400;outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding:12px 12px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px;font-weight:800}
.card h2 small{margin-left:6px;font-size:13px;font-weight:600;color:var(--muted)}
.card h3{margin:14px 0 6px;font-size:15px;font-weight:800;color:var(--ink2)}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.nav:focus-visible,.ent:focus-visible,.link:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}

.pnav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.nav{flex-shrink:0;width:50px;height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:26px;font-weight:800;line-height:1;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.plabel{flex:1;min-width:0;text-align:center}
.plabel b{display:block;font-size:18.5px;font-weight:800;line-height:1.3}
.plabel small{display:block;font-size:13.5px;color:var(--muted)}

.head .k{margin:0;font-size:15px;font-weight:800;color:var(--vc)}
.head .big{margin:2px 0 2px;font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.head .note{margin:2px 0;font-size:14.5px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{padding:10px;border-radius:12px;background:var(--soft)}
.tile span{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.tile b{display:block;font-size:17px;font-weight:800;line-height:1.3;margin-top:2px}
.tile small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}}
.warnbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.badbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px;font-weight:700}
.okbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-size:14px;font-weight:700}

.dayh{display:flex;justify-content:space-between;gap:8px;margin:14px 0 2px;padding:6px 10px;border-radius:10px;background:var(--vsoft);font-size:14px;font-weight:800;color:var(--ink2)}
.dayh:first-child{margin-top:4px}
.ent{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ent .et{flex:1;min-width:0}
.ent .et b{display:block;font-size:15.5px;font-weight:800}
.ent .et small{display:block;font-size:13px;color:var(--muted)}
.ent .ea{flex-shrink:0;text-align:right}
.ent .ea b{display:block;font-size:15.5px}
.ent .ea small{display:block;font-size:12px;color:var(--muted)}
.ent.off{opacity:.55}
.tag{display:inline-block;margin:2px 4px 0 0;padding:0 6px;border-radius:6px;background:var(--soft);font-size:11.5px;font-weight:800;color:var(--ink2);vertical-align:1px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.info{background:var(--accent-soft);color:#174A8C}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:14px 4px;color:var(--muted);font-weight:600}

/* 서식 (엑셀과 같은 모양: 제목 · 머리글 · 줄 · 합계 줄) */
.form .ft{margin:2px 0 2px;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.01em}
.form .ft.sm{font-size:16px}
.form .fs{display:flex;justify-content:space-between;gap:8px;margin:0 0 6px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.form .fs .b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:42px;padding:0 14px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:15px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--vc);background:var(--vc);color:#fff}
.chip.sm{min-height:36px;padding:0 11px;font-size:14px;border-width:1px}
.tw{overflow-x:auto;margin:8px -4px 0;-webkit-overflow-scrolling:touch}
table.fm{border-collapse:collapse;font-size:13px;min-width:100%;background:#fff}
table.fm th,table.fm td{height:28px;padding:3px 6px;border:1px solid #8C96A3;text-align:right;white-space:nowrap}
table.fm th{background:#F3F5F8;font-size:12.5px;font-weight:800;color:#1F2933;text-align:center;line-height:1.3}
table.fm td.l{text-align:left}table.fm td.c{text-align:center}table.fm td.r{text-align:right}table.fm td.b,table.fm th.b{font-weight:800}
table.fm tr.sum td{font-weight:700}
table.fm tr.cum td{font-weight:800;background:var(--vsoft)}
table.fm tr.ylw td,table.fm td.yel,table.fm tr.cum td.yel{background:#FFF59D}
table.fm td.blu,table.fm tr.cum td.blu{background:#4472C4;color:#000}
table.fm td.red{color:#C00000}
table.fm td.warnc{color:var(--warn);font-weight:800;font-size:12px;text-align:center}
table.fm tr.gtop td{border-top:2px solid #44505C}
table.fm .sm{font-size:11.5px;color:var(--muted);font-weight:700}
table.fm td.neg{color:var(--bad)}
table.fm td.mut,table.fm th.mut{color:var(--muted)}
table.fm tr.rb,table.fm td.rb,table.fm th.v{cursor:pointer}
table.fm tr.rb:hover td,table.fm td.rb:hover{background:var(--vsoft)}
table.fm td.pc[data-act]{cursor:pointer;color:#174A8C;text-decoration:underline dotted;text-underline-offset:3px}
table.fm th.v{color:#174A8C;text-decoration:underline dotted;text-underline-offset:3px}
[role="button"]:focus-visible{outline:3px solid #F4B400;outline-offset:-2px}
.lab3{margin:6px 0 8px;font-size:15px;font-weight:800;color:var(--ink2)}
.impb .file{margin-bottom:8px}
.chkm{color:var(--ok);font-weight:800}.chkx{color:var(--bad);font-weight:800}

/* 점검 */
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
.issue .t{flex:1;min-width:0;font-size:14.5px}
.issue .lv{flex-shrink:0}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;min-height:58px;padding:0 22px;border:0;border-radius:999px;background:var(--vc);color:#fff;font-size:17.5px;font-weight:800;box-shadow:0 6px 18px rgba(15,23,42,.3);cursor:pointer}
.fab:focus-visible{outline:3px solid #F4B400;outline-offset:3px}

#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:600px;max-height:94vh;max-height:94dvh;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25)}
@media (min-width:640px){#sheet{align-items:center;padding:16px}.sheet{border-radius:20px;max-height:92vh}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;margin:0;font-size:19px;font-weight:800;color:var(--vc)}
.sbody{flex:1;overflow:auto;padding:12px 16px 4px;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot .btn{flex:1 1 140px}
.fld{margin:0 0 14px}
.fld > .lab{display:block;margin:0 0 6px;font-size:14.5px;font-weight:800;color:var(--ink2)}
.fld > .lab small{margin-left:4px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:50px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17.5px}
.inp:focus{outline:none;border-color:var(--vc)}
.inp:disabled{background:var(--soft);color:var(--ink2)}
.inp.amt{font-weight:800;text-align:right}
textarea.inp{min-height:150px;padding:10px 12px;font-size:14px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
.inrow{display:flex;align-items:center;gap:8px}
.inrow .inp{flex:1;min-width:0}
.unit{flex-shrink:0;font-weight:800;color:var(--muted)}
.calc{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14.5px;line-height:1.6}
.ro{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14.5px;line-height:1.7}
.ro b{font-weight:800}
.smsg{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:700}
.smsg.err{background:var(--bad-soft);color:var(--bad)}
.smsg.info{background:var(--accent-soft);color:#174A8C}
details.more{margin:0 0 12px;border-top:1px dashed var(--line);padding-top:6px}
details.more > summary{display:flex;align-items:center;min-height:44px;font-weight:800;color:var(--accent);cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700}
.chk input{width:22px;height:22px}
.file{display:block;width:100%;padding:14px;border:2px dashed var(--line);border-radius:12px;background:var(--soft);font-size:15px}

.login{max-width:440px;margin:20px auto}
.login form{display:flex;gap:8px;margin-top:12px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px}
.err{margin:8px 0 0;color:var(--bad);font-weight:700}
.wait{padding:30px 10px;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3)}
@media (max-width:420px){.vtabs button{font-size:15px}.bar h1{font-size:18px}}
@media print{.bar,.fab,.noprint,#sheet,.toast{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.card{border:1px solid #999;break-inside:avoid}}
</style>
</head>
<body>
<header class="bar">
  <div class="bin" data-nmc-slot data-nmc-hub="manage.html" data-nmc-hub-name="관리자">

    <h1 id="title">폐타이어 입고</h1>
  </div>
  <nav class="vtabs" id="vtabs" role="tablist" aria-label="화면 선택"></nav>
</header>
<main class="wrap" id="root"></main>
<button type="button" class="fab" id="fab" hidden></button>
<div id="sheet" hidden></div>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<script>
(function () {
  'use strict';
  var DEMO = window.__SERVER__ || null;   // 시험용 화면에서만
  var API = DEMO ? '' : String(window.NMC_API || '');
  var TOKEN_KEY = 'nmc_pay_token';      // 다른 관리자 화면과 같은 열쇠
  var T = window.NMCTire;
  var $ = function (id) { return document.getElementById(id); };
  var root = $('root'), sheetEl = $('sheet'), toastEl = $('toast'), fab = $('fab');

  var VIEWS = [['f1', '서식-1 보고서'], ['f2', '서식-2 보고서'], ['weigh', '계량증명서 관리'], ['tax', '세금계산서 관리'], ['sum', '총괄표']];   // 2026-11-25 22:00 지시: 서식 5가지 그대로
  var TITLE = { f1: '서식-1 보고서', f2: '서식-2 보고서', weigh: '계량증명서 관리', tax: '세금계산서 관리', sum: '총괄표' };
  var FAB = { f1: '+ 입고 등록', f2: '+ 생산 입력', weigh: '+ 매입 계량 등록', tax: '+ 판매 추가' };
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var vm = /[?&]view=(f1|f2|weigh|tax|sum)(?:&|$)/.exec(location.search);
  var S = { view: vm ? vm[1] : 'f1', y: '', m: 0, today: '', data: {}, M: {}, loading: {}, err: '', authed: false, loginErr: '', sheet: null, dl: '', imp: null };
  var token = '';
  try { token = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  S.authed = !!token;

  /* ───────── 글자 · 숫자 · 날짜 ───────── */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kg(n) { return n == null || n === '' ? '' : (n < 0 ? '−' : '') + Math.abs(Math.round(Number(n))).toLocaleString('ko-KR'); }
  function won(n) { return n == null ? '' : (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원'; }
  function pr(n) { return n == null ? '' : Number(n).toLocaleString('ko-KR', { maximumFractionDigits: 2 }); }
  function num(v) {
    var s = String(v == null ? '' : v).replace(/[,\s원]/g, '');
    if (s === '') return null;
    if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
    return Number(s);
  }
  function fmtIn(v, dec) {   // dec: 소수 자리 (true = 2) — 수율 · 철심 비율은 소수 넷째 자리까지
    var nd = dec === true ? 2 : (Number(dec) || 0);
    var s = String(v == null ? '' : v).replace(/[^0-9.]/g, '');
    if (!nd) s = s.replace(/\./g, '');
    var i = s.indexOf('.');
    if (i >= 0) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, '').slice(0, nd);
    var a = i >= 0 ? s.slice(0, i) : s, b = i >= 0 ? s.slice(i) : '';
    a = a.replace(/^0+(?=\d)/, '');
    return (a ? Number(a).toLocaleString('ko-KR') : (b ? '0' : '')) + b;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function P3(s) { return [Number(s.slice(0, 4)), Number(s.slice(5, 7)), Number(s.slice(8, 10))]; }
  function wd(s) { var p = P3(s); return WD[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()]; }
  function md(s) { var p = P3(s); return p[1] + '월 ' + p[2] + '일'; }
  function dShort(s) { return md(s) + ' (' + wd(s) + ')'; }
  function mOf(s) { return Number(String(s).slice(5, 7)); }
  function dnum(s) { var p = P3(s); return Date.UTC(p[0], p[1] - 1, p[2]) / 864e5; }
  function todayY() { return S.today ? S.today.slice(0, 4) : String(new Date().getFullYear()); }

  /* ───────── 서버 ───────── */
  var ERR = {

  var LIBP = {};
  function lib(k) {
    var src = k === 'x' ? 'lib/exceljs.min.js' : 'lib/jszip.min.js', g = k === 'x' ? 'ExcelJS' : 'JSZip';
    if (window[g]) return Promise.resolve(window[g]);
    if (!LIBP[k]) LIBP[k] = new Promise(function (res, rej) {
      var sc = document.createElement('script'); sc.src = src; sc.async = true;
      sc.onload = function () { if (window[g]) res(window[g]); else { LIBP[k] = null; rej(new Error('lib')); } };
      sc.onerror = function () { LIBP[k] = null; rej(new Error('lib')); };
      document.head.appendChild(sc);
    });
    return LIBP[k];
  }
  function save(name, blob) {
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 4000);
  }
  function dlOne(k) {

    S.dl = k; render();

      save(o.name, new Blob([o.buf], { type: XLSX })); S.dl = ''; render(); toast(o.name + ' 내려받기 완료');
    }, function (e) { S.dl = ''; render(); toast(errText(e)); });
  }
  function dlAll() {
    var M = cur(); if (!M || S.dl) return;
    S.dl = 'all'; render();
    Promise.all([lib('x'), lib('z')]).then(function (L) {
      return T.buildAll(L[0], M).then(function (files) {
        var z = new L[1]();
        files.forEach(function (f) { z.file(f.name, f.buf); });
        return z.generateAsync({ type: 'blob', compression: 'DEFLATE' });

    }).then(function (blob) {
      var name = M.y + '년 폐타이어 관리대장 (' + (M.lastM === 12 ? '1~12월' : '1~' + M.lastM + '월') + ').zip';
