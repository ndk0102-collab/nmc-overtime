<!--PREVIEW_SERVER-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 계근대 계량 (2026-11-26). 계근대 옆 PC의 크롬 · 엣지가 지시계 무게를 직접 읽습니다(Web Serial — 이 화면에서 처음 한 번 단자를 고르면 다음부터 자동).
   업체 · 차량 · 무게 기록은 이 파일에 없고, 관리자 로그인 뒤 서버(구글 시트 '계량기록')에서 받아 옵니다. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;
  --accent:#1E5AA8; --accent-soft:#E6EEF9;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA;
  --vc:#44505C; --vsoft:#E9EDF1;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
b,td,th,.wnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home:focus-visible{outline:3px solid #F4B400;outline-offset:2px}

.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px;font-weight:800}
.card h2 small{margin-left:6px;font-size:13px;font-weight:600;color:var(--muted)}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14.5px}
.btn.big{min-height:64px;padding:0 26px;font-size:20px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.nav:focus-visible,.link:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.tag{display:inline-block;margin:2px 4px 0 0;padding:0 6px;border-radius:6px;background:var(--soft);font-size:11.5px;font-weight:800;color:var(--ink2);vertical-align:1px;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.info{background:var(--accent-soft);color:#174A8C}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:12px 4px;color:var(--muted);font-weight:600}
.err{margin:8px 0 0;color:var(--bad);font-weight:700}
.wait{padding:30px 10px;text-align:center;color:var(--muted);font-weight:700}

/* 계근대 (지시계 무게) */
.scale .srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wst{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--soft);color:var(--ink2);font-size:14px;font-weight:800}
.wst.stable{background:var(--ok-soft);color:var(--ok)}
.wst.move,.wst.nodata{background:var(--warn-soft);color:var(--warn)}
.wst.err,.wst.ol{background:var(--bad-soft);color:var(--bad)}
.wport{font-size:13px;color:var(--muted);font-weight:700}
.wnum{margin:6px 0 2px;padding:10px 16px;border:3px solid var(--line);border-radius:16px;background:#0F172A;color:#E2E8F0;text-align:right;font-size:64px;font-weight:800;line-height:1.15;letter-spacing:.01em}
.wnum::after{content:' kg';font-size:26px;color:#94A3B8}
.wnum.stable{border-color:#22C55E;color:#fff}
.wnum.move{border-color:#F59E0B}
@media (max-width:480px){.wnum{font-size:48px}}
.act1{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}

/* 대기 차량 */
.pend{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.pend:first-of-type{border-top:0}
.pend .pt{flex:1;min-width:0;font-size:15px}
.pend .pt b{font-size:17px}
.pend .pt small{display:block;font-size:13.5px;color:var(--muted)}
.pend .pa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.pend{flex-direction:column;align-items:stretch}.pend .pa{justify-content:flex-start}}

/* 그날 계량 */
.pnav{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.nav{flex-shrink:0;width:50px;height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:26px;font-weight:800;line-height:1;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.plabel{flex:1;min-width:0;text-align:center}
.plabel b{display:block;font-size:18px;font-weight:800;line-height:1.3}
.plabel small{display:block;font-size:13.5px;color:var(--muted)}
.tw{overflow-x:auto;margin:4px -4px 0;-webkit-overflow-scrolling:touch}
table.dl{border-collapse:collapse;font-size:14px;min-width:100%}
table.dl th,table.dl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.dl th{background:#F3F5F8;font-size:13px;font-weight:800;color:#1F2933}
table.dl td.l{text-align:left}table.dl td.r{text-align:right}table.dl td.b{font-weight:800}
table.dl tr.rb{cursor:pointer}
table.dl tr.rb:hover td{background:var(--vsoft)}
table.dl tr.off td{color:var(--muted);text-decoration:line-through}
table.dl tr.off td:last-child{text-decoration:none}
[role="button"]:focus-visible{outline:3px solid #F4B400;outline-offset:-2px}

/* 창 */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:640px;max-height:94vh;max-height:94dvh;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25)}
@media (min-width:680px){#sheet{align-items:center;padding:16px}.sheet{border-radius:20px;max-height:92vh}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;margin:0;font-size:19px;font-weight:800;color:var(--vc)}
.sbody{flex:1;overflow:auto;padding:12px 16px 4px;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot .btn{flex:1 1 140px}
.fld{margin:0 0 14px}
.fld > .lab{display:block;margin:0 0 6px;font-size:14.5px;font-weight:800;color:var(--ink2)}
.fld > .lab small{margin-left:4px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:50px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17.5px}
.inp:focus{outline:none;border-color:var(--vc)}
.inp.amt{font-weight:800;text-align:right}
select.inp{font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{min-width:0}
.inrow{display:flex;align-items:center;gap:8px}
.inrow .inp{flex:1;min-width:0}
.unit{flex-shrink:0;font-weight:800;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:15.5px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--vc);background:var(--vc);color:#fff}
.chip.sm{min-height:36px;padding:0 11px;font-size:14px;border-width:1px}
.capw{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px;padding:12px 14px;border-radius:12px;background:#0F172A;color:#fff}
.capw span{font-size:14px;font-weight:800;color:#94A3B8}
.capw b{font-size:34px;font-weight:800;line-height:1.1}
.capw small{font-size:13px;color:#CBD5E1}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;font-size:14px;color:var(--ink2)}
.calc{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:15px;line-height:1.7}
.calc b{font-weight:800}
.ro{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14.5px;line-height:1.7}
.smsg{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:700}
.smsg.err{background:var(--bad-soft);color:var(--bad)}
.smsg.info{background:var(--accent-soft);color:#174A8C}
.smsg.warn{background:var(--warn-soft);color:var(--warn)}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700}
.chk input{width:22px;height:22px}
.rawl{margin:0 0 12px;padding:10px;border-radius:10px;background:#0F172A;color:#E2E8F0;font-family:Consolas,'D2Coding',monospace;font-size:13px;line-height:1.55;max-height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-all}

.login{max-width:440px;margin:20px auto}
.login form{display:flex;gap:8px;margin-top:12px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3)}

/* 계량증명서 (임시 양식 — 지금 쓰시는 계량증명서를 받으면 같은 모양으로 맞춤) */
.cert{width:100%;max-width:178mm;margin:0 auto;color:#000;font-family:'Malgun Gothic','Noto Sans KR',sans-serif}
.cert .ch{margin:0;text-align:center;font-size:26px;font-weight:800;letter-spacing:.5em;padding-left:.5em}
.cert .cre{text-align:center;font-size:12px;font-weight:700}
.cert .cno{margin:6px 0 4px;display:flex;justify-content:space-between;font-size:13px}
.cert table{width:100%;border-collapse:collapse;font-size:14px}
.cert th,.cert td{border:1px solid #000;padding:7px 8px;height:34px}
.cert th{width:21%;background:#F2F2F2;font-weight:700;text-align:center;letter-spacing:.2em}
.cert td.r{text-align:right;font-weight:700}
.cert tr.net td,.cert tr.net th{font-size:16px;font-weight:800}
.cert .cmsg{margin:14px 0 4px;text-align:center;font-size:14px}
.cert .cdate{margin:4px 0 10px;text-align:center;font-size:14px}
.cert .cco{margin:0;text-align:right;font-size:15px;font-weight:800}
.cert .cco small{display:block;font-size:12px;font-weight:400}
.cert .cnote{margin:8px 0 0;font-size:11.5px}
.prev{padding:12px;border:1px dashed var(--line);border-radius:12px;background:#fff}
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body.printing > *:not(#print){display:none!important}
  body.printing #print{display:block!important}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bin" data-nmc-slot data-nmc-hub="manage.html" data-nmc-hub-name="관리자">
    <a class="home nmc-menu" href="manage.html" data-nmc-menu aria-haspopup="dialog" aria-label="전체 메뉴" title="전체 메뉴"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg><span>메뉴</span></a>
    <h1 id="title">계근대 계량</h1>
  </div>
</header>
<main class="wrap" id="root"></main>
<div id="sheet" hidden></div>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
<div id="print" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  var DEMO = window.__SERVER__ || null;   // 시험용 화면에서만
  var API = DEMO ? '' : String(window.NMC_API || '');
  var TOKEN_KEY = 'nmc_pay_token';      // 다른 관리자 화면과 같은 열쇠
  var $ = function (id) { return document.getElementById(id); };
  var root = $('root'), sheetEl = $('sheet'), toastEl = $('toast'), printEl = $('print');
  var dm = /[?&]day=(\d{4}-\d{2}-\d{2})(?:&|$)/.exec(location.search);
  var S = { authed: false, loginErr: '', d: null, day: dm ? dm[1] : '', err: '', sheet: null, loading: false };
  var token = '';
  try { token = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  S.authed = !!token;
  var LINKABLE = ['SBR 고무분말', '분철'];
  var KIND_ITEM = { '매입': '폐타이어', '매출': 'SBR 고무분말', '기타': '' };

  /* ───────── 글자 · 숫자 · 날짜 ───────── */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kg(n) { return n == null || n === '' || isNaN(Number(n)) ? '' : (n < 0 ? '−' : '') + Math.abs(Math.round(Number(n))).toLocaleString('ko-KR'); }
  function num(v) {
    var s = String(v == null ? '' : v).replace(/[,\s]/g, '');
    if (s === '') return null;
    if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
    return Number(s);
  }
  function fmtInt(v) { var s = String(v == null ? '' : v).replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, ''); return s ? Number(s).toLocaleString('ko-KR') : ''; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function P3(s) { return [Number(s.slice(0, 4)), Number(s.slice(5, 7)), Number(s.slice(8, 10))]; }
  function addDays(s, n) { var p = P3(s), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function wd(s) { var p = P3(s); return WD[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()]; }
  function dLong(s) { var p = P3(s); return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일 (' + wd(s) + ')'; }
  function md(s) { var p = P3(s); return p[1] + '/' + p[2]; }
  function hm(s) { return String(s || '').slice(11, 16); }
  function clock() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function tag(t, c) { return '<span class="tag' + (c ? ' ' + c : '') + '">' + esc(t) + '</span>'; }
  function kindCls(k) { return k === '매입' ? 'info' : k === '매출' ? 'ok' : ''; }

  /* ───────── 서버 ───────── */
  var ERR = {
    auth: '로그인 유효 시간이 지났습니다. 비밀번호를 다시 입력해 주십시오.', bad_pw: '비밀번호가 맞지 않습니다.', locked: '비밀번호를 여러 번 틀려서 15분 동안 잠겼습니다.',
    net: '인터넷 연결을 확인해 주십시오.', timeout: '응답이 지연되고 있습니다. 잠시 후 다시 시도해 주십시오.', bad_date: '날짜를 확인해 주십시오.',
    bad_kind: '구분(매입 · 매출 · 기타)을 골라 주십시오.', bad_car: '차량번호를 입력해 주십시오.', bad_co: '업체(거래처)를 입력해 주십시오.', bad_item: '품명을 입력해 주십시오.',
    bad_weight: '무게를 확인해 주십시오 (1kg 이상 120,000kg 이하의 정수).', bad_link: '연결할 출고를 확인해 주십시오 (매출 · SBR 고무분말 · 분철 출고만).',
    dup_link: '이 출고에는 이미 다른 계량이 연결되어 있습니다.', not_waiting: '이미 2차 계량을 마친 차량입니다.', same_weight: '2차 무게가 1차와 같습니다. 차량을 확인해 주십시오.',
    cancelled: '취소된 계량입니다.', not_done: '2차 계량을 마친 뒤 발행할 수 있습니다.', not_found: '해당 계량이 없습니다. 다른 곳에서 취소되었을 수 있습니다.',
    bad_action: '서버가 아직 이 기능을 지원하지 않습니다. 서버 배포 후 다시 시도해 주십시오.'
  };
  function errText(e) { var c = String((e && e.message) || e || ''); return ERR[c] || ('처리하지 못했습니다 (' + c + '). 잠시 후 다시 시도해 주십시오.'); }
  function post(body) {
    if (token && body.action !== 'login') body.token = token;
    if (DEMO) {
      return new Promise(function (res, rej) {
        setTimeout(function () { try { var j = JSON.parse(DEMO.post(JSON.stringify(body))); if (j.ok) res(j.data); else rej(new Error(j.error)); } catch (e) { rej(e); } }, 20);
      });
    }
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 90000);
    return fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); }, function (e) { throw new Error(e && e.name === 'AbortError' ? 'timeout' : 'net'); })

  function capNow() { return okWeight() ? { w: SC.w, t: clock() } : null; }

        var sh = S.sheet; if (!sh) return;
        var k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
        if (k === 'kind' && sh.f.kind !== v) { var was = sh.f.item; sh.f.kind = v; if (!was || was === KIND_ITEM['매입'] || was === KIND_ITEM['매출']) sh.f.item = KIND_ITEM[v] || was; if (v !== '매출') sh.f.link = ''; }
        else sh.f[k] = v;
        renderSheet(); return;
      }
      case 'w1-save': saveW1(); return;
      case 'w2-save': saveW2(); return;
      case 'edit': {
        var r = recOf(el.getAttribute('data-id')) || (S.sheet && S.sheet.rec); if (!r) return;
        closeSheetNow();
        openSheet('edit', { id: r.id, rec: r, f: { kind: r.kind, car: r.car, co: r.co, item: r.item, link: r.link || '', memo: r.memo || '' } });
        return;
      }
      case 'edit-save': saveEdit(); return;
      case 'cancel': {
        var s2 = S.sheet; if (!s2) return;
        if (!s2.arm) { s2.arm = true; renderSheet(); return; }
        busy(true);
        call('apiWeighIn', ['cancel', { id: s2.id }]).then(function () { closeSheet(); toast('계량을 취소했습니다'); load(true); }, fail);
        return;
      }
      case 'rec': { var rr = recOf(el.getAttribute('data-id')); if (rr) openSheet('rec', { id: rr.id, rec: rr }); return; }
      case 'print': { if (S.sheet && S.sheet.rec) doPrint(S.sheet.rec); return; }
      case 'dprev': case 'dnext': {
        if (!S.d) return;
        var nd = addDays(S.d.day, act === 'dprev' ? -1 : 1);
        if (nd > S.d.today) return;
        S.day = nd; S.d.day = nd; S.d.done = []; render(); load();
        return;
      }
    }
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target, sh = S.sheet;
    if (!sh) return;
    var c = el.getAttribute('data-c');
    if (c) { sh.f[c] = el.type === 'checkbox' ? el.checked : el.value; return; }
    var k = el.getAttribute('data-f');
    if (!k) return;
    if (k === 'w') {
      var nv = fmtInt(el.value);
      if (nv !== el.value) el.value = nv;
      sh.f.w = nv;
      var cc = $('calc2'); if (cc && sh.kind === 'w2') cc.innerHTML = calc2(sh);
      return;
    }
    sh.f[k] = el.value;
    if (k === 'car' && (sh.kind === 'w1' || sh.kind === 'edit')) {
      var hit = (S.d.cars || {})[el.value.trim()];
      if (hit && sh.kind === 'w1') {
        sh.f.kind = hit.kind; sh.f.co = hit.co; sh.f.item = hit.item; sh.f.carHit = true;
        if (hit.kind === '매출') sh.f.link = autoLink({ kind: '매출', co: hit.co, item: hit.item });
        renderSheet();
        var ci = $('f_car'); if (ci) { ci.focus(); ci.setSelectionRange(ci.value.length, ci.value.length); }
      }
    }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target, sh = S.sheet;
    if (!sh) return;
    var c = el.getAttribute('data-c'); if (c) { sh.f[c] = el.type === 'checkbox' ? el.checked : el.value; return; }
    var k = el.getAttribute('data-f'); if (k === 'link') sh.f.link = el.value;
    if (k === 'co' && sh.kind === 'w1' && sh.f.kind === '매출' && !sh.f.link) { sh.f.link = autoLink({ kind: '매출', co: el.value.trim(), item: sh.f.item }); if (sh.f.link) renderSheet(); }
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'loginForm') return;
    ev.preventDefault();
    var pw = $('pw'), v = pw ? pw.value : '';
    if (!v) return;
    S.loginErr = '';
    var btn = ev.target.querySelector('button'); if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
    post({ action: 'login', pw: v, dev: devId() }).then(function (r) { setToken(r.token); S.authed = true; S.loginErr = ''; start(); },
      function (e) { S.loginErr = errText(e); render(); });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); ev.target.click(); return; }
    if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229 && S.sheet && ev.target.tagName === 'INPUT' && ev.target.type !== 'checkbox') { ev.preventDefault(); ev.target.blur(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.authed && !S.sheet) load(true); });
  setInterval(function () { if (S.authed && !document.hidden && !S.sheet && S.d) load(true); }, 30000);   // 다른 기기에서 넣은 계량도 보이게
  var toastT = null;
  function toast(t) { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, 3600); }

  /* 뒤로 = 온 길로 한 걸음 (공통 nav.js) */
  function sheetKey(sh) { return sh ? ({ w2: 'r', rec: 'r', edit: 'r' }[sh.kind] || sh.kind) + (sh.id ? ':' + sh.id : '') : ''; }   // 2차 계량 → 계량증명서 → 고치기는 한 칸 (뒤로 한 번 = 닫기)
  function navGet() { return { day: S.day, sheet: sheetKey(S.sheet) }; }
  function navSet(v) {
    v = v || {};
    if (S.sheet && v.sheet !== sheetKey(S.sheet)) closeSheetNow();
    if (v.day && v.day !== S.day && S.d) { S.day = v.day; S.d.day = v.day; S.d.done = []; load(); }
    render();
  }
  if (window.NMCNav) NMCNav.page({ get: navGet, set: navSet, url: function (v) { return location.pathname + (v.day && S.d && v.day !== S.d.today ? '?day=' + v.day : ''); } });
  function start() {
    S.err = '';
    render();
    if (!S.authed) return;
    load();
    scAuto();
  }
  start();
  if (DEMO) window.__weigh = { get S() { return S; }, get SC() { return SC; }, C: C, parseFrame: parseFrame, feedText: function (s) { feed(Array.prototype.map.call(s, function (c) { return c.charCodeAt(0); })); } };
})();
</script>
