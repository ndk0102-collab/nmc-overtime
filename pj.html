<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NMC 공사 프로젝트</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B3A6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
window.NMC_API = "https://script.google.com/macros/s/AKfycbzg5mbJ9hkPn6Ld7hzNICzRYcsTDM_vVFdWZXV2qAy6QSYJFQVOvREsvE5NjIyy_05M/exec";
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
<!--PREVIEW_SERVER-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 공사 프로젝트 (2026-11-21). 프로젝트 · 금액 · 규격 · 도면은 이 파일에 없고, 관리자 로그인 뒤 서버(구글 시트 '공사' · '공사규격' · '공사도면')에서 받아 옵니다. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#121820; --ink2:#2E3742; --muted:#5A6471; --line:#D5DBE3; --soft:#EBEEF3;
  --vc:#1B3A6B; --vsoft:#E8EEF7; --gold:#B08A35; --gold-soft:#F6EFDF; --blue:#1F5FBF;
  --bad:#B42318; --bad-soft:#FDE9E7; --warn:#8A5300; --warn-soft:#FCF0D6; --ok:#1B7A43; --ok-soft:#E4F3EA;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
b,td,th,.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:20;background:var(--vc);color:#fff;padding:10px 12px 0;box-shadow:0 2px 8px rgba(15,23,42,.18)}
.bin{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
.home{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.bar h1{margin:0;flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.bar h1 small{margin-left:8px;font-size:12px;font-weight:700;letter-spacing:.2em;color:#E9D7AC}
.vtabs{max-width:900px;margin:8px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.vtabs button{min-height:46px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer;padding:0 2px}
.vtabs button[aria-selected="true"]{background:var(--bg);color:var(--vc)}
.home:focus-visible,.vtabs button:focus-visible{outline:3px solid #F4B400;outline-offset:2px}

.wrap{max-width:900px;margin:0 auto;padding:12px 12px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px;font-weight:800;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.card h2 small{font-size:13px;font-weight:600;color:var(--muted)}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--vc);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.gold{background:var(--gold)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.nav:focus-visible,.ent:focus-visible,.link:focus-visible,.x:focus-visible,.ev:focus-visible{outline:3px solid #F4B400;outline-offset:2px}
.link{border:0;background:none;padding:6px 0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.tools .btn{flex:1 1 140px}
.err{margin:8px 0 0;color:var(--bad);font-weight:700}
.wait{padding:30px 10px;text-align:center;color:var(--muted);font-weight:700}
.warnbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.okbox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-size:14px;font-weight:700}
.infobox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--vsoft);color:var(--vc);font-size:14px;font-weight:600}
.st{display:inline-block;padding:0 8px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--soft);color:var(--ink2);vertical-align:1px;white-space:nowrap}
.st.s1{background:var(--vsoft);color:var(--vc)}
.st.s2{background:var(--ok-soft);color:var(--ok)}
.st.s3{background:var(--bad-soft);color:var(--bad)}
.st.p0{background:var(--bad-soft);color:var(--bad)}
.st.p1{background:var(--warn-soft);color:var(--warn)}
.st.p2{background:var(--ok-soft);color:var(--ok)}
.st.d1{background:var(--gold-soft);color:#7A5C17}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 13px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:15px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--vc);background:var(--vc);color:#fff}
.chip small{margin-left:4px;font-weight:600;opacity:.8}
.find{width:100%;min-height:46px;margin:10px 0 4px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px}

/* 합계 */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.sum div{padding:10px;border-radius:12px;background:var(--soft)}
.sum span{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.sum b{display:block;font-size:18px;font-weight:800;line-height:1.3;margin-top:2px}
.sum small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.sum div.tot{background:var(--vc);color:#fff}
.sum div.tot span,.sum div.tot small{color:#E9D7AC}
.sum div.bad b{color:var(--bad)}
@media (max-width:520px){.sum{grid-template-columns:1fr 1fr}.sum div.tot{grid-column:1/-1}}

/* 목록 */
.ent{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:0 0 8px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ent.void{opacity:.6}
.ent .no{flex-shrink:0;width:52px;padding:6px 0;border-radius:12px;background:var(--soft);color:var(--ink2);text-align:center;font-size:12.5px;font-weight:800;line-height:1.25}
.ent .no.s1{background:var(--vsoft);color:var(--vc)}
.ent .no.s2{background:var(--ok-soft);color:var(--ok)}
.ent .no.s3{background:var(--bad-soft);color:var(--bad)}
.ent .no i{display:block;font-style:normal;font-size:11px;font-weight:700;opacity:.8}
.ent .et{flex:1;min-width:0}
.ent .et b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .et small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .ea{flex-shrink:0;text-align:right}
.ent .ea b{display:block;font-size:16px;font-weight:800}
.ent .ea .st{margin-top:2px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:700}
.grp{margin:16px 2px 6px;font-size:15px;font-weight:800;color:var(--vc);display:flex;justify-content:space-between;gap:8px}
.grp small{font-size:13.5px;color:var(--ink2);font-weight:700}

/* 달력 */
.pnav{display:flex;align-items:center;gap:8px}
.nav{flex-shrink:0;width:50px;height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:26px;font-weight:800;line-height:1;cursor:pointer}
.plabel{flex:1;min-width:0;text-align:center}
.plabel b{display:block;font-size:19px;font-weight:800;line-height:1.3}
.plabel small{display:block;font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}
.cal .dh{padding:2px 0;font-size:12.5px;font-weight:800;text-align:center;color:var(--muted)}
.cal .dh.su,.cal .dc.su .dn{color:var(--bad)}
.cal .dh.sa,.cal .dc.sa .dn{color:var(--blue)}
.cal .dc{min-height:78px;padding:3px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden;min-width:0}
.cal .dc.out{background:transparent;border-style:dashed;opacity:.55}
.cal .dc.today{border:2px solid var(--vc)}
.cal .dn{display:block;font-size:12.5px;font-weight:800;line-height:1.2}
.ev{display:block;width:100%;margin-top:2px;padding:1px 4px;border:0;border-radius:5px;font-size:11.5px;font-weight:700;line-height:1.35;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--soft);color:var(--ink2)}
.ev.s1{background:var(--vc);color:#fff}
.ev.s2{background:var(--ok-soft);color:var(--ok)}
.ev.due{background:var(--warn-soft);color:var(--warn)}
.ev.more{background:none;color:var(--muted);padding:0 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (max-width:520px){.cal .dc{min-height:62px}.ev{font-size:10.5px;padding:0 2px}}

/* 보기 */
.vh{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 12px}
.vh .vt{flex:1;min-width:220px}
.vh .vt p{margin:0;font-size:13.5px;color:var(--muted);font-weight:700}
.vh .vt h2{margin:2px 0 4px;font-size:21px;display:block}
.vh .va{text-align:right}
.vh .va b{display:block;font-size:24px;font-weight:800;color:var(--vc)}
.vh .va small{display:block;font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.vh .va{width:100%;text-align:left}}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kv div{padding:9px 10px;border-radius:12px;background:var(--soft);min-width:0}
.kv span{display:block;font-size:12.5px;font-weight:800;color:var(--muted)}
.kv b{display:block;font-size:15.5px;font-weight:800;overflow-wrap:anywhere}
@media (max-width:520px){.kv{grid-template-columns:1fr 1fr}}
.flow{display:flex;align-items:center;gap:4px;margin:4px 0 10px;flex-wrap:wrap}
.flow span{padding:4px 10px;border-radius:999px;background:var(--soft);font-size:13.5px;font-weight:800;color:var(--muted)}
.flow span.on{background:var(--vc);color:#fff}
.flow span.done{background:var(--ok);color:#fff}
.flow em{font-style:normal;color:var(--muted);font-weight:800}
.bar2{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin:10px 0 4px}
.bar2 i{display:block;height:100%;background:var(--ok);border-radius:999px}
.pays{margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pt{flex:1;min-width:0}
.prow .pt b{display:block;font-size:15.5px;font-weight:800}
.prow .pt small{display:block;font-size:13px;color:var(--muted)}
.pform{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:8px;margin-top:10px;align-items:end}
@media (max-width:640px){.pform{grid-template-columns:1fr 1fr}.pform .w{grid-column:1/-1}}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.18);vertical-align:-3px;margin-right:6px;flex-shrink:0}
.mixsw{display:inline-flex;vertical-align:-3px;margin-right:6px;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.18)}
.mixsw i{display:block;width:8px;height:16px}

/* 표 */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{padding:7px 8px;background:var(--soft);font-size:12.5px;font-weight:800;color:var(--ink2);text-align:left;white-space:nowrap}
table.t td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t tr.sub td{color:var(--muted);font-size:13.5px;border-top:1px dashed var(--line)}
table.t tr.sub td:first-child{padding-left:20px}
table.t tr.tot td{font-weight:800;background:var(--vsoft);color:var(--vc)}
table.t tr.need td{background:var(--warn-soft);color:var(--warn);font-weight:700}
table.t td small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.big{font-size:16px;font-weight:800}

/* 입력 */
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fgrid .w2{grid-column:span 2}
.fgrid .wf{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .w2,.fgrid .wf{grid-column:1/-1}}
.fld{display:block;margin:0}
.fld > span{display:block;margin:0 0 5px;font-size:14px;font-weight:800;color:var(--ink2)}
.fld > span small{margin-left:4px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16.5px}
textarea.inp{min-height:70px;padding:10px 12px;resize:vertical;line-height:1.45}
select.inp{padding-right:30px}
.inp:focus{outline:none;border-color:var(--vc)}
.inp.r{text-align:right;font-weight:700}
.inp.sm{min-height:40px;font-size:15px;padding:0 8px}
.calc{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px;line-height:1.6}
.totbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.totbox div{padding:10px;border-radius:12px;background:var(--soft);text-align:right}
.totbox span{display:block;font-size:12.5px;font-weight:800;color:var(--muted);text-align:left}
.totbox b{display:block;font-size:18px;font-weight:800;white-space:nowrap}
.totbox div.t{background:var(--vc);color:#fff}
.totbox div.t span{color:#E9D7AC}
@media (max-width:460px){.totbox{grid-template-columns:1fr 1fr}.totbox div.t{grid-column:1/-1}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,23,42,.08)}
.savebar .in{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center}
.savebar .in .btn{flex:1}
.savebar .in .btn.ghost{flex:0 0 auto}

/* 규격 */
.lrow{display:grid;grid-template-columns:1.5fr 1.2fr .8fr .8fr .8fr .8fr auto;gap:6px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .mini{display:block;margin:0 0 3px;font-size:12px;font-weight:800;color:var(--muted)}
.lrow .note{grid-column:1/-1}
.x{flex-shrink:0;width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:18px;font-weight:800;line-height:1;cursor:pointer;color:var(--muted)}
@media (max-width:640px){.lrow{grid-template-columns:1fr 1fr 1fr}.lrow .w2{grid-column:span 2}}
.sett{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:640px){.sett{grid-template-columns:1fr 1fr}}

/* 창 */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45)}
.sheet{display:flex;flex-direction:column;width:100%;max-width:760px;max-height:94vh;max-height:94dvh;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25)}
@media (min-width:640px){#sheet{align-items:center;padding:16px}.sheet{border-radius:20px;max-height:92vh}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;margin:0;font-size:19px;font-weight:800;color:var(--vc)}
.sbody{flex:1;overflow:auto;padding:14px 16px 6px;-webkit-overflow-scrolling:touch}
.sbody .fld{margin:0 0 12px}
.sfoot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot .btn{flex:1 1 130px}

.login{max-width:440px;margin:20px auto}
.login form{display:flex;gap:8px;margin-top:12px}
.login input{flex:1;min-width:0;min-height:52px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:92vw;padding:12px 18px;border-radius:12px;background:#0F172A;color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(15,23,42,.3)}
</style>
</head>
<body>
<header class="bar">
  <div class="bin">
    <a class="home" href="manage.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>관리자</a>
    <h1>공사 프로젝트<small>PROJECT</small></h1>
  </div>
  <nav class="vtabs" id="vtabs" role="tablist" aria-label="화면 선택"></nav>
</header>
<main class="wrap" id="root"></main>
<div class="savebar" id="savebar" hidden></div>
<div id="sheet" hidden></div>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<script>
(function () {
  'use strict';
  var DEMO = window.__SERVER__ || null;   // 시험용 화면에서만
  var API = DEMO ? '' : String(window.NMC_API || '');
  var TOKEN_KEY = 'nmc_pay_token';      // 다른 관리자 화면과 같은 열쇠
  var $ = function (id) { return document.getElementById(id); };
  var root = $('root'), tabsEl = $('vtabs'), saveEl = $('savebar'), sheetEl = $('sheet'), toastEl = $('toast');
  var TABS = [['list', '목록'], ['cal', '일정'], ['new', '등록'], ['spec', '규격']];
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  var STATES = ['미정', '예정', '완료', '취소'];
  var KIND = { top: '상부 칼라칩', base: '하부 칩', chip: '기타 칩', pu: '우레탄', coat: '탑코팅', primer: '프라이머', etc: '기타' };
  var KINDS = ['primer', 'base', 'top', 'chip', 'pu', 'coat', 'etc'];

  var q0 = new URLSearchParams(location.search);
  var S = {
    authed: false, loginErr: '', err: '', loading: false,
    tab: /^(list|cal|new|spec)$/.test(q0.get('view') || '') ? q0.get('view') : 'list',
    I: null, list: [], flt: 'act', q: '', ym: '',
    cur: null, curLoading: '', F: null, busy: false, arm: '', sheet: null, set: null, setMsg: '', pay: null
  };
  var token = '';
  try { token = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
